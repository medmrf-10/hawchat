<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الدرس — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px}
.crumb{color:var(--dim);font-size:.78rem;margin-top:8px}
.crumb a{color:var(--acc2);text-decoration:none}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:10px}
.hero h1{font-family:var(--font-ar);font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .meta{color:var(--dim);font-size:.8rem;margin-top:8px}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);margin-top:14px;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}
.player .cover .big{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#0b0f1a}
.player .cover span{color:var(--dim);font-size:.82rem}
.txt{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-top:16px;font-family:var(--font-ar);font-size:1.08rem;line-height:2.1;white-space:pre-wrap}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav a{color:var(--acc2);text-decoration:none;font-size:.85rem;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 16px;background:var(--card)}
.nav a:hover{border-color:var(--acc)}
.empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="javascript:history.back()" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">السلاسل المختارة</span>
</div></header>
<main><div class="wrap" id="app"><p class="empty">يحمّل…</p></div></main>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{
  const q=new URLSearchParams(location.search);
  const slug=q.get('s'), ln=parseInt(q.get('l'),10);
  const app=document.getElementById('app');
  const d=await j('series/'+encodeURIComponent(slug)+'.json');
  if(!d){app.innerHTML='<p class="empty">الدرس غير موجود.</p>';return}
  const l=d.lessons.find(x=>x.n===ln);
  if(!l){app.innerHTML='<p class="empty">الدرس غير موجود.</p>';return}
  const txt=await t('lessons/'+encodeURIComponent(slug)+'/'+String(ln).padStart(2,'0')+'.txt');
  document.title=l.title+' — '+d.title;
  const prev=d.lessons.find(x=>x.n===ln-1), next=d.lessons.find(x=>x.n===ln+1);
  let h='<div class="crumb cin"><a href="sheikh.html?s='+esc(d.sheikh_slug)+'">'+esc(d.sheikh)+'</a> ← <a href="series.html?s='+encodeURIComponent(slug)+'">'+esc(d.title)+'</a></div>';
  h+='<div class="hero cin"><h1>الدرس '+l.n+': '+esc(l.title)+'</h1><div class="meta">'+d.count+' درساً في السلسلة</div></div>';
  if(l.video){
    h+='<div class="player" id="pl"><div class="cover" onclick="this.parentElement.innerHTML=\'<iframe src=https://www.youtube.com/embed/'+esc(l.video)+'?autoplay=1 allowfullscreen></iframe>\'"><span class="big">▶</span><span>تشغيل الدرس من يوتيوب — '+esc(l.video)+'</span></div></div>';
  }
  h+='<div class="txt cin">'+(txt?esc(txt):'التفريغ غير متوفر بعد.')+'</div>';
  h+='<div class="nav">'+(prev?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+prev.n+'">→ الدرس السابق</a>':'<span></span>')
    +(next?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n+'">الدرس التالي ←</a>':'<span></span>')+'</div>';
  app.innerHTML=h;
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
