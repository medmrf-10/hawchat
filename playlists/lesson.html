<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 30px}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-top:10px}
.hero h1{font-family:var(--font-ui);font-size:var(--fs-lg);font-weight:700;color:var(--txt);margin:0}
.hero .meta{color:var(--dim);font-size:var(--fs-xs);margin-top:6px}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);margin-top:12px;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl .btn{min-width:44px;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
@media(hover:hover){.ctrl .btn:hover{border-color:var(--acc)}}
.ctrl .btn.main{background:var(--acc);color:#0b0f1a;font-weight:700;border-color:var(--acc)}
.ctrl select{min-height:44px;padding:0 10px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:var(--fs-sm)}
.ctrl .tm{margin-inline-start:auto;color:var(--acc2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.stage{min-height:200px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);margin-top:14px;padding:34px 26px}
.stage .ph{font-family:var(--font-ar);font-size:1.5rem;line-height:2.3;text-align:center;color:var(--txt)}
.stage .ph .w{color:#9aa3b5;opacity:.55;border-radius:6px;padding:0 3px;transition:opacity .12s,color .12s;cursor:pointer}
.stage .ph .w.read{color:var(--acc);opacity:.75}
.stage .ph .w.on{opacity:1}
.stage .wait{color:var(--dim);font-size:var(--fs-sm)}
.pos{color:var(--dim);font-size:var(--fs-xs);text-align:center;margin-top:10px}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav a{color:var(--acc2);text-decoration:none;font-size:var(--fs-sm);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;background:var(--card);min-height:44px;display:inline-flex;align-items:center}
@media(hover:hover){.nav a:hover{border-color:var(--acc)}}
.empty{color:var(--dim);padding:20px}
.txt{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-top:16px;font-family:var(--font-ar);font-size:1.1rem;line-height:2.1;white-space:pre-wrap}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}
.cover .big{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#0b0f1a}
.cover span{color:var(--dim);font-size:var(--fs-sm)}
.tlink{display:inline-flex;align-items:center;gap:6px;color:var(--acc2);font-size:var(--fs-xs);text-decoration:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 12px;margin-top:10px}
@media(max-width:400px){.ctrl .btn span.lbl{display:none}.ctrl .btn{padding:0 12px}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:80px;margin-top:10px"></div><div class="skel" style="height:240px;margin-top:12px"></div></div></main>
<script src="common.js"></script>
<script>
let YTP=null,AL=null,PH=[],curPh=-1,curW=-1,timer=null,pendPlay=false,playing=false;
function fmtT(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function normAlign(al){let ws=Array.isArray(al)?al:(al&&al.w)||[];return ws.map(x=>Array.isArray(x)?x:[x.w||x.t,x.s,x.e,x.seg||0])}
const PBRK=/[،؛.!؟:…—]$/;
function buildPhrases(ws){const ph=[];let cur=[],last=-1;for(const w of ws){const sg=w[3];if(((sg!==last&&last>=0)||cur.length>=12)&&cur.length){ph.push(cur);cur=[]}cur.push(w);last=sg;if(PBRK.test(w[0])&&cur.length>=3){ph.push(cur);cur=[];last=-1}}if(cur.length)ph.push(cur);return ph}
function renderPhrase(i){const st=document.getElementById('stage'),pos=document.getElementById('pos');if(i<0||i>=PH.length)return;curPh=i;curW=-1;st.innerHTML='<div class="ph">'+PH[i].map((w,k)=>'<span class="w" data-s="'+w[1]+'">'+esc(w[0])+'</span>').join(' ')+'</div>';pos.textContent='جملة '+(i+1)+' / '+PH.length}
function tick(){
  if(!YTP||!YTP.getCurrentTime||!PH.length)return;
  const tm=YTP.getCurrentTime();
  const bar=document.getElementById('tm');if(bar)bar.textContent=fmtT(tm)+' / '+fmtT(YTP.getDuration?YTP.getDuration():0);
  let pi=curPh;
  if(pi<0||tm<PH[pi][0][1]-0.3||tm>PH[pi][PH[pi].length-1][2]+0.4){pi=-1;for(let i=0;i<PH.length;i++){if(tm<=PH[i][PH[i].length-1][2]+0.4){pi=i;break}}if(pi<0)pi=PH.length-1;renderPhrase(pi)}
  const ph=PH[pi];let wi=-1;
  for(let k=0;k<ph.length;k++){if(tm>=ph[k][1]&&tm<ph[k][2]+0.25){wi=k;break}}
  if(wi<0){for(let k=ph.length-1;k>=0;k--){if(ph[k][1]<=tm){wi=k;break}}}
  const spans=document.querySelectorAll('#stage .w');
  if(wi!==curW){for(let k=0;k<spans.length;k++){spans[k].classList.toggle('on',k===wi);spans[k].classList.toggle('read',wi>=0&&k<wi);if(k!==wi){spans[k].style.background='';spans[k].style.webkitBackgroundClip='';spans[k].style.backgroundClip='';spans[k].style.color=''}}curW=wi}
  if(wi>=0&&spans[wi]){const w=ph[wi],f=Math.max(0,Math.min(1,(tm-w[1])/Math.max(.05,w[2]-w[1])));const p=Math.round(f*100),sp=spans[wi];sp.style.background='linear-gradient(to left,var(--acc) '+p+'%,#9aa3b5 '+p+'%)';sp.style.webkitBackgroundClip='text';sp.style.backgroundClip='text';sp.style.color='transparent'}
}
function seekPhrase(i){if(!YTP||i<0||i>=PH.length)return;YTP.seekTo(Math.max(0,PH[i][0][1]-0.1),true);renderPhrase(i)}
function setPlay(x){playing=x;const b=document.getElementById('pp');if(b)b.innerHTML=x?'إيقاف':'تشغيل'}
function togglePlay(){if(!YTP){pendPlay=true;setPlay(true);return}playing?YTP.pauseVideo():YTP.playVideo();setPlay(!playing)}
function mountPlayer(vid){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=()=>{YTP=new YT.Player('yfp',{events:{onReady:()=>{timer=setInterval(tick,150);if(pendPlay){YTP.playVideo();pendPlay=false}},onStateChange:e=>{setPlay(e.data===1)}}})};
}
document.addEventListener('click',e=>{const sp=e.target.closest('.w');if(sp&&YTP){YTP.seekTo(parseFloat(sp.dataset.s),true);YTP.playVideo();setPlay(true)}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  if(e.key==='ArrowLeft')seekPhrase(curPh+1);
  if(e.key==='ArrowRight')seekPhrase(curPh-1);
});
(async()=>{
  const q=new URLSearchParams(location.search);
  const slug=q.get('s'), ln=parseInt(q.get('l'),10);
  const app=document.getElementById('app');
  const [d,alidx]=await Promise.all([
    j('series/'+encodeURIComponent(slug)+'.json'),
    j('lessons/'+encodeURIComponent(slug)+'/index.json')]);
  if(!d){app.innerHTML='<div class="errbox">الدرس غير موجود — <a href="./">عودة</a></div>';return}
  const aln=new Set((alidx&&alidx.align)||[]),txn=new Set((alidx&&alidx.txt)||[]);
  const avail=(d.lessons||[]).filter(l=>aln.has(l.n)||txn.has(l.n));
  const pos=avail.findIndex(x=>x.n===ln);
  const l=avail[pos];
  if(!l){app.innerHTML='<div class="errbox">الدرس غير موجود — <a href="series.html?s='+encodeURIComponent(slug)+'">السلسلة</a></div>';return}
  const shSlug=d.sheikh_slug||'';
  document.getElementById('back').href='series.html?s='+encodeURIComponent(slug);
  document.getElementById('hdr-sub').textContent=d.sheikh||d.title||'';
  document.title=l.title+' — '+d.title;
  const stats=await j('data/sheikh_stats.json');
  const st=stats&&stats[shSlug];
  const row=st&&(st.rows||[]).find(r=>r.sSlug===slug);
  // file padding from index.json truth
  const pad=(alidx&&alidx.pad)||3;
  const fns=n=>pad===2?[String(n).padStart(2,'0'),String(n).padStart(3,'0')]:[String(n).padStart(3,'0'),String(n).padStart(2,'0')];
  const base='lessons/'+encodeURIComponent(slug)+'/';
  let aln=null;
  if(aln.has(ln)){for(const c of fns(ln)){aln=await j(base+c+'.align.json');if(aln)break}}
  let txt=null;
  if(!aln&&txn.has(ln)){for(const c of fns(ln)){txt=await jtxt(base+c+'.txt');if(txt)break}}
  // preload next align/txt
  const nx=avail[pos+1];if(nx){const u2='lessons/'+encodeURIComponent(slug)+'/'+fns(nx.n)[0];if(aln.has(nx.n))j(u2+'.align.json');else if(txn.has(nx.n))jtxt(u2+'.txt')}
  const pv=avail[pos-1];
  let h='<nav class="crumb" aria-label="مسار التنقل"><a href=".">سلاسل المشايخ</a> ‹ <a href="sheikh.html?s='+encodeURIComponent(shSlug)+'">'+esc(d.sheikh)+'</a> ‹ <a href="series.html?s='+encodeURIComponent(slug)+'">'+esc(d.title)+'</a> ‹ الدرس '+l.n+'</nav>';
  h+='<div class="hero cin"><h1><bdi>'+esc(l.title)+'</bdi></h1><div class="meta">'+pluralLesson(d.count)+' في السلسلة'+(l.dur?' · '+esc(l.dur):'')+'</div>'
    +(row?'<a class="tlink" href="tr.html?r='+encodeURIComponent(row.id)+'&l='+l.n+'">'+I.read+' النص كاملاً</a>':'')+'</div>';
  if(aln){
    AL=aln;PH=buildPhrases(normAlign(aln));
    h+='<div class="player"><iframe id="yfp" src="https://www.youtube.com/embed/'+esc(l.video)+'?enablejsapi=1&rel=0" allowfullscreen></iframe></div>';
    h+='<div class="ctrl">'
      +'<button class="btn main" id="pp" onclick="togglePlay()">تشغيل</button>'
      +'<button class="btn" onclick="seekPhrase(curPh-1)" aria-label="الجملة السابقة">→ <span class="lbl">السابقة</span></button>'
      +'<button class="btn" onclick="seekPhrase(curPh+1)" aria-label="الجملة التالية"><span class="lbl">التالية</span> ←</button>'
      +'<label style="font-size:var(--fs-xs);color:var(--dim)">السرعة <select aria-label="سرعة التشغيل" onchange="YTP&&YTP.setPlaybackRate(parseFloat(this.value))"><option value="0.75">×0.75</option><option value="1" selected>×1</option><option value="1.25">×1.25</option><option value="1.5">×1.5</option></select></label>'
      +'<span class="tm" id="tm">0:00</span></div>';
    h+='<div class="stage" id="stage" aria-live="off"><span class="wait">اضغط تشغيل — تظهر الجملة وتضيء الكلمة في وقتها · اضغط كلمة للانتقال إليها</span></div>';
    h+='<div class="pos" id="pos"></div>';
  }else{
    if(l.video)h+='<div class="player" id="pl"><div class="cover" role="button" tabindex="0" onclick="this.parentElement.innerHTML=\'<iframe src=https://www.youtube.com/embed/'+esc(l.video)+'?autoplay=1 allowfullscreen></iframe>\'"><span class="big">▶</span><span>تشغيل الدرس</span></div></div>';
    h+='<div class="txt cin">'+(txt?esc(txt):'<div style="text-align:center;color:var(--dim);padding:30px;border:1px dashed var(--border);border-radius:12px">التفريغ غير متوفر لهذا الدرس بعد</div>')+'</div>';
  }
  h+='<div class="nav">'+(pv?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+pv.n+'">→ الدرس السابق</a>':'<span></span>')
    +(nx?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+nx.n+'">الدرس التالي ←</a>':'<span></span>')+'</div>';
  app.innerHTML=h;
  if(aln)mountPlayer(l.video);
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
