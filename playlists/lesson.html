<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الدرس — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px}
.crumb{color:var(--dim);font-size:.78rem;margin-top:8px}
.crumb a{color:var(--acc2);text-decoration:none}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:10px}
.hero h1{font-family:var(--font-ar);font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .meta{color:var(--dim);font-size:.8rem;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.hero .sync{font-size:.66rem;color:var(--ok);border:1px solid var(--ok);border-radius:99px;padding:2px 10px}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);margin-top:14px;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}
.player .cover .big{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#0b0f1a}
.player .cover span{color:var(--dim);font-size:.82rem}
.txt{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-top:16px;font-family:var(--font-ar);font-size:1.08rem;line-height:2.1;white-space:pre-wrap}
.txt .w{border-radius:6px;padding:0 1px;transition:background-color .12s}
.txt.synced .w{cursor:pointer}
.txt.synced .w:hover{background:rgba(201,162,75,.15)}
.txt.synced .w.on{background:var(--acc);color:#0b0f1a;font-weight:700}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav a{color:var(--acc2);text-decoration:none;font-size:.85rem;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 16px;background:var(--card)}
.nav a:hover{border-color:var(--acc)}
.empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="javascript:history.back()" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">السلاسل المختارة</span>
</div></header>
<main><div class="wrap" id="app"><p class="empty">يحمّل…</p></div></main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let player=null,words=[],spans=[],wi=0,lastOn=-1,rafId=null;
function seekWord(i){if(player&&words[i]){player.seekTo(words[i].s+0.01,true);if(player.getPlayerState&&player.getPlayerState()!==1)player.playVideo()}}
function tick(){
  if(!player||!words.length)return;
  const tm=player.getCurrentTime();
  // last word whose start has passed — the spoken word (even during short gaps)
  let lo=0,hi=words.length-1,cur=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;if(words[mid].s<=tm){cur=mid;lo=mid+1}else hi=mid-1}
  if(cur!==lastOn){
    if(lastOn>=0&&spans[lastOn])spans[lastOn].classList.remove('on');
    if(cur>=0&&spans[cur]){spans[cur].classList.add('on');spans[cur].scrollIntoView({block:'center',behavior:'smooth'})}
    lastOn=cur;
  }
}
function loop(){tick();rafId=requestAnimationFrame(loop)}
(async()=>{
  const q=new URLSearchParams(location.search);
  const slug=q.get('s'), ln=parseInt(q.get('l'),10);
  const app=document.getElementById('app');
  const d=await j('series/'+encodeURIComponent(slug)+'.json');
  if(!d){app.innerHTML='<p class="empty">الدرس غير موجود.</p>';return}
  const l=d.lessons.find(x=>x.n===ln);
  if(!l){app.innerHTML='<p class="empty">الدرس غير موجود.</p>';return}
  const [txt,al]=await Promise.all([
    t('lessons/'+encodeURIComponent(slug)+'/'+String(ln).padStart(2,'0')+'.txt'),
    j('lessons/'+encodeURIComponent(slug)+'/'+String(ln).padStart(2,'0')+'.align.json')]);
  document.title=l.title+' — '+d.title;
  const prev=d.lessons.find(x=>x.n===ln-1), next=d.lessons.find(x=>x.n===ln+1);
  let h='<div class="crumb cin"><a href="sheikh.html?s='+esc(d.sheikh_slug)+'">'+esc(d.sheikh)+'</a> ← <a href="series.html?s='+encodeURIComponent(slug)+'">'+esc(d.title)+'</a></div>';
  h+='<div class="hero cin"><h1>الدرس '+l.n+': '+esc(l.title)+'</h1><div class="meta"><span>'+d.count+' درساً في السلسلة'+(l.dur?' · '+esc(l.dur)+' د':'')+'</span>'+(al&&l.video?'<span class="sync">● محاذاة صوتية — الكلمة تُضاء</span>':'')+'</div></div>';
  if(l.video){
    h+='<div class="player" id="pl"><div class="cover" id="cov"><span class="big">▶</span><span>تشغيل الدرس'+(al?' — مع إضاءة الكلمات':'')+'</span></div></div>';
  }
  if(txt){
    if(al){
      h+='<div class="txt synced cin" id="tx">'+al.map((w,i)=>'<span class="w" data-i="'+i+'">'+esc(w.w)+'</span>').join(' ')+'</div>';
    }else{
      h+='<div class="txt cin">'+esc(txt)+'</div>';
    }
  }else h+='<div class="txt cin">التفريغ غير متوفر بعد.</div>';
  h+='<div class="nav">'+(prev?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+prev.n+'">→ الدرس السابق</a>':'<span></span>')
    +(next?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n+'">الدرس التالي ←</a>':'<span></span>')+'</div>';
  app.innerHTML=h;
  if(al&&l.video){
    words=al; spans=[...document.querySelectorAll('#tx .w')];
    document.getElementById('tx').addEventListener('click',e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!=null)seekWord(+i)});
  }
  const cov=document.getElementById('cov');
  if(cov)cov.onclick=()=>{
    document.getElementById('pl').innerHTML='<div id="ytp" style="position:absolute;inset:0;width:100%;height:100%"></div>';
    player=new YT.Player('ytp',{videoId:l.video,playerVars:{autoplay:1,rel:0},events:{onReady:e=>e.target.playVideo(),onStateChange:e=>{if(e.data===1){if(!rafId)loop()}else{cancelAnimationFrame(rafId);rafId=null}}}});
  };
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
