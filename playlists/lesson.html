<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="../icons/favicon-180.png">

<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>

<style>
html,body{height:100%;overflow:hidden}
.wrap{max-width:920px;margin:0 auto;height:calc(100dvh - 54px);display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.lst-head{display:none}
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:42vh;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:#000;flex:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);margin-top:8px;padding:16px 18px;overflow:hidden}
.stage.idle .ph{opacity:.4}
.stage .ph{font-family:var(--font-ar);font-size:clamp(1.15rem,4.5vw,1.6rem);line-height:2.1;text-align:center;color:var(--txt)}
.stage .ph .w{color:#9aa3b5;opacity:.55;border-radius:6px;padding:0 3px;transition:opacity .12s,color .12s;cursor:pointer}
.stage .ph .w.read{color:var(--acc);opacity:.75}
.stage .ph .w.on{opacity:1}
.stage .wait{color:var(--dim);font-size:.9rem}
.stage .tpv,.stage .tnx{font-family:var(--font-ar);font-size:.9rem;line-height:1.8;color:var(--dim);opacity:.55;text-align:center;max-width:640px}
.stage .tpv{order:-1;margin-bottom:10px}
.stage .tnx{margin-top:10px}
.stage .ph{order:0}
.pos{color:var(--dim);font-size:.7rem;text-align:center;margin-top:4px}
.czone{flex:none;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-top:8px}
.cbar{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;justify-content:center;gap:8px}
.crow .btn{min-width:52px;min-height:52px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.crow .btn:hover{border-color:var(--acc)}
.crow .btn.main{min-width:64px;min-height:64px;font-size:1.4rem;background:var(--acc);color:#0b0f1a;font-weight:700;border-color:var(--acc)}
.crow .btn.ld{position:relative;color:transparent}
.crow .btn.ld::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--acc);animation:ldsp .8s linear infinite}
@keyframes ldsp{to{transform:rotate(360deg)}}
.csub{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.csub .tm{color:var(--acc2);font-size:.8rem;font-variant-numeric:tabular-nums}
.csub .chip,.csub select,.crow .chip{min-height:40px;min-width:40px;justify-content:center;padding:0 8px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:.75rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.csub .chip.on,.crow .chip.on{border-color:var(--acc);color:var(--acc)}
.crow .chip{min-height:52px;min-width:52px;font-variant-numeric:tabular-nums}
.nav{display:none}
.txt{flex:1;min-height:0;overflow-y:auto;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:18px;margin-top:8px;font-family:var(--font-ar);font-size:1.08rem;line-height:2.1;white-space:pre-wrap}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}
.cover .big{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#0b0f1a}
.cover span{color:var(--dim);font-size:.82rem}
.unv{display:none}
@media(max-width:420px){.hd-lg{display:none}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="عودة" style="text-decoration:none"><svg class="i" style="width:1.15em;height:1.15em"><use href="icons.svg#i-back"/></svg></a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px" class="hd-lg">
  <span class="brand hd-lg">سلاسل</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:.8rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">درس</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:70px;margin-top:12px"></div><div class="skel" style="height:300px;margin-top:12px"></div></div></main>
<script src="common.js?v=11"></script>
<script>
function fmtT(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const icS='<svg class="i" style="width:1em;height:1em;vertical-align:-.12em"><use href="icons.svg#i-clock"/></svg>';

let YTP=null,AL=null,PH=[],curPh=-1,curW=-1,timer=null,pendPlay=false;
let WLOCK=null,SLEEP=null,SPANS=[],lastSave=0;

/* normalize alignment shapes to [[word,s,e,seg],...] then group into
   display phrases by punctuation / seg id / max length */
function normAlign(al){
  let ws = Array.isArray(al) ? al : (al && al.w) || [];
  return ws.map(x=>{
    if(Array.isArray(x))return x;
    return [x.w||x.t,x.s,x.e,x.seg||0];
  });
}
const PBRK=/[،؛.!؟:…—]$/;
function buildPhrases(ws){
  const ph=[];let cur=[],last=-1;
  for(const w of ws){
    const sg=w[3];
    if(((sg!==last&&last>=0)||cur.length>=12)&&cur.length){ph.push(cur);cur=[]}
    cur.push(w);last=sg;
    if(PBRK.test(w[0])&&cur.length>=3){ph.push(cur);cur=[];last=-1}
  }
  if(cur.length)ph.push(cur);
  return ph;
}
function renderPhrase(i){
  const st=document.getElementById('stage');
  const pos=document.getElementById('pos');
  if(i<0||i>=PH.length)return;
  curPh=i;curW=-1;
  let h='<div class="ph">'+PH[i].map((w,k)=>'<span class="w" data-s="'+w[1]+'">'+esc(w[0])+'</span>').join(' ')+'</div>';
  if(TELE){
    const pv=i>0?PH[i-1].map(w=>w[0]).join(' '):'';
    const nx=i<PH.length-1?PH[i+1].map(w=>w[0]).join(' '):'';
    h='<div class="tpv">'+esc(pv)+'</div>'+h+'<div class="tnx">'+esc(nx)+'</div>';
  }
  st.innerHTML=h;
  pos.textContent='جملة '+(i+1)+' / '+PH.length;
  SPANS=st.querySelectorAll('.w');   // cached — tick() never re-queries the DOM
}
function tick(){
  if(!YTP||!YTP.getCurrentTime||!PH.length)return;
  const tm=YTP.getCurrentTime();
  const bar=document.getElementById('tm');if(bar)bar.textContent=fmtT(tm)+' / '+fmtT(YTP.getDuration?YTP.getDuration():0);
  /* find current phrase: last phrase whose first word starts <= tm */
  let pi=curPh;
  if(pi<0||tm<PH[pi][0][1]-0.3||tm>PH[pi][PH[pi].length-1][2]+0.4){
    pi=-1;
    for(let i=0;i<PH.length;i++){if(tm<=PH[i][PH[i].length-1][2]+0.4){pi=i;break}}
    if(pi<0)pi=PH.length-1;
    renderPhrase(pi);
  }
  const ph=PH[pi];
  let wi=-1;
  for(let k=0;k<ph.length;k++){if(tm>=ph[k][1]&&tm<ph[k][2]+0.25){wi=k;break}}
  if(wi<0){for(let k=ph.length-1;k>=0;k--){if(ph[k][1]<=tm){wi=k;break}}}
  const spans=SPANS;
  if(wi!==curW){
    for(let k=0;k<spans.length;k++){
      spans[k].classList.toggle('on',k===wi);
      spans[k].classList.toggle('read',wi>=0&&k<wi);
      if(k!==wi){spans[k].style.background='';spans[k].style.webkitBackgroundClip='';spans[k].style.backgroundClip='';spans[k].style.color=''}
    }
    curW=wi;
  }
  if(wi>=0&&spans[wi]&&!HLLEGACY){
    const w=ph[wi],f=Math.max(0,Math.min(1,(tm-w[1])/Math.max(.05,w[2]-w[1])));
    const p=Math.round(f*100),sp=spans[wi];
    sp.style.background='linear-gradient(to left,var(--acc) '+p+'%,#9aa3b5 '+p+'%)';
    sp.style.webkitBackgroundClip='text';sp.style.backgroundClip='text';sp.style.color='transparent';
  }
  if(Math.abs(tm-lastSave)>5){lastSave=tm;savePos()}
}
function seekPhrase(i){
  if(!YTP||i<0||i>=PH.length)return;
  YTP.seekTo(Math.max(0,PH[i][0][1]-0.1),true);
  renderPhrase(i);
}
function mountPlayer(vid){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  let ready=false;
  setTimeout(()=>{if(!ready){const s=document.getElementById('stage');if(s)s.innerHTML='<span class="wait">المشغّل يتأخر — <a href="https://youtu.be/'+vid+'" target="_blank" rel="noopener" style="color:var(--acc2)">افتح الدرس على يوتيوب مباشرة</a></span>'}},8000);
  window.onYouTubeIframeAPIReady=()=>{
    YTP=new YT.Player('yfp',{events:{
      onReady:()=>{ready=true;
        const b=document.getElementById('playb');if(b){b.classList.remove('ld');b.innerHTML='&#9654;'}
        const sp=store.get('speed');if(sp&&sp!==1&&YTP.setPlaybackRate){YTP.setPlaybackRate(sp);const sel=document.getElementById('spd');if(sel)sel.textContent='×'+sp}
        const rp=T0||resumePos();if(rp>5)YTP.seekTo(rp,true);
        if(pendPlay){YTP.playVideo();pendPlay=false}},
      onStateChange:(e)=>{const b=document.getElementById('playb');
        const playing=(e.data===1||e.data===3);
        if(b){b.innerHTML=playing?'&#10074;&#10074;':'&#9654;';b.setAttribute('aria-pressed',playing?'true':'false')}
        if(e.data===1){wakeLock(true);const st=document.getElementById('stage');if(st)st.classList.remove('idle');if(!timer)timer=setInterval(tick,150)}
        else{wakeLock(false);if(e.data!==3&&timer){clearInterval(timer);timer=null}}
        if(e.data===0&&nextOn()){const nx=document.getElementById('go-next');if(nx)nx.click()}
        if(e.data===0){const d=store._d();if(d.resume&&d.resume[RESK]){delete d.resume[RESK];store._w(d)}}}}});
  };
}
/* URL flags for phase-6 features (additive, off by default) */
const FLAGS=new URLSearchParams(location.search);
if(FLAGS.get('next')==='1')store.set('anx',1);
if(FLAGS.get('mode')==='tele')store.set('tele',1);
const AUTO_NEXT=FLAGS.get('next')==='1';       // arrived via auto-advance
const nextOn=()=>store.get('anx')===1;         // auto-advance to next lesson
let TELE=store.get('tele')===1;                // teleprompter prev/cur/next
const HLLEGACY=FLAGS.get('hl')==='legacy';     // old single-word fill
const RAWPH=FLAGS.get('ph')==='raw';           // do not merge short phrases
const SLUG=FLAGS.get('s')||'',LN=parseInt(FLAGS.get('l'),10);
const T0=parseFloat(FLAGS.get('t'))||0;        // start position in seconds
const RESK='lspos:'+SLUG+':'+LN;
function resumePos(){const r=store.resume(RESK);return(r&&r.n)||0}
function savePos(){
  if(!YTP||!YTP.getCurrentTime)return;
  const p=YTP.getCurrentTime();
  if(p>3)store.setResume(RESK,Math.floor(p));
}
function playToggle(b){
  if(!YTP){pendPlay=true;if(b)b.classList.add('ld');return}
  const s=YTP.getPlayerState&&YTP.getPlayerState();
  (s===1||s===3)?YTP.pauseVideo():YTP.playVideo();
}
const SPEEDS=[1,1.25,1.5,2,0.75];
function phraseAt(t){let i=0;for(let k=0;k<PH.length;k++){if(PH[k][0][1]<=t)i=k;else break}return i}
async function shareLesson(b){
  const tm=(YTP&&YTP.getCurrentTime)?Math.floor(YTP.getCurrentTime()):0;
  const u=location.origin+location.pathname+'?s='+encodeURIComponent(SLUG)+'&l='+LN+(tm>5?'&t='+tm:'');
  try{if(navigator.share)await navigator.share({title:document.title,url:u});
  else{await navigator.clipboard.writeText(u);const o=b.textContent;b.textContent='✓ نُسخ';setTimeout(()=>b.textContent=o,1600)}}catch(e){}
}
function cycleSpeed(){
  const cur=store.get('speed')||1;
  const nx=SPEEDS[(SPEEDS.indexOf(cur)+1)%SPEEDS.length]||1;
  store.set('speed',nx);if(YTP&&YTP.setPlaybackRate)YTP.setPlaybackRate(nx);
  const el=document.getElementById('spd');if(el)el.textContent='×'+nx;
}
function wakeLock(on){
  if(!('wakeLock' in navigator))return;
  if(on){navigator.wakeLock.request('screen').then(w=>WLOCK=w).catch(()=>{})}
  else if(WLOCK){WLOCK.release().catch(()=>{});WLOCK=null}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&YTP&&YTP.getPlayerState&&YTP.getPlayerState()===1){wakeLock(true);if(!timer)timer=setInterval(tick,150)}
  else if(document.visibilityState!=='visible'){if(timer){clearInterval(timer);timer=null}savePos()}
});
document.addEventListener('click',e=>{
  const sp=e.target.closest('.w');
  if(sp&&YTP){YTP.seekTo(parseFloat(sp.dataset.s),true);YTP.playVideo()}
});
// keyboard shortcuts: space play/pause · ←/→ ±10s · [ ] phrase back/fwd
document.addEventListener('keydown',e=>{
  if(!YTP||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();const s=YTP.getPlayerState&&YTP.getPlayerState();if(s===1)YTP.pauseVideo();else YTP.playVideo()}
  else if(e.key==='ArrowLeft'){YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)}
  else if(e.key==='ArrowRight'){YTP.seekTo(YTP.getCurrentTime()+10,true)}
  else if(e.key===']')seekPhrase(curPh+1);else if(e.key==='[')seekPhrase(curPh-1);
});
(async()=>{
  const q=new URLSearchParams(location.search);
  const slug=q.get('s'), ln=parseInt(q.get('l'),10);
  const app=document.getElementById('app');
  const d=await j('series/'+encodeURIComponent(slug)+'.json');
  if(!d){app.innerHTML='<div class="errbox">'+(navigator.onLine===false?'لا اتصال — حدّث الصفحة حين يعود':'تعذر تحميل الدرس')+' — <a href="row.html?s='+encodeURIComponent(slug)+'">عودة للسلسلة</a></div>';return}
  const l=d.lessons.find(x=>x.n===ln);
  if(!l){app.innerHTML='<div class="errbox">الدرس غير موجود — <a href="row.html?s='+encodeURIComponent(slug)+'">عودة للسلسلة</a></div>';return}
  document.getElementById('back').href='row.html?s='+encodeURIComponent(slug)+'&m=listen';
  const ln3=String(ln).padStart(3,'0'), ln2=String(ln).padStart(2,'0');
  const lidx=await j('lessons/'+encodeURIComponent(slug)+'/index.json');
  const hasMap=lidx&&lidx.af;           // rebuilt index = authoritative filenames
  const afn=hasMap?lidx.af[ln]:null;
  const tfn=lidx&&lidx.tf?lidx.tf[ln]:null;
  let aln=afn?await j('lessons/'+encodeURIComponent(slug)+'/'+afn):null;
  if(!aln&&!hasMap){ // no file map → probe both pads
    aln=await j('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.align.json');
    if(!aln&&ln3!==ln2)aln=await j('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.align.json');
  }
  // stats → read row for this series: enables the full-text button and the
  // text fallback for lessons whose transcript lives only in data/read
  const stats=await j('data/sheikh_stats.json');
  let readRows=null,rdRow=null;
  if(stats){
    for(const s in stats){if(s==='_meta')continue;
      const rw=(stats[s].rows||[]).find(r=>r.sSlug===slug);
      if(rw){rdRow=rw;const rr=await j('data/read/'+encodeURIComponent(rw.id)+'.json');if(rr)readRows={};(rr||[]).forEach(x=>readRows[x.n]=x);break}}
  }
  const rrow=readRows&&readRows[ln];
  let txt=aln?null:(tfn?await jtxt('lessons/'+encodeURIComponent(slug)+'/'+tfn)
    :(lidx&&lidx.tf?(await jtxt('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.txt')||(ln3!==ln2?await jtxt('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.txt'):null))
      :(!lidx?(await jtxt('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.txt')||(ln3!==ln2?await jtxt('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.txt'):null)):null)));
  if(!txt&&rrow&&rrow.file)txt=await jtxt(rrow.base+encodeURIComponent(rrow.file));
  if(aln){ // alignment exists but is empty → fall back to plain text
    const w=Array.isArray(aln)?aln:(aln&&aln.w)||[];
    if(!w.length)aln=null;
  }
  document.title=l.title+' — '+d.title;
  document.getElementById('hdr-sub').textContent=d.sheikh||d.title||'درس';
  if('mediaSession' in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:l.title||('الدرس '+ln),artist:d.sheikh||'',album:d.title||''});
      navigator.mediaSession.setActionHandler('play',()=>YTP&&YTP.playVideo());
      navigator.mediaSession.setActionHandler('pause',()=>YTP&&YTP.pauseVideo());
      navigator.mediaSession.setActionHandler('seekbackward',()=>YTP&&YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true));
      navigator.mediaSession.setActionHandler('seekforward',()=>YTP&&YTP.seekTo(YTP.getCurrentTime()+10,true));
    }catch(e){}
  }
  const _ls=d.lessons.map(x=>x.n).sort((a,b)=>a-b);
  const prev=d.lessons.find(x=>x.n===_ls.filter(n=>n<ln).pop()),
        next=d.lessons.find(x=>x.n===_ls.find(n=>n>ln));
  if('mediaSession' in navigator)try{
    if(prev)navigator.mediaSession.setActionHandler('previoustrack',()=>location.href='lesson.html?s='+encodeURIComponent(slug)+'&l='+prev.n);
    if(next)navigator.mediaSession.setActionHandler('nexttrack',()=>location.href='lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n);
  }catch(e){}
  if(aln){
    AL=aln;PH=RAWPH?normAlign(aln).map(w=>[w]):buildPhrases(normAlign(aln));
    if(!PH.length){aln=null;PH=[]} // empty phrases → plain-text path
  }
  const alcov=aln&&!Array.isArray(aln)?(aln.cov||0):1;
  if(alcov<0.3)aln=null;  // below the site-wide listenable threshold → text lesson
  const hasText=!!(tfn||rrow);
  const du=(l.dur&&fmtDur(l.dur))||'';
  let h='';
  if(aln&&l.video){
    h+='<div class="player"><iframe id="yfp" src="https://www.youtube-nocookie.com/embed/'+esc(l.video)+'?enablejsapi=1&rel=0&playsinline=1&iv_load_policy=3&hl=ar&origin='+encodeURIComponent(location.origin)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    h+='<div class="stage" id="stage"></div>';
    h+='<div class="czone"><div class="pos" id="pos"></div>';
    h+='<div class="cbar"><div class="crow">'
      +'<button class="btn" onclick="seekPhrase(curPh-1)" aria-label="الجملة السابقة" title="الجملة السابقة">⇤</button>'
      +'<button class="btn" onclick="YTP&&YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)" aria-label="رجوع 10 ثوانٍ">↺10</button>'
      +'<button class="btn main ld" id="playb" aria-pressed="false" onclick="playToggle(this)" aria-label="تشغيل/إيقاف"></button>'
      +'<button class="btn" onclick="YTP&&YTP.seekTo(YTP.getCurrentTime()+10,true)" aria-label="تقدم 10 ثوانٍ">10↻</button>'
      +'<button class="chip" id="spd" title="سرعة التشغيل" onclick="cycleSpeed()">×'+(store.get('speed')||1)+'</button>'
      +'<button class="btn" onclick="seekPhrase(curPh+1)" aria-label="الجملة التالية" title="الجملة التالية">⇥</button></div>'
      +'<div class="csub"><span class="tm" id="tm">0:00</span>'
      +'<select id="slp" title="مؤقت النوم" onchange="if(SLEEP){clearTimeout(SLEEP);SLEEP=null}const m=parseInt(this.value);if(m){SLEEP=setTimeout(()=>{YTP&&YTP.pauseVideo();SLEEP=null},m*60000)}this.title=m?\'يتوقف خلال \'+this.value+\' د\':\'مؤقت النوم\'"><option value="0">نوم —</option><option value="15">15د</option><option value="30">30د</option><option value="45">45د</option><option value="60">60د</option></select>'
      +'<button class="chip'+(store.get('anx')===1?' on':'')+'" id="t-anx" title="التشغيل التلقائي للدرس التالي" onclick="const v=!(store.get(\'anx\')===1);store.set(\'anx\',v);this.classList.toggle(\'on\',v)">تلقائي</button>'
      +'<button class="chip'+(TELE?' on':'')+'" id="t-tele" title="وضع الملقّن" onclick="TELE=!TELE;store.set(\'tele\',TELE?1:0);this.classList.toggle(\'on\',TELE);renderPhrase(Math.max(0,curPh))">ملقّن</button>'
      +'<button class="chip" id="shr" title="مشاركة الدرس" onclick="shareLesson(this)">↗ مشاركة</button>'
      +(rdRow?'<a class="chip" href="tr.html?r='+encodeURIComponent(rdRow.id)+'&l='+ln+'" title="قراءة التفريغ">قراءة</a>':'')
      +((lidx&&lidx.sum&&(lidx.sum||[]).indexOf(ln)>=0)?'<a class="chip" href="sm.html?s='+encodeURIComponent(slug)+'&l='+ln+'" title="ملخص الدرس">☰ ملخص</a>':'')
      +'</div></div></div>';
  }else{
    if(l.video)h+='<div class="player" id="pl"><div class="cover" id="cvr"><span class="big">▶</span><span>تشغيل الدرس من يوتيوب</span></div></div>';
    h+='<div class="tools" style="display:flex;gap:8px;margin-top:10px"><button id="fmi" aria-label="تصغير الخط" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer">A−</button>'
      +'<button id="fpl" aria-label="تكبير الخط" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer">A+</button></div>';
    h+='<div class="txt cin" id="tx">'+(txt?esc(txt):'<div style="text-align:center;color:var(--dim);padding:30px;border:1px dashed var(--border);border-radius:12px">التفريغ غير متوفر لهذا الدرس بعد</div>')+'</div>';
    h+='<div class="nav" style="display:flex">'+(prev?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+prev.n+'">→ السابق</a>':'<a class="off">→ السابق</a>')
      +'<span class="pos" style="flex:1">'+l.n+' / '+d.count+'</span>'
      +(next?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n+'">التالي ←</a>':'<a class="off">التالي ←</a>')+'</div>';
  }
  h+='<div class="nav">'+(next?'<a id="go-next" href="lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n+(AUTO_NEXT?'&next=1':'')+'">التالي</a>':'<span></span>')+'</div>';
  app.innerHTML=h;
  const tFS=()=>{const el=document.getElementById('tx');if(el)el.style.fontSize=(parseFloat(localStorage.getItem('trfs'))||1.08)+'rem'};
  tFS();
  const fb=document.getElementById('fmi'),pb=document.getElementById('fpl');
  if(fb)fb.onclick=()=>{const v=Math.max(.8,(parseFloat(localStorage.getItem('trfs'))||1.08)-.1);localStorage.setItem('trfs',v);tFS()};
  if(pb)pb.onclick=()=>{const v=Math.min(1.9,(parseFloat(localStorage.getItem('trfs'))||1.08)+.1);localStorage.setItem('trfs',v);tFS()};
  const cvr=document.getElementById('cvr');
  if(cvr)cvr.onclick=()=>{const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+l.video+'?autoplay=1&playsinline=1&rel=0&hl=ar';
    f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');f.setAttribute('allowfullscreen','');
    cvr.parentElement.replaceChild(f,cvr)};
  if(aln){
    renderPhrase(phraseAt(T0||resumePos()));   // first phrase visible before the player loads
    const st=document.getElementById('stage');if(st)st.classList.add('idle');
    mountPlayer(l.video);
  }
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
