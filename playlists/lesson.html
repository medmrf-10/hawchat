<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الدرس — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=8">
<link rel="stylesheet" href="common.css?v=8">
<link rel="stylesheet" href="ui.css?v=8">
<style>
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 30px}
.crumb{color:var(--dim);font-size:.78rem;margin-top:8px}
.crumb a{color:var(--acc2);text-decoration:none}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-top:10px}
.hero h1{font-family:var(--font-ar);font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .meta{color:var(--dim);font-size:.78rem;margin-top:6px}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);margin-top:12px;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl .btn{min-width:44px;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ctrl .btn:hover{border-color:var(--acc)}
.ctrl .btn.main{background:var(--acc);color:#0b0f1a;font-weight:700;border-color:var(--acc)}
.ctrl select{min-height:44px;padding:0 10px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:.85rem}
.ctrl .tm{margin-inline-start:auto;color:var(--acc2);font-size:.85rem;font-variant-numeric:tabular-nums}
.stage{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);margin-top:14px;padding:34px 26px}
.stage .ph{font-family:var(--font-ar);font-size:1.5rem;line-height:2.3;text-align:center;color:var(--txt)}
.stage .ph .w{color:#9aa3b5;opacity:.55;border-radius:6px;padding:0 3px;transition:opacity .12s,color .12s;cursor:pointer}
.stage .ph .w.read{color:var(--acc);opacity:.75}
.stage .ph .w.on{opacity:1}
.stage .wait{color:var(--dim);font-size:.9rem}
.pos{color:var(--dim);font-size:.75rem;text-align:center;margin-top:10px}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav a{color:var(--acc2);text-decoration:none;font-size:.85rem;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 16px;background:var(--card);min-height:44px;display:inline-flex;align-items:center}
.tlink{display:inline-flex;align-items:center;gap:6px;color:var(--acc2);font-size:.78rem;text-decoration:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 12px;margin-top:10px;min-height:44px;box-sizing:border-box}
.nav a:hover{border-color:var(--acc)}
.empty{color:var(--dim);padding:20px}
.txt{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-top:16px;font-family:var(--font-ar);font-size:1.08rem;line-height:2.1;white-space:pre-wrap}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}
.cover .big{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#0b0f1a}
.cover span{color:var(--dim);font-size:.82rem}
.stage .tpv,.stage .tnx{font-family:var(--font-ar);font-size:.95rem;line-height:1.9;color:var(--dim);opacity:.55;text-align:center;max-width:640px}
.stage .tpv{order:-1;margin-bottom:14px}
.stage .tnx{margin-top:14px}
.stage .ph{order:0}
.covtag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;border:1px solid var(--border);border-radius:99px;padding:4px 10px;color:var(--dim)}
.covtag.warn{border-color:rgba(224,90,90,.5);color:var(--err)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:.8rem">درس</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:70px;margin-top:12px"></div><div class="skel" style="height:300px;margin-top:12px"></div></div></main>
<script src="common.js?v=8"></script>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtT(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const icS='<svg class="i" style="width:1em;height:1em;vertical-align:-.12em"><use href="icons.svg#i-clock"/></svg>';

let YTP=null,AL=null,PH=[],curPh=-1,curW=-1,timer=null,pendPlay=false;
let WLOCK=null,SLEEP=null,SPANS=[],lastSave=0;

/* normalize alignment shapes to [[word,s,e,seg],...] then group into
   display phrases by punctuation / seg id / max length */
function normAlign(al){
  let ws = Array.isArray(al) ? al : (al && al.w) || [];
  return ws.map(x=>{
    if(Array.isArray(x))return x;
    return [x.w||x.t,x.s,x.e,x.seg||0];
  });
}
const PBRK=/[،؛.!؟:…—]$/;
function buildPhrases(ws){
  const ph=[];let cur=[],last=-1;
  for(const w of ws){
    const sg=w[3];
    if(((sg!==last&&last>=0)||cur.length>=12)&&cur.length){ph.push(cur);cur=[]}
    cur.push(w);last=sg;
    if(PBRK.test(w[0])&&cur.length>=3){ph.push(cur);cur=[];last=-1}
  }
  if(cur.length)ph.push(cur);
  return ph;
}
function renderPhrase(i){
  const st=document.getElementById('stage');
  const pos=document.getElementById('pos');
  if(i<0||i>=PH.length)return;
  curPh=i;curW=-1;
  let h='<div class="ph">'+PH[i].map((w,k)=>'<span class="w" data-s="'+w[1]+'">'+esc(w[0])+'</span>').join(' ')+'</div>';
  if(TELE){
    const pv=i>0?PH[i-1].map(w=>w[0]).join(' '):'';
    const nx=i<PH.length-1?PH[i+1].map(w=>w[0]).join(' '):'';
    h='<div class="tpv">'+esc(pv)+'</div>'+h+'<div class="tnx">'+esc(nx)+'</div>';
  }
  st.innerHTML=h;
  pos.textContent='جملة '+(i+1)+' / '+PH.length;
  SPANS=st.querySelectorAll('.w');   // cached — tick() never re-queries the DOM
}
function tick(){
  if(!YTP||!YTP.getCurrentTime||!PH.length)return;
  const tm=YTP.getCurrentTime();
  const bar=document.getElementById('tm');if(bar)bar.textContent=fmtT(tm)+' / '+fmtT(YTP.getDuration?YTP.getDuration():0);
  /* find current phrase: last phrase whose first word starts <= tm */
  let pi=curPh;
  if(pi<0||tm<PH[pi][0][1]-0.3||tm>PH[pi][PH[pi].length-1][2]+0.4){
    pi=-1;
    for(let i=0;i<PH.length;i++){if(tm<=PH[i][PH[i].length-1][2]+0.4){pi=i;break}}
    if(pi<0)pi=PH.length-1;
    renderPhrase(pi);
  }
  const ph=PH[pi];
  let wi=-1;
  for(let k=0;k<ph.length;k++){if(tm>=ph[k][1]&&tm<ph[k][2]+0.25){wi=k;break}}
  if(wi<0){for(let k=ph.length-1;k>=0;k--){if(ph[k][1]<=tm){wi=k;break}}}
  const spans=SPANS;
  if(wi!==curW){
    for(let k=0;k<spans.length;k++){
      spans[k].classList.toggle('on',k===wi);
      spans[k].classList.toggle('read',wi>=0&&k<wi);
      if(k!==wi){spans[k].style.background='';spans[k].style.webkitBackgroundClip='';spans[k].style.backgroundClip='';spans[k].style.color=''}
    }
    curW=wi;
  }
  if(wi>=0&&spans[wi]&&!HLLEGACY){
    const w=ph[wi],f=Math.max(0,Math.min(1,(tm-w[1])/Math.max(.05,w[2]-w[1])));
    const p=Math.round(f*100),sp=spans[wi];
    sp.style.background='linear-gradient(to left,var(--acc) '+p+'%,#9aa3b5 '+p+'%)';
    sp.style.webkitBackgroundClip='text';sp.style.backgroundClip='text';sp.style.color='transparent';
  }
  if(tm-lastSave>5){lastSave=tm;savePos()}
}
function seekPhrase(i){
  if(!YTP||i<0||i>=PH.length)return;
  YTP.seekTo(Math.max(0,PH[i][0][1]-0.1),true);
  renderPhrase(i);
}
function mountPlayer(vid){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  let ready=false;
  setTimeout(()=>{if(!ready){const s=document.getElementById('stage');if(s)s.innerHTML='<span class="wait">المشغّل يتأخر — <a href="https://youtu.be/'+vid+'" target="_blank" rel="noopener" style="color:var(--acc2)">افتح الدرس على يوتيوب مباشرة</a></span>'}},8000);
  window.onYouTubeIframeAPIReady=()=>{
    YTP=new YT.Player('yfp',{events:{
      onReady:()=>{ready=true;
        const b=document.querySelector('.btn.main');if(b)b.textContent='تشغيل';
        const sp=store.get('speed');if(sp&&sp!==1&&YTP.setPlaybackRate){YTP.setPlaybackRate(sp);const sel=document.getElementById('spd');if(sel)sel.value=String(sp)}
        const rp=T0||resumePos();if(rp>5)YTP.seekTo(rp,true);
        if(pendPlay){YTP.playVideo();pendPlay=false}},
      onStateChange:(e)=>{const b=document.querySelector('.btn.main');if(b)b.textContent=(e.data===1||e.data===3)?'إيقاف':'تشغيل';
        if(e.data===1){wakeLock(true);if(!timer)timer=setInterval(tick,150)}
        else{wakeLock(false);if(e.data!==3&&timer){clearInterval(timer);timer=null}}
        if(e.data===0&&AUTO_NEXT){const nx=document.getElementById('go-next');if(nx)nx.click()}
        if(e.data===0){const d=store._d();if(d.resume&&d.resume[RESK]){delete d.resume[RESK];store._w(d)}}}}});
  };
}
/* URL flags for phase-6 features (additive, off by default) */
const FLAGS=new URLSearchParams(location.search);
const AUTO_NEXT=FLAGS.get('next')==='1';
const TELE=FLAGS.get('mode')==='tele';         // teleprompter prev/cur/next
const HLLEGACY=FLAGS.get('hl')==='legacy';     // old single-word fill
const RAWPH=FLAGS.get('ph')==='raw';           // do not merge short phrases
const SLUG=FLAGS.get('s')||'',LN=parseInt(FLAGS.get('l'),10);
const T0=parseFloat(FLAGS.get('t'))||0;        // start position in seconds
const RESK='lspos:'+SLUG+':'+LN;
function resumePos(){const r=store.resume(RESK);return(r&&r.n)||0}
function savePos(){
  if(!YTP||!YTP.getCurrentTime)return;
  const p=YTP.getCurrentTime();
  if(p>3)store.setResume(RESK,Math.floor(p));
}
function wakeLock(on){
  if(!('wakeLock' in navigator))return;
  if(on){navigator.wakeLock.request('screen').then(w=>WLOCK=w).catch(()=>{})}
  else if(WLOCK){WLOCK.release().catch(()=>{});WLOCK=null}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&YTP&&YTP.getPlayerState&&YTP.getPlayerState()===1){wakeLock(true);if(!timer)timer=setInterval(tick,150)}
  else if(document.visibilityState!=='visible'){if(timer){clearInterval(timer);timer=null}savePos()}
});
document.addEventListener('click',e=>{
  const sp=e.target.closest('.w');
  if(sp&&YTP){YTP.seekTo(parseFloat(sp.dataset.s),true);YTP.playVideo()}
});
// keyboard shortcuts: space play/pause · ←/→ ±10s · [ ] phrase back/fwd
document.addEventListener('keydown',e=>{
  if(!YTP||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();const s=YTP.getPlayerState&&YTP.getPlayerState();if(s===1)YTP.pauseVideo();else YTP.playVideo()}
  else if(e.key==='ArrowLeft'){YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)}
  else if(e.key==='ArrowRight'){YTP.seekTo(YTP.getCurrentTime()+10,true)}
  else if(e.key===']')seekPhrase(curPh+1);else if(e.key==='[')seekPhrase(curPh-1);
});
(async()=>{
  const q=new URLSearchParams(location.search);
  const slug=q.get('s'), ln=parseInt(q.get('l'),10);
  const app=document.getElementById('app');
  const d=await j('series/'+encodeURIComponent(slug)+'.json');
  if(!d){app.innerHTML='<p class="empty">الدرس غير موجود.</p>';return}
  const l=d.lessons.find(x=>x.n===ln);
  if(!l){app.innerHTML='<div class="errbox">الدرس غير موجود — <a href="series.html?s='+encodeURIComponent(slug)+'">عودة للسلسلة</a></div>';return}
  document.getElementById('back').href='series.html?s='+encodeURIComponent(slug);
  // رابط «النص كاملاً» لقارئ التفريغ عند توفر صف مطابق
  const stats=await j('data/sheikh_stats.json');let rowL=null;
  if(stats&&stats[d.sheikh_slug])rowL=(stats[d.sheikh_slug].rows||[]).find(r=>r.sSlug===slug);
  const ln3=String(ln).padStart(3,'0'), ln2=String(ln).padStart(2,'0');
  const lidx=await j('lessons/'+encodeURIComponent(slug)+'/index.json');
  const hasMap=lidx&&lidx.af;           // rebuilt index = authoritative filenames
  const afn=hasMap?lidx.af[ln]:null;
  const tfn=lidx&&lidx.tf?lidx.tf[ln]:null;
  let aln=afn?await j('lessons/'+encodeURIComponent(slug)+'/'+afn):null;
  if(!aln&&!hasMap){ // no file map → probe both pads
    aln=await j('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.align.json');
    if(!aln&&ln3!==ln2)aln=await j('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.align.json');
  }
  const txt=aln?null:(tfn?await t('lessons/'+encodeURIComponent(slug)+'/'+tfn)
    :(lidx&&lidx.tf?(await t('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.txt')||(ln3!==ln2?await t('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.txt'):null))
      :(!lidx?(await t('lessons/'+encodeURIComponent(slug)+'/'+ln3+'.txt')||(ln3!==ln2?await t('lessons/'+encodeURIComponent(slug)+'/'+ln2+'.txt'):null)):null)));
  if(aln){ // alignment exists but is empty → fall back to plain text
    const w=Array.isArray(aln)?aln:(aln&&aln.w)||[];
    if(!w.length)aln=null;
  }
  document.title=l.title+' — '+d.title;
  document.getElementById('hdr-sub').textContent=d.sheikh||d.title||'درس';
  if('mediaSession' in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:l.title||('الدرس '+ln),artist:d.sheikh||'',album:d.title||''});
      navigator.mediaSession.setActionHandler('play',()=>YTP&&YTP.playVideo());
      navigator.mediaSession.setActionHandler('pause',()=>YTP&&YTP.pauseVideo());
      navigator.mediaSession.setActionHandler('seekbackward',()=>YTP&&YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true));
      navigator.mediaSession.setActionHandler('seekforward',()=>YTP&&YTP.seekTo(YTP.getCurrentTime()+10,true));
    }catch(e){}
  }
  const _ls=d.lessons.map(x=>x.n).sort((a,b)=>a-b);
  const prev=d.lessons.find(x=>x.n===_ls.filter(n=>n<ln).pop()),
        next=d.lessons.find(x=>x.n===_ls.find(n=>n>ln));
  let h='<div class="crumb cin"><a href="sheikh.html?s='+encodeURIComponent(d.sheikh_slug)+'">'+esc(d.sheikh)+'</a> ← <a href="series.html?s='+encodeURIComponent(slug)+'">'+esc(d.title)+'</a></div>';
  h+='<div class="hero cin"><h1>الدرس '+l.n+': '+esc(l.title)+'</h1><div class="meta">'+d.count+' درساً في السلسلة'+(l.dur?' · '+fmtDur(l.dur):'')+'</div></div>';
  if(aln){
    AL=aln;PH=RAWPH?normAlign(aln).map(w=>[w]):buildPhrases(normAlign(aln));
    if(!PH.length){aln=null;PH=[]} // empty phrases → plain-text path
  }
  const alcov=aln&&!Array.isArray(aln)?(aln.cov||0):1;
  if(aln){
    h+='<div class="player"><iframe id="yfp" src="https://www.youtube-nocookie.com/embed/'+esc(l.video)+'?enablejsapi=1&rel=0&playsinline=1&iv_load_policy=3&hl=ar&origin='+encodeURIComponent(location.origin)+'" allowfullscreen></iframe></div>';
    h+='<div class="ctrl">'
      +'<button class="btn main" onclick="if(YTP){const s=YTP.getPlayerState&&YTP.getPlayerState();(s===1||s===3)?YTP.pauseVideo():YTP.playVideo()}else{pendPlay=true;this.textContent=\'جارٍ التحميل…\'}">تشغيل</button>'
      +'<button class="btn" onclick="seekPhrase(curPh-1)">الجملة السابقة</button>'
      +'<button class="btn" onclick="seekPhrase(curPh+1)">الجملة التالية</button>'
      +'<button class="btn" onclick="YTP&&YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)" title="رجوع 10ث">↺10</button>'
      +'<button class="btn" onclick="YTP&&YTP.seekTo(YTP.getCurrentTime()+10,true)" title="تقدم 10ث">10↻</button>'
      +'<select id="spd" onchange="const v=parseFloat(this.value);YTP&&YTP.setPlaybackRate(v);store.set(\'speed\',v)"><option value="0.75">×0.75</option><option value="1" selected>×1</option><option value="1.25">×1.25</option><option value="1.5">×1.5</option><option value="2">×2</option></select>'
      +'<select id="slp" title="مؤقت النوم" onchange="if(SLEEP){clearTimeout(SLEEP);SLEEP=null}const m=parseInt(this.value);if(m){SLEEP=setTimeout(()=>{YTP&&YTP.pauseVideo();SLEEP=null},m*60000)}this.title=m?\'يتوقف خلال \'+this.value+\' د\':\'مؤقت النوم\'"><option value="0">نوم —</option><option value="15">15د</option><option value="30">30د</option><option value="45">45د</option><option value="60">60د</option></select>'
      +'<span class="tm" id="tm">0:00</span></div>';
    h+='<div class="stage" id="stage"><span class="wait">اضغط تشغيل — تظهر الجملة وتضيء الكلمة في وقتها</span></div>';
    h+='<div class="pos" id="pos"></div>';
    if(alcov<1)h+='<div style="text-align:center;margin-top:8px"><span class="covtag'+(alcov<0.7?' warn':'')+'">'+icS+' تغطية النص في هذه المحاذاة '+Math.round(alcov*100)+'%'+(alcov<0.7?' — قد تتقطع الإضاءة':'')+'</span></div>';
    if(rowL)h+='<a class="tlink" href="tr.html?r='+encodeURIComponent(rowL.id)+'&l='+l.n+'">'+I.read+' النص كاملاً</a>';
  }else{
    if(l.video)h+='<div class="player" id="pl"><div class="cover" onclick="this.parentElement.innerHTML=\'<iframe src=https://www.youtube.com/embed/'+esc(l.video)+'?autoplay=1 allowfullscreen></iframe>\'"><span class="big">▶</span><span>تشغيل الدرس من يوتيوب — '+esc(l.video)+'</span></div></div>';
    h+='<div class="txt cin">'+(txt?esc(txt):'<div style="text-align:center;color:var(--dim);padding:30px;border:1px dashed var(--border);border-radius:12px">التفريغ غير متوفر لهذا الدرس بعد</div>')+'</div>';
  }
  h+='<div class="nav">'+(prev?'<a href="lesson.html?s='+encodeURIComponent(slug)+'&l='+prev.n+'">→ الدرس السابق</a>':'<span></span>')
    +(next?'<a id="go-next" href="lesson.html?s='+encodeURIComponent(slug)+'&l='+next.n+(AUTO_NEXT?'&next=1':'')+'">الدرس التالي ←</a>':'<span></span>')+'</div>';
  app.innerHTML=h;
  if(aln)mountPlayer(l.video);
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
