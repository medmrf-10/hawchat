<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الملخص — سلاسل المشايخ</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" href="../fonts/Amiri-400-arabic.woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=11">
<style>
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 90px}
h1{font-family:var(--font-ar);font-size:1.45rem;font-weight:700;color:var(--txt);margin:8px 0 4px;line-height:1.6}
.lsub{color:var(--dim);font-size:var(--fs-xs);margin-bottom:16px}
.sbody{background:var(--card);border:1px solid var(--line-1);border-radius:var(--r-lg);padding:34px 30px;box-shadow:var(--e-1)}
.sbody .lead{font-family:var(--font-ar);font-size:1.28rem;line-height:2.45;color:var(--txt);white-space:pre-wrap;margin:0 0 18px}
.sbody ul{margin:0;padding-inline-start:24px}
.sbody li{font-family:var(--font-ar);font-size:1.15rem;line-height:2.2;color:var(--txt);margin-bottom:8px}
.sbody li::marker{color:var(--gold-3)}
.fit{display:inline-block;font-size:.78rem;padding:3px 12px;border-radius:999px;border:1px solid rgba(80,200,120,.4);color:#7fdca4;margin-bottom:14px}
.fit.mid{border-color:var(--gold-1);color:var(--gold-3)}
.fit.no{border-color:var(--line-2);color:var(--dim)}
.tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r-md);border:1px solid var(--gold-1);background:rgba(201,162,75,.08);color:var(--gold-3);font-family:var(--font-ui);font-size:.9rem;font-weight:600;cursor:pointer}
.navb{position:fixed;bottom:0;left:0;right:0;background:var(--bgt);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;z-index:50}
.navb a{min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:var(--fs-sm);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.navb a.off{opacity:.35;pointer-events:none}
.navb .pos{color:var(--acc2);font-size:var(--fs-sm);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="عودة" style="text-decoration:none"><svg class="i" style="width:1.15em;height:1.15em"><use href="icons.svg#i-back"/></svg></a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">الملخص</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:var(--fs-xs);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:60px;margin-top:12px"></div><div class="skel" style="height:260px;margin-top:12px"></div></div></main>
<div class="navb" id="navb" hidden></div>
<script src="common.js?v=11"></script>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const app=document.getElementById('app');
  let rid=q.get('r'),want=parseInt(q.get('l'),10)||0;
  const stats=await j('data/sheikh_stats.json');
  let hit=null;
  if(stats&&rid){
    for(const s in stats){if(s==='_meta')continue;
      const r=(stats[s].rows||[]).find(r=>r.id===rid);
      if(r){hit={slug:s,r,st:stats[s]};break}}
    if(!hit){const red=await j('data/redirects.json');
      if(red&&red[rid]){rid=red[rid];
        for(const s in stats){if(s==='_meta')continue;
          const r=(stats[s].rows||[]).find(r=>r.id===rid);
          if(r){hit={slug:s,r,st:stats[s]};break}}}}
  }
  if(!hit){app.innerHTML='<div class="errbox">لم يُعثر على السلسلة — <a href=".">عودة</a></div>';return}
  const row=hit.r,st=hit.st,slug=hit.slug;
  document.getElementById('hdr-sub').textContent=st.name;
  document.getElementById('back').href='row.html?r='+encodeURIComponent(row.id)+'&m=sm';
  const lidx=await j('lessons/'+encodeURIComponent(row.sSlug)+'/index.json');
  const smf=(lidx&&lidx.sumf)||{},sums=(lidx&&lidx.sum)||[],ti=(lidx&&lidx.ti)||{};
  if(!sums.length){app.innerHTML='<div class="errbox">لا ملخصات لهذه السلسلة — <a href="row.html?r='+encodeURIComponent(row.id)+'">عودة</a></div>';return}
  const srows=await j('data/sum/'+encodeURIComponent(row.id)+'.json')||[];
  const titleOf=n=>{const x=srows.find(y=>y.n===n);return ti[n]||(x&&x.title)||('الدرس '+n)};
  async function show(n){
    const i=sums.indexOf(n);
    const fn=smf[n];const sm=fn?await j('lessons/'+encodeURIComponent(row.sSlug)+'/'+encodeURIComponent(fn)):null;
    document.title='ملخص الدرس '+n+' — '+row.title;
    let h='<h1><bdi>'+esc(titleOf(n))+'</bdi></h1><div class="lsub">'+esc(row.title)+' · ملخص الدرس '+n+' من '+sums.length+' · '+esc(st.name)+'</div>';
    if(!sm){app.innerHTML=h+'<div class="errbox">تعذر تحميل الملخص.</div>';return}
    const fit=sm.fit||sm.s||'';
    h+='<div class="sbody cin">'
      +(fit?'<span class="fit'+(fit==='نعم'?'':(fit==='جزئياً'?' mid':' no'))+'">يصلح لدرس مسجد: '+esc(fit)+'</span>':'')
      +((sm.summary||sm.p)?'<p class="lead">'+esc(sm.summary||sm.p)+'</p>':'')
      +((sm.points&&sm.points.length)?'<ul>'+sm.points.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':'')
      +'</div><div class="tools"><button class="cbtn" id="cpy">⧉ نسخ الملخص</button></div>';
    app.innerHTML=h;
    document.getElementById('cpy').onclick=async()=>{
      const txt=(sm.summary||sm.p||'')+(sm.points&&sm.points.length?'\n\n'+sm.points.map(b=>'• '+b).join('\n'):'')
        +'\n\n— '+titleOf(n)+'، '+row.title+'، '+st.name;
      try{await navigator.clipboard.writeText(txt);if(typeof toast==='function')toast('نُسخ الملخص')}catch(e){}};
    const nav=document.getElementById('navb');nav.hidden=false;
    nav.innerHTML=(i>0?'<a href="?r='+encodeURIComponent(row.id)+'&l='+sums[i-1]+'">→ السابق</a>':'<a class="off">→ السابق</a>')
      +'<span class="pos">'+esc(row.title)+' — '+(i+1)+' / '+sums.length+'</span>'
      +(i<sums.length-1?'<a href="?r='+encodeURIComponent(row.id)+'&l='+sums[i+1]+'">التالي ←</a>':'<a class="off">التالي ←</a>');
  }
  if(want&&sums.includes(want))show(want);
  else if(want&&smf[want])show(want);
  else show(sums[0]);
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
