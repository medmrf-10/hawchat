<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السلاسل المختارة — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
/* ── hero ── */
.hero{display:flex;align-items:end;gap:14px;margin:10px 0 18px}
.hero h1{font-family:var(--font-ar);font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .pill{font-size:.68rem;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin-bottom:6px;white-space:nowrap}
/* ── unified action bar ── */
.bar{display:flex;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px}
.bar input{flex:1;min-width:0;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:.85rem}
.bar input:focus{outline:none;border-color:var(--acc)}
.abtn{height:38px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card2);color:var(--txt);font-family:var(--font-ui);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background .15s;display:inline-flex;align-items:center;gap:6px}
.abtn:hover{border-color:var(--acc)}
.abtn.gold{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:800}
.abtn.on{border-color:var(--acc3);color:var(--acc3)}
@media(max-width:640px){
  .bar{flex-wrap:wrap}
  .bar input{width:100%;flex:none;height:46px;font-size:.95rem}
  .bar .abtn{flex:1;height:44px;justify-content:center;font-size:.82rem}
  .wrap{padding:12px}
  .hero h1{font-size:1.45rem}
}
/* ── toast ── */
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%) translateY(80px);background:var(--card2);border:1px solid var(--acc);color:var(--txt);font-size:.78rem;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(50%) translateY(0)}
#toast.err{border-color:#e06565}
/* ── list cards ── */
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 6px}
.lst{position:relative;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s}
.lst:hover{border-color:var(--acc);transform:translateY(-2px)}
.lst.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 24px -12px var(--acc)}
.lst .cov{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--skel);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.lst .cov img{width:100%;height:100%;object-fit:cover;display:block}
.lst .cov .ph-f{display:flex;align-items:center;justify-content:center;font-family:var(--font-ar);color:var(--acc2);font-size:1.4rem;grid-column:1/-1;grid-row:1/-1}
.lst .lnm{font-family:var(--font-ar);font-weight:700;font-size:.88rem;margin-top:8px;line-height:1.4}
.lst .lct{font-size:.66rem;color:var(--dim);margin-top:2px}
.lst .lx{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(11,15,26,.8);border:1px solid var(--border);color:var(--dim);display:none;align-items:center;justify-content:center;font-size:.62rem;z-index:2}
.lst:hover .lx{display:flex}
.lst .lx:hover{color:#e06565;border-color:#e06565}
/* ── filtered banner ── */
#fltnote{display:none;align-items:center;gap:8px;margin:10px 0 0;font-size:.75rem;color:var(--dim)}
#fltnote.on{display:flex}
#fltnote b{color:var(--acc2);font-weight:700}
#fltnote .clr{cursor:pointer;border:1px solid var(--border);border-radius:99px;padding:3px 12px;color:var(--dim)}
#fltnote .clr:hover{color:#e06565;border-color:#e06565}
/* ── sheikh cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.sh{display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:8px 8px 10px;text-decoration:none;color:var(--txt);text-align:center;transition:border-color .18s,transform .18s;position:relative}
.sh:hover{border-color:var(--acc);transform:translateY(-2px)}
.sh .ph{width:100%;aspect-ratio:1;height:auto;margin:0 0 7px;border-radius:50%;background:var(--skel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:1.6rem;font-weight:700;color:var(--acc2)}
.sh .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .nm{font-family:var(--font-ar);font-size:.8rem;font-weight:700;line-height:1.4}
.sh .plus{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--acc);color:var(--acc2);background:var(--bgt);font-size:.85rem;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2}
body.assign .sh .plus{display:flex}
.sh .badge{position:absolute;top:6px;right:6px;min-width:20px;height:20px;font-size:.62rem;background:var(--acc);color:var(--bg);border-radius:99px;padding:0 7px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.sh .mrm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--bgt);border:1px solid var(--border);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:.62rem;z-index:2;cursor:pointer}
.sh .mrm:hover{color:#e06565;border-color:#e06565}
.sub{color:var(--dim);font-size:.8rem}
/* ── assign modal ── */
.mov{position:fixed;inset:0;background:rgba(4,7,14,.66);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
.mov.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;width:min(400px,92vw);max-height:80vh;overflow:auto;animation:cin .25s both}
.mbox h3{font-family:var(--font-ar);font-size:1.05rem;color:var(--acc2);margin:0 0 12px}
.lrow{display:flex;align-items:center;gap:8px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;transition:border-color .15s;font-size:.85rem}
.lrow:hover{border-color:var(--acc)}
.lrow.in{border-color:var(--acc);background:var(--card2)}
.lrow .inmark{margin-right:auto;font-size:.7rem;color:var(--acc2)}
.newl{display:flex;gap:8px;margin-top:12px}
.newl input{flex:1;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 12px;font-family:var(--font-ui);font-size:.8rem}
.newl button{height:38px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--acc);background:var(--card2);color:var(--acc2);cursor:pointer;font-size:.8rem;font-weight:600}
.mclose{margin-top:14px;width:100%;height:40px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card2);color:var(--txt);cursor:pointer;font-family:var(--font-ui)}
.sh.cin{animation:cin .35s both}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub">السلاسل المختارة</span>
</div></header>
<main><div class="wrap">
  <div class="hero cin"><h1>السلاسل المختارة</h1><span class="pill" id="count"></span></div>
  <div class="bar cin">
    <input type="text" id="nl" placeholder="اسم قائمة جديدة…">
    <button class="abtn gold" id="mk">＋ قائمة</button>
    <button class="abtn" id="asg">تخصيص</button>
    <button class="abtn" id="sav">حفظ</button>
  </div>
  <div class="lists" id="lists"></div>
  <div id="fltnote"><span>يعرض: <b id="fltn"></b></span><span class="clr" onclick="setFlt(null)">إظهار الكل</span></div>
  <div id="groups" class="grid"></div>
</div></main>
<div id="toast"></div>
<div class="mov" id="mov"><div class="mbox">
  <h3 id="mt">إسناد إلى قائمة</h3>
  <div id="mlists"></div>
  <div class="newl"><input id="mnl" placeholder="أو قائمة جديدة…"><button id="mmk">إضافة</button></div>
  <button class="mclose" onclick="closeModal()">تم</button>
</div></div>
<script>
const REPO={o:'medmrf-10',r:'hawchat',br:'main',path:'playlists/lists.json'};
const LS='hw_lists_v1',LT='hw_ghtok';
let state={version:1,updated_at:null,lists:[]},assign=false,curSh=null,flt=null;
let _groups=[],_slugs={},_photos={},_ch={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,err){const e=document.getElementById('toast');e.textContent=msg;e.className='on'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2600)}
function loadLS(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.lists){state=s;return true}}catch(e){}return false}
function saveLS(){state.updated_at=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(state))}
if(location.hash.startsWith('#t=')){try{localStorage.setItem(LT,location.hash.slice(3));history.replaceState(null,'',location.pathname)}catch(e){}}
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function mkid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function normalize(s){return (s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
function inLists(name){return state.lists.filter(l=>l.members.some(m=>m.name===name))}
function photo(name){return _photos[name]||_photos[normalize(name)]}
function slugOf(name){return _slugs[name]||_slugs[normalize(name)]||normalize(name)}
function cardHTML(name,lid){
  const p=photo(name);
  const init=name.replace(/^ال/,'').trim()[0]||'؟';
  return (lid?'<span class="mrm" data-l="'+lid+'">✕</span>':'')
    +'<div class="ph">'+(p?'<img src="'+p+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></div>'
    +'<div class="nm">'+name+'</div>';
}
/* lists → cover cards acting as filters */
function renderLists(){
  const w=document.getElementById('lists');w.innerHTML='';
  for(const l of state.lists){
    const c=document.createElement('div');c.className='lst'+(flt===l.id?' on':'');
    const imgs=l.members.slice(0,4).map(m=>photo(m.name)).filter(Boolean);
    c.innerHTML='<span class="lx">✕</span><div class="cov">'
      +(imgs.length?imgs.map(u=>'<img src="'+u+'" alt="" loading="lazy" onerror="this.remove()">').join(''):'<div class="ph-f">'+esc(l.name.trim()[0]||'؟')+'</div>')
      +'</div><div class="lnm">'+esc(l.name)+'</div><div class="lct">'+l.members.length+' مشايخ</div>';
    c.onclick=()=>setFlt(flt===l.id?null:l.id);
    c.querySelector('.lx').onclick=e=>{e.stopPropagation();delList(l.id)};
    w.appendChild(c);
  }
}
function setFlt(id){flt=id;renderAll();if(id){const l=state.lists.find(x=>x.id===id);document.getElementById('fltn').textContent=l?l.name:''}}
function renderGroups(){
  const g=document.getElementById('groups');g.innerHTML='';
  const fset=flt?new Set((state.lists.find(x=>x.id===flt)||{members:[]}).members.map(m=>m.name)):null;
  document.getElementById('fltnote').classList.toggle('on',!!flt);
  let i=0;
  for(const gr of _groups)for(const name of gr.names){
    if(fset&&!fset.has(name))continue;
    const a=document.createElement('a');
    a.className='sh cin';a.style.animationDelay=(Math.min(i++,30)*25)+'ms';
    if(!assign)a.href='sheikh.html?s='+encodeURIComponent(slugOf(name));
    const n=inLists(name).length;
    a.innerHTML='<span class="plus" data-n="'+esc(name)+'">＋</span>'
      +(n?'<span class="badge">'+n+'</span>':'')+cardHTML(name,flt);
    a.querySelector('.plus').onclick=ev=>{ev.preventDefault();ev.stopPropagation();pick(null,name)};
    const rm=a.querySelector('.mrm');
    if(rm)rm.onclick=ev=>{ev.preventDefault();ev.stopPropagation();dropM(rm.dataset.l,name)};
    if(assign)a.addEventListener('click',e=>{e.preventDefault();pick(null,name)});
    g.appendChild(a);
  }
}
function renderAll(){renderLists();renderGroups()}
function addList(nm){nm=(nm||'').trim();if(!nm)return;state.lists.push({id:mkid(),name:nm,members:[]});saveLS();renderAll();toast('أُنشئت «'+nm+'» — اضغط «حفظ» لرفعها')}
function dropM(lid,name){const l=state.lists.find(x=>x.id===lid);if(!l)return;l.members=l.members.filter(m=>m.name!==name);saveLS();renderAll()}
function delList(lid){state.lists=state.lists.filter(x=>x.id!==lid);if(flt===lid)flt=null;saveLS();renderAll()}
function pick(ev,name){if(ev)ev.stopPropagation();curSh=name;openModal()}
function openModal(){
  document.getElementById('mt').textContent='إسناد «'+curSh+'» إلى:';
  const w=document.getElementById('mlists');w.innerHTML='';
  if(!state.lists.length)w.innerHTML='<p class="sub">لا قوائم بعد — أنشئ واحدة أدناه</p>';
  for(const l of state.lists){
    const inn=l.members.some(m=>m.name===curSh);
    const r=document.createElement('div');r.className='lrow'+(inn?' in':'');
    r.innerHTML=esc(l.name)+'<span class="inmark">'+(inn?'✓ منسوب':'إضافة')+'</span>';
    r.onclick=()=>{
      if(inn)l.members=l.members.filter(m=>m.name!==curSh);
      else l.members.push({name:curSh,channel:_ch[curSh]||null});
      saveLS();renderAll();openModal();
    };
    w.appendChild(r);
  }
  document.getElementById('mov').classList.add('on');
}
function closeModal(){document.getElementById('mov').classList.remove('on');curSh=null}
document.getElementById('mk').onclick=()=>{const i=document.getElementById('nl');addList(i.value);i.value=''};
document.getElementById('mmk').onclick=()=>{const i=document.getElementById('mnl');addList(i.value);i.value=''};
document.getElementById('asg').onclick=e=>{assign=!assign;e.target.classList.toggle('on',assign);e.target.textContent=assign?'إنهاء التخصيص':'تخصيص';document.body.classList.toggle('assign',assign);renderAll();if(assign)toast('انقر بطاقة شيخ لإسناده لقائمة')};
document.getElementById('mov').addEventListener('click',e=>{if(e.target.id==='mov')closeModal()});
async function ghReq(m,u,body){
  const t=localStorage.getItem(LT);
  if(!t)throw new Error('no-token');
  const r=await fetch('https://api.github.com'+u,{method:m,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):null});
  if(r.status===404)return null;
  if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,120))}
  return r.json();
}
async function saveRepo(){
  toast('يحفظ…');
  const payload={version:1,updated_at:new Date().toISOString(),lists:state.lists.map(l=>({id:l.id,name:l.name,members:l.members.map(m=>({name:m.name,channel:_ch[m.name]||m.channel||null}))}))};
  const t=localStorage.getItem(LT);
  if(t){
    try{
      const cur=await ghReq('GET','/repos/'+REPO.o+'/'+REPO.r+'/contents/'+REPO.path+'?ref='+REPO.br);
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,1))));
      const body={message:'playlists: save lists ('+payload.lists.length+' قوائم)',content:b64,branch:REPO.br};
      if(cur&&cur.sha)body.sha=cur.sha;
      await ghReq('PUT','/repos/'+REPO.o+'/'+REPO.r+'/contents/'+REPO.path,body);
      toast('حُفظت '+payload.lists.length+' قائمة ✓');return;
    }catch(e){toast('فشل الحفظ: '+e.message,1);return}
  }
  toast('لا يوجد رمز حفظ — القوائم محفوظة محلياً على هذا الجهاز',1);
}
document.getElementById('sav').onclick=saveRepo;
(async()=>{
  const [data,photos,chd,meta,file]=await Promise.all([j('shuyukh.json'),j('photos.json'),j('channels.json'),j('data/sheikhs.json'),j('lists.json')]);
  _photos=photos||{};
  for(const c of ((chd&&chd.channels)||[]))for(const it of (c.items||[]))if(it.verified&&it.url)_ch[it.name]=it.url;
  for(const s of ((meta&&meta.sheikhs)||[]))for(const n of [s.name_display,s.name,...(s.aliases||[])]){_slugs[n]=s.slug;_slugs[normalize(n)]=s.slug}
  if(!loadLS()&&file&&file.lists)state=file; else if(file&&file.lists&&(!state.updated_at||(file.updated_at&&file.updated_at>state.updated_at)))state=file;
  if(!data||!data.groups){document.getElementById('groups').innerHTML='<p class="sub">تعذر تحميل القائمة.</p>';return}
  _groups=data.groups;
  let total=0;for(const g of _groups)total+=g.names.length;
  document.getElementById('count').textContent=total+' شيخاً';
  renderAll();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
