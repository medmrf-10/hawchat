<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — سلاسل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css?v=8">
<link rel="stylesheet" href="common.css?v=8">
<link rel="stylesheet" href="ui.css?v=8">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 24px}
.sh.soon{opacity:.42;pointer-events:none}
.soonh{width:100%;height:48px;margin-top:16px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);color:var(--ink-3);font-family:var(--font-ui);font-size:var(--fs-sm);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.sres a{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-1);
  border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--txt);font-size:var(--fs-sm);min-height:52px}
.sres a small{color:var(--ink-3);margin-inline-start:auto;white-space:nowrap}
#nres{font-size:var(--fs-xs);color:var(--ink-3);margin:8px 2px;min-height:1.2em}
a.mini{color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 4px}
.kpis{display:flex;gap:24px;align-items:center;margin-top:4px}
.favgrid .u-sh .ph{border-color:var(--gold-2)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="الرئيسية" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span class="sub" style="color:var(--ink-3);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div class="u-hero cin"><h1>سلاسل المشايخ</h1>
    <div class="meta"><span id="count"></span><span class="kpis" id="kpis"></span></div>
  </div>
  <div class="u-search cin"><input type="search" id="flt" aria-label="ابحث عن شيخ أو سلسلة" enterkeyhint="search" placeholder="ابحث عن شيخ أو سلسلة…"><svg class="i"><use href="icons.svg#i-search"/></svg></div>
  <div id="cont"></div>
  <div id="favwrap" hidden>
    <div class="u-sech"><h2>المفضلة</h2><span class="cnt" id="favcnt"></span></div>
    <div id="favs" class="u-grid favgrid"></div>
  </div>
  <div class="u-sech"><h2>المشايخ</h2><span class="cnt" id="shcnt"></span></div>
  <div id="nres" aria-live="polite"></div>
  <div id="groups" class="u-grid"></div>
  <div id="sres" class="sres"></div>
  <button id="soonh" class="soonh" hidden></button>
  <div id="soong" class="u-grid" hidden style="margin-top:12px"></div>
  <div style="text-align:center;margin-top:32px;font-size:var(--fs-xs);color:var(--ink-3)">
    <a href="#" id="exp" class="mini">تصدير بياناتي</a> · <a href="#" id="imp" class="mini">استيراد</a>
    <input type="file" id="impf" accept="application/json" hidden>
  </div>
</div></main>
<script src="common.js?v=8"></script>
<script>
let _stats={},flt='',showSoon=false;
const ic=id=>'<svg class="i"><use href="icons.svg#'+id+'"/></svg>';
const num=(kind,n,label,ok)=>'<span class="u-num '+kind+'">'+ic(kind==='rd'?'i-read':'i-listen')+'<b>'+n+'</b>'+(ok?'<b class="ok">'+ic('i-check')+'</b>':'')+'<small>'+label+'</small></span>';
function shCard(st,slug,fav){
  const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
  return '<a class="u-sh cin" href="sheikh.html?s='+encodeURIComponent(slug)+'">'
    +'<span class="ph">'+(st.photo?'<img src="'+esc(st.photo)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></span>'
    +'<span class="nm">'+esc(st.name)+'</span>'
    +'<span class="stats">'
    +(st.read?num('rd',st.read,'مقروء',allR(st)):'')
    +(st.watch?num('ls',st.watch,'مسموع',allW(st)):'')
    +'</span></a>';
}
function slugOf(st){for(const s in _stats)if(_stats[s]===st)return s;return''}
function allR(st){return st.rows.length&&st.rows.every(r=>r.rOk)}
function allW(st){const w=st.rows.filter(r=>r.wtt);return w.length&&w.every(r=>r.wOk)}
function draw(){
  const g=document.getElementById('groups'),sg=document.getElementById('soong'),sr=document.getElementById('sres');
  g.innerHTML='';sg.innerHTML='';sr.innerHTML='';
  let withC=[],without=[],sres=[];
  for(const slug in _stats){if(slug==='_meta')continue;const st=_stats[slug];st._slug=slug;
    withC.push(st)}
  withC.sort((a,b)=>(a.order||999)-(b.order||999));
  without.sort((a,b)=>(a.order||999)-(b.order||999));
  for(const st of withC){
    const hay=normalize(st.name+' '+(st.aliases||[]).join(' '));
    if(flt&&!hay.includes(flt)){
      for(const r of (st.rows||[]))if(normalize(r.title).includes(flt))sres.push({st,r});
      continue}
    g.insertAdjacentHTML('beforeend',shCard(st,st._slug));
  }
  for(const st of without){
    if(flt&&!normalize(st.name+' '+(st.aliases||[]).join(' ')).includes(flt))continue;
    const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
    sg.insertAdjacentHTML('beforeend','<a class="u-sh soon" aria-disabled="true"><span class="ph"><span>'+init+'</span></span><span class="nm">'+esc(st.name)+'</span></a>');
  }
  for(const x of sres){
    sr.insertAdjacentHTML('beforeend','<a href="'+esc(x.r.read)+'"><span>'+esc(x.r.title)+'</span><small>'+esc(x.st.name)+'</small></a>');
  }
  const sh=document.getElementById('soonh');
  sh.hidden=!without.length;sg.hidden=!showSoon;
  sh.innerHTML=showSoon?'إخفاء':'قريباً ('+without.length+')';
  document.getElementById('count').textContent=withC.length+' شيخاً';
  document.getElementById('shcnt').textContent=withC.length+' شيخاً';
  document.getElementById('nres').textContent=flt?(withC.some(st=>normalize(st.name+' '+(st.aliases||[]).join(' ')).includes(flt))||sres.length?'':'لا نتائج.'):'';
  drawFavs();
}
function drawFavs(){
  const f=store.favList(),wrap=document.getElementById('favwrap'),el=document.getElementById('favs');
  const cards=[];
  for(const slug in _stats){if(slug==='_meta')continue;const st=_stats[slug];
    if(!st.rows)continue;
    for(const r of st.rows)if(f.includes(r.id))cards.push({st,r,slug});
  }
  wrap.hidden=!cards.length;
  document.getElementById('favcnt').textContent=cards.length?cards.length+' سلسلة':'';
  const seenL=store.seenList();
  el.innerHTML=cards.map(x=>'<a class="u-sh" href="'+esc(x.r.read)+'">'
    +''
    +'<span class="ph"><span>'+esc((x.st.name||'؟').replace(/^ال/,'').trim()[0]||'؟')+'</span></span>'
    +'<span class="nm">'+esc(x.r.title)+'</span>'
    +'<span class="stats">'+(x.r.rdn?num('rd',x.r.rdn,'مقروء',x.r.rOk):'')+(x.r.wan?num('ls',x.r.wan,'مسموع',x.r.wOk):'')+'</span></a>').join('');
}
function drawCont(){
  const el=document.getElementById('cont');el.innerHTML='';
  const rs=store.resumeList();if(!rs.length)return;
  const items=[];
  for(const it of rs.slice(0,4)){
    const rid=it.k;let found=null;
    for(const slug in _stats){if(slug==='_meta')continue;
      const r=(_stats[slug].rows||[]).find(r=>r.id===rid);
      if(r)found={r,st:_stats[slug]}}
    if(found)items.push({h:'tr.html?r='+encodeURIComponent(rid)+'&l='+it.n,t:found.r.title,sub:found.st.name+' — الدرس '+it.n,rd:true});
  }
  el.innerHTML=items.map(x=>'<a class="u-cont cin" href="'+esc(x.h)+'">'+ic(x.rd?'i-read':'i-listen')
    +'<span class="tt">'+esc(x.t)+'<small>'+esc(x.sub)+'</small></span><span class="go">تابِع ←</span></a>').join('');
}
document.getElementById('flt').addEventListener('input',e=>{flt=normalize(e.target.value);draw()});
document.getElementById('soonh').addEventListener('click',()=>{showSoon=!showSoon;draw()});
document.getElementById('exp').addEventListener('click',e=>{
  e.preventDefault();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([store.export()],{type:'application/json'}));
  a.download='salasil-backup.json';a.click();
});
document.getElementById('imp').addEventListener('click',e=>{e.preventDefault();document.getElementById('impf').click()});
document.getElementById('impf').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{if(store.import_(r.result)){drawCont();drawFavs()}};
  r.readAsText(f);
});
(async()=>{
  document.getElementById('groups').innerHTML='<div class="skel" style="height:200px;border-radius:18px"></div><div class="skel" style="height:200px;border-radius:18px"></div>';
  const stats=await j('data/sheikh_stats.json');
  if(!stats){document.getElementById('groups').innerHTML='';document.getElementById('kpis').innerHTML='<div class="errbox">تعذر تحميل بيانات السلاسل — <a href=".">أعد المحاولة</a></div>';return}
  _stats=stats;
  let tR=0,tW=0;for(const k in stats){if(k==='_meta')continue;tR+=stats[k].read||0;tW+=stats[k].watch||0}
  document.getElementById('kpis').innerHTML=num('rd',tR,'مقروء',false)+num('ls',tW,'مسموع',false);
  drawCont();draw();
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
