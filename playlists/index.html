<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — سلاسل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=12">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 24px}
.sh.soon,.u-sh.soon{opacity:.42;pointer-events:none;filter:grayscale(.6)}
.u-sh.soon .nm::after{content:'قريباً';display:inline-block;margin-inline-start:6px;font-size:.6rem;color:var(--ink-3);border:1px solid var(--line-2);border-radius:8px;padding:1px 6px;vertical-align:2px}
.soonh{width:100%;height:48px;margin-top:16px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);color:var(--ink-3);font-family:var(--font-ui);font-size:var(--fs-sm);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
a.mini{color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 4px}
.wrap{padding-left:0;padding-right:0}
.u-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:0}
@media(min-width:720px){.u-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important}}
.u-sh{padding:var(--sp-2) 0 0;overflow:hidden;border-radius:0;position:relative}
.u-sh .cntx{position:absolute;top:6px;inset-inline-end:8px;font-family:var(--font-ui);
  font-size:1.15rem;font-weight:800;color:var(--gold-3);line-height:1;pointer-events:none}
.u-sh .ph{width:56px;height:56px}
.u-sh .nm{font-size:.8rem;margin-top:4px;flex-basis:100%;text-align:center;line-height:1.4}
.u-sh .u-top{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;text-decoration:none;color:inherit;width:100%;padding:var(--sp-2) var(--sp-2) var(--sp-3);position:relative}
.u-sh .u-top .ph{width:78px;height:78px;flex:none;margin-inline-end:14px}
.u-sh .snums{position:absolute;inset-inline-end:0;top:calc(var(--sp-2) + 39px);transform:translateY(-50%);width:calc(50% - 25px);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-ui);font-size:1.05rem;font-weight:800;color:var(--gold-3);line-height:1;pointer-events:none}
.u-sh .snums span{display:block}
.u-sh .snums .sm2{font-weight:700}
.ubar{display:flex;justify-content:center;gap:10px;padding:4px var(--sp-3) 14px}
.ubar .ftile{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
  border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-3);
  cursor:pointer;transition:border-color var(--t-fast) var(--ease)}
.ubar .ftile .i{width:24px;height:24px}
.ubar .ftile.on{border-color:var(--gold-2);color:var(--gold-3);background:rgba(201,162,75,.12)}
.ubar .ftile.rd.on{color:var(--gold-3)}.ubar .ftile.lsn.on{color:var(--violet)}
.ubar .ftile.sm.on{color:#4fb3c9}.ubar .ftile.yt.on{color:#e05a4f}.ubar .ftile.qu.on{color:#8fb3e0}
.ubar .ftile.aud.on{color:var(--green)}
@media(hover:hover){.ubar .ftile:hover{border-color:var(--gold-2)}}
.u-sech{padding:0 var(--sp-3)}
#cont{padding:0 var(--sp-3)}
.soonh{margin:16px var(--sp-3) 0;width:calc(100% - 2*var(--sp-3))}
main .wrap>div:last-child{padding:0 var(--sp-3)}
.hhero{padding:14px var(--sp-3) 4px}.hhero h1{font-size:1.25rem;font-weight:800;line-height:1.5;margin:0}
.hhero p{color:var(--ink-3);font-size:var(--fs-xs);margin:2px 0 0;font-variant-numeric:tabular-nums}
.u-sh .shm{color:var(--ink-3);font-size:.72rem;margin-top:2px}
.u-sh .shc{display:flex;gap:10px;justify-content:center;margin-top:8px;min-height:18px}
.u-sh .shc i{font-style:normal;display:inline-flex;align-items:center;gap:3px;font-size:.72rem;color:var(--gold-3);font-variant-numeric:tabular-nums}
.u-sh .shc i.v{color:var(--violet)}.u-sh .shc i.s{color:#4fb3c9}.u-sh .shc .i{width:14px;height:14px}
.u-sh .nm{min-height:2.8em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:0 6px;max-width:100%;overflow-wrap:anywhere}
.u-sh .shc{flex-wrap:wrap;gap:4px 8px;padding:0 4px}
.u-sh .shm{padding:0 4px}
@media(max-width:360px){.u-sh .ph{width:56px;height:56px}.u-sh .shc i{font-size:.68rem}}
.gsrch{position:relative;margin:4px var(--sp-3) 14px}
.gsrch input{width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--txt);
  padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm)}
.gsrch input:focus{outline:none;border-color:var(--gold-2)}
#gres{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:60vh;overflow:auto}
#gres:empty{display:none}
.gr{display:block;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-1);background:var(--bg-2);color:var(--txt);text-decoration:none;min-height:44px}
.gr b{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.5}.gr small{color:var(--ink-3);font-size:var(--fs-xs)}
.gempty{color:var(--ink-3);text-align:center}
.ctit{font-size:var(--fs-xs);color:var(--gold-3);margin:0 2px 6px;font-weight:700}
.crow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.crow::-webkit-scrollbar{display:none}
.ccard{flex:0 0 72%;max-width:280px;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:linear-gradient(160deg,var(--card),var(--bg-2));color:var(--txt);text-decoration:none}
.ccard b{font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard span{color:var(--gold-3);font-size:var(--fs-xs)}
.ccard small{color:var(--ink-3);font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="الرئيسية" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
</div></header>
<main><div class="wrap">
  <div class="hhero"><h1>دروس المشايخ — اقرأ، شاهد، استمع</h1><p id="htot">&nbsp;</p></div>
  <div class="gsrch"><input id="gq" type="search" placeholder="ابحث عن سلسلة أو درس أو شيخ…" aria-label="بحث شامل" autocomplete="off"><div id="gres" aria-live="polite"></div></div>
  <div id="cont"></div>
  <div class="u-sech"><h2>المشايخ</h2><span class="cnt" id="shcnt"></span></div>
  <div id="groups" class="u-grid"></div>
  <button id="soonh" class="soonh" hidden></button>
  <div id="soong" class="u-grid" hidden style="margin-top:12px"></div>
  <div style="text-align:center;margin-top:32px;font-size:var(--fs-xs);color:var(--ink-3)">
    <a href="#" id="exp" class="mini">تصدير بياناتي</a> · <a href="#" id="imp" class="mini">استيراد</a>
    <input type="file" id="impf" accept="application/json" hidden>
  </div>
</div></main>
<script src="common.js?v=11"></script>
<script src="core.js?v=2"></script>
<script>
let _stats={},showSoon=false,_mode='lsn';
const ic=id=>'<svg class="i"><use href="icons.svg?v=11#'+id+'"/></svg>';
const MODES=[['rd','i-read','قراءة'],['yt','i-yt','يوتيوب'],['lsn','i-watch','مشاهدة حية'],['qu','i-qu','أسئلة'],['aud','i-audio','استماع'],['sm','i-list','تلخيص']];
const MCOUNT={rd:r=>r.rdn||0,yt:r=>r.ytn||0,lsn:r=>r.wan||0,qu:r=>r.qn||0,aud:r=>(r.ytn||0)+(r.aun||0),sm:r=>r.sun||0};
function drawBar(){
  document.getElementById('ubar').innerHTML=MODES.map(([k,i,a])=>
    '<button class="ftile '+k+(_mode===k?' on':'')+'" data-k="'+k+'" aria-label="'+a+'" aria-pressed="'+(_mode===k)+'" title="'+a+'">'+ic(i)+'</button>').join('');
  document.querySelectorAll('#ubar .ftile').forEach(b=>b.onclick=()=>{
    _mode=(_mode===b.dataset.k)?'':b.dataset.k;
    draw();
  let S=0,R=0,L=0;for(const k in stats){if(k==='_meta')continue;const rs=stats[k].rows||[];if(rs.length)S++;R+=rs.length;
    for(const r of rs)L+=Math.max(r.ytn||0,r.wtt||0,r.rtt||0,r.rdn||0)}
  document.getElementById('htot').textContent=S+' شيخاً · '+kfmt(R)+' سلسلة · '+kfmt(L)+' درس';
  document.getElementById('shcnt').textContent=S;
  });
  const lbl=document.getElementById('ubar-sub'),mn=_mode&&(MODES.find(x=>x[0]===_mode)||[])[2];
  if(lbl)lbl.textContent=mn?('العرض: '+mn):'';
}
function shCard(st,slug){
  const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
  let L=0,rd=0,ls=0,sm=0;
  for(const r of st.rows||[]){L+=Math.max(r.ytn||0,r.wtt||0,r.rtt||0,r.rdn||0);rd+=r.rdn||0;ls+=r.wan||0;sm+=r.sun||0}
  const seen=(store.get('hist',[])||[]).some(h=>(st.rows||[]).some(r=>r.id===h.r));
  return '<a class="u-sh cin" href="sheikh.html?s='+encodeURIComponent(slug)+'">'
    +(seen?'<span class="u-badge">تتابعه</span>':'')
    +'<span class="ph">'+(st.photo?'<img src="'+esc(st.photo)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></span>'
    +'<span class="nm">'+esc(st.name)+'</span>'
    +'<span class="shm">'+pluralSeries((st.rows||[]).length)+' · '+kfmt(L)+' درس</span>'
    +'<span class="shc">'+(rd?'<i title="دروس مكتوبة">'+ic('i-read')+kfmt(rd)+'</i>':'')+(ls?'<i class="v" title="مشاهدة حية">'+ic('i-watch')+kfmt(ls)+'</i>':'')+(sm?'<i class="s" title="ملخصات">'+ic('i-list')+kfmt(sm)+'</i>':'')+'</span>'
    +'</a>';
}

function draw(){
  const g=document.getElementById('groups'),sg=document.getElementById('soong');
  g.innerHTML='';sg.innerHTML='';
  let withC=[],without=[];
  for(const slug in _stats){if(slug==='_meta')continue;const st=_stats[slug];st._slug=slug;
    (st.rows&&st.rows.length?withC:without).push(st)}
  withC.sort((a,b)=>(a.order||999)-(b.order||999));
  without.sort((a,b)=>(a.order||999)-(b.order||999));
  for(const st of withC)g.insertAdjacentHTML('beforeend',shCard(st,st._slug));
  for(const st of without){
    // name only — an initial letter glued visually onto the name ("شالشعراوي")
    sg.insertAdjacentHTML('beforeend','<div class="u-sh soon" aria-disabled="true"><span class="nm" style="flex-basis:auto;padding:14px 8px">'+esc(st.name)+'</span></div>');
  }
  const sh=document.getElementById('soonh');
  sh.hidden=!without.length;sg.hidden=!showSoon;
  sh.innerHTML=showSoon?'إخفاء':'قريباً ('+without.length+')';
}
document.getElementById('soonh').addEventListener('click',()=>{showSoon=!showSoon;draw()});
document.getElementById('exp').addEventListener('click',async e=>{
  e.preventDefault();
  const file=new File([store.export()],'salasil-backup.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(err){if(err&&err.name==='AbortError')return}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download='salasil-backup.json';a.click();
  if(typeof toast==='function')toast('نُزّلت نسخة بياناتك');
});
document.getElementById('imp').addEventListener('click',e=>{e.preventDefault();document.getElementById('impf').click()});
document.getElementById('impf').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    if(store.import_(r.result)){
      const d=store._d(),nf=Object.keys(d.fav||{}).length,nr=Object.keys(d.resume||{}).length;
      draw();
      if(typeof toast==='function')toast('استُعيدت بياناتك ('+nf+' مفضلة، '+nr+' موضع استئناف)');
    }else if(typeof toast==='function')toast('ملف غير صالح');
  };
  r.readAsText(f);
});
/* continue where you left off — written by core.js on every lesson page */
function drawCont(){
  const h=(store.get('hist',[])||[]).slice(0,4),el=document.getElementById('cont');
  const MN={listen:'مشاهدة',read:'قراءة',yt:'يوتيوب',aud:'استماع',sm:'ملخص',qu:'أسئلة'};
  el.innerHTML=h.length?'<div class="ctit">تابع من حيث توقفت</div><div class="crow">'+h.map(x=>
    '<a class="ccard" href="'+(x.m==='listen'?'row.html?r='+encodeURIComponent(x.r)+'&l='+x.n+'&m=listen':'d.html?r='+encodeURIComponent(x.r)+'&l='+x.n+(x.m?'&t='+x.m:''))+'"><b><bdi>'+esc(x.rt||'')+'</bdi></b>'
    +'<span>الدرس '+x.n+(x.m&&MN[x.m]?' · '+MN[x.m]:'')+'</span><small><bdi>'+esc(x.ti||'')+'</bdi></small></a>').join('')+'</div>':'';
}
let _sl=null,_slp=null;
async function gsearch(){
  const raw=document.getElementById('gq').value,qq=normalize(raw),el=document.getElementById('gres');
  if(qq.length<2){el.innerHTML='';return}
  const out=[];
  for(const s in _stats){if(s==='_meta')continue;const st=_stats[s];
    if(normalize(st.name).includes(qq))out.push('<a class="gr" href="sheikh.html?s='+encodeURIComponent(s)+'"><b>'+esc(st.name)+'</b><small>شيخ · '+pluralSeries((st.rows||[]).length)+'</small></a>');
    for(const r of st.rows||[])if(normalize(r.title).includes(qq))out.push('<a class="gr" href="row.html?r='+encodeURIComponent(r.id)+'"><b><bdi>'+esc(r.title)+'</bdi></b><small>سلسلة · '+esc(st.name)+'</small></a>')}
  el.innerHTML=out.length?out.slice(0,12).join(''):'<div class="gr gempty">…</div>';
  if(!_sl){_slp=_slp||j('data/search_lessons.json');_sl=await _slp||{}}
  if(normalize(document.getElementById('gq').value)!==qq)return;
  const rt={};for(const s in _stats){if(s==='_meta')continue;for(const r of _stats[s].rows||[])rt[r.id]=[r.title,_stats[s].name]}
  const ls=[];
  for(const rid in _sl){if(!rt[rid])continue;for(const [n,t] of _sl[rid].L||[]){if(ls.length>=30)break;
    if(normalize(t).includes(qq))ls.push('<a class="gr" href="d.html?r='+encodeURIComponent(rid)+'&l='+n+'"><b><bdi>'+esc(HC.cleanTitle(t,n,{title:rt[rid][0]})||t)+'</bdi></b><small>درس '+n+' · '+esc(rt[rid][0])+' · '+esc(rt[rid][1])+'</small></a>')}}
  const all=out.slice(0,12).concat(ls);
  el.innerHTML=all.length?all.join(''):'<div class="gr gempty">لا نتائج لـ«'+esc(raw)+'»</div>';
}
let _gt=0;document.getElementById('gq').addEventListener('input',()=>{clearTimeout(_gt);_gt=setTimeout(gsearch,180)});
drawCont();
(async()=>{
  document.getElementById('groups').innerHTML='<div class="skel" style="height:200px;border-radius:18px"></div><div class="skel" style="height:200px;border-radius:18px"></div>';
  const stats=await j('data/sheikh_stats.json');
  if(!stats){document.getElementById('groups').innerHTML='<div class="errbox">تعذر تحميل بيانات السلاسل — <a href=".">أعد المحاولة</a></div>';return}
  _stats=stats;
  draw();
  let S=0,R=0,L=0;for(const k in stats){if(k==='_meta')continue;const rs=stats[k].rows||[];if(rs.length)S++;R+=rs.length;
    for(const r of rs)L+=Math.max(r.ytn||0,r.wtt||0,r.rtt||0,r.rdn||0)}
  document.getElementById('htot').textContent=S+' شيخاً · '+kfmt(R)+' سلسلة · '+kfmt(L)+' درس';
  document.getElementById('shcnt').textContent=S;
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
