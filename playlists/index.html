<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — سلاسل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=11">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 24px}
.sh.soon,.u-sh.soon{opacity:.42;pointer-events:none;filter:grayscale(.6)}
.u-sh.soon .nm::after{content:'قريباً';display:inline-block;margin-inline-start:6px;font-size:.6rem;color:var(--ink-3);border:1px solid var(--line-2);border-radius:8px;padding:1px 6px;vertical-align:2px}
.soonh{width:100%;height:48px;margin-top:16px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);color:var(--ink-3);font-family:var(--font-ui);font-size:var(--fs-sm);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
a.mini{color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 4px}
.wrap{padding-left:0;padding-right:0}
.u-grid{grid-template-columns:repeat(2,1fr)!important;gap:0}
.u-sh{padding:var(--sp-2) 0 0;overflow:hidden;border-radius:0}
.u-sh .ph{width:56px;height:56px}
.u-sh .nm{font-size:.8rem;margin-top:5px;-webkit-line-clamp:1;min-height:1.45em}
.u-sh .u-top{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;width:100%;padding:0 var(--sp-2) 6px}
.u-sh .tgrid{width:100%;margin:0;grid-template-columns:repeat(2,1fr)}
.u-sh .tgrid .tile{height:46px;flex-direction:row;gap:10px;justify-content:center}
.u-sh .tgrid .tile .i{width:24px;height:24px}
.u-sh .tgrid .tile b{font-size:1.02rem}
.u-sech{padding:0 var(--sp-3)}
.soonh{margin:16px var(--sp-3) 0;width:calc(100% - 2*var(--sp-3))}
main .wrap>div:last-child{padding:0 var(--sp-3)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="الرئيسية" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span class="sub" style="color:var(--ink-3);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div class="u-sech"><h2>المشايخ</h2><span class="cnt" id="shcnt"></span></div>
  <div id="groups" class="u-grid"></div>
  <button id="soonh" class="soonh" hidden></button>
  <div id="soong" class="u-grid" hidden style="margin-top:12px"></div>
  <div style="text-align:center;margin-top:32px;font-size:var(--fs-xs);color:var(--ink-3)">
    <a href="#" id="exp" class="mini">تصدير بياناتي</a> · <a href="#" id="imp" class="mini">استيراد</a>
    <input type="file" id="impf" accept="application/json" hidden>
  </div>
</div></main>
<script src="common.js?v=11"></script>
<script>
let _stats={},showSoon=false;
const ic=id=>'<svg class="i"><use href="icons.svg?v=11#'+id+'"/></svg>';
function shCard(st,slug,fav){
  const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
  const rows=st.rows||[];
  const agg=k=>{let s=0;for(const r of rows)s+=(k==='rd'?r.rdn:k==='yt'?r.ytn:k==='lsn'?r.wan:k==='qu'?r.qn:k==='aud'?(r.ytn||0)+(r.aun||0):k==='sm'?r.sun:0)||0;return s};
  const favn=rows.reduce((a,r)=>a+(store.fav(r.id)?1:0),0);
  const ytOk=rows.length&&rows.every(r=>{const t=Math.max(r.rtt||0,r.wtt||0);return t===0||(r.ytn||0)>=t});
  const tk=(k,icn,n,al,fk,ok)=>n>0
    ?'<a class="tile '+k+(ok?' ok':'')+'" href="sheikh.html?s='+encodeURIComponent(slug)+'&f='+(fk||k)+'" aria-label="'+al+' — '+n+'">'+ic(icn)+'<b>'+n+'</b></a>'
    :'<span class="tile '+k+' off" aria-hidden="true">'+ic(icn)+'<b>'+(n||0)+'</b></span>';
  return '<div class="u-sh cin">'
    +'<a class="u-top" href="sheikh.html?s='+encodeURIComponent(slug)+'">'
    +'<span class="ph">'+(st.photo?'<img src="'+esc(st.photo)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></span>'
    +'<span class="nm">'+esc(st.name)+'</span></a>'
    +'<span class="tgrid">'
    +tk('rd','i-read',agg('rd'),'قراءة')
    +tk('yt','i-yt',agg('yt'),'يوتيوب',null,ytOk)
    +tk('lsn','i-watch',agg('lsn'),'مشاهدة حية')
    +tk('qu','i-qu',agg('qu'),'أسئلة')
    +tk('aud','i-audio',agg('aud'),'استماع','aud')
    +tk('sm','i-list',agg('sm'),'تلخيص')
    +'</span></div>';
}

function draw(){
  const g=document.getElementById('groups'),sg=document.getElementById('soong');
  g.innerHTML='';sg.innerHTML='';
  let withC=[],without=[];
  for(const slug in _stats){if(slug==='_meta')continue;const st=_stats[slug];st._slug=slug;
    (st.rows&&st.rows.length?withC:without).push(st)}
  withC.sort((a,b)=>(a.order||999)-(b.order||999));
  without.sort((a,b)=>(a.order||999)-(b.order||999));
  for(const st of withC)g.insertAdjacentHTML('beforeend',shCard(st,st._slug));
  for(const st of without){
    const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
    sg.insertAdjacentHTML('beforeend','<div class="u-sh soon" aria-disabled="true"><span class="ph"><span>'+init+'</span></span><span class="nm">'+esc(st.name)+'</span></div>');
  }
  const sh=document.getElementById('soonh');
  sh.hidden=!without.length;sg.hidden=!showSoon;
  sh.innerHTML=showSoon?'إخفاء':'قريباً ('+without.length+')';
  document.getElementById('shcnt').textContent=withC.length+' شيخاً';
}
document.getElementById('soonh').addEventListener('click',()=>{showSoon=!showSoon;draw()});
document.getElementById('exp').addEventListener('click',async e=>{
  e.preventDefault();
  const file=new File([store.export()],'salasil-backup.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(err){if(err&&err.name==='AbortError')return}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download='salasil-backup.json';a.click();
  if(typeof toast==='function')toast('نُزّلت نسخة بياناتك');
});
document.getElementById('imp').addEventListener('click',e=>{e.preventDefault();document.getElementById('impf').click()});
document.getElementById('impf').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    if(store.import_(r.result)){
      const d=store._d(),nf=Object.keys(d.fav||{}).length,nr=Object.keys(d.resume||{}).length;
      draw();
      if(typeof toast==='function')toast('استُعيدت بياناتك ('+nf+' مفضلة، '+nr+' موضع استئناف)');
    }else if(typeof toast==='function')toast('ملف غير صالح');
  };
  r.readAsText(f);
});
(async()=>{
  document.getElementById('groups').innerHTML='<div class="skel" style="height:200px;border-radius:18px"></div><div class="skel" style="height:200px;border-radius:18px"></div>';
  const stats=await j('data/sheikh_stats.json');
  if(!stats){document.getElementById('groups').innerHTML='<div class="errbox">تعذر تحميل بيانات السلاسل — <a href=".">أعد المحاولة</a></div>';return}
  _stats=stats;
  draw();
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
