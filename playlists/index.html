<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السلاسل المختارة — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.gtitle{font-family:var(--font-ar);font-size:1.15rem;font-weight:700;color:var(--acc2);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.gtitle::after{content:"";flex:1;height:1px;background:var(--border)}
.gtitle .del{font-size:.7rem;color:var(--dim);cursor:pointer;border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-family:var(--font-ui)}
.gtitle .del:hover{color:#e06565;border-color:#e06565}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sh{display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 12px;text-decoration:none;color:var(--txt);text-align:center;transition:border-color .15s,transform .15s;position:relative}
.sh:hover{border-color:var(--acc);transform:translateY(-2px)}
.sh .ph{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--skel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:1.5rem;font-weight:700;color:var(--acc2)}
.sh .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .nm{font-family:var(--font-ar);font-size:1rem;font-weight:700;line-height:1.5}
.sh .ch{display:inline-block;margin-top:8px;font-size:.68rem;color:var(--dim)}
.sh .ch.ok{color:var(--acc2)}
.sh .plus{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--acc);color:var(--acc2);background:var(--bgt);font-size:.9rem;display:none;align-items:center;justify-content:center;cursor:pointer}
body.assign .sh .plus{display:flex}
.sh .badge{position:absolute;top:8px;right:8px;font-size:.6rem;background:var(--acc);color:var(--bg);border-radius:99px;padding:1px 8px;font-weight:800}
.sub{color:var(--dim);font-size:.8rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
.toolbar input[type=text]{flex:1;min-width:160px;height:40px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:.85rem}
.tbtn{height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-family:var(--font-ui);font-size:.8rem;cursor:pointer;transition:border-color .15s}
.tbtn:hover{border-color:var(--acc)}
.tbtn.gold{background:var(--acc);color:var(--bg);font-weight:800;border-color:var(--acc)}
.tbtn.on{border-color:var(--acc3);color:var(--acc3)}
#st{font-size:.75rem;color:var(--dim)}
#st.ok{color:var(--ok)}#st.err{color:#e06565}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 12px;font-size:.75rem;background:var(--card)}
.mchip a{color:var(--acc2);text-decoration:none}
.mchip .x{cursor:pointer;color:var(--dim)}
.mchip .x:hover{color:#e06565}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.mov.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;width:min(400px,92vw);max-height:80vh;overflow:auto}
.mbox h3{font-family:var(--font-ar);font-size:1.05rem;color:var(--acc2);margin:0 0 12px}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;transition:border-color .15s;font-size:.85rem}
.lrow:hover{border-color:var(--acc)}
.lrow.in{border-color:var(--acc);background:var(--card2)}
.lrow .inmark{margin-right:auto;font-size:.7rem;color:var(--acc2)}
.newl{display:flex;gap:8px;margin-top:12px}
.newl input{flex:1;height:36px;background:var(--bgt);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--txt);padding:0 12px;font-family:var(--font-ui);font-size:.8rem}
.newl button{height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--acc);background:var(--card2);color:var(--acc2);cursor:pointer;font-size:.8rem}
.mclose{margin-top:14px;width:100%;height:38px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card2);color:var(--txt);cursor:pointer}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub">السلاسل المختارة</span>
</div></header>
<main><div class="wrap">
  <h1 class="cin" style="font-family:var(--font-ar);font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 4px">السلاسل المختارة</h1>
  <p class="sub cin" id="count"></p>
  <div class="toolbar cin">
    <input type="text" id="nl" placeholder="اسم قائمة جديدة…">
    <button class="tbtn gold" id="mk">إنشاء قائمة</button>
    <button class="tbtn" id="asg">وضع التخصيص</button>
    <button class="tbtn gold" id="sav">حفظ</button>
    <span id="st"></span>
  </div>
  <div id="lists"></div>
  <div id="groups"></div>
</div></main>
<div class="mov" id="mov"><div class="mbox">
  <h3 id="mt">إسناد إلى قائمة</h3>
  <div id="mlists"></div>
  <div class="newl"><input id="mnl" placeholder="أو قائمة جديدة…"><button id="mmk">إضافة</button></div>
  <button class="mclose" onclick="closeModal()">تم</button>
</div></div>
<script>
const REPO={o:'medmrf-10',r:'hawchat',br:'main',path:'playlists/lists.json'};
const LS='hw_lists_v1',LT='hw_ghtok';
let groups=[],chMap={},state={version:1,updated_at:null,lists:[]},assign=false,curSh=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function st(msg,cls){const e=document.getElementById('st');e.textContent=msg;e.className=cls||''}
function loadLS(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.lists){state=s;return true}}catch(e){}return false}
function saveLS(){state.updated_at=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(state))}
if(location.hash.startsWith('#t=')){try{localStorage.setItem(LT,location.hash.slice(3));history.replaceState(null,'',location.pathname)}catch(e){}}
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function mkid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function inLists(name){return state.lists.filter(l=>l.members.some(m=>m.name===name))}
function renderLists(){
  const w=document.getElementById('lists');w.innerHTML='';
  if(!state.lists.length)return;
  const t=document.createElement('div');t.className='gtitle';t.textContent='قوائمي ('+state.lists.length+')';w.appendChild(t);
  for(const l of state.lists){
    const g=document.createElement('div');g.className='gtitle';g.style.margin='12px 0 8px';
    g.innerHTML=esc(l.name)+' <span class="sub">('+l.members.length+')</span> <span class="del" onclick="delList(\''+l.id+'\')">حذف</span>';
    const c=document.createElement('div');c.className='mchips';
    for(const m of l.members){
      const s=document.createElement('span');s.className='mchip';
      s.innerHTML=(m.channel?'<a href="'+m.channel+'" target="_blank" rel="noopener">'+esc(m.name)+' ↗</a>':esc(m.name))+' <span class="x" onclick="dropM(\''+l.id+'\',\''+esc(m.name).replace(/'/g,"\\'")+'\')">✕</span>';
      c.appendChild(s);
    }
    if(!l.members.length)c.innerHTML='<span class="sub">فارغة — فعّل «وضع التخصيص» وأضف مشايخ من البطاقات</span>';
    w.appendChild(g);w.appendChild(c);
  }
}
function renderGroups(groups,slugs,photos,ch){
  const g=document.getElementById('groups');g.innerHTML='';
  for(const gr of groups){
    const sec=document.createElement('section');
    sec.innerHTML='<div class="gtitle">المجموعة '+gr.id+'</div>';
    const grid=document.createElement('div');grid.className='grid';
    for(const name of gr.names){
      const p=photos[name]||photos[normalize(name)];
      const url=ch[name];
      const slug=slugs[name]||slugs[normalize(name)];
      const n=inLists(name).length;
      const a=document.createElement('a');
      a.className='sh cin';
      if(!assign)a.href='sheikh.html?s='+encodeURIComponent(slug||normalize(name));
      const init=name.replace(/^ال/,'').trim()[0]||'؟';
      a.innerHTML='<span class="plus" onclick="pick(event,\''+name.replace(/'/g,"\\'")+'\')">＋</span>'
        +(n?'<span class="badge">'+n+'</span>':'')
        +'<div class="ph">'+(p?'<img src="'+p+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></div>'
        +'<div class="nm">'+name+'</div>'
        +'<span class="ch'+(url?' ok':'')+'">'+(url?'القناة موثقة':'بانتظار القناة')+'</span>';
      if(assign)a.addEventListener('click',e=>{e.preventDefault();pick(null,name)});
      grid.appendChild(a);
    }
    sec.appendChild(grid);g.appendChild(sec);
  }
}
let _groups=[],_slugs={},_photos={},_ch={};
function renderAll(){renderLists();renderGroups(_groups,_slugs,_photos,_ch)}
function addList(nm){nm=(nm||'').trim();if(!nm)return;state.lists.push({id:mkid(),name:nm,members:[]});saveLS();renderAll();st('أُنشئت «'+nm+'» — محفوظة محلياً، اضغط «حفظ» لرفعها')}
function dropM(lid,name){const l=state.lists.find(x=>x.id===lid);if(!l)return;l.members=l.members.filter(m=>m.name!==name);saveLS();renderAll()}
function delList(lid){state.lists=state.lists.filter(x=>x.id!==lid);saveLS();renderAll()}
function pick(ev,name){if(ev)ev.stopPropagation();curSh=name;openModal()}
function openModal(){
  document.getElementById('mt').textContent='إسناد «'+curSh+'» إلى:';
  const w=document.getElementById('mlists');w.innerHTML='';
  if(!state.lists.length)w.innerHTML='<p class="sub">لا قوائم بعد — أنشئ واحدة أدناه</p>';
  for(const l of state.lists){
    const inn=l.members.some(m=>m.name===curSh);
    const r=document.createElement('div');r.className='lrow'+(inn?' in':'');
    r.innerHTML=esc(l.name)+'<span class="inmark">'+(inn?'✓ منسوب':'إضافة')+'</span>';
    r.onclick=()=>{
      if(inn)l.members=l.members.filter(m=>m.name!==curSh);
      else l.members.push({name:curSh,channel:_ch[curSh]||null});
      saveLS();renderAll();openModal();
    };
    w.appendChild(r);
  }
  document.getElementById('mov').classList.add('on');
}
function closeModal(){document.getElementById('mov').classList.remove('on');curSh=null}
document.getElementById('mk').onclick=()=>{const i=document.getElementById('nl');addList(i.value);i.value=''};
document.getElementById('mmk').onclick=()=>{const i=document.getElementById('mnl');addList(i.value);i.value=''};
document.getElementById('asg').onclick=e=>{assign=!assign;e.target.classList.toggle('on',assign);e.target.textContent=assign?'إنهاء التخصيص':'وضع التخصيص';document.body.classList.toggle('assign',assign);renderAll();st(assign?'انقر بطاقة شيخ لإسناده لقائمة':'')};
document.getElementById('mov').addEventListener('click',e=>{if(e.target.id==='mov')closeModal()});
async function ghReq(m,u,body){
  const t=localStorage.getItem(LT);
  if(!t)throw new Error('no-token');
  const r=await fetch('https://api.github.com'+u,{method:m,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):null});
  if(r.status===404)return null;
  if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,120))}
  return r.json();
}
const SAVE_HOOK='';
async function saveRepo(){
  st('يحفظ…');
  const payload={version:1,updated_at:new Date().toISOString(),lists:state.lists.map(l=>({id:l.id,name:l.name,members:l.members.map(m=>({name:m.name,channel:_ch[m.name]||m.channel||null}))}))};
  const t=localStorage.getItem(LT);
  if(t){
    try{
      const cur=await ghReq('GET','/repos/'+REPO.o+'/'+REPO.r+'/contents/'+REPO.path+'?ref='+REPO.br);
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,1))));
      const body={message:'playlists: save lists ('+payload.lists.length+' قوائم)',content:b64,branch:REPO.br};
      if(cur&&cur.sha)body.sha=cur.sha;
      await ghReq('PUT','/repos/'+REPO.o+'/'+REPO.r+'/contents/'+REPO.path,body);
      st('حُفظت '+payload.lists.length+' قائمة في الريبو ✓','ok');return;
    }catch(e){st('فشل الحفظ المباشر: '+e.message,'err');return}
  }
  if(SAVE_HOOK){
    try{
      const r=await fetch(SAVE_HOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok)throw new Error(r.status);
      st('أُرسل الحفظ — يظهر في الريبو خلال دقائق ✓','ok');return;
    }catch(e){st('فشل إرسال الحفظ: '+e.message,'err');return}
  }
  st('محفوظ محلياً فقط — تفعيل الرفع بانتظار موافقة محمد','err');
}
document.getElementById('sav').onclick=saveRepo;
function normalize(s){return (s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
(async()=>{
  const data=await j('shuyukh.json');
  _photos=await j('photos.json')||{};
  const chd=await j('channels.json')||{};
  const meta=await j('data/sheikhs.json')||{sheikhs:[]};
  for(const s of (meta.sheikhs||[])){for(const n of [s.name_display,s.name,...(s.aliases||[])]){_slugs[n]=s.slug;_slugs[normalize(n)]=s.slug}}
  for(const grp of (chd.channels||[]))for(const c of (grp.items||[]))if(c.verified&&c.url)_ch[c.name]=c.url;
  chMap=_ch;
  const file=await j('lists.json');
  if(!loadLS()&&file&&file.lists)state=file; else if(file&&file.lists&&(!state.updated_at||(file.updated_at&&file.updated_at>state.updated_at)))state=file;
  if(!data||!data.groups){document.getElementById('groups').innerHTML='<p class="sub">تعذر تحميل القائمة.</p>';return}
  _groups=data.groups;
  let total=0;for(const g of _groups)total+=g.names.length;
  document.getElementById('count').textContent=total+' شيخاً ضمن '+_groups.length+' مجموعات';
  renderAll();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
