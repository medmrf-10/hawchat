<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:end;gap:14px;margin:10px 0 14px}
.hero h1{font-family:var(--font-ui);font-size:var(--fs-xl);font-weight:700;color:var(--txt);margin:0}
.hero .pill{font-size:var(--fs-xs);color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin-bottom:6px;white-space:nowrap}
.bar{display:flex;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px;margin-bottom:6px}
.bar input{flex:1;min-width:0;height:44px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm)}
.bar input:focus{outline:none;border-color:var(--acc)}
.abtn{height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card2);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.abtn.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#kpis{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px;align-items:center}
#kpis .k{display:flex;flex-direction:column;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:12px}
.sh{display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:10px 8px;text-decoration:none;color:var(--txt);text-align:center;transition:border-color .18s,transform .18s;min-height:44px}
@media(hover:hover){.sh:hover{border-color:var(--acc);transform:translateY(-2px)}}
.sh .ph{width:100%;aspect-ratio:1;height:auto;margin:0 0 7px;border-radius:50%;background:var(--skel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:1.6rem;font-weight:700;color:var(--acc2)}
.sh .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.sh .nm{font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh .icrow{display:flex;justify-content:center;gap:16px;margin-top:8px}
.sh.soon{opacity:.42;pointer-events:none}
.soonh{width:100%;height:44px;margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--dim);font-family:var(--font-ui);font-size:var(--fs-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.sres{margin-top:10px}
.sres a{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--txt);font-size:var(--fs-sm)}
.sres a small{color:var(--dim);margin-inline-start:auto;white-space:nowrap}
#nres{font-size:var(--fs-xs);color:var(--dim);margin-top:4px;min-height:1.2em}
@media(max-width:640px){.wrap{padding:12px}.hero h1{font-size:var(--fs-lg)}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="الرئيسية" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div class="hero cin"><h1>سلاسل المشايخ</h1><span class="pill" id="count"></span></div>
  <div id="kpis" class="cin" role="status" aria-live="polite"></div>
  <div class="bar cin">
    <input type="search" id="flt" aria-label="ابحث عن شيخ أو سلسلة" enterkeyhint="search" placeholder="ابحث عن شيخ أو سلسلة…">
  </div>
  <div id="nres" aria-live="polite"></div>
  <div id="groups" class="grid"></div>
  <div id="sres" class="sres"></div>
  <button id="soonh" class="soonh" hidden></button>
  <div id="soong" class="grid" hidden></div>
</div></main>
<script src="common.js"></script>
<script>
let _stats={},flt='',showSoon=false;
function draw(){
  const g=document.getElementById('groups'),sg=document.getElementById('soong'),sr=document.getElementById('sres');
  g.innerHTML='';sg.innerHTML='';sr.innerHTML='';
  let withC=[],without=[],sres=[];
  for(const slug in _stats){if(slug==='_meta')continue;const st=_stats[slug];
    ((st.read||0)+(st.watch||0)>0?withC:without).push(st)}
  withC.sort((a,b)=>(a.order||999)-(b.order||999));
  without.sort((a,b)=>(a.order||999)-(b.order||999));
  let i=0;
  for(const st of withC){
    const hay=normalize(st.name+' '+(st.aliases||[]).join(' '));
    if(flt&&!hay.includes(flt)){
      // series title match → jump link to reader
      for(const r of (st.rows||[]))if(normalize(r.title).includes(flt))sres.push({st,r});
      continue}
    const a=document.createElement('a');a.className='sh cin';a.style.animationDelay=(Math.min(i++,30)*25)+'ms';
    a.href='sheikh.html?s='+encodeURIComponent(slugOf(st));
    const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
    a.innerHTML='<div class="ph">'+(st.photo?'<img src="'+esc(st.photo)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></div><div class="nm">'+esc(st.name)+'</div>'
      +'<div class="icrow">'+(st.read?statChip('read',st.read,totalR(st),allR(st)):'')+(st.watch?statChip('listen',st.watch,totalW(st),allW(st)):'')+'</div>';
    g.appendChild(a);
  }
  for(const st of without){
    if(flt&&!normalize(st.name+' '+(st.aliases||[]).join(' ')).includes(flt))continue;
    const a=document.createElement('a');a.className='sh soon';a.setAttribute('aria-disabled','true');a.removeAttribute('href');
    const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
    a.innerHTML='<div class="ph">'+(st.photo?'<img src="'+esc(st.photo)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></div><div class="nm">'+esc(st.name)+'</div>';
    sg.appendChild(a);
  }
  for(const x of sres){
    const a=document.createElement('a');
    a.href=x.r.read;
    a.innerHTML=I.read+'<span>'+esc(x.r.title)+'</span><small>'+esc(x.st.name)+'</small>';
    sr.appendChild(a);
  }
  const sh=document.getElementById('soonh');
  sh.hidden=!without.length;sg.hidden=!showSoon;
  sh.innerHTML=showSoon?('إخفاء '+I.chev):('قريباً ('+without.length+') '+I.chev);
  document.getElementById('count').textContent=withC.length+' شيخاً';
  document.getElementById('nres').textContent=flt?(i+sres.length?'':'لا نتائج.'):'';
}
function slugOf(st){for(const s in _stats)if(_stats[s]===st)return s;return''}
function totalR(st){let m=0;for(const r of st.rows)m=Math.max(m,r.rtt||0);return Math.max(m,st.read)}
function totalW(st){let m=0;for(const r of st.rows)m=Math.max(m,r.wtt||0);return Math.max(m,st.watch)}
function allR(st){return st.rows.every(r=>r.rOk)}
function allW(st){return st.rows.every(r=>!r.wtt||r.wOk)}
document.getElementById('flt').addEventListener('input',e=>{flt=normalize(e.target.value);draw()});
document.getElementById('soonh').addEventListener('click',()=>{showSoon=!showSoon;draw()});
(async()=>{
  document.getElementById('groups').innerHTML='<div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div>';
  const stats=await j('data/sheikh_stats.json');
  if(!stats){document.getElementById('groups').innerHTML='';document.getElementById('kpis').innerHTML='<div class="errbox">تعذر تحميل بيانات السلاسل — <a href=".">أعد المحاولة</a></div>';return}
  _stats=stats;
  let tR=0,tW=0;for(const k in stats){if(k==='_meta')continue;tR+=stats[k].read||0;tW+=stats[k].watch||0}
  document.getElementById('kpis').innerHTML='<span class="k">'+statChip('read',tR,tR,true)+'</span><span class="k">'+statChip('listen',tW,tR,tW>=tR)+'</span>';
  draw();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
