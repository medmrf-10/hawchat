<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الشيوخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:end;gap:14px;margin:10px 0 18px}
.hero h1{font-family:var(--font-ar);font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .pill{font-size:.68rem;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin-bottom:6px;white-space:nowrap}
.hero .abtn{margin-bottom:6px}
.bar{display:flex;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px;margin-bottom:6px}
.bar input{flex:1;min-width:0;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:.85rem}
.bar input:focus{outline:none;border-color:var(--acc)}
.abtn{height:38px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card2);color:var(--txt);font-family:var(--font-ui);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.abtn:hover{border-color:var(--acc)}
@media(max-width:640px){.wrap{padding:12px}.hero h1{font-size:1.45rem}.bar input{height:44px;font-size:.95rem}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.sh{display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:8px 8px 10px;text-decoration:none;color:var(--txt);text-align:center;transition:border-color .18s,transform .18s;position:relative}
.sh:hover{border-color:var(--acc);transform:translateY(-2px)}
.sh .ph{width:100%;aspect-ratio:1;height:auto;margin:0 0 7px;border-radius:50%;background:var(--skel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:1.6rem;font-weight:700;color:var(--acc2)}
.sh .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .nm{font-family:var(--font-ar);font-size:.8rem;font-weight:700;line-height:1.4}
.sh .pb{height:5px;border-radius:99px;background:var(--skel);margin-top:7px;overflow:hidden;display:flex}
.sh .pb i{display:block;height:100%}
.sh .pb .pd{background:var(--gold,#d4a017)}
.sh .pb .pa{background:var(--ok,#3fb27f)}
.sh .pb .pp{background:var(--acc,#4f8cff)}
.sh .pb .ph{background:#7ba4e8}
.sh .pb .px{background:var(--err,#e05a5a)}
.sh .pb .pw{background:#6b7280}
.sh .cnt{font-size:.62rem;color:var(--dim);margin-top:4px;line-height:1.3}
.sh.cin{animation:cin .35s both}
.sub{color:var(--dim);font-size:.8rem}
#kpis{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
#kpis .k{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 14px;text-align:center}
#kpis .k b{display:block;font-size:1.05rem;color:var(--acc2)}
#kpis .k span{font-size:.62rem;color:var(--dim)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub">الشيوخ والسلاسل</span>
</div></header>
<main><div class="wrap">
  <div class="hero cin"><h1>الشيوخ</h1><span class="pill" id="count"></span><a href="helm.html" class="abtn">🎛 دفة القيادة</a></div>
  <div id="kpis" class="cin"></div>
  <div class="bar cin"><input type="text" id="flt" placeholder="ابحث عن شيخ…"></div>
  <div id="groups" class="grid"></div>
</div></main>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function normalize(s){return (s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
let _groups=[],_slugs={},_photos={},flt='',_read={},_watch={};
function photo(name){return _photos[name]||_photos[normalize(name)]}
function slugOf(name){return _slugs[name]||_slugs[normalize(name)]||normalize(name)}
function render(){
  const g=document.getElementById('groups');g.innerHTML='';let i=0;
  for(const gr of _groups)for(const name of gr.names){
    if(flt&&!normalize(name).includes(flt))continue;
    const a=document.createElement('a');
    a.className='sh cin';a.style.animationDelay=(Math.min(i++,30)*25)+'ms';
    a.href='sheikh.html?s='+encodeURIComponent(slugOf(name));
    const p=photo(name),init=name.replace(/^ال/,'').trim()[0]||'؟';
    const slug=slugOf(name),nw=_watch[slug]||0,nr=(_read[name]||0)+(_readPub[slug]||0);
    a.innerHTML='<div class="ph">'+(p?'<img src="'+p+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<span>'+init+'</span></div><div class="nm">'+esc(name)+'</div>'
      +((nr||nw)?'<div class="cnt">'+(nr?'📖 '+nr:'')+(nr&&nw?' · ':'')+(nw?'🎬 '+nw:'')+'</div>':'');
    g.appendChild(a);
  }
  if(!i)g.innerHTML='<p class="sub">لا نتائج.</p>';
}
document.getElementById('flt').addEventListener('input',e=>{flt=normalize(e.target.value);render()});
(async()=>{
  const bust='?v='+Date.now();
  const [data,photos,meta,pub,mut]=await Promise.all([j('shuyukh.json'),j('photos.json'),j('data/sheikhs.json'),j('series/index.json'+bust),j('https://medmrf-10.github.io/des/mutalaa/data/manifest.json'+bust)]);
  _photos=photos||{};
  const name2disp={};
  for(const s of ((meta&&meta.sheikhs)||[])){
    const d=s.name_display||s.name;
    for(const n of [s.name_display,s.name,...(s.aliases||[])]){_slugs[n]=s.slug;_slugs[normalize(n)]=s.slug;name2disp[normalize(n)]=d}
  }
  const _readPub={};
  for(const s of ((pub&&pub.series)||[])){
    if(!s.sheikh_slug)continue;
    if((s.aligned||0)>0)_watch[s.sheikh_slug]=(_watch[s.sheikh_slug]||0)+1;
    if((s.transcribed||0)>0)_readPub[s.sheikh_slug]=(_readPub[s.sheikh_slug]||0)+1;
  }
  for(const m of (Array.isArray(mut)?mut:(mut&&mut.series)||[])){
    if(!(m.files||[]).length)continue;
    const d=name2disp[normalize(m.sheikh||'')];
    if(d)_read[d]=(_read[d]||0)+1;
  }
  const tR=Object.values(_read).reduce((a,b)=>a+b,0),tW=Object.values(_watch).reduce((a,b)=>a+b,0);
  document.getElementById('kpis').innerHTML=
    '<div class="k"><b>'+tR+'</b><span>سلسلة يُقرأ</span></div>'
    +'<div class="k"><b>'+tW+'</b><span>سلسلة يُسمع</span></div>';
  if(!data||!data.groups){document.getElementById('groups').innerHTML='<p class="sub">تعذر تحميل القائمة.</p>';return}
  _groups=data.groups;
  let total=0;for(const g of _groups)total+=g.names.length;
  document.getElementById('count').textContent=total+' شيخاً';
  render();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
