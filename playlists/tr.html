<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نص الدرس — سلاسل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawshat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(JSON.parse(localStorage.getItem('hc_store_v1')||'{}').trtheme==='day')document.documentElement.dataset.theme='day'}catch(e){}</script>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=11">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}
h1{font-family:var(--font-ui);font-size:var(--fs-lg);font-weight:700;color:var(--txt);margin:10px 0 4px}
.lsub{color:var(--dim);font-size:var(--fs-xs);margin-bottom:14px}
.unv{display:inline-block;background:rgba(201,162,75,.08);border:1px solid var(--acc);border-radius:var(--r-md);padding:8px 12px;margin-bottom:14px;color:var(--acc2);font-size:var(--fs-xs)}
.ls{display:flex;flex-direction:column;gap:8px}
.ls a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;font-size:var(--fs-sm);text-decoration:none;color:var(--txt);min-height:52px}
@media(hover:hover){.ls a:hover{border-color:var(--acc2)}}
.ls a.on{border-color:var(--acc);color:var(--acc2)}
.ls .num{min-width:34px;height:34px;border-radius:50%;background:rgba(201,162,75,.1);border:1px solid var(--border);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-sm);flex:none}
/* قراءة بملء الشاشة — بلا صندوق: النص يشغل العرض كاملاً على الهاتف، 66ch على الواسع */
.txt{background:transparent;border:0;border-radius:0;box-shadow:none;
  max-width:66ch;margin:14px auto 0;padding:6px 4px 30px;
  font-family:var(--font-ar);font-size:1.34rem;line-height:2.6;white-space:pre-wrap;color:var(--txt)}
#sump{border-top:1px dashed var(--border)}
@media(max-width:480px){.txt{padding:4px 2px 26px}}
.navb{position:fixed;bottom:0;left:0;right:0;background:var(--bgt);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;z-index:50}
.navb a,.navb button{min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-sm);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.navb a.off,.navb button.off{opacity:.35;pointer-events:none}
.navb .pos{color:var(--acc2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
@media(max-width:420px){.hd-lg{display:none}}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer}
.tools .abtn{white-space:nowrap;min-height:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--acc2);font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tsrch{display:flex;gap:6px;align-items:center;margin-top:10px}
.tsrch input{flex:1;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-sm);padding:0 12px}
.tsrch button{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--txt);cursor:pointer}
.tsrch .tc{color:var(--dim);font-size:var(--fs-xs);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.txt mark{background:rgba(201,162,75,.28);color:inherit;border-radius:3px;padding:0 1px}
.txt mark.cur{background:var(--acc);color:var(--bg)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="عودة" style="text-decoration:none"><svg class="i" style="width:1.15em;height:1.15em"><use href="icons.svg#i-back"/></svg></a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px" class="hd-lg">
  <span class="brand hd-lg">سلاسل</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:var(--fs-xs);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">سلاسل المشايخ</span>
</div></header>
<div class="u-prog"><i id="pbar"></i></div>
<main><div class="wrap">
  <div id="crumb"></div>
  <div id="app"><div class="skel" style="height:60px;margin-top:12px"></div><div class="skel" style="height:220px;margin-top:12px"></div></div>
</div></main>
<div class="navb" id="navb" hidden></div>
<script src="common.js?v=11"></script>
<script>
let ROWS=[],META={},CUR=-1,FS=parseFloat(localStorage.getItem('trfs'))||1.15;
(async()=>{
  const q=new URLSearchParams(location.search);
  const app=document.getElementById('app');
  const stats=await j('data/sheikh_stats.json');
  // resolve the row: ?r=<id> or legacy ?id=<mutId> / ?sh&s=
  let rid=q.get('r'),row=null,slug=null;
  const ssl=q.get('s'),want=parseInt(q.get('l'),10);
  function find(pred){for(const s in stats){if(s==='_meta')continue;const r=(stats[s].rows||[]).find(pred);if(r)return{slug:s,r,st:stats[s]}}return null}
  let hit=null,SROWS=null,VIDF={};
  // ?s=<slug>&l=<n> — series-native deep link (player's «النص كاملاً»): number by
  // series n, resolve transcript file by video id or normalized lessons copy
  if(ssl&&!q.get('sh')){
    hit=find(r=>r.sSlug===ssl);
    const sd=await j('series/'+encodeURIComponent(ssl)+'.json');
    if(sd){
      const lidx=await j('lessons/'+encodeURIComponent(ssl)+'/index.json');
      SROWS=(sd.lessons||[]).map(l=>({n:l.n,title:(lidx&&lidx.ti&&lidx.ti[l.n])||l.title,vid:l.video,trfile:(lidx&&lidx.tf&&lidx.tf[l.n])||null}));
      if(!hit){hit={slug:'',r:{id:'tr:'+ssl,title:sd.title||ssl,sSlug:ssl,rdn:SROWS.length},st:{name:sd.sheikh||'سلسلة'}}}
    }
  }
  if(rid)hit=find(r=>r.id===rid);
  if(!hit&&rid){ // legacy row id → redirect map (unmixed series keep working)
    const rd=await j('data/redirects.json');
    if(rd&&rd[rid]){rid=rd[rid];history.replaceState(null,'','?r='+encodeURIComponent(rid)+(want?'&l='+want:''));hit=find(r=>r.id===rid)}
  }
  if(!hit&&q.get('id'))hit=find(r=>String(r.mutId)===String(q.get('id')));
  if(!hit&&q.get('sh'))hit=find(r=>r.trSh===q.get('sh')&&r.trSr===q.get('s'));
  if(!hit){app.innerHTML='<div class="errbox">تعذر العثور على هذه السلسلة — <a href=".">عودة</a></div>';return}
  slug=hit.slug;row=hit.r;META=hit.st;
  const synthetic=!slug;
  document.getElementById('back').href=SROWS?('row.html?s='+encodeURIComponent(ssl)):('sheikh.html?s='+encodeURIComponent(slug));
  document.getElementById('hdr-sub').textContent=META.name;
  // crumb links use the row id (?r=) — ?s= yields «سلسلة غير موجودة» for
  // rows without an sSlug, and «undefined» when the page was opened via ?r=
  const rowHref='row.html?r='+encodeURIComponent(row.id);
  document.getElementById('crumb').innerHTML=synthetic
    ?hdr(null,[{h:'.',t:'سلاسل المشايخ'},{h:rowHref,t:row.title}])
    :hdr(null,[{h:'.',t:'سلاسل المشايخ'},{h:'sheikh.html?s='+encodeURIComponent(slug),t:META.name},{h:rowHref,t:row.title}]);
  const rows=SROWS||(await j('data/read/'+encodeURIComponent(row.id)+'.json'));
  if(!rows||!rows.length){app.innerHTML='<div class="errbox">تعذر تحميل نصوص هذه السلسلة — <a href="sheikh.html?s='+encodeURIComponent(slug)+'">عودة</a></div>';return}
  // text-by-n fallback for ?s= rows lacking a lessons copy — the generator
  // already renumbers data/read to series numbering (renumber_to_series)
  let byN={};
  if(SROWS){const rr=await j('data/read/'+encodeURIComponent(row.id)+'.json');(rr||[]).forEach(x=>byN[x.n]=x)}
  ROWS=rows;
  const SELF=SROWS?('?s='+encodeURIComponent(ssl)):('?r='+encodeURIComponent(row.id));
  const ALLR=(!synthetic&&row.id)?('?r='+encodeURIComponent(row.id)):SELF;
  document.title=row.title+' — '+META.name;
  // aligned lessons for "استمع لهذا الدرس" — the same listenable threshold
  // (cov>=0.3) the cards count with, not just any alignment file
  let aligned=new Set(),summed=new Set();
  if(row.listen||row.sun||row.sSlug){const li=await j('lessons/'+encodeURIComponent(row.sSlug||ssl||row.id)+'/index.json');
    aligned=new Set((li&&(li.alignOk||li.align))||[]);summed=new Set((li&&li.sum)||[]);window._sumIdx=li}
  // REQ must exist before the first showLesson(): a `let` declared below the call
  // sits in its TDZ and threw on every ?l= deep link (blank page, no text)
  let REQ=0;
  const wantL=want;
  const idx=wantL?ROWS.findIndex(x=>x.n===wantL):-1;
  if(idx>=0){showLesson(idx,false)}else{showList()}
  addEventListener('popstate',()=>{
    const l2=new URLSearchParams(location.search).get('l');
    const i2=l2?ROWS.findIndex(y=>y.n===parseInt(l2,10)):-1;
    if(i2>=0)showLesson(i2,false);else showList();
  });
  function showList(){
    document.getElementById('navb').hidden=true;
    store.markSeen(row.id);
    const res=store.resume(row.id);
    let h='<h1><bdi>'+esc(row.title)+'</bdi></h1><div class="lsub">'+esc(META.name)+' · '+pluralLesson(row.rdn)+(row.rtt&&row.rtt>row.rdn?' من '+row.rtt:'')+'</div>';
    if(row.unv)h+='<div class="unv">ترجمة آلية مأخوذة من يوتيوب — غير مدققة بعد</div>';
    if(res&&res.n)h+='<a class="lsres" href="'+SELF+'&l='+res.n+'">تابع من حيث توقفت — الدرس '+res.n+'</a>';
    h+='<div class="ls">';
    ROWS.forEach((x,i)=>{const hasT=!SROWS||x.trfile||byN[x.n];
      const seen=store.seen(row.id+':'+x.n),cur=res&&res.n===x.n;
      if(hasT)h+='<a'+(cur?' class="on"':'')+' href="'+SELF+'&l='+x.n+'"><span class="num">'+x.n+'</span><span style="flex:1"><bdi>'+esc(x.title)+'</bdi></span>'+(summed.has(x.n)?'<span title="فيه ملخص" style="color:var(--acc2);flex:none;font-size:.9rem">☰</span>':'')+(seen?'<span style="color:var(--ok,#5fbf7f);flex:none">'+I.check+'</span>':'')+'</a>';
      else h+='<a class="off" aria-disabled="true" style="opacity:.45;pointer-events:none"><span class="num" style="opacity:.6">'+x.n+'</span><span><bdi>'+esc(x.title)+'</bdi><small style="display:block;color:var(--dim)">لا نص بعد</small></span></a>'});
    h+='</div>';
    app.innerHTML=h;
    if(res&&res.n)document.querySelector('.lsres').style.cssText='display:flex;align-items:center;gap:10px;background:rgba(201,162,75,.08);border:1px solid var(--acc);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;color:var(--acc2);text-decoration:none;font-size:var(--fs-sm);min-height:44px';
  }
  // strip a yaml-ish metadata head (الشيخ:/السلسلة:/الفيديو: links …) — it ends
  // at the first blank line; a non-header first line means there is no head
  function cleanTxt(t){
    if(!t)return t;
    const L=t.split('\n');let i=0;
    while(i<L.length){
      const s=L[i].trim();
      if(!s){i++;break}
      if(/[:：]/.test(s)&&!/[،.؟!]/.test(s)&&s.length<160){i++;continue}
      if(/^https?:\/\/\S+$/.test(s)){i++;continue}
      break;
    }
    t=L.slice(i).join('\n');
    return t
      .replace(/^(السلسلة|الشيخ|الفيديو|الحلقة|الدرس|الرابط|المصدر)\s*[:：].{0,200}$/gm,'')
      .replace(/^<?https?:\/\/\S+>?\s*$/gm,'')
      .replace(/\n{3,}/g,'\n\n').trim();
  }
  // one resolver for display + prefetch. series-native rows: lessons copy →
  // transcripts by vid → padded probe (3 then 2 digits, both layouts exist)
  async function loadText(x){
    if(SROWS){
      const base='lessons/'+encodeURIComponent(ssl)+'/';
      if(x.trfile){const r=await jtxt(base+encodeURIComponent(x.trfile));if(r)return r}
      const rb=byN[x.n];
      if(rb&&rb.file){const r=await jtxt(rb.base+encodeURIComponent(rb.file));if(r)return r}
      const p3=String(x.n).padStart(3,'0'),p2=String(x.n).padStart(2,'0');
      return (await jtxt(base+p3+'.txt'))||(p2!==p3?await jtxt(base+p2+'.txt'):null)||'';
    }
    return x.file?await jtxt(x.base+encodeURIComponent(x.file)):'';
  }
  async function showLesson(i,push){
    CUR=i;const x=ROWS[i];const my=++REQ;
    window._sumN=x.n;
    store.setResume(row.id,x.n);store.markSeen(row.id+':'+x.n);
    window.scrollTo(0,0);
    const u=SELF+'&l='+x.n;
    if(push===false)history.replaceState(null,'',u);else history.pushState(null,'',u);
    document.title=x.title+' — '+row.title;
    let h='<h1><bdi>'+esc(x.title)+'</bdi></h1><div class="lsub">الدرس '+x.n+' من '+ROWS.length+' · '+esc(META.name)+'</div>';
    if(row.unv)h+='<div class="unv">ترجمة آلية مأخوذة من يوتيوب — غير مدققة بعد</div>';
    h+='<div class="txt skel" id="tx" style="min-height:200px"></div>'
      +'<div class="txt" id="sump" hidden style="margin-top:10px"></div>';
    app.innerHTML=h;
    const nav=document.getElementById('navb');nav.hidden=false;
    const dayNow=document.documentElement.dataset.theme==='day';
    nav.innerHTML='<button id="cpy" aria-label="نسخ نص الدرس" title="نسخ نص الدرس كاملاً">⧉ نسخ</button>'
      +(summed.has(x.n)?'<button id="sum" title="عرض ملخص الدرس" style="min-width:44px;color:var(--acc2)">☰</button>':'')
      +(aligned.has(x.n)?'<a href="lesson.html?s='+encodeURIComponent(row.sSlug||ssl)+'&l='+x.n+'" title="مشاهدة حية مع المحاذاة" style="min-width:44px;color:var(--violet)">▶</a>':'')
      +'<span class="pos">'+(i+1)+' / '+ROWS.length+'</span>'
      +'<button id="zout" aria-label="تصغير الخط" title="تصغير الخط" style="min-width:44px">أ−</button>'
      +'<button id="zin" aria-label="تكبير الخط" title="تكبير الخط" style="min-width:44px">أ+</button>'
      +'<button id="dnt" aria-label="تبديل نهاري/ليلي" title="نهاري/ليلي" style="min-height:44px;width:44px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center"><svg style="width:1.2em;height:1.2em"><use href="icons.svg?v=11#'+(dayNow?'i-sun':'i-moon')+'"/></svg></button>';
    const sb=document.getElementById('sum');if(sb)sb.onclick=()=>showSum();
    const zAp=()=>{localStorage.setItem('trfs',FS);document.querySelectorAll('.txt').forEach(e=>e.style.fontSize=FS+'rem')};
    document.getElementById('zin').onclick=()=>{FS=Math.min(2.6,+(FS+0.15).toFixed(2));zAp()};
    document.getElementById('zout').onclick=()=>{FS=Math.max(0.8,+(FS-0.15).toFixed(2));zAp()};
    document.getElementById('dnt').onclick=()=>{
      const day=document.documentElement.dataset.theme!=='day';
      if(day)document.documentElement.dataset.theme='day';else delete document.documentElement.dataset.theme;
      store.set('trtheme',day?'day':'night');
      document.getElementById('dnt').innerHTML='<svg style="width:1.2em;height:1.2em"><use href="icons.svg?v=11#'+(day?'i-sun':'i-moon')+'"/></svg>';
      const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',day?'#f6f0df':'#0b0f1a');
    };
    const tx=cleanTxt(await loadText(x));
    if(my!==REQ)return;  // a newer lesson was opened while loading
    const el=document.getElementById('tx');
    if(!el)return;
    el.classList.remove('skel');el.style.fontSize=FS+'rem';
    if(tx){el.textContent=tx;
      // E6: restore reading position inside this lesson
      const pk='trp:'+row.id+':'+x.n,sp=store.get(pk);
      if(sp&&sp.f>0.02)setTimeout(()=>{const h=document.documentElement;window.scrollTo(0,Math.max(0,(h.scrollHeight-h.clientHeight)*sp.f))},60);
    }else{
      el.innerHTML=(typeof errState==='function')?errState('تعذر تحميل النص','location.reload()'):'تعذر تحميل النص — <a href="">إعادة المحاولة</a>';
    }
    // E2: copy the whole text with attribution
    const cb=document.getElementById('cpy');
    if(cb)cb.onclick=async()=>{if(!tx)return;
      try{await navigator.clipboard.writeText(tx+'\n\n— '+row.title+'، الدرس '+x.n+'، '+META.name+'\n'+location.origin+location.pathname+SELF+'&l='+x.n);
        if(typeof toast==='function')toast('نُسخ النص كاملاً');else{cb.textContent='✓ نُسخ';setTimeout(()=>cb.innerHTML='⧉ نسخ',1600)}
      }catch(e){}};
    // prefetch next
    if(i<ROWS.length-1)loadText(ROWS[i+1]);
    updProg();
  }
  let _spT=0;
  function updProg(){
    const p=document.getElementById('pbar');if(!p)return;
    const h=document.documentElement;
    const f=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);
    p.style.width=Math.min(100,Math.max(0,f*100))+'%';
    // E6: save reading position (throttled)
    const now=Date.now();
    if(CUR>=0&&now-_spT>800){_spT=now;const x=ROWS[CUR];if(x)store.set('trp:'+row.id+':'+x.n,{f:Math.round(f*1000)/1000})}
  }
  addEventListener('scroll',updProg,{passive:true});
  let _sumIdx=null;
  window.showSum=async()=>{
    const n=window._sumN;if(!n)return false;
    const el=document.getElementById('sump');
    if(!el.hidden){el.hidden=true;return false}
    el.hidden=false;el.innerHTML='<div class="skel" style="height:80px"></div>';
    if(_sumIdx===null)_sumIdx=window._sumIdx||await j('lessons/'+encodeURIComponent(row.sSlug||ssl||row.id)+'/index.json');
    const fn=_sumIdx&&_sumIdx.sumf&&_sumIdx.sumf[n];
    const sm=fn?await j('lessons/'+encodeURIComponent(row.sSlug||ssl||row.id)+'/'+encodeURIComponent(fn)):null;
    if(!sm){el.innerHTML='<i>تعذر تحميل الملخص.</i>';return false}
    el.innerHTML='<b style="color:var(--acc2)">☰ الملخص</b>'
      +(sm.summary||sm.p?'<p style="line-height:2">'+esc(sm.summary||sm.p)+'</p>':'')
      +(sm.points&&sm.points.length?'<ul>'+sm.points.map(b=>'<li style="line-height:1.9">'+esc(b)+'</li>').join('')+'</ul>':'')
      +(sm.note?'<div style="color:var(--txt3);font-size:.8rem;margin-top:6px">'+esc(sm.note)+'</div>':'');
    return false;
  };
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
