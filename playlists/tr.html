<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css?v=7">
<link rel="stylesheet" href="common.css?v=7">
<style>
body{min-height:100vh}
main{max-width:820px;margin:0 auto;padding:24px 18px 60px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd a{color:var(--acc2);text-decoration:none;font-size:.9rem}
.hd h1{font-size:1.15rem;margin:0}
.sub{color:var(--dim);font-size:.8rem;margin-bottom:14px}
.ls{display:flex;flex-direction:column;gap:8px}
.ls a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;font-size:var(--fs-sm);text-decoration:none;color:var(--txt);min-height:52px}
@media(hover:hover){.ls a:hover{border-color:var(--acc2)}}
.ls a.on{border-color:var(--acc);color:var(--acc2)}
.ls .num{min-width:34px;height:34px;border-radius:50%;background:rgba(201,162,75,.1);border:1px solid var(--border);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-sm);flex:none}
.txt{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;margin-top:14px;font-family:var(--font-ar);font-size:1.15rem;line-height:2.2;white-space:pre-wrap}
.navb{position:fixed;bottom:0;left:0;right:0;background:var(--bgt);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;z-index:50}
.navb a,.navb button{min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-sm);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.navb a.off,.navb button.off{opacity:.35;pointer-events:none}
.navb .pos{color:var(--acc2);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div id="crumb"></div>
  <div id="app"><div class="skel" style="height:60px;margin-top:12px"></div><div class="skel" style="height:220px;margin-top:12px"></div></div>
</div></main>
<div class="navb" id="navb" hidden></div>
<script src="common.js?v=7"></script>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():null}catch(e){return null}}
(async()=>{
 const q=new URLSearchParams(location.search),sh=q.get('sh')||'',sr=q.get('s')||'',mid=q.get('id')||'';
 const T=document.getElementById('ttl'),M=document.getElementById('meta'),L=document.getElementById('ls'),X=document.getElementById('txt');
 let name='',title='',files=[],n=0,total=0,base='';
 if(mid){ // mutalaa source — same reader, unified
  const man=await j('https://medmrf-10.github.io/des/mutalaa/data/manifest.json?v='+Date.now());
  const ser=((man&&Array.isArray(man)?man:(man&&man.series)||[])).find(x=>String(x.id)===String(mid));
  if(ser){name=ser.sheikh||'';title=ser.name||ser.title||'';files=ser.files||[];n=ser.done||files.length;total=ser.total||n;
   base='https://medmrf-10.github.io/des/mutalaa/data/txt/'+encodeURIComponent(mid)+'/';}
 }else{
  const idx=await j('../transcripts/index.json?v='+Date.now());
  const sheikh=idx&&idx.sheikhs?idx.sheikhs[sh]:null;
  const ser=sheikh?sheikh.series.find(x=>x.slug===sr):null;
  if(ser){name=sheikh.name||'';title=ser.title;files=ser.files||[];n=ser.n||files.length;total=ser.total||n;
   base='../transcripts/'+encodeURIComponent(sh)+'/'+encodeURIComponent(sr)+'/';}
 }
 if(!files.length){T.textContent='غير موجود';M.textContent='';L.innerHTML='<div class="sub">تعذر العثور على هذه السلسلة.</div>';return}
 T.textContent=name+' — '+title;
 M.textContent=n+' مفرّغ'+(total?' من '+total:'');
 files.forEach((f,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<span>الحلقة '+(i+1)+'</span><i>'+esc(f)+'</i>';
  b.onclick=async()=>{L.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
   X.style.display='block';X.textContent='يُحمَّل…';
   const tx=await t(base+encodeURIComponent(f));
   X.textContent=tx||'تعذر تحميل النص';X.scrollIntoView({behavior:'smooth'})};
  L.appendChild(b);
 });
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
