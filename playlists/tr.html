<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>التفريغ — hawchat</title>
<link rel="icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{min-height:100vh}
main{max-width:820px;margin:0 auto;padding:24px 18px 60px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd a{color:var(--acc2);text-decoration:none;font-size:.9rem}
.hd h1{font-size:1.15rem;margin:0}
.sub{color:var(--dim);font-size:.8rem;margin-bottom:14px}
.ls{display:flex;flex-direction:column;gap:8px}
.ls button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;font-family:var(--font-ui);font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.ls button.on{border-color:var(--acc);color:var(--acc2)}
.ls button:hover{border-color:var(--acc2)}
.ls button i{font-style:normal;color:var(--dim);font-size:.75rem}
.txt{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-top:16px;font-family:var(--font-ar);font-size:1.05rem;line-height:2.1;white-space:pre-wrap;display:none}
</style></head><body>
<main>
 <div class="hd"><a href="javascript:history.back()">→ رجوع</a><h1 id="ttl">التفريغ</h1></div>
 <div class="sub" id="meta"></div>
 <div class="ls" id="ls"></div>
 <div class="txt" id="txt"></div>
</main>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
async function t(u){try{const r=await fetch(u);return r.ok?await r.text():null}catch(e){return null}}
(async()=>{
 const q=new URLSearchParams(location.search),sh=q.get('sh')||'',sr=q.get('s')||'';
 const idx=await j('../transcripts/index.json?v='+Date.now());
 const sheikh=idx&&idx.sheikhs?idx.sheikhs[sh]:null;
 const ser=sheikh?sheikh.series.find(x=>x.slug===sr):null;
 const T=document.getElementById('ttl'),M=document.getElementById('meta'),L=document.getElementById('ls'),X=document.getElementById('txt');
 if(!ser){T.textContent='غير موجود';M.textContent='';L.innerHTML='<div class="sub">تعذر العثور على هذه السلسلة.</div>';return}
 T.textContent=(sheikh.name||'')+' — '+ser.title;
 M.textContent=ser.n+' مفرّغ'+(ser.total?' من '+ser.total:'');
 ser.files.forEach((f,i)=>{
  const b=document.createElement('button');
  b.innerHTML='<span>الحلقة '+(i+1)+'</span><i>'+esc(f)+'</i>';
  b.onclick=async()=>{L.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
   X.style.display='block';X.textContent='يُحمَّل…';
   const tx=await t('../transcripts/'+encodeURIComponent(sh)+'/'+encodeURIComponent(sr)+'/'+encodeURIComponent(f));
   X.textContent=tx||'تعذر تحميل النص';X.scrollIntoView({behavior:'smooth'})};
  L.appendChild(b);
 });
})();
</script></body></html>
