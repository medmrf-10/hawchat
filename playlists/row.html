<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلسلة — سلاسل المشايخ</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=12">
<style>
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.u-hero .meta a{color:var(--gold-3);text-decoration:none;font-size:var(--fs-xs);display:inline-flex;align-items:center;min-height:44px}
.lrow{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line-1);border-radius:var(--r-md);padding:9px 12px;margin-top:6px;
  text-decoration:none;color:var(--txt);min-height:48px;transition:border-color var(--t-fast) var(--ease)}
@media(hover:hover){.lrow:hover{border-color:var(--gold-2)}}
.lrow .num{width:30px;height:30px;min-width:30px;border-radius:50%;background:rgba(201,162,75,.1);
  border:1px solid var(--line-1);color:var(--gold-3);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:var(--fs-xs)}
.lrow .t{flex:1;font-size:var(--fs-sm);line-height:1.55}
.lrow .badge{color:#4fb3c9;font-size:.8rem;flex:none}
.gapnote{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:var(--fs-xs);padding:2px 14px}
.gapnote i{flex:1;height:1px;background:var(--line-1)}
.stitle{font-size:1.15rem;font-weight:800;margin:4px 0 2px}
.smeta{color:var(--ink-3);font-size:var(--fs-xs);margin-bottom:4px}
.lrow .t small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.lrow .bd{display:flex;gap:10px;color:var(--ink-3)}
.lrow .bd .i{width:1.15em;height:1.15em}
.lrow .bd .ic-read{color:var(--gold-3)} .lrow .bd .ic-listen{color:var(--violet)} .lrow .bd .ic-play{color:var(--muted);opacity:.7}
.lrow.seen{opacity:.62}
.lrow.cur{border-color:var(--gold-2)}
.u-hero h1{padding-inline-end:56px}
.resline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.resline a{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--bg-2);color:var(--gold-3);font-size:var(--fs-sm);text-decoration:none}
.sflt{width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm);margin-top:12px}
.sflt:focus{outline:none;border-color:var(--gold-2)}
.unv{display:inline-block;background:rgba(201,162,75,.08);border:1px solid var(--line-2);border-radius:var(--r-md);padding:8px 12px;margin-top:10px;color:var(--gold-3);font-size:var(--fs-xs)}
.ytpl{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;
  border:1px solid rgba(224,90,79,.45);border-radius:var(--r-md);text-decoration:none;
  background:linear-gradient(160deg,rgba(224,90,79,.08),var(--bg-2));color:var(--txt)}
.ytpl .i{width:26px;height:26px;color:#e05a4f;flex:none}
.ytpl span{flex:1;font-size:var(--fs-sm)}.ytpl small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.mchips{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mc{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--bg-2);color:var(--ink-2);font-family:var(--font-ui);font-size:var(--fs-xs);cursor:pointer}
.mc .i{width:16px;height:16px}.mc b{color:var(--ink-3);font-weight:600}
.mc.on{border-color:var(--gold-2);color:var(--gold-3);background:rgba(201,162,75,.10)}.mc.on b{color:var(--gold-3)}
.lrow .bd{gap:6px}.lrow .bd .i{width:15px;height:15px}
.lrow .bd .ic-listen{color:var(--violet)}.lrow .bd .ic-read{color:var(--gold-3)}.lrow .bd .ic-yt{color:#e05a4f;opacity:.75}
.lrow .bd .ic-sm{color:#4fb3c9}.lrow .bd .ic-qu{color:#8fb3e0}
.resline .rfav{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-2);font:inherit;font-size:var(--fs-xs);cursor:pointer}
.resline .rfav[aria-pressed=true]{color:var(--gold-3);border-color:var(--gold-2)}.resline .i{width:16px;height:16px}
.resline a{background:var(--gold-2)!important;color:#0b0f1a!important;font-weight:700;border:0!important}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span class="sub" id="hdr-sub" style="color:var(--ink-3);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:130px;margin-top:10px;border-radius:18px"></div><div class="skel" style="height:300px;margin-top:12px;border-radius:18px"></div></div></main>
<script src="common.js?v=11"></script>
<script src="core.js?v=2"></script>
<script>
const ic=id=>'<svg class="i"><use href="icons.svg?v=11#'+id+'"/></svg>';
const MIC={listen:'i-watch',read:'i-read',yt:'i-yt',aud:'i-audio',sm:'i-list',qu:'i-qu'};
(async()=>{
  const q=new URLSearchParams(location.search);
  const app=document.getElementById('app');
  const hit=await HC.findRow(q);
  if(!hit){app.innerHTML='<div class="errbox">'+(navigator.onLine===false?'لا اتصال — حدّث الصفحة حين يعود':'السلسلة غير موجودة')+' — <a href=".">عودة</a></div>';return}
  const row=hit.r,st=hit.st,slug=hit.slug;row._sname=st.name;
  if(q.get('r')!==row.id){const u=new URLSearchParams(q);u.delete('s');u.delete('k');u.set('r',row.id);history.replaceState(null,'','?'+u)}
  document.getElementById('back').href='sheikh.html?s='+encodeURIComponent(slug);
  document.getElementById('hdr-sub').textContent=st.name;
  const ctx=await HC.lessons(row);
  let mode=q.get('m');if(mode==='ltx')mode='yt';
  if(!HC.MODES.some(m=>m[0]===mode))mode='';
  const ln0=parseInt(q.get('l'),10)||0;
  if(ln0&&ctx.by.has(ln0)){const x=ctx.by.get(ln0),m=HC.best(x,mode);if(m){location.replace(HC.href(ctx,x,m));return}}
  const cnt={};for(const [k] of HC.MODES)cnt[k]=ctx.list.filter(x=>x.has[k]).length;
  const MN=Object.fromEntries(HC.MODES.map(m=>[m[0],m[2]]));
  document.title=(mode?MN[mode]+' — ':'')+row.title+' — '+st.name;
  const hist=(store.get('hist',[])||[]).find(h=>h.r===row.id);
  const rs=hist||store.resume(row.id);
  const resX=rs&&ctx.by.get(rs.n);
  app.innerHTML='<div class="stitle cin"><bdi>'+esc(row.title)+'</bdi></div><div class="smeta"><a href="sheikh.html?s='+encodeURIComponent(slug)+'" style="color:inherit">'+esc(st.name)+'</a> · '+pluralLesson(ctx.list.length)+'</div>'
    +'<div class="resline"><button class="rfav" id="rfav" aria-pressed="'+store.fav(row.id)+'">'+ic('i-star')+'<span>'+(store.fav(row.id)?'في المفضلة':'أضف للمفضلة')+'</span></button>'
    +'<button class="rfav" id="roff">'+ic('i-offline')+'<span>حفظ للقراءة دون اتصال</span></button>'
    +(resX?'<a href="'+HC.href(ctx,resX,HC.best(resX,rs.m||mode))+'">'+ic('i-play')+'تابع: الدرس '+resX.n+'</a>':'')+'</div>'
    +'<div class="mchips" role="toolbar" aria-label="تصفية حسب المتوفر">'
      +'<button class="mc'+(mode?'':' on')+'" data-m="">الكل <b>'+ctx.list.length+'</b></button>'
      +HC.MODES.filter(([k])=>cnt[k]).map(([k,i,a])=>'<button class="mc'+(mode===k?' on':'')+'" data-m="'+k+'" title="'+a+'">'+ic(i)+'<span>'+a+'</span> <b>'+cnt[k]+'</b></button>').join('')+'</div>'
    +'<input class="sflt" id="sflt" type="search" aria-label="ابحث في دروس السلسلة" placeholder="ابحث في دروس السلسلة…">'
    +(row.unv?'<div class="unv">ترجمة آلية مأخوذة من يوتيوب — غير مدققة بعد</div>':'')
    +'<div id="ytpl"></div><div id="lst" aria-live="polite"></div>';
  const draw=()=>{
    const fq=normalize(document.getElementById('sflt').value);
    document.getElementById('ytpl').innerHTML=(mode==='yt'&&row.yt)?'<a class="ytpl cin" href="yt.html?r='+encodeURIComponent(row.id)+'">'+ic('i-yt')+'<span><b>تشغيل قائمة يوتيوب كاملة</b><small>'+(row.ytn||0)+' فيديو — مشغّل داخلي بلا تفريغ</small></span></a>':'';
    const lst=document.getElementById('lst');let h='',n=0,prev=0;
    for(const x of ctx.list){
      if(mode&&!x.has[mode])continue;
      if(fq&&!normalize(x.title).includes(fq)&&!String(x.n).includes(fq))continue;n++;
      const m=HC.best(x,mode);if(!m)continue;
      if(!fq&&prev&&x.n-prev>1)h+='<div class="gapnote"><i></i>'+(x.n-prev===2?'الدرس '+(prev+1):'الدروس '+(prev+1)+'–'+(x.n-1))+' غير متاحة<i></i></div>';
      prev=x.n;
      const seen=store.seen(row.id+':'+x.n),isCur=rs&&rs.n===x.n;
      h+='<a class="lrow cin'+(seen?' seen':'')+(isCur?' cur':'')+'" href="'+HC.href(ctx,x,m)+'"><span class="num">'+x.n+'</span>'
        +'<span class="t"><bdi>'+esc(x.title)+'</bdi>'+((x.dur||x.parts)?'<small>'+[HC.partOf(x),x.dur?fmtDur(x.dur):''].filter(Boolean).join(' · ')+'</small>':'')+'</span>'
        +'<span class="bd" aria-label="المتوفر">'+HC.MODES.filter(([k])=>x.has[k]&&k!=='aud').map(([k,i,a])=>'<span class="ic-'+k+'" title="'+a+'">'+ic(i)+'</span>').join('')+'</span></a>';
    }
    lst.innerHTML=n?h:'<p class="empty">'+(fq?'لا نتائج.':'لا دروس بعد.')+'</p>';
  };
  draw();
  const fb=document.getElementById('rfav');fb.onclick=()=>{const on=store.favToggle(row.id);fb.setAttribute('aria-pressed',on);fb.querySelector('span').textContent=on?'في المفضلة':'أضف للمفضلة';toast(on?'أضيفت للمفضلة':'أزيلت من المفضلة')};
  const ob=document.getElementById('roff');if(!row.rdn)ob.remove();else{
    isPinned(row.id).then(p=>{if(p)ob.querySelector('span').textContent='محفوظة دون اتصال ✓'});
    ob.onclick=async()=>{ob.disabled=true;ob.querySelector('span').textContent='جارٍ الحفظ…';const r=await offlineRow(row.id,row.ld||'');
      ob.disabled=false;ob.querySelector('span').textContent=r.ok?'محفوظة دون اتصال ✓':'تعذر الحفظ';if(r.ok)toast('حُفظت '+r.total+' دروس للقراءة دون اتصال')}}
  document.getElementById('sflt').addEventListener('input',draw);
  document.querySelectorAll('.mchips .mc').forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;const u=new URLSearchParams(location.search);mode?u.set('m',mode):u.delete('m');
    history.replaceState(null,'','?'+u);document.title=(mode?MN[mode]+' — ':'')+row.title+' — '+st.name;
    document.querySelectorAll('.mchips .mc').forEach(c=>c.classList.toggle('on',c===b));draw()});
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
