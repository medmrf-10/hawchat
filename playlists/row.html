<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلسلة — سلاسل المشايخ</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css?v=8">
<link rel="stylesheet" href="common.css?v=8">
<link rel="stylesheet" href="ui.css?v=8">
<style>
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.u-hero .meta a{color:var(--gold-3);text-decoration:none;font-size:var(--fs-xs);display:inline-flex;align-items:center;min-height:44px}
.ls{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line-1);border-radius:var(--r-md);padding:12px 14px;margin-top:8px;
  text-decoration:none;color:var(--txt);min-height:56px;transition:border-color var(--t-fast) var(--ease)}
@media(hover:hover){.ls:hover{border-color:var(--gold-2)}}
.ls .num{width:34px;height:34px;min-width:34px;border-radius:50%;background:rgba(201,162,75,.1);
  border:1px solid var(--line-1);color:var(--gold-3);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:var(--fs-sm)}
.ls .t{flex:1;font-size:var(--fs-sm);line-height:1.6}
.ls .t small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.ls .bd{display:flex;gap:10px;color:var(--ink-3)}
.ls .bd .i{width:1.15em;height:1.15em}
.ls .bd .ic-read{color:var(--gold-3)} .ls .bd .ic-listen{color:var(--violet)}
.sflt{width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm);margin-top:12px}
.sflt:focus{outline:none;border-color:var(--gold-2)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span class="sub" id="hdr-sub" style="color:var(--ink-3);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:130px;margin-top:10px;border-radius:18px"></div><div class="skel" style="height:300px;margin-top:12px;border-radius:18px"></div></div></main>
<script src="common.js?v=8"></script>
<script>
const ic=id=>'<svg class="i"><use href="icons.svg#'+id+'"/></svg>';
(async()=>{
  const q=new URLSearchParams(location.search);
  const app=document.getElementById('app');
  // ?r=<row id> — resolves the row then shows series OR reader lessons
  const stats=await j('data/sheikh_stats.json');
  let rid=q.get('r'),slug=q.get('s'),ln0=parseInt(q.get('l'),10)||0;
  let hit=null;
  if(stats&&rid){
    // row id not found → follow a redirect (rows get re-keyed when merged)
    let found=false;
    for(const s in stats){if(s==='_meta')continue;
      if((stats[s].rows||[]).some(r=>r.id===rid)){found=true;break}}
    if(!found){
      const red=await j('data/redirects.json');
      if(red&&red[rid])rid=red[rid];
    }
  }
  if(stats){
    for(const s in stats){if(s==='_meta')continue;
      const r=(stats[s].rows||[]).find(r=>(rid&&r.id===rid)||(!rid&&slug&&r.sSlug===slug));
      if(r){hit={slug:s,r,st:stats[s]};break}}
  }
  if(!hit){app.innerHTML='<div class="errbox">السلسلة غير موجودة — <a href=".">عودة</a></div>';return}
  const row=hit.r,st=hit.st;slug=hit.slug;
  document.getElementById('back').href='sheikh.html?s='+encodeURIComponent(slug);
  document.getElementById('hdr-sub').textContent=st.name;
  document.title=row.title+' — '+st.name;
  // lessons: series json (aligned) + read-file list
  const [sd,alidx,rows]=await Promise.all([
    row.sSlug?j('series/'+encodeURIComponent(row.sSlug)+'.json'):null,
    row.sSlug?j('lessons/'+encodeURIComponent(row.sSlug)+'/index.json'):null,
    j('data/read/'+encodeURIComponent(row.id)+'.json')]);
  const aln=new Set((alidx&&alidx.align)||[]);
  const txn=new Set((alidx&&alidx.txt)||[]);
  const rtxt=new Map((rows||[]).map(x=>[x.n,x]));
  // unified lesson list: every n that has text OR align
  const ns=new Set([...aln,...txn,...rtxt.keys()]);
  const lessons=(sd&&sd.lessons)||[];
  for(const l of lessons)if((l.video||aln.has(l.n)||txn.has(l.n)))ns.add(l.n);
  const sorted=[...ns].sort((a,b)=>a-b);
  const L=n=>lessons.find(x=>x.n===n)||{};
  const favs=store.favList();
  store.markSeen(row.id);
  let h='<nav class="crumb cin"><a href=".">سلاسل المشايخ</a> ‹ <a href="sheikh.html?s='+encodeURIComponent(slug)+'">'+esc(st.name)+'</a> ‹ <bdi>'+esc(row.title)+'</bdi></nav>';
  h+='<div class="u-hero cin">'
    +'<button class="u-fav'+(favs.includes(row.id)?' on':'')+'" id="favb" aria-label="مفضلة" style="position:absolute;top:12px;inset-inline-end:12px">'+ic('i-star')+'</button>'
    +(row.rdn?'<button class="u-fav" id="dlb" aria-label="حفظ بلا اتصال" title="حفظ النصوص بلا اتصال" style="position:absolute;top:58px;inset-inline-end:12px">'+ic('i-dl')+'</button>':'')
    +'<h1><bdi>'+esc(row.title)+'</bdi></h1><div class="meta">'
    +(row.rdn?'<span class="u-num rd">'+ic('i-read')+'<b>'+row.rdn+'</b>'+(row.rdn<row.rtt?'<small>/'+row.rtt+'</small>':'')+(row.rOk?'<b class="ok">'+ic('i-check')+'</b>':'')+'<small>مقروء</small></span>':'')
    +(row.wan?'<span class="u-num ls">'+ic('i-listen')+'<b>'+row.wan+'</b>'+(row.wan<row.rtt?'<small>/'+row.rtt+'</small>':'')+(row.wOk?'<b class="ok">'+ic('i-check')+'</b>':'')+'<small>مسموع</small></span>':'')
    +(sd&&sd.playlist?'<a href="'+esc(sd.playlist)+'" target="_blank" rel="noopener">قائمة يوتيوب ↗</a>':'')
    +'</div>'
    +'<input class="sflt" id="sflt" type="search" aria-label="ابحث في دروس السلسلة" placeholder="ابحث في دروس السلسلة…"></div><div id="lst" aria-live="polite"></div>';
  app.innerHTML=h;
  document.getElementById('favb').addEventListener('click',e=>{
    store.favToggle(row.id);e.currentTarget.classList.toggle('on',store.fav(row.id));
  });
  const dlb=document.getElementById('dlb');
  if(dlb)dlb.addEventListener('click',async e=>{
    e.currentTarget.style.opacity=.4;
    const r=await offlineRow(row.id);
    e.currentTarget.style.opacity=1;
    e.currentTarget.classList.toggle('on',!!r.ok);
    e.currentTarget.title=r.ok?('محفوظة بلا اتصال ('+r.total+' نصاً)'):'تعذر الحفظ بلا اتصال';
  });
  const draw=fq=>{
    const lst=document.getElementById('lst');lst.innerHTML='';let n=0;
    for(const nn of sorted){
      const l=L(nn),rx=rtxt.get(nn);
      const title=(rx&&rx.title)||l.title||('الدرس '+nn);
      if(fq&&!normalize(title).includes(fq)&&!String(nn).includes(fq))continue;n++;
      const canL=aln.has(nn)||(l.video&&l.video.length>=8);
      const href=canL
        ? 'lesson.html?s='+encodeURIComponent(row.sSlug)+'&l='+nn
        : 'tr.html?r='+encodeURIComponent(row.id)+'&l='+nn;
      lst.insertAdjacentHTML('beforeend',
        '<a class="ls cin" href="'+href+'"><span class="num">'+nn+'</span>'
        +'<span class="t"><bdi>'+esc(title)+'</bdi>'+(l.dur?'<small>'+esc(fmtDur(l.dur))+'</small>':'')+'</span>'
        +'<span class="bd">'+(rtxt.has(nn)?'<span class="ic-read" title="نص">'+ic('i-read')+'</span>':'')
        +(aln.has(nn)?'<span class="ic-listen" title="محاذاة">'+ic('i-listen')+'</span>':'')+'</span></a>');
    }
    if(!n)lst.innerHTML='<p class="empty">لا نتائج.</p>';
  };
  draw('');
  document.getElementById('sflt').addEventListener('input',e=>draw(normalize(e.target.value)));
  // deep-link ?l=n → jump straight into the lesson
  if(ln0&&sorted.includes(ln0)){
    const canL=aln.has(ln0)||(L(ln0).video&&L(ln0).video.length>=8);
    location.replace(canL?'lesson.html?s='+encodeURIComponent(row.sSlug)+'&l='+ln0:'tr.html?r='+encodeURIComponent(row.id)+'&l='+ln0);
  }
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
