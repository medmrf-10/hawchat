<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلسلة — سلاسل المشايخ</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=11">
<style>
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.u-hero .meta a{color:var(--gold-3);text-decoration:none;font-size:var(--fs-xs);display:inline-flex;align-items:center;min-height:44px}
.lrow{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line-1);border-radius:var(--r-md);padding:12px 14px;margin-top:8px;
  text-decoration:none;color:var(--txt);min-height:56px;transition:border-color var(--t-fast) var(--ease)}
@media(hover:hover){.lrow:hover{border-color:var(--gold-2)}}
.lrow .num{width:34px;height:34px;min-width:34px;border-radius:50%;background:rgba(201,162,75,.1);
  border:1px solid var(--line-1);color:var(--gold-3);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:var(--fs-sm)}
.lrow .t{flex:1;font-size:var(--fs-sm);line-height:1.6}
.lrow .t small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.lrow .bd{display:flex;gap:10px;color:var(--ink-3)}
.lrow .bd .i{width:1.15em;height:1.15em}
.lrow .bd .ic-read{color:var(--gold-3)} .lrow .bd .ic-listen{color:var(--violet)} .lrow .bd .ic-play{color:var(--muted);opacity:.7}
.lrow.seen{opacity:.62}
.lrow.cur{border-color:var(--gold-2)}
.u-hero h1{padding-inline-end:56px}
.resline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.resline a{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--bg-2);color:var(--gold-3);font-size:var(--fs-sm);text-decoration:none}
.sflt{width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm);margin-top:12px}
.sflt:focus{outline:none;border-color:var(--gold-2)}
.unv{display:inline-block;background:rgba(201,162,75,.08);border:1px solid var(--line-2);border-radius:var(--r-md);padding:8px 12px;margin-top:10px;color:var(--gold-3);font-size:var(--fs-xs)}
.ytpl{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;
  border:1px solid rgba(224,90,79,.45);border-radius:var(--r-md);text-decoration:none;
  background:linear-gradient(160deg,rgba(224,90,79,.08),var(--bg-2));color:var(--txt)}
.ytpl .i{width:26px;height:26px;color:#e05a4f;flex:none}
.ytpl span{flex:1;font-size:var(--fs-sm)}.ytpl small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span class="sub" id="hdr-sub" style="color:var(--ink-3);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:130px;margin-top:10px;border-radius:18px"></div><div class="skel" style="height:300px;margin-top:12px;border-radius:18px"></div></div></main>
<script src="common.js?v=11"></script>
<script>
const ic=id=>'<svg class="i"><use href="icons.svg?v=11#'+id+'"/></svg>';
(async()=>{
  const q=new URLSearchParams(location.search);
  const app=document.getElementById('app');
  // ?r=<row id> — resolves the row then shows series OR reader lessons
  const stats=await j('data/sheikh_stats.json');
  let rid=q.get('r'),slug=q.get('s'),ln0=parseInt(q.get('l'),10)||0;
  let hit=null;
  if(stats&&rid){
    // row id not found → follow a redirect (rows get re-keyed when merged)
    let found=false;
    for(const s in stats){if(s==='_meta')continue;
      if((stats[s].rows||[]).some(r=>r.id===rid)){found=true;break}}
    if(!found){
      const red=await j('data/redirects.json');
      if(red&&red[rid])rid=red[rid];
    }
  }
  if(stats){
    for(const s in stats){if(s==='_meta')continue;
      const r=(stats[s].rows||[]).find(r=>(rid&&r.id===rid)||(!rid&&slug&&r.sSlug===slug));
      if(r){hit={slug:s,r,st:stats[s]};break}}
  }
  if(!hit){app.innerHTML='<div class="errbox">السلسلة غير موجودة — <a href=".">عودة</a></div>';return}
  const row=hit.r,st=hit.st;slug=hit.slug;
  document.getElementById('back').href='sheikh.html?s='+encodeURIComponent(slug);
  document.getElementById('hdr-sub').textContent=st.name;
  document.title=row.title+' — '+st.name;
  // lessons: series json (aligned) + read-file list
  const [sd,alidx,rows,audx]=await Promise.all([
    row.sSlug?j('series/'+encodeURIComponent(row.sSlug)+'.json'):null,
    j('lessons/'+encodeURIComponent(row.sSlug||row.id)+'/index.json'),
    j('data/read/'+encodeURIComponent(row.id)+'.json'),
    j('audio/index.json')]);
  const akey=row.sSlug||row.id;
  const audMap=new Map((((audx||{})[akey]||{}).items||[]).map(a=>[a.n,a]));
  const aln=new Set((alidx&&(alidx.alignOk||alidx.align))||[]);
  const smn=new Set((alidx&&alidx.sum)||[]);
  const qun=new Set((alidx&&alidx.qu)||[]);
  const tin=(alidx&&alidx.ti)||{};
  const txn=new Set((alidx&&alidx.txt)||[]);
  const rtxt=new Map((rows||[]).map(x=>[x.n,x]));
  // unified lesson list: every n that has text OR align
  const ns=new Set([...aln,...txn,...rtxt.keys(),...audMap.keys()]);
  const lessons=(sd&&sd.lessons)||[];
  for(const l of lessons)if((l.video||aln.has(l.n)||txn.has(l.n)))ns.add(l.n);
  let sorted=[...ns].sort((a,b)=>a-b);
  // B2: ?m=listen (from «استمع» on sheikh page) filters to aligned lessons;
  // ?m=read to lessons with text. Unfiltered default shows everything.
  const L=n=>lessons.find(x=>x.n===n)||{};
  let mode=q.get('m');if(mode==='ltx')mode='yt';
  if(mode==='listen')sorted=sorted.filter(n=>aln.has(n));
  else if(mode==='read')sorted=sorted.filter(n=>txn.has(n)||rtxt.has(n));
  else if(mode==='yt')sorted=sorted.filter(n=>{const ll=L(n),rx=rtxt.get(n);return (ll.video&&ll.video.length>=8)||(rx&&rx.vid)});
  else if(mode==='aud')sorted=sorted.filter(n=>{const ll=L(n),rx=rtxt.get(n);return (ll.video&&ll.video.length>=8)||(rx&&rx.vid)||audMap.has(n)});
  else if(mode==='sm')sorted=sorted.filter(n=>smn.has(n));
  else if(mode==='qu')sorted=sorted.filter(n=>qun.has(n));
  const MN={read:'قراءة',yt:'يوتيوب',aud:'استماع',listen:'مشاهدة حية',sm:'تلخيص',qu:'أسئلة'};
  if(MN[mode])document.title=MN[mode]+' — '+row.title;
  const rs=store.resume(row.id);
  store.markSeen(row.id);
  app.innerHTML='<input class="sflt" id="sflt" type="search" aria-label="ابحث في دروس السلسلة" placeholder="ابحث في دروس السلسلة…">'
    +(row.unv?'<div class="unv">ترجمة آلية مأخوذة من يوتيوب — غير مدققة بعد</div>':'')
    +(mode==='yt'&&row.yt?'<a class="ytpl cin" href="yt.html?r='+encodeURIComponent(row.id)+'">'+ic('i-yt')+'<span><b>تشغيل قائمة يوتيوب كاملة</b><small>'+(row.ytn||0)+' فيديو — مشغّل داخلي بلا تفريغ</small></span></a>':'')
    +'<div id="lst" aria-live="polite"></div>';
  const draw=fq=>{
    const lst=document.getElementById('lst');lst.innerHTML='';let n=0;
    for(const nn of sorted){
      const l=L(nn),rx=rtxt.get(nn);
      const title=tin[nn]||(rx&&rx.title)||l.title||('الدرس '+nn);
      if(fq&&!normalize(title).includes(fq)&&!String(nn).includes(fq))continue;n++;
      const canL=aln.has(nn)||(l.video&&l.video.length>=8);
      // each tile-mode opens its own page — no mixing of read/watch/summary
      const href=mode==='sm' ? 'sm.html?r='+encodeURIComponent(row.id)+'&l='+nn
        : mode==='qu' ? 'qu.html?r='+encodeURIComponent(row.id)+'&l='+nn
        : mode==='read' ? 'tr.html?r='+encodeURIComponent(row.id)+'&l='+nn
        : mode==='aud'&&audMap.has(nn)&&!(L(nn).video&&L(nn).video.length>=8)&&!(rtxt.get(nn)||{}).vid
            ? 'aud.html?k='+encodeURIComponent(akey)+'&n='+nn
        : mode==='yt'||mode==='aud' ? ((L(nn).video&&L(nn).video.length>=8)
            ? 'yt.html?s='+encodeURIComponent(row.sSlug)+'&l='+nn+(mode==='aud'?'&a=1':'')
            : 'yt.html?v='+encodeURIComponent((rtxt.get(nn)||{}).vid||'')+'&r='+encodeURIComponent(row.id)+'&l='+nn+(mode==='aud'?'&a=1':''))
        : mode==='listen' ? 'lesson.html?s='+encodeURIComponent(row.sSlug)+'&l='+nn
        : canL ? 'lesson.html?s='+encodeURIComponent(row.sSlug)+'&l='+nn
        : 'tr.html?r='+encodeURIComponent(row.id)+'&l='+nn;
      const seen=store.seen(row.id+':'+nn),isCur=rs&&rs.n===nn;
      lst.insertAdjacentHTML('beforeend',
        '<a class="lrow cin'+(seen?' seen':'')+(isCur?' cur':'')+'" href="'+href+'"><span class="num">'+nn+'</span>'
        +'<span class="t"><bdi>'+esc(title)+'</bdi>'+(l.dur?'<small>'+esc(fmtDur(l.dur))+'</small>':'')+'</span></a>');
    }
    if(!n)lst.innerHTML='<p class="empty">لا نتائج.</p>';
  };
  draw('');
  document.getElementById('sflt').addEventListener('input',e=>draw(normalize(e.target.value)));
  // deep-link ?l=n → jump straight into the mode's own page
  if(ln0&&sorted.includes(ln0)){
    const canL=aln.has(ln0)||(L(ln0).video&&L(ln0).video.length>=8);
    location.replace(mode==='sm'?'sm.html?r='+encodeURIComponent(row.id)+'&l='+ln0
      :mode==='qu'?'qu.html?r='+encodeURIComponent(row.id)+'&l='+ln0
      :mode==='read'?'tr.html?r='+encodeURIComponent(row.id)+'&l='+ln0
      :mode==='aud'&&audMap.has(ln0)&&!(L(ln0).video&&L(ln0).video.length>=8)&&!(rtxt.get(ln0)||{}).vid?'aud.html?k='+encodeURIComponent(akey)+'&n='+ln0
      :(mode==='yt'||mode==='aud')&&L(ln0).video&&L(ln0).video.length>=8?'yt.html?s='+encodeURIComponent(row.sSlug)+'&l='+ln0+(mode==='aud'?'&a=1':'')
      :mode==='yt'||mode==='aud'?'yt.html?v='+encodeURIComponent((rtxt.get(ln0)||{}).vid||'')+'&r='+encodeURIComponent(row.id)+'&l='+ln0+(mode==='aud'?'&a=1':'')
      :canL?'lesson.html?s='+encodeURIComponent(row.sSlug)+'&l='+ln0
      :'tr.html?r='+encodeURIComponent(row.id)+'&l='+ln0);
  }
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
