<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفة القيادة — تفريغ agy</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:end;gap:14px;margin:10px 0 16px}
.hero h1{font-family:var(--font-ar);font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .pill{font-size:.68rem;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin-bottom:6px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.row.skipped{opacity:.45;border-style:dashed}
.row .nm{flex:1;min-width:0;font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-size:.68rem;color:var(--dim);white-space:nowrap}
.row .cnt b{color:var(--acc);font-size:.85rem}
.btn{min-width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;transition:border-color .15s}
.btn:hover{border-color:var(--acc)}
.btn.off{border-color:#c0392b;color:#c0392b}
.btn.on{border-color:var(--acc3);color:var(--acc3)}
#save{position:fixed;bottom:16px;right:16px;left:16px;max-width:728px;margin:0 auto;height:48px;border-radius:var(--r-md);border:none;background:var(--acc);color:var(--bg);font-family:var(--font-ui);font-size:.95rem;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);display:none;z-index:50}
#save.show{display:block}
#toast{position:fixed;top:18px;right:50%;transform:translateX(50%);background:var(--card2);border:1px solid var(--acc);color:var(--txt);font-size:.78rem;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1}
h2{font-size:.8rem;color:var(--dim);font-weight:600;margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px}
.bk{display:inline-block;margin-top:4px;font-size:.75rem;color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>دفة القيادة</h1><span class="pill" id="stat">…</span></div>
<a class="bk" href="./">← السلاسل المختارة</a>
<h2>الطابور — اسحب الترتيب بالأسهم</h2>
<div id="list"></div>
<h2 id="heldh" style="display:none">متجمدة (غير مرغوب)</h2>
<div id="held"></div>
<h2 id="doneh" style="display:none">أُنجزت مؤخراً</h2>
<div id="done" style="font-size:.75rem;color:var(--dim);line-height:1.9"></div>
<div style="height:80px"></div>
</div>
<button id="save">حفظ الترتيب — يُطبَّق على الطابور فوراً</button>
<div id="toast"></div>
<script>
const NT='https://ntfy.sh/des_helm_q7';
let state={queue:[],held:[],done_recent:[]},order=[],skip=new Set(),dirty=false;

async function boot(){
  const [s,o]=await Promise.all([
    fetch('data/helm_state.json?v='+Date.now()).then(r=>r.json()).catch(()=>({queue:[],held:[],done_recent:[]})),
    fetch('data/helm_order.json?v='+Date.now()).then(r=>r.json()).catch(()=>({order:[],skip:[]})),
  ]);
  state=s;
  skip=new Set(o.skip||[]);
  const known=s.queue.map(q=>q.key);
  order=(o.order||[]).filter(k=>known.includes(k));
  known.forEach(k=>{if(!order.includes(k))order.push(k)});
  render();
}

function pretty(k){return k.replace(/^\d+_?/,'').replace(/\.txt$/,'')}

function render(){
  const L=document.getElementById('list'),H=document.getElementById('held'),D=document.getElementById('done');
  const byKey={};state.queue.forEach(q=>byKey[q.key]=q);
  L.innerHTML='';
  order.forEach((k,i)=>{
    if(skip.has(k))return;
    const q=byKey[k]||{pending:0,active:0};
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`<span style="color:var(--dim);font-size:.72rem;width:22px;text-align:center">${i+1}</span>
      <span class="nm">${pretty(k)}</span>
      <span class="cnt"><b>${q.pending}</b> منتظر${q.active?' · '+q.active+' نشط':''}</span>
      <button class="btn" data-a="up" data-i="${i}" title="أعلى">▲</button>
      <button class="btn" data-a="dn" data-i="${i}" title="أسفل">▼</button>
      <button class="btn off" data-a="sk" data-i="${i}" title="غير مرغوب">✕</button>`;
    L.appendChild(d);
  });
  const held=[...order.filter(k=>skip.has(k)),...state.held.filter(k=>!order.includes(k))];
  document.getElementById('heldh').style.display=held.length?'':'none';
  H.innerHTML='';held.forEach(k=>{
    const d=document.createElement('div');d.className='row skipped';
    d.innerHTML=`<span class="nm">${pretty(k)}</span><button class="btn on" data-a="un" data-k="${k.replace(/"/g,'')}" title="أعد للطابور">↩</button>`;
    H.appendChild(d);
  });
  document.getElementById('doneh').style.display=state.done_recent.length?'':'none';
  D.textContent=state.done_recent.map(pretty).join(' · ');
  const pend=state.queue.reduce((a,q)=>a+q.pending,0),act=state.queue.reduce((a,q)=>a+(q.active||0),0);
  document.getElementById('stat').textContent=`${pend} منتظر · ${act} نشط`;
  document.getElementById('save').classList.toggle('show',dirty);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='up'&&i>0){[order[i-1],order[i]]=[order[i],order[i-1]]}
  else if(a==='dn'&&i<order.length-1){[order[i+1],order[i]]=[order[i],order[i+1]]}
  else if(a==='sk'){skip.add(order[i])}
  else if(a==='un'){skip.delete(b.dataset.k)}
  dirty=true;render();
});

document.getElementById('save').onclick=async()=>{
  const body=JSON.stringify({kind:'helm',order,skip:[...skip],t:Date.now()});
  try{await fetch(NT,{method:'POST',body});toast('حُفظ — يصل للسرب خلال دقيقة');dirty=false;render();}
  catch(e){toast('تعذّر الحفظ — جرّب ثانية')}
};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}

boot();setInterval(boot,60000);
</script>
</body>
</html>
