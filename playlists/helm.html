<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفة القيادة — التفريغ والتنزيل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1160px;margin:0 auto;padding:14px}
.hero{display:flex;align-items:end;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.hero h1{font-family:var(--font-ar);font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .mut{font-size:.66rem;color:var(--dim)}
.hero a{color:var(--acc);font-size:.7rem;text-decoration:none}
#pendtag{font-size:.66rem;color:#e0b34a;border:1px solid #8a6d1a;border-radius:99px;padding:3px 10px;display:none}
#pendtag.show{display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px}
.kpi b{display:block;font-size:1.1rem}
.kpi span{font-size:.62rem;color:var(--dim)}
.kpi.d b{color:var(--acc)}.kpi.a b{color:var(--acc3)}.kpi.p b{color:#c9a227}.kpi.b b{color:#e74c3c}.kpi.f b{color:#5a8ad0}.kpi.u b{color:#95a3bb}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-family:var(--font-ui);font-size:.7rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.tab.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tab i{font-style:normal;opacity:.75;font-size:.64rem}
select#fsh,input#flt{height:32px;background:var(--card);border:1px solid var(--border);border-radius:99px;color:var(--txt);padding:0 12px;font-family:var(--font-ui);font-size:.75rem}
input#flt{flex:1;min-width:110px}
input#flt:focus,select#fsh:focus{outline:none;border-color:var(--acc)}
#rows{display:block}
.ser{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 11px;margin-bottom:6px}
.ser.paused{opacity:.55;border-color:#3a4a8a}
.ser.held{opacity:.45;border-style:dashed}
.ser.feederr{border-color:#5c1f16}
.ser .ord{color:var(--acc);font-size:.68rem;width:20px;text-align:center;font-weight:700;flex:none}
.ser .nm{flex:1;min-width:0}
.ser .nm b{display:block;font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.ser .nm a{color:inherit;text-decoration:none}
.ser .nm a:hover{color:var(--acc2)}
.ser .nm i{font-style:normal;font-size:.62rem;color:var(--dim)}
.ser .nm i a{color:var(--acc);text-decoration:none}
.ser .nums{font-size:.64rem;color:var(--dim);white-space:nowrap;text-align:left;min-width:130px;flex:none}
.ser .nums b{font-size:.72rem;color:var(--txt)}
.nums .d{color:var(--acc)}.nums .a{color:var(--acc3)}.nums .p{color:#c9a227}.nums .b{color:#e74c3c}.nums .u{color:#7ea9ea}
.badge{display:inline-block;font-size:.58rem;border-radius:99px;padding:1px 7px;border:1px solid var(--border);color:var(--dim);margin-inline-start:4px}
.badge.fe{border-color:#5a8ad0;color:#7ea9ea}
.badge.err{border-color:#c0392b;color:#e74c3c}
.badge.tofu{font-size:.56rem}
.pb{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--bg);margin-top:5px;border:1px solid var(--border)}
.pb i{display:block;height:100%}
.pb .d{background:var(--acc)}.pb .a{background:var(--acc3)}.pb .p{background:#8a6d1a}
.pb .b{background:#c0392b}.pb .z{background:#3a4a8a}.pb .h{background:#444;opacity:.5}.pb .u{background:#5a8ad0}
.ab{display:flex;gap:4px;flex:none}
.btn{min-width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card2);color:var(--txt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;transition:border-color .15s;flex:none;font-family:var(--font-ui)}
.btn:hover{border-color:var(--acc)}
.btn svg{width:13px;height:13px;display:block}
.btn.off{border-color:#c0392b;color:#e74c3c}
.btn.on{border-color:var(--acc3);color:var(--acc3)}
.btn.pause{border-color:#3a4a8a;color:#7a9be0}
.btn.retry{border-color:#8a6d1a;color:#d4aa27}
.btn.enq{border-color:var(--acc);color:var(--acc)}
.btn.dl{border-color:#5a8ad0;color:#7ea9ea}
.more{background:var(--card);border:1px solid var(--border);color:var(--acc);cursor:pointer;font-size:.7rem;padding:9px 14px;border-radius:99px;margin:8px auto;display:block}
#save{position:fixed;bottom:14px;right:14px;left:14px;max-width:1128px;margin:0 auto;height:46px;border-radius:var(--r-md);border:none;background:var(--acc);color:var(--bg);font-family:var(--font-ui);font-size:.92rem;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);display:none;z-index:50}
#save.show{display:block}
#toast{position:fixed;top:16px;right:50%;transform:translateX(50%);background:var(--card2);border:1px solid var(--acc);color:var(--txt);font-size:.78rem;padding:9px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{border-color:#c0392b;color:#ffb0a0}
details#cmdlog{margin-bottom:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px}
details#cmdlog summary{font-size:.72rem;color:var(--dim);cursor:pointer}
details#cmdlog .l{font-size:.64rem;color:var(--dim);padding:3px 0;border-top:1px dashed var(--border)}
@media(max-width:640px){
 .wrap{padding:10px}
 .ser{flex-wrap:wrap;gap:5px}
 .ser .nm{flex:1 1 100%;order:1}
 .ser .ord{display:none}
 .ser .nums{order:2;flex:1;min-width:0;text-align:right}
 .ab{order:3}
 .kpi{padding:7px 9px}
}
@media(min-width:1200px){#rows{columns:2;column-gap:10px}.ser{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>دفة القيادة</h1><a href="./">← موقع السلاسل</a><span id="pendtag">تعديلات معلّقة — التحديث التلقائي موقوف</span><span class="mut" id="upd"></span></div>
<div class="kpis" id="kpis"></div>
<div class="bar" id="tabs"></div>
<div class="bar">
  <select id="fsh"><option value="">كل المشايخ</option></select>
  <input id="flt" placeholder="بحث باسم السلسلة…">
</div>
<details id="cmdlog"><summary>سجل الأوامر المرسلة</summary><div id="clog"></div></details>
<div id="rows"></div>
<div style="height:76px"></div>
</div>
<button id="save">حفظ الترتيب والتجميد — يُطبَّق خلال دقيقة</button>
<button id="und" class="btn" style="position:fixed;bottom:74px;left:16px;display:none;z-index:50">↩ تراجع عن التعديلات</button>
<style>#und.show{display:block}</style>
<div id="toast"></div>
<script>
const NT='https://ntfy.sh/des_helm_q7';
const MUT='https://medmrf-10.github.io/des/mutalaa/';
let series=[],order=[],skip=new Set(),paused=new Set(),dirty=false,edits=0;
let view='all',flt='',fsh='',limit=300;
const VIEWS=[['all','الكل'],['nodl','لم تُنزَّل'],['feed','التنزيل'],['queue','الطابور'],['active','نشط'],['done','مفرّغ'],['complete','مكتملة'],['bad','فاشل'],['paused','متوقفة'],['held','غير مرغوب']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
 up:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3l5 6H3z"/></svg>',
 dn:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 13L3 7h10z"/></svg>',
 pz:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="4" height="10" rx="1"/><rect x="9" y="3" width="4" height="10" rx="1"/></svg>',
 play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 3l9 5-9 5z"/></svg>',
 x:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.2" fill="none"/></svg>',
 rt:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2v3h-3" fill="none"/></svg>',
 add:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 2v12M2 8h12"/></svg>',
 dl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M4.5 7 8 10.5 11.5 7"/><path d="M3 13.5h10"/></svg>',
 undl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M4.5 7 8 10.5 11.5 7"/><path d="M3 13.5h10"/><path d="M2 3l12 12" stroke="#e74c3c"/></svg>',
 back:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3 2.5 7 6 11"/><path d="M3 7h7a4 4 0 0 1 0 8h-1"/></svg>'
};
function L(t,a){return `<button class="btn ${a.c||''}" data-a="${a.a}" data-k="${esc(t)}" title="${a.t}">${ICON[a.i]||a.i}</button>`}

async function boot(){
  if(dirty)return;
  edits=0;
  document.getElementById('pendtag').classList.remove('show');
  const [s,o]=await Promise.all([
    fetch('data/helm_state.json?v='+Date.now()).then(r=>r.json()).catch(()=>({series:[]})),
    fetch('data/helm_order.json?v='+Date.now()).then(r=>r.json()).catch(()=>({order:[],skip:[],pause:[]})),
  ]);
  series=dedupe(s.series||[]);
  skip=new Set(o.skip||[]);paused=new Set(o.pause||[]);
  const qk=series.filter(x=>(x.pending>0||x.active>0)&&!skip.has(x.key)&&!x.paused).map(x=>x.key);
  order=(o.order||[]).filter(k=>qk.includes(k));
  qk.forEach(k=>{if(!order.includes(k))order.push(k)});
  document.getElementById('upd').textContent=s.t?('تحديث '+new Date(s.t*1000).toLocaleTimeString('ar')):'';
  render();
}
function dedupe(ss){
  const seen=new Map();
  for(const x of ss){
    if(!x.id){continue}
    const k='id'+x.id;
    const ex=seen.get(k);
    if(!ex||(x.total>ex.total||x.done>ex.done)){seen.set(k,x)}
    else{ex._dup=(ex._dup||0)+1}
  }
  const out=ss.filter(x=>!x.id?true:seen.get('id'+x.id)===x);
  return out;
}
function cat(x){
  if(skip.has(x.key)||x.held)return 'held';
  if(x.paused||paused.has(x.key))return 'paused';
  if(x.active)return 'active';
  if(x.pending)return 'queue';
  if(x.feed==='downloading'||x.feed==='queued')return 'feed';
  if(x.exp&&x.done>=x.exp&&x.exp>0)return 'complete';
  if(x.bad||x.feed==='feederr')return 'bad';
  if(x.done)return 'done';
  if(!x.total)return 'nodl';
  return 'queue';
}
function match(x){
  if(fsh&&(x.sheikh||'أخرى')!==fsh)return false;
  if(flt&&!(x.name||x.key).includes(flt))return false;
  if(view==='all')return true;
  if(view==='bad')return x.bad>0||x.feed==='feederr';
  if(view==='queue')return cat(x)==='queue';
  return cat(x)===view;
}
function nums(x){
  const p=[];
  p.push(`أصل <b>${x.exp||'—'}</b>`);
  if(x.total)p.push(`منزّل <b>${x.total}</b>`);
  if(x.done)p.push(`<b class="d">${x.done}</b> مفرّغ`);
  if(x.pending)p.push(`<b class="p">${x.pending}</b> منتظر`);
  if(x.active)p.push(`<b class="a">${x.active}</b> نشط`);
  if(x.bad)p.push(`<b class="b">${x.bad}</b> فاشل`);
  if(x.exp&&(x.done>x.exp||x.total>x.exp))p.push(`<b class="b">⚠ +${Math.max(x.done,x.total)-x.exp} عن الأصل</b>`);
  return p.join(' · ');
}
function acts(x){
  const held=skip.has(x.key)||x.held, pz=x.paused||paused.has(x.key);
  if(held)return L(x.key,{a:'un',i:'back',c:'on',t:'إرجاع للطابور'});
  if(pz)return L(x.key,{a:'unp',i:'play',c:'on',t:'استئناف'})+L(x.key,{a:'sk',i:'x',c:'off',t:'غير مرغوب'});
  let b='';
  if(x.id){
    if(x.feed==='queued')b+=L(x.id,{a:'ufd',i:'undl',c:'off',t:'إلغاء التنزيل'});
    else if(x.feed==='downloading')b+=`<span class="btn" title="يُنزَّل الآن" style="cursor:default">${ICON.dl}</span>`;
    else if(!x.total||x.feed==='feederr'||x.total<x.exp)b+=L(x.id,{a:'fd',i:'dl',c:'dl',t:x.total?'استكمال تنزيل الباقي':'تنزيل'});
  }
  if(x.remaining>0&&x.total>0&&!x.pending)b+=L(x.key,{a:'eq',i:'add',c:'enq',t:'جدولة المتبقي'});
  if(x.pending||x.active||x.remaining){
    b+=L(x.key,{a:'up',i:'up',t:'أعلى'})+L(x.key,{a:'dn',i:'dn',t:'أسفل'})+L(x.key,{a:'pz',i:'pz',c:'pause',t:'إيقاف مؤقت'});
  }
  if(x.bad)b+=L(x.key,{a:'rt',i:'rt',c:'retry',t:'أعد الفاشل'});
  if(x.pending||x.active||x.remaining)b+=L(x.key,{a:'sk',i:'x',c:'off',t:'غير مرغوب'});
  if(!b&&!x.id)b='<span class="badge">لا يمكن إدارتها — مصدر الصوت مفقود</span>';
  return b?`<span class="ab">${b}</span>`:'';
}
function clog(op,label){
  try{
    const l=JSON.parse(localStorage.getItem('helm_log')||'[]');
    l.unshift({t:Date.now(),op,label});
    localStorage.setItem('helm_log',JSON.stringify(l.slice(0,30)));
  }catch(e){}
  drawLog();
}
function drawLog(){
  const l=JSON.parse(localStorage.getItem('helm_log')||'[]');
  const el=document.getElementById('clog');if(!el)return;
  el.innerHTML=l.length?l.map(x=>`<div class="l">${new Date(x.t).toLocaleString('ar')} — ${esc(x.op)}: ${esc(x.label)}</div>`).join(''):'<div class="l">لا أوامر بعد.</div>';
}
async function post(kind,key,label){
  toast('يُرسَل الأمر…');
  try{
    const r=await fetch(NT,{method:'POST',body:JSON.stringify({kind,keys:[key],t:Date.now()})});
    if(r.ok){toast('أُرسل الأمر — يُطبَّق خلال دقيقة');clog(kind,label||key)}
    else toast('فشل الإرسال ('+r.status+')',1);
  }catch(e){toast('تعذّر الإرسال — تحقق من الشبكة',1)}
}
function bar(x){
  const T=Math.max(x.exp||0,x.total,x.done+x.pending+x.bad,1);
  const seg=(n,cls)=>n?`<i class="${cls}" style="width:${n/T*100}%"></i>`:'';
  return `<div class="pb">${seg(x.done,'d')}${seg(x.active,'a')}${seg(x.pending,'p')}${seg(x.paused?x.total:0,'z')}${seg(x.bad,'b')}${seg(x.held?x.total:0,'h')}${(x.feed==='downloading'||x.feed==='queued')?seg(Math.max(0,(x.total||0)-(x.done+x.pending+x.bad))||1,'u'):''}</div>`;
}
function render(){
  const k={nodl:0,feed:0,pend:0,act:0,donef:0,bad:0,comp:0,exp:0};
  series.forEach(x=>{const c=cat(x);k.exp+=x.exp||0;k.donef+=x.done;
    if(c==='nodl')k.nodl++;if(c==='feed')k.feed++;
    k.pend+=x.pending;k.act+=x.active;k.bad+=x.bad;if(c==='complete')k.comp++;});
  document.getElementById('kpis').innerHTML=
    `<div class="kpi"><b>${series.length}</b><span>سلسلة إجمالاً</span></div>
     <div class="kpi d"><b>${k.donef}</b><span>ملف مفرّغ من ${k.exp} متوقَّع</span></div>
     <div class="kpi p"><b>${k.pend}</b><span>ملف في طابور التفريغ</span></div>
     <div class="kpi a"><b>${k.act}</b><span>ملف نشط الآن</span></div>
     <div class="kpi f"><b>${k.feed}</b><span>سلسلة في التنزيل</span></div>
     <div class="kpi u"><b>${k.nodl}</b><span>سلسلة لم تُنزَّل</span></div>
     <div class="kpi b"><b>${k.bad}</b><span>ملف فاشل</span></div>
     <div class="kpi"><b>${k.comp}</b><span>سلسلة مكتملة</span></div>`;
  document.getElementById('tabs').innerHTML=VIEWS.map(([v,l])=>{
    let n;
    if(v==='all')n=series.length;
    else if(v==='bad')n=series.filter(x=>x.bad>0||x.feed==='feederr').length;
    else if(v==='queue')n=series.filter(x=>cat(x)==='queue').length;
    else n=series.filter(x=>cat(x)===v).length;
    return `<button class="tab ${view===v?'on':''}" data-v="${v}">${l} <i>${n}</i></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;limit=300;render()});
  const shs=[...new Set(series.map(x=>x.sheikh||'أخرى'))].sort();
  const fs=document.getElementById('fsh');
  if(fs.options.length!==shs.length+1){
    fs.innerHTML='<option value="">كل المشايخ</option>'+shs.map(s=>`<option ${fsh===s?'selected':''}>${esc(s)}</option>`).join('');
  }
  fs.onchange=()=>{fsh=fs.value;render()};
  const w={active:0,queue:1,feed:2,bad:3,paused:4,done:5,complete:6,held:7,nodl:8};
  let rows=series.filter(match);
  rows.sort((a,b)=>{
    const ca=w[cat(a)]??9,cb=w[cat(b)]??9;
    if(ca!==cb)return ca-cb;
    const ia=order.indexOf(a.key),ib=order.indexOf(b.key);
    if(ia>-1&&ib>-1)return ia-ib;
    if(ia>-1)return -1;if(ib>-1)return 1;
    if(cat(a)==='nodl'||cat(b)==='nodl')return (b.exp||0)-(a.exp||0)||a.key.localeCompare(b.key);
    return (b.done||0)-(a.done||0)||a.key.localeCompare(b.key);
  });
  const shown=rows.slice(0,limit);
  let h='';
  shown.forEach(x=>{
    const c=cat(x),qi=order.indexOf(x.key);
    const nm=x.name||x.key.replace(/^\d+_?/,'');
    const shQ=x.sheikh&&x.sheikh!=='أخرى';
    const shtm=x.id?`${MUT}#/s/${x.id}`:(shQ?`sheikh.html?s=${encodeURIComponent(x.sheikh)}`:'#');
    const fb=c==='feed'?`<span class="badge fe">${x.feed==='downloading'?'⬇ يُنزَّل':'⬇ بالطابور '+(x.fqpos||'')}</span>`:x.feed==='feederr'?'<span class="badge err">خطأ تنزيل</span>':'';
    h+=`<div class="ser${c==='paused'?' paused':c==='held'?' held':x.feed==='feederr'?' feederr':''}">
      ${qi>-1?`<span class="ord">${qi+1}</span>`:'<span class="ord"></span>'}
      <span class="nm"><b>${shtm==='#'?esc(nm):`<a href="${shtm}" target="_blank" rel="noopener">${esc(nm)}</a>`}</b><i>${shQ?`<a href="sheikh.html?s=${encodeURIComponent(x.sheikh)}">${esc(x.sheikh)}</a>`:esc(x.sheikh||'أخرى')}${x.id?' · #'+x.id:''}</i>${fb}${bar(x)}</span>
      <span class="nums">${nums(x)}</span>${acts(x)}</div>`;
  });
  if(rows.length>limit)h+=`<button class="more" id="more">+ ${rows.length-limit} سلسلة إضافية — أظهر المزيد</button>`;
  if(!rows.length)h+='<p style="color:var(--dim);font-size:.8rem;padding:16px">لا نتائج.</p>';
  document.getElementById('rows').innerHTML=h;
  const mb=document.getElementById('more');
  if(mb)mb.onclick=()=>{limit+=500;render()};
  document.getElementById('save').classList.toggle('show',dirty);
  document.getElementById('und').classList.toggle('show',dirty);
  const pt=document.getElementById('pendtag');
  if(dirty){pt.textContent=edits+' تعديل معلّق — التحديث التلقائي موقوف';pt.classList.add('show')}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const k=t.dataset.k,a=t.dataset.a;if(!k)return;
  const row=series.find(x=>x.key===k||String(x.id)===k);
  const nm=row?(row.name||row.key):k;
  if(a==='eq'){if(confirm(`جدولة ملفات «${nm}» المتبقية في طابور التفريغ؟`))post('helm_enqueue',k,nm);return}
  if(a==='rt'){if(confirm(`إعادة الملفات الفاشلة لـ«${nm}»؟`))post('helm_retry',k,nm);return}
  if(a==='fd'){if(confirm(`بدء تنزيل «${nm}» من يوتيوب؟`))post('helm_feed',k,nm);return}
  if(a==='ufd'){if(confirm(`إلغاء تنزيل «${nm}» من الطابور؟`))post('helm_unfeed',k,nm);return}
  if(a==='sk'){skip.add(k);paused.delete(k)}
  else if(a==='un'){skip.delete(k)}
  else if(a==='pz'){paused.add(k)}
  else if(a==='unp'){paused.delete(k)}
  else{let i=order.indexOf(k);if(i<0){order.push(k);i=order.length-1}
    if(a==='up'&&i>0){[order[i-1],order[i]]=[order[i],order[i-1]]}
    if(a==='dn'&&i<order.length-1){[order[i+1],order[i]]=[order[i],order[i+1]]}}
  dirty=true;edits++;render();
});
document.getElementById('und').onclick=()=>{dirty=false;edits=0;boot()};
document.getElementById('flt').addEventListener('input',e=>{flt=e.target.value.trim();limit=300;render()});
document.getElementById('save').onclick=async()=>{
  const body=JSON.stringify({kind:'helm',order,skip:[...skip],pause:[...paused],t:Date.now()});
  try{const r=await fetch(NT,{method:'POST',body});
    if(r.ok){toast('حُفظ — يُطبَّق خلال دقيقة');clog('helm','ترتيب/تجميد '+skip.size+' مجمّد، '+paused.size+' متوقف');dirty=false;edits=0;render();}
    else toast('تعذّر الحفظ — جرّب ثانية',1);}
  catch(e){toast('تعذّر الحفظ — جرّب ثانية',1)}
};
function toast(t,err){const el=document.getElementById('toast');el.textContent=t;el.className='show'+(err?' err':'');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
drawLog();
boot();setInterval(boot,60000);
</script>
</body>
