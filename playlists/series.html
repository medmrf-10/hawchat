<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السلسلة — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:8px}
.hero h1{font-family:var(--font-ar);font-size:1.45rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .meta{color:var(--dim);font-size:.8rem;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.hero a{color:var(--acc2);text-decoration:none;font-size:.8rem}
.ls{display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;margin-top:10px;text-decoration:none;color:var(--txt);transition:border-color .15s,transform .15s}
.ls:hover{border-color:var(--acc);transform:translateY(-1px)}
.ls .num{width:34px;height:34px;min-width:34px;border-radius:50%;background:rgba(201,162,75,.1);border:1px solid var(--border);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.ls .t{flex:1;font-size:.92rem;line-height:1.6}
.ls .ply{color:var(--dim);font-size:.85rem}
.empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="./" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">السلاسل المختارة</span>
</div></header>
<main><div class="wrap" id="app"><p class="empty">يحمّل…</p></div></main>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{
  const slug=new URLSearchParams(location.search).get('s');
  const app=document.getElementById('app');
  const d=await j('series/'+encodeURIComponent(slug)+'.json');
  if(!d){app.innerHTML='<p class="empty">السلسلة غير موجودة. <a href="./" style="color:var(--acc2)">عودة</a></p>';return}
  document.title=d.title+' — hawchat';
  let h='<div class="hero cin"><h1>'+esc(d.title)+'</h1><div class="meta"><span>'+esc(d.sheikh)+'</span><span>'+d.count+' درساً</span>'
    +(d.playlist?'<a href="'+esc(d.playlist)+'" target="_blank" rel="noopener">قائمة يوتيوب ↗</a>':'')
    +'</div></div>';
  for(const l of d.lessons){
    h+='<a class="ls cin" href="lesson.html?s='+encodeURIComponent(slug)+'&l='+l.n+'"><span class="num">'+l.n+'</span><span class="t">'+esc(l.title)+'</span><span class="ply">▶</span></a>';
  }
  app.innerHTML=h;
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
