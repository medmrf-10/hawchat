<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:10px}
.hero h1{font-family:var(--font-ui);font-size:var(--fs-xl);font-weight:700;color:var(--txt);margin:0}
.hero .meta{color:var(--dim);font-size:var(--fs-xs);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hero a{color:var(--acc2);text-decoration:none;font-size:var(--fs-xs)}
.hero .acts{display:flex;gap:10px;margin-top:14px}
.hero .acts a{min-height:44px;padding:0 16px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:600;text-decoration:none;border:1px solid var(--border)}
.hero .acts a.rd{border-color:var(--read);color:var(--read)}
.hero .acts a.pl{border-color:var(--border);color:var(--dim)}
.ls{display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;margin-top:10px;text-decoration:none;color:var(--txt);min-height:56px}
@media(hover:hover){.ls:hover{border-color:var(--acc)}}
.ls .num{width:34px;height:34px;min-width:34px;border-radius:50%;background:rgba(201,162,75,.1);border:1px solid var(--border);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-sm)}
.ls .t{flex:1;font-size:var(--fs-sm);line-height:1.6}
.ls .bd{display:flex;gap:12px;color:var(--dim);font-size:1rem}
.ls .bd .i{width:1.15em;height:1.15em}
.empty{color:var(--dim);padding:20px}
.sflt{width:100%;height:44px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);padding:0 14px;font-family:var(--font-ui);font-size:var(--fs-sm);margin-top:12px;box-sizing:border-box}
.sflt:focus{outline:none;border-color:var(--acc)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." id="back" class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" id="hdr-sub" style="color:var(--dim);font-size:var(--fs-xs)">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap" id="app"><div class="skel" style="height:110px;margin-top:10px"></div><div class="skel" style="height:300px;margin-top:12px"></div></div></main>
<script src="common.js"></script>
<script>
(async()=>{
  const slug=new URLSearchParams(location.search).get('s');
  const app=document.getElementById('app');
  const [d,alidx]=await Promise.all([
    j('series/'+encodeURIComponent(slug)+'.json'),
    j('lessons/'+encodeURIComponent(slug)+'/index.json')]);
  if(!d){app.innerHTML='<div class="errbox">السلسلة غير موجودة — <a href="./">عودة</a></div>';return}
  const aln=new Set((alidx&&alidx.align)||[]);
  const txn=new Set((alidx&&alidx.txt)||[]);
  document.title=d.title+' — سلاسل المشايخ';
  document.getElementById('hdr-sub').textContent=d.sheikh||'سلاسل المشايخ';
  const shSlug=d.sheikh_slug||'';
  document.getElementById('back').href='sheikh.html?s='+encodeURIComponent(shSlug);
  const visible=(d.lessons||[]).filter(l=>aln.has(l.n)||txn.has(l.n));
  const stats=await j('data/sheikh_stats.json');
  const st=stats&&stats[shSlug];
  const row=st&&(st.rows||[]).find(r=>r.sSlug===slug);
  let h='<nav class="crumb" aria-label="مسار التنقل"><a href=".">سلاسل المشايخ</a> ‹ <a href="sheikh.html?s='+encodeURIComponent(shSlug)+'">'+esc(d.sheikh)+'</a> ‹ '+esc(d.title)+'</nav>';
  h+='<div class="hero cin"><h1><bdi>'+esc(d.title)+'</bdi></h1><div class="meta">'
    +(row?statChip('read',row.rdn,row.rtt,row.rOk):'')
    +(row&&row.wan?statChip('listen',row.wan,row.rtt,row.wOk):'')
    +(d.playlist?'<a href="'+esc(d.playlist)+'" target="_blank" rel="noopener">قائمة يوتيوب ↗</a>':'')
    +'</div><div class="acts">'
    +(row?'<a class="rd" href="'+esc(row.read)+'">'+I.read+' اقرأ التفريغ</a>':'')
    +'</div><input class="sflt" id="sflt" type="search" aria-label="ابحث في دروس السلسلة" placeholder="ابحث في دروس السلسلة…"></div><div id="lst" aria-live="polite"></div>';
  app.innerHTML=h;
  const draw=q=>{
    const lst=document.getElementById('lst');let n=0;
    lst.innerHTML='';
    for(const l of visible){
      if(q&&!normalize(l.title).includes(q)&&!String(l.n).includes(q))continue;n++;
      const a=document.createElement('a');a.className='ls cin';
      a.href='lesson.html?s='+encodeURIComponent(slug)+'&l='+l.n;
      let bd='';
      if(aln.has(l.n))bd+=I.listen;
      if(txn.has(l.n))bd+=I.read;
      a.innerHTML='<span class="num">'+l.n+'</span><span class="t"><bdi>'+esc(l.title)+'</bdi>'+(l.dur?'<span style="display:block;color:var(--dim);font-size:var(--fs-xs)">'+esc(l.dur)+'</span>':'')+'</span><span class="bd">'+bd+'</span>';
      lst.appendChild(a);
    }
    if(!n)lst.innerHTML='<p class="empty">لا نتائج.</p>';
  };
  draw('');
  document.getElementById('sflt').addEventListener('input',e=>draw(normalize(e.target.value)));
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
