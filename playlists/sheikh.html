<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — سلاسل</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل المشايخ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="common.css?v=11">
<link rel="stylesheet" href="ui.css?v=12">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 24px}
.hero{display:flex;align-items:center;gap:16px}
.hero .ph{width:96px;height:96px;min-width:96px;border-radius:50%;background:var(--bg-2);
  border:2px solid var(--gold-1);display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;font-family:var(--font-ar);font-size:2rem;font-weight:700;color:var(--gold-3);flex:none}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero .stats{display:flex;gap:24px;margin-top:10px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--bg-2);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-xs);
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold-2);color:var(--bg-0);border-color:var(--gold-2)}
.acts{display:flex;gap:10px;margin-top:12px;justify-content:center}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:60px;height:60px;border-radius:var(--r-md);border:1px solid var(--line-2);
  background:var(--bg-2);text-decoration:none;padding:5px;transition:border-color var(--t-fast) var(--ease)}
.tile .i{width:1.25em;height:1.25em}
.tile b{font-size:var(--fs-sm);font-weight:700}
.tile.rd{color:var(--gold-3)}.tile.lsn{color:var(--violet)}.tile.sm{color:#4fb3c9}.tile.yt{color:#e05a4f}.tile.qu{color:#8fb3e0}
.tile.fv{color:var(--ink-3);cursor:pointer;font-family:var(--font-ui)}
.tile.fv.on{color:var(--gold-3);background:rgba(201,162,75,.12)}
.tile.ok{border-color:rgba(70,201,109,.6);box-shadow:inset 0 0 0 1px rgba(70,201,109,.22)}
.tile.off{opacity:.32}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-1);
  margin:0 calc(-1*var(--sp-4)) calc(-1*var(--sp-4));border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden}
.tgrid .tile{width:auto;height:66px;border:0;border-radius:0;box-shadow:inset 0 0 0 .5px var(--line-2)}
.tgrid button.tile{border:0;border-radius:0;font:inherit}
.tgrid .tile .i{width:22px;height:22px}
.tgrid .tile b{font-size:.95rem}
.tgrid .tile.ok{box-shadow:inset 0 0 0 .5px var(--line-2),inset 0 0 0 2px rgba(70,201,109,.75)}
.tgrid.fbar{margin:12px 0 0;border:1px solid var(--line-1);border-radius:var(--r-lg);grid-template-columns:repeat(7,minmax(44px,1fr));overflow:hidden}
.ftile{cursor:pointer;position:relative}
.ftile.sel{border-color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-2)}
.ftile.sel::after{content:'';position:absolute;top:4px;inset-inline-start:5px;width:12px;height:12px;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 5.5 9.5 16 4 10.5" fill="none" stroke="%2370c96d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  background-size:contain;background-repeat:no-repeat}
.fbar{margin-top:12px}
@media(hover:hover){a.tile:hover,.ftile:hover{border-color:var(--gold-2)}}
.u-sr .srow{display:flex;align-items:center;gap:10px;padding:0 12px}
.u-sr .t{flex:1;min-width:0;text-align:center}
.u-sr .sn{flex:none;display:flex;gap:6px;direction:ltr}
.u-sr .sn .n{font-style:normal;color:var(--ink-3);font-size:.85rem;font-weight:700;font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.mvok{display:inline-block;flex:none;margin-inline-start:6px;padding:1px 7px;border-radius:999px;background:var(--gold-2);color:#141414;font-size:.72rem;font-weight:800;vertical-align:2px}
.u-sr .sn .n.ok{color:var(--green)}
.u-sr .sn .sep{color:var(--ink-3);font-size:.7rem}
.shn{font-size:1.3rem;font-weight:800;line-height:1.4;margin:0}.shs{color:var(--ink-3);font-size:var(--fs-xs);margin-top:4px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-2);font:inherit;font-size:var(--fs-xs);cursor:pointer}
.fc .i{width:15px;height:15px}.fc b{color:var(--ink-3);font-weight:600}.fc.on{border-color:var(--gold-2);color:var(--gold-3);background:rgba(201,162,75,.12)}
.sr{display:flex;flex-direction:column;gap:6px;padding:14px 16px;margin-top:8px;border-radius:var(--r-md);border:1px solid var(--line-1);
  background:linear-gradient(160deg,var(--card),var(--bg-2));color:var(--txt);text-decoration:none}
@media(hover:hover){.sr:hover{border-color:var(--gold-2)}}
.sr-t{font-size:var(--fs-md);font-weight:700;line-height:1.55}
.sr-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--ink-3);font-size:.74rem}
.sr-m i{font-style:normal;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}.sr-m .i{width:14px;height:14px}
.a-rd{color:var(--gold-3)}.a-lsn{color:var(--violet)}.a-sm{color:#4fb3c9}.a-qu{color:#8fb3e0}.a-fav{color:var(--gold-3)}
.sr-p{height:3px;border-radius:3px;background:var(--line-1);overflow:hidden}.sr-p i{display:block;height:100%;background:var(--green)}
.sr-c{display:flex;justify-content:space-between;font-size:.72rem;color:var(--green)}.sr-c small{color:var(--ink-3)}
@media(min-width:720px){#srows{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">سلاسل</span>
  <span style="color:var(--ink-3);font-size:var(--fs-xs)" id="hdr-sub">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div id="crumb"></div>
  <div id="body"><div class="skel" style="height:140px;margin-top:10px;border-radius:18px"></div><div class="skel" style="height:300px;margin-top:12px;border-radius:18px"></div></div>
</div></main>
<script src="common.js?v=11"></script>
<script>
let flt=new Set();
let _rows=[],_slug='',_st=null,_mig={};
const ic=id=>'<svg class="i"><use href="icons.svg?v=12#'+id+'"/></svg>';
const FCOUNT={rd:r=>r.rdn||0,yt:r=>r.ytn||0,lsn:r=>r.wan||0,qu:r=>r.qn||0,aud:r=>(r.ytn||0)+(r.aun||0),fav:r=>store.fav(r.id)?1:0,sm:r=>r.sun||0};
const FALABEL={rd:'قراءة',yt:'يوتيوب',lsn:'مشاهدة حية',qu:'أسئلة',aud:'استماع',fav:'مفضلة',sm:'تلخيص'};
function rowMatch(r){
  for(const k of flt)if(!FCOUNT[k](r))return false;
  return true;
}
const FMODE={rd:'read',yt:'yt',lsn:'listen',qu:'qu',aud:'aud',sm:'sm'};
function activeMode(){for(const k of ['rd','yt','lsn','sm','qu','aud'])if(flt.has(k))return FMODE[k];return''}
const FIC={rd:'i-read',yt:'i-yt',lsn:'i-watch',qu:'i-qu',aud:'i-audio',sm:'i-list',fav:'i-star'};
const lessonsOf=r=>Math.max(r.ytn||0,r.wtt||0,r.rtt||0,r.rdn||0);
function seenIn(r){const p=r.id+':';let n=0;for(const k of store.seenList())if(k.startsWith(p))n++;return n}
function renderSeries(){
  const w=document.getElementById('srows');if(!w)return;
  const fq=normalize((document.getElementById('sq')||{}).value||'');
  let rows=_rows.filter(r=>rowMatch(r)&&(!fq||normalize(r.title).includes(fq)));
  const hist=(store.get('hist',[])||[]);
  rows.sort((a,b)=>{const ha=hist.findIndex(h=>h.r===a.id),hb=hist.findIndex(h=>h.r===b.id);
    if((ha>=0)!==(hb>=0))return ha>=0?-1:1;if(ha>=0)return ha-hb;
    if(flt.size){let d=0;for(const k of flt)d+=FCOUNT[k](b)-FCOUNT[k](a);if(d)return d}return 0});
  w.innerHTML=rows.map(r=>{
    const L=lessonsOf(r),sn=seenIn(r),h=hist.find(x=>x.r===r.id);
    const av=[['rd',r.rdn],['lsn',r.wan],['sm',r.sun],['qu',r.qn]].filter(x=>x[1]).map(([k,n])=>'<i class="a-'+k+'" title="'+FALABEL[k]+'">'+ic(FIC[k])+n+'</i>').join('');
    return '<a class="sr cin" href="row.html?r='+encodeURIComponent(r.id)+'">'
      +'<span class="sr-t"><bdi>'+esc(r.title)+'</bdi>'+(_mig[r.id]&&_mig[r.id].done?'<i class="mvok" title="نُقلت كاملة إلى إرث">✓ منقولة</i>':'')+'</span>'
      +'<span class="sr-m"><span>'+pluralLesson(L)+'</span>'+av+(store.fav(r.id)?'<i class="a-fav">'+ic('i-star')+'</i>':'')+'</span>'
      +(sn?'<span class="sr-p"><i style="width:'+Math.min(100,Math.round(sn/Math.max(1,L)*100))+'%"></i></span><span class="sr-c">'+(h?'تابع الدرس '+h.n:'')+'<small>شاهدت '+sn+' من '+L+'</small></span>':'')
      +'</a>'}).join('')||'<div class="empty">'+(flt.has('fav')?'لا سلاسل مفضلة بعد — اضغط ☆ في صفحة السلسلة':'لا نتائج')+'</div>';
}
function renderHero(){
  const st=_st;if(!st)return;
  const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
  const L=_rows.reduce((a,r)=>a+lessonsOf(r),0);
  const keys=['rd','lsn','sm','qu','fav'].filter(k=>_rows.some(r=>FCOUNT[k](r)));
  let h='<div class="hero cin"><span class="ph">'
    +(st.photo?'<img src="'+esc(st.photo)+'" alt="" onerror="this.remove()">':'')+'<span>'+init+'</span></span>'
    +'<div style="min-width:0"><h1 class="shn">'+esc(st.name)+'</h1>'
    +'<div class="shs">'+pluralSeries(_rows.length)+' · '+kfmt(L)+' درس</div></div></div>'
    +(_rows.length>6?'<input class="sflt" id="sq" type="search" placeholder="ابحث في سلاسل '+esc(st.name)+'…" aria-label="ابحث في السلاسل">':'')
    +'<div class="fchips" role="toolbar" aria-label="تصفية">'
    +'<button class="fc'+(flt.size?'':' on')+'" data-k="">الكل <b>'+_rows.length+'</b></button>'
    +keys.map(k=>{const c=_rows.filter(r=>FCOUNT[k](r)).length;
      return '<button class="fc'+(flt.has(k)?' on':'')+'" data-k="'+k+'">'+ic(FIC[k])+FALABEL[k]+' <b>'+c+'</b></button>'}).join('')+'</div>';
  const el=document.getElementById('hero');if(el)el.innerHTML=h;
  const sq=document.getElementById('sq');if(sq)sq.oninput=renderSeries;
  document.querySelectorAll('.fchips .fc').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(!k)flt.clear();else{const on=flt.has(k);flt.clear();if(!on)flt.add(k)}
    document.querySelectorAll('.fchips .fc').forEach(c=>c.classList.toggle('on',c.dataset.k?flt.has(c.dataset.k):!flt.size));renderSeries()});
}
(async()=>{
  const q=new URLSearchParams(location.search);
  _slug=q.get('s')||'';
  const stats=await j('data/sheikh_stats.json');
  try{const mj=await j('data/migration.json');_mig=(mj&&mj.rows)||{}}catch(e){_mig={}}
  const B=document.getElementById('body');
  const st=stats&&stats[_slug];_st=st;
  if(!st){B.innerHTML='<div class="errbox">لم يُعثر على الشيخ المطلوب — <a href=".">عودة للقائمة</a></div>';return}
  _rows=st.rows||[];
  document.title=st.name+' — سلاسل المشايخ';
  document.getElementById('hdr-sub').textContent=st.name;
  B.innerHTML='<div id="hero"></div><div id="srows" style="margin-top:14px"></div>';
  const fq=(q.get('f')||'').split(',').filter(k=>FCOUNT[k]);
  fq.forEach(k=>flt.add(k));
  renderHero();renderSeries();
})();
if('serviceWorker' in navigator)swRegister('../sw.js');
</script>
</body>
</html>
