<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بطاقة الشيخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:8px}
.hero .ph{width:96px;height:96px;min-width:96px;border-radius:50%;background:var(--skel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:2rem;font-weight:700;color:var(--acc2)}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{font-family:var(--font-ar);font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .als{color:var(--dim);font-size:.78rem;margin-top:5px}
.hero .grp{display:inline-block;margin-top:8px;font-size:.7rem;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:3px 12px}
.pb{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--bg);margin-top:12px;border:1px solid var(--border)}
.pb i{display:block;height:100%}
.pb .d{background:var(--acc)}.pb .a{background:var(--acc3)}.pb .p{background:#8a6d1a}
.pb .b{background:#c0392b}.pb .z{background:#3a4a8a}.pb .h{background:#444;opacity:.5}
.lgnd{display:flex;gap:10px;flex-wrap:wrap;font-size:.62rem;color:var(--dim);margin-top:6px}
.lgnd span::before{content:'●';margin-left:3px}
.lgnd .d::before{color:var(--acc)}.lgnd .a::before{color:var(--acc3)}.lgnd .p::before{color:#8a6d1a}
.lgnd .b::before{color:#c0392b}.lgnd .z::before{color:#3a4a8a}.lgnd .h::before{color:#666}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.sec h2{font-family:var(--font-ar);font-size:1.05rem;font-weight:700;color:var(--acc2);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--border)}
.lnk{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-md);text-decoration:none;color:var(--txt);margin-bottom:8px;transition:border-color .15s}
.lnk:hover{border-color:var(--acc)}
.lnk .ic{width:34px;height:34px;min-width:34px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--acc2);font-size:.95rem}
.lnk .av{width:56px;height:56px;min-width:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--skel)}
.lnk .vbadge{width:18px;height:18px;flex:none;color:var(--dim)}
.lnk .vbadge svg{width:100%;height:100%;display:block}
.lnk .yts{min-width:26px;display:flex;align-items:center;justify-content:center;color:var(--acc2)}
.lnk .yts svg{width:20px;height:20px;display:block}
.lnk .t{flex:1;font-size:.88rem}
.lnk .d{display:block;font-size:.68rem;color:var(--dim);margin-top:2px}
.lnk .arw{color:var(--dim);font-size:.8rem}
.empty{color:var(--dim);font-size:.8rem;padding:8px 0}
.notes{color:var(--txt);font-size:.85rem;line-height:1.8}
.st{display:inline-block;font-size:.68rem;padding:3px 12px;border-radius:99px;border:1px solid var(--border);color:var(--dim)}
.st.pending{border-color:var(--acc);color:var(--acc2)}
/* ── helm ── */
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-family:var(--font-ui);font-size:.7rem;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.ser{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;margin-bottom:7px;background:var(--card2)}
.ser.paused{opacity:.55;border-color:#3a4a8a}
.ser.held{opacity:.45;border-style:dashed}
.ser .nm{flex:1;min-width:0;font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser .nm small{display:block;font-size:.64rem;color:var(--dim);font-weight:400;margin-top:2px}
.ser .cnt{font-size:.66rem;color:var(--dim);white-space:nowrap}
.cnt b{font-size:.78rem;color:var(--txt)}
.cnt .act{color:var(--acc3)}.cnt .bad{color:#c0392b}.cnt .don{color:var(--acc)}
.ser .icrow{display:flex;gap:14px;align-items:center;white-space:nowrap}
.ser .ic{display:flex;flex-direction:column;align-items:center;line-height:1}
.ser .ic i{font-style:normal;font-size:1.2rem;color:var(--acc2)}
.ser .ic i svg{width:1.2rem;height:1.2rem;display:block}
.ser .ic b{font-size:.95rem;font-weight:700;color:var(--txt);margin-top:2px}
.ser .ic .ok{font-style:normal;color:#3ecf8e;font-size:.75rem;margin-top:1px}
.btn{min-width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;transition:border-color .15s;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.off{border-color:#c0392b;color:#c0392b}
.btn.on{border-color:var(--acc3);color:var(--acc3)}
.btn.pause{border-color:#3a4a8a;color:#5a7ad0}
.btn.retry{border-color:#8a6d1a;color:#c9a227}
.btn.enq{border-color:var(--acc);color:var(--acc)}
.btn.read{border-color:var(--acc2);color:var(--acc2)}
.btn.play{border-color:var(--acc3);color:var(--acc3)}
#save{position:fixed;bottom:16px;right:16px;left:16px;max-width:1068px;margin:0 auto;height:48px;border-radius:var(--r-md);border:none;background:var(--acc);color:var(--bg);font-family:var(--font-ui);font-size:.95rem;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);display:none;z-index:50}
#save.show{display:block}
#toast{position:fixed;top:18px;right:50%;transform:translateX(50%);background:var(--card2);border:1px solid var(--acc);color:var(--txt);font-size:.78rem;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1}
#toast.err{border-color:#c0392b;color:#ffb0a0}
.btn svg{width:13px;height:13px;display:block}
@media(max-width:640px){.ser{flex-wrap:wrap}.ser .nm{flex:1 1 100%}.ser .icrow{gap:20px}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span style="color:var(--dim);font-size:.8rem" id="hdr-sub">بطاقة الشيخ</span>
</div></header>
<main><div class="wrap">
  <div id="body"><div class="empty">جارٍ التحميل…</div></div>
</div></main>
<button id="save" style="display:none">حفظ — يُطبَّق على الطابور خلال دقيقة</button>
<div id="toast"></div>
<script>
const NT='https://ntfy.sh/des_helm_q7';
const MUT='https://medmrf-10.github.io/des/mutalaa/';
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function norm(s){return (s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
let fv='all';
let _rows=[];
function toast(t,err){const e=document.getElementById('toast');e.textContent=t;e.className='show'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function pretty(k){return k.replace(/^\d+_?/,'')}
function tot(x){return Math.max(x.total,x.done+x.pending+x.bad)}

const ICON={
 up:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3l5 6H3z"/></svg>',
 dn:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 13L3 7h10z"/></svg>',
 pz:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="4" height="10" rx="1"/><rect x="9" y="3" width="4" height="10" rx="1"/></svg>',
 play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 3l9 5-9 5z"/></svg>',
 x:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.2" fill="none"/></svg>',
 rt:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2v3h-3" fill="none"/></svg>',
 add:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 2v12M2 8h12"/></svg>',
 dl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M4.5 7 8 10.5 11.5 7"/><path d="M3 13.5h10"/></svg>',
 undl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M4.5 7 8 10.5 11.5 7"/><path d="M3 13.5h10"/><path d="M2 3l12 12" stroke="#e74c3c"/></svg>',
 back:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3 2.5 7 6 11"/><path d="M3 7h7a4 4 0 0 1 0 8h-1"/></svg>',
 book:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h7l3 3v9H3z"/><path d="M10 2v3h3"/></svg>'
};

const FILT={all:'الكل',listen:'يُسمع',read:'يُقرأ'};
function rowMatch(r){
  if(fv==='listen')return r.wan>0;
  if(fv==='read')return (r.rdn>0||r.wan>0);
  return true;
}
function rLink(r){
  if(r.kind==='mut'&&r.mutId!=null)return `tr.html?id=${encodeURIComponent(r.mutId)}`;
  if(r.kind==='tr')return `tr.html?sh=${encodeURIComponent(r.trSh)}&s=${encodeURIComponent(r.trSr)}`;
  if(r.sSlug)return `series.html?s=${encodeURIComponent(r.sSlug)}`;
  if(r.trSh)return `tr.html?sh=${encodeURIComponent(r.trSh)}&s=${encodeURIComponent(r.trSr)}`;
  return null;
}
const CHK='<svg viewBox="0 0 16 16" fill="currentColor" style="width:.8em;height:.8em"><path d="M13.8 3.2 6.2 10.8 2.6 7.2l-1.4 1.4 5 5 9-9z"/></svg>';
function renderSeries(){
  const w=document.getElementById('srows');if(!w)return;
  w.innerHTML='';
  const rows=_rows.filter(rowMatch).sort((a,b)=>{
    const wa=a.wan>0?0:1,wb=b.wan>0?0:1;
    if(wa!==wb)return wa-wb;
    return (a.title||'').localeCompare(b.title||'','ar');
  });
  for(const r of rows){
    const d=document.createElement('div');d.className='ser';
    const rdone=r.rtt>0&&r.rdn>=r.rtt, wdone=r.wtt>0&&r.wan>=r.wtt;
    let nums='';
    if(r.rdn>0)nums+=`<span class="ic"><i>${ICON.book}</i><b>${r.rdn}</b>${rdone?'<em class="ok">'+CHK+'</em>':''}</span>`;
    if(r.wan>0)nums+=`<span class="ic"><i>${ICON.play}</i><b>${r.wan}</b>${wdone?'<em class="ok">'+CHK+'</em>':''}</span>`;
    let links='';
    const rl=rLink(r);
    if(r.wan>0&&r.sSlug)links+=`<a class="btn play" href="series.html?s=${encodeURIComponent(r.sSlug)}" title="استمع/تصفح الدروس">${ICON.play}</a>`;
    if(rl)links+=`<a class="btn read" href="${rl}" title="اقرأ التفريغ">${ICON.book}</a>`;
    d.innerHTML=`<span class="nm">${esc(r.title)}</span>
      <span class="icrow">${nums}</span>${links}`;
    w.appendChild(d);
  }
  if(!rows.length)w.innerHTML='<div class="empty">لا سلاسل في هذا القسم.</div>';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('chip')){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===t));fv=t.dataset.f;renderSeries();return}
});
(async()=>{
  const slug=new URLSearchParams(location.search).get('s')||'';
  const bust='?v='+Date.now();
  const [data,photos,chs,stats]=await Promise.all([
    j('data/sheikhs.json'),j('photos.json'),j('channels.json'),j('data/sheikh_stats.json'+bust)]);
  const sh=data&&data.sheikhs?data.sheikhs.find(x=>x.slug===slug):null;
  const B=document.getElementById('body');
  if(!sh){B.innerHTML='<div class="empty">لم يُعثر على الشيخ المطلوب. <a href="." style="color:var(--acc2)">عودة للقائمة</a></div>';return}
  document.title=sh.name_display+' — hawchat';
  document.getElementById('hdr-sub').textContent=sh.name_display;
  const nset=new Set([sh.name_display,sh.name,...(sh.aliases||[])].flatMap(x=>[x,norm(x)]));
  const photo=(photos&&(photos[sh.name_display]||photos[sh.name]||photos[norm(sh.name_display)]))||sh.photo;
  const init=(sh.name_display||sh.name).replace(/^ال/,'').trim()[0]||'؟';
  // two states only — same truth file the index cards read
  const st=(stats&&stats[slug])||{rows:[],read:0,watch:0,nRead:0,nWatch:0};
  _rows=st.rows||[];
  const nRead=st.nRead||0,nWatch=st.nWatch||0;
  let h='<div class="hero cin"><div class="ph">'+(photo?'<img src="'+esc(photo)+'" alt="" onerror="this.remove()">':'')+'<span>'+esc(init)+'</span></div>'
    +'<div style="flex:1"><h1>'+esc(sh.name_display)+'</h1>'
    +(sh.name!==sh.name_display?'<div class="als">'+esc(sh.name)+'</div>':'')
    +((sh.aliases&&sh.aliases.length)?'<div class="als">'+sh.aliases.map(esc).join('، ')+'</div>':'')
    +'<span class="grp">'+_rows.length+' سلسلة · '+(st.read||0)+' يُقرأ · '+(st.watch||0)+' يُسمع</span>'
    +'</div></div>';
  const YT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.85-.46-5.58a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.15 1 12 1 12s0 3.85.46 5.58a2.78 2.78 0 0 0 1.94 2c1.72.42 8.6.42 8.6.42s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.85 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5-6-3.5z"/></svg>';
  const VCHK='<span class="vbadge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9.2 4.6l-4.1-.2-.2 4.1L2.4 11.3l2.5 2.8.2 4.1 4.1-.2L12 20.6l2.8-2.5 4.1.2.2-4.1 4.1.2z"/><path d="M10.6 15.2 7.6 12.2l1.3-1.3 1.7 1.7 4.5-4.5 1.3 1.3z" fill="#0b0f1a"/></svg></span>';
  h+='<div class="sec cin"><h2>السلاسل — التفريغ والمحاذاة</h2>'
    +'<div class="fbar">'+Object.entries(FILT).map(([k,v])=>{
      const n=k==='all'?_rows.length:_rows.filter(r=>{const sv=fv;fv=k;const m=rowMatch(r);fv=sv;return m}).length;
      return '<button class="chip'+(k==='all'?' on':'')+'" data-f="'+k+'">'+v+' <i style="font-style:normal;opacity:.7">'+n+'</i></button>'}).join('')+'</div>'
    +'<div id="srows"></div></div>';
  if(sh.notes)h+='<div class="sec cin"><h2>ملاحظات</h2><div class="notes">'+esc(sh.notes)+'</div></div>';
  B.innerHTML=h;
  renderSeries();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
