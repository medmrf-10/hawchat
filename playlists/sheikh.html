<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلاسل المشايخ — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:10px}
.hero .ph{width:96px;height:96px;min-width:96px;border-radius:50%;background:var(--skel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:2rem;font-weight:700;color:var(--acc2)}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.hero h1{font-family:var(--font-ui);font-size:var(--fs-xl);font-weight:700;color:var(--txt);margin:0}
.hero .icrow{display:flex;gap:22px;margin-top:12px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.sec h2{font-family:var(--font-ui);font-size:var(--fs-lg);font-weight:700;color:var(--txt);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--border)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.ser{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm st" "nm st";align-items:center;gap:4px 12px;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:8px;background:var(--card2);text-decoration:none;color:var(--txt);min-height:52px}
@media(hover:hover){.ser:hover{border-color:var(--acc)}}
.ser .nm{grid-area:nm;font-size:var(--fs-sm);font-weight:600;line-height:1.5}
.ser .nm small{display:block;font-size:var(--fs-xs);color:var(--dim);font-weight:400;margin-top:2px}
.ser .icrow{grid-area:st;display:flex;gap:16px;align-items:center}
.ser .lbtn{grid-area:st;justify-self:end;min-height:44px;padding:0 12px;border:1px solid var(--listen);color:var(--listen);border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.swrap{display:block}
@media(max-width:640px){.ser{grid-template-columns:1fr;grid-template-areas:"nm" "st"}.ser .icrow{justify-content:flex-start}}
.notes{color:var(--txt);font-size:var(--fs-sm);line-height:1.8}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." class="btn" aria-label="سلاسل المشايخ" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span style="color:var(--dim);font-size:var(--fs-xs)" id="hdr-sub">سلاسل المشايخ</span>
</div></header>
<main><div class="wrap">
  <div id="crumb"></div>
  <div id="body"><div class="skel" style="height:120px;margin-top:10px"></div><div class="skel" style="height:300px;margin-top:12px"></div></div>
</div></main>
<script src="common.js"></script>
<script>
let fv=new URLSearchParams(location.search).get('f')||'all';
let _rows=[],_slug='';
function rowMatch(r){
  if(fv==='listen')return r.wan>0;
  if(fv==='done')return r.rOk||(r.wtt&&r.wOk);
  return true;
}
function renderSeries(){
  const w=document.getElementById('srows');if(!w)return;
  w.innerHTML='';
  const rows=_rows.filter(rowMatch);
  for(const r of rows){
    const a=document.createElement('a');a.className='ser';a.href=r.read;
    a.setAttribute('aria-label',r.title+' — يُقرأ');
    let st=statChip('read',r.rdn,r.rtt,r.rOk);
    if(r.wan>0)st+=statChip('listen',r.wan,r.wtt,r.wOk);
    a.innerHTML='<span class="nm"><bdi>'+esc(r.title)+'</bdi></span><span class="icrow">'+st+(r.listen?'<span class="lbtn" data-l="'+r.listen+'">'+I.listen+' استمع</span>':'')+'</span>';
    w.appendChild(a);
  }
  if(!rows.length)w.innerHTML='<div class="empty">لا سلاسل في هذا القسم.</div>';
}
document.addEventListener('click',e=>{
  const lb=e.target.closest('.lbtn');
  if(lb){e.preventDefault();e.stopPropagation();location.href=lb.dataset.l;return}
  const t=e.target.closest('.chip');if(!t)return;
  document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-pressed',x===t?'true':'false')});
  fv=t.dataset.f;
  const u=new URL(location);u.searchParams.set('f',fv);history.replaceState(null,'',u);
  renderSeries();
});
(async()=>{
  const q=new URLSearchParams(location.search);
  _slug=q.get('s')||'';
  const stats=await j('data/sheikh_stats.json');
  const B=document.getElementById('body');
  const st=stats&&stats[_slug];
  if(!st){B.innerHTML='<div class="errbox">لم يُعثر على الشيخ المطلوب — <a href=".">عودة للقائمة</a></div>';return}
  _rows=st.rows||[];
  document.title=st.name+' — سلاسل المشايخ';
  document.getElementById('hdr-sub').textContent=st.name;
  document.getElementById('crumb').innerHTML=hdr(null,[{h:'.',t:'سلاسل المشايخ'},{t:st.name}]);
  const init=(st.name||'؟').replace(/^ال/,'').trim()[0]||'؟';
  const photo=st.photo?String(st.photo).replace(/^\/+/,''):null;
  let h='<div class="hero cin"><div class="ph">'+(photo?'<img src="'+esc(photo)+'" alt="" onerror="this.remove()">':'')+'<span>'+esc(init)+'</span></div>'
    +'<div style="flex:1"><h1>'+esc(st.name)+'</h1>'
    +'<div class="icrow">'+(st.read?statChip('read',st.read,Math.max(st.read,maxR(_rows)),_rows.every(r=>r.rOk)):'')+(st.watch?statChip('listen',st.watch,st.watch,_rows.every(r=>!r.wtt||r.wOk)):'')
    +'<span style="font-size:var(--fs-xs);color:var(--dim);align-self:end">'+pluralSeries(st.nSeries)+'</span></div>'
    +'</div></div>';
  h+='<div class="sec cin"><h2>السلاسل</h2><div class="fbar" role="radiogroup">'
    +[['all','الكل',_rows.length],['listen','يُسمع',_rows.filter(r=>r.wan>0).length],['done','مكتملة',_rows.filter(r=>r.rOk||(r.wtt&&r.wOk)).length]]
      .map(([k,v,n])=>'<button class="chip'+(fv===k?' on':'')+'" data-f="'+k+'" aria-pressed="'+(fv===k)+'">'+v+' <i style="font-style:normal;opacity:.7">'+n+'</i></button>').join('')+'</div>'
    +'<div id="srows" class="swrap"></div></div>';
  B.innerHTML=h;
  renderSeries();
})();
function maxR(rows){let m=0;for(const r of rows)m=Math.max(m,r.rtt||0);return m}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
