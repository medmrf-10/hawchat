<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دخول — سلاسل المشايخ</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="theme.css?v=9">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--txt);font-family:var(--font-ui)}
.box{width:min(360px,88vw);background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line-1);border-radius:18px;padding:32px 26px;text-align:center;box-shadow:var(--e-3)}
.box img{border-radius:12px;margin-bottom:14px}
h1{font-size:1.1rem;margin:0 0 6px;color:var(--gold-3)}
p{font-size:.85rem;color:var(--ink-3);margin:0 0 18px}
input{width:100%;height:48px;box-sizing:border-box;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:10px;color:var(--txt);padding:0 14px;font-family:inherit;font-size:1rem;text-align:center}
input:focus{outline:none;border-color:var(--gold-2)}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:10px;cursor:pointer;
  background:var(--gold-2);color:var(--bg-0);font-family:inherit;font-weight:700;font-size:1rem}
.err{color:var(--red);font-size:.8rem;min-height:1.2em;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f">
  <img src="icons/icon-192.png" alt="" width="56" height="56">
  <h1>سلاسل المشايخ</h1>
  <p>هذا الموقع خاص — أدخل كلمة السر للمتابعة</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" autofocus>
  <button type="submit">دخول</button>
  <div class="err" id="e"></div>
</form>
<script>
const EXPECTED='afc60dd739ae426702948b1d112f5a0c7c28e9d639d5abb9548a8e34c3153112';
const SALT='hawchat-gate-v1:';
async function h(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  const d=await h(SALT+pw);
  if(d===EXPECTED){localStorage.setItem('hwk','1');
    const b=new URLSearchParams(location.search).get('b');
    location.replace(b||'index.html');
  }else{document.getElementById('e').textContent='كلمة السر غير صحيحة';document.getElementById('pw').select()}
};
</script>
</body>
</html>
