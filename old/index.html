<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>old — hawshat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:46px}
.srch input{flex:1;min-width:0;background:none;border:none;color:var(--txt);font-family:inherit;font-size:.95rem;outline:none}
.srch svg{color:var(--dim);flex:none}
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:6px 2px}
.gh h2{font-family:var(--font-ar);font-size:1.15rem;color:var(--acc2);margin:0}
.gh .cnt{font-size:.68rem;color:var(--dim);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:2px 10px}
.gh .arrow{color:var(--dim);font-size:.8rem;transition:transform .2s;margin-inline-start:auto}
.grp.open .gh .arrow{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:10px 0 4px}
.grp:not(.open) .grid{display:none}
.it{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;display:block;text-decoration:none;transition:border-color .15s,transform .15s;animation:cin .3s both}
.it:hover{border-color:var(--acc);transform:translateY(-2px)}
.it .n{font-weight:600;font-size:.88rem;color:var(--txt);display:flex;align-items:center;gap:8px}
.it .n .i{font-family:var(--font-ar);color:var(--acc2);font-size:1rem}
.it .d{font-size:.72rem;color:var(--dim);margin-top:3px;line-height:1.5}
.major{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.mj{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;text-decoration:none;transition:border-color .15s,transform .15s}
.mj:hover{border-color:var(--acc);transform:translateY(-2px)}
.mj .n{font-family:var(--font-ar);font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.mj .d{font-size:.75rem;color:var(--dim);margin-top:4px}
.back{color:var(--acc2);text-decoration:none;font-size:.8rem;border:1px solid var(--border);border-radius:99px;padding:6px 14px;background:var(--card)}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">old</span>
  <a class="back" href="../">← hawshat</a>
</div></header>
<div class="wrap">
  <div class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="ابحث في المواقع السابقة…"></div>
  <div class="major" id="major"></div>
  <div id="groups"></div>
</div>
<script>
const DES='https://medmrf-10.github.io/des/';
const MAJOR=[
 {n:'portal',d:'البوابة الرئيسية للمنظومة',u:'https://medmrf-10.github.io/des/portal/'},
 {n:'manzuma',d:'لوحة التعلم الرئيسية',u:'https://medmrf-10.github.io/manzuma/'},
 {n:'durus',d:'مكتبة الدروس والسلاسل',u:'https://medmrf-10.github.io/des/durus/'},
 {n:'majlis',d:'مجلس — تفسير وحديث وعلوم ودروس',u:'https://medmrf-10.github.io/des/majlis/'},
 {n:'shami',d:'تصفح كتب الشامي وشروحها',u:'https://medmrf-10.github.io/des/shami/'},
 {n:'fihris',d:'الفهرس العام للمنظومة',u:'https://medmrf-10.github.io/des/fihris/'},
 {n:'mutalaa',d:'قارئ التفريغات',u:'https://medmrf-10.github.io/des/mutalaa/'},
 {n:'tafrigh',d:'مِفرَغ — تتبّع التفريغ',u:'https://medmrf-10.github.io/des/tafrigh/'},
];
document.getElementById('major').innerHTML=MAJOR.map(m=>`<a class="mj cin" href="${m.u}" target="_blank" rel="noopener"><div class="n">${m.n}</div><div class="d">${m.d}</div></a>`).join('');
const res=u=>u.startsWith('http')?u:DES+u.replace(/^\.\.\//,'').replace(/^\.\//,'');
fetch('catalog.json').then(r=>r.json()).then(G=>{
  window._G=G;render('');
});
function render(q){
  q=q.trim();
  const host=document.getElementById('groups');
  host.innerHTML='';
  for(const[g,items]of Object.entries(window._G)){
    const f=q?items.filter(e=>(e.n+e.d).includes(q)):items;
    if(!f.length)continue;
    const div=document.createElement('div');div.className='grp'+(q?' open':'');
    div.innerHTML=`<div class="gh"><h2>${g}</h2><span class="cnt">${f.length}</span><span class="arrow">◀</span></div><div class="grid">${f.map(e=>`<a class="it" href="${res(e.u)}" target="_blank" rel="noopener"><div class="n"><span class="i">${e.i||'·'}</span>${e.n}</div><div class="d">${e.d||''}</div></a>`).join('')}</div>`;
    div.querySelector('.gh').onclick=()=>div.classList.toggle('open');
    host.appendChild(div);
  }
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
