<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/favicon-180.png">
<link rel="stylesheet" href="theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="hd"><div class="hd-in">
  <img src="icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
</div></header>
<main id="app"><div class="wrap" style="max-width:1100px;margin:0 auto;padding:16px">
  <a href="old/" style="display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;text-decoration:none;transition:border-color .15s,transform .15s" onmouseover="this.style.borderColor='var(--acc)'" onmouseout="this.style.borderColor='var(--border)'">
    <div style="font-family:var(--font-ar);font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">old</div>
    <div style="font-size:.8rem;color:var(--dim);margin-top:4px">كل مواقع المنظومة السابقة — 1,913 موقعاً وأداة</div>
  </a>
  <a href="playlists/" style="display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;text-decoration:none;transition:border-color .15s,transform .15s;margin-top:12px" onmouseover="this.style.borderColor='var(--acc)'" onmouseout="this.style.borderColor='var(--border)'">
    <div style="font-family:var(--font-ar);font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">الشيوخ والسلاسل</div>
    <div style="font-size:.8rem;color:var(--dim);margin-top:4px">بطاقات المشايخ وسلاسلهم — تفريغ ومحاذاة ودفة قيادة</div>
  </a>
</div></main>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
