name: hawshat-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inline-script syntax check (node --check)
        run: python3 scripts/check_inline_js.py
      - name: Regenerate derived data
        run: python3 playlists/data/gen_stats.py
      - name: Structural audit (fail on inconsistency)
        run: python3 scripts/audit_site.py
      - name: Non-regression gate vs live stats
        run: python3 scripts/non_regression.py
      - name: Full-site crawl (every sheikh/row/mode + first lesson)
        run: |
          pip install -q playwright==1.47.0
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 scripts/crawl_site.py
      - name: Guard — no conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})' -- ':!*.md' | head -20 | grep .; then
            echo "conflict markers in tree"; exit 1
          fi
      - name: Stage publishable tree into _site/
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' \
            --exclude 'scripts/' --exclude 'tools/' --exclude 'inbox/' \
            --exclude 'track/' --exclude 'site_pub.log' \
            --exclude '*.wwords.json' --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude 'shots/' --exclude '.agents/' \
            ./ _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
