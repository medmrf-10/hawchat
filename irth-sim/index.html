<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irth — محاكاة المشاهدة الحية</title>
<style>
:root{
  --bg:#0e1220;--bg2:#151a2e;--card:#1a2038;--card2:#202842;--line:#2a3355;
  --tx:#e8eaf2;--tx2:#9aa3c0;--acc:#5b8cff;--acc2:#7ea4ff;--gold:#e8b565;--ok:#4ecb8d;
  --rad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
a{color:var(--acc2);text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(14,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.logo{font-weight:700;font-size:18px;color:var(--tx);letter-spacing:.5px}
.logo b{color:var(--acc)}
.crumb{color:var(--tx2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crumb a{color:var(--tx2)}.crumb a:hover{color:var(--acc2)}
.crumb b{color:var(--tx)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.err{background:#3a1d24;border:1px solid #6e2f3c;color:#ffb4c0;padding:14px 16px;border-radius:var(--rad);margin:20px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;cursor:pointer;transition:.15s;border-top:3px solid transparent}
.card:hover{border-color:var(--acc);transform:translateY(-2px);background:var(--card2)}
.card h3{font-size:17px;margin-bottom:6px}
.card .meta{font-size:13px;color:var(--tx2);display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--tx2);background:var(--bg2)}
.badge.sci{color:var(--gold);border-color:#5a4a28}
.badge.kind{color:var(--ok);border-color:#2c5344}
.count{color:var(--acc);font-weight:700}
.sec-title{font-size:20px;font-weight:700;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title small{color:var(--tx2);font-weight:400;font-size:13px}
/* series lessons */
.lesson{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:.12s}
.lesson:hover{border-color:var(--acc);background:var(--card2)}
.lesson .num{min-width:34px;height:34px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--acc2);font-weight:700}
.lesson .t{flex:1;font-size:15px;line-height:1.5}
.lesson .d{font-size:12px;color:var(--tx2);white-space:nowrap}
/* lesson page */
.lesson-wrap{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
@media(max-width:860px){.lesson-wrap{grid-template-columns:1fr}}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:var(--rad);overflow:hidden;border:1px solid var(--line)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line)}
.tab{padding:9px 18px;cursor:pointer;font-size:14px;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--tx);border-color:var(--acc);font-weight:700}
.pane{display:none}.pane.on{display:block}
.transcript{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px 22px;line-height:2.3;font-size:17px;font-family:"Noto Naskh Arabic","Segoe UI",serif}
.w{color:var(--tx);cursor:pointer;border-radius:4px;padding:0 1px;transition:background .1s}
.w:hover{background:#2a3355}
.w.on{background:var(--acc);color:#fff;font-weight:700}
.w.passed{color:var(--tx2)}
.sum p{line-height:2;font-size:15.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;margin-bottom:14px}
.pts{list-style:none}
.pts li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;line-height:1.7;font-size:14.5px;position:relative;padding-right:38px}
.pts li:before{content:"";position:absolute;right:14px;top:19px;width:7px;height:7px;border-radius:99px;background:var(--acc)}
.meta-card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;margin-bottom:16px;font-size:13.5px;color:var(--tx2);line-height:2}
.meta-card b{color:var(--tx)}
.person{display:flex;align-items:center;gap:12px}
.person img{width:44px;height:44px;border-radius:99px;object-fit:cover;border:2px solid var(--line)}
.side-lessons{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:10px;max-height:520px;overflow-y:auto}
.side-lessons .lesson{padding:9px 12px;margin-bottom:4px}
.side-lessons .lesson .num{min-width:26px;height:26px;font-size:11px}
.side-lessons .lesson .t{font-size:13px}
.side-lessons .lesson.cur{border-color:var(--acc);background:#1c2749}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.ctrl{font-size:12.5px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctrl.on{color:var(--tx);border-color:var(--acc)}
.prog{height:4px;background:var(--bg2);border-radius:99px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.loading{padding:60px;text-align:center;color:var(--tx2)}
.foot{color:var(--tx2);font-size:12px;text-align:center;margin-top:40px;opacity:.7}
</style>
</head>
<body>
<header>
  <div class="logo">irth <b>· محاكاة</b></div>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"><div class="loading">يُحمّل البيانات…</div></main>
<script>
const BASE='https://medmrf-10.github.io/irth';
const $=s=>document.querySelector(s);
const app=$('#app'),crumb=$('#crumb');
let SCI={},PER={},WRK={},SER=[],VID={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=+s||0;const h=~~(s/3600),m=~~(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
async function jget(p){const r=await fetch(BASE+p);if(!r.ok)throw p;return r.json()}
async function tget(p){const r=await fetch(BASE+p);if(!r.ok)throw p;return r.text()}

async function boot(){
  try{
    const [sc,pe,wk,se,vi]=await Promise.all([jget('/data/sciences.json'),jget('/data/persons.json'),jget('/data/works.json'),jget('/data/tube/series.json'),jget('/data/tube/videos.json')]);
    sc.rows.forEach(r=>SCI[r.id]=r); pe.rows.forEach(r=>PER[r.id]=r); wk.rows.forEach(r=>WRK[r.id]=r);
    SER=se.rows; vi.rows.forEach(r=>VID[r.id]=r);
    route();
  }catch(e){app.innerHTML=`<div class="err">تعذر جلب بيانات irth الحية (${esc(e)})</div>`}
}
addEventListener('hashchange',route);
function parts(){return location.hash.replace(/^#\/?/,'').split('/').filter(Boolean)}
function route(){
  const p=parts();
  if(p[0]==='lesson'&&p[1]) return viewLesson(p[1]);
  if(p[0]==='series'&&p[1]) return viewSeries(p[1]);
  if(p[0]==='science'&&p[1]) return viewScience(p[1]);
  viewHome();
}
function setCrumb(items){crumb.innerHTML=items.map(i=>i.a?`<a href="${i.a}">${esc(i.t)}</a>`:`<b>${esc(i.t)}</b>`).join(' <span style="opacity:.4">›</span> ')}

/* ---- Views ---- */
function viewHome(){
  setCrumb([{t:'العلوم'}]);
  const bySci={};SER.forEach(s=>{(bySci[s.science]=bySci[s.science]||[]).push(s)});
  app.innerHTML=`<div class="sec-title">العلوم <small>${SER.length} سلسلة · ${Object.keys(VID).length} درساً منقولاً حياً من irth</small></div>
  <div class="grid">${Object.keys(bySci).sort().map(id=>{
    const rows=bySci[id],n=rows.reduce((a,s)=>a+s.items.length,0);
    const sh=[...new Set(rows.flatMap(s=>s.items.map(v=>VID[v]?.speakers?.[0]).filter(Boolean)))];
    return `<div class="card" onclick="location.hash='#/science/${id}'">
      <h3>${esc(SCI[id]?.name||id)}</h3>
      <div class="meta"><span><span class="count">${rows.length}</span> سلسلة</span><span><span class="count">${n}</span> درساً</span>${sh.map(x=>`<span>${esc(PER[x]?.short||x)}</span>`).join('')}</span></div></div>`}).join('')}
  </div>
  <div class="foot">البيانات تُجلب حياً من medmrf-10.github.io/irth — نسخة المحاكاة الأولى</div>`;
}
function viewScience(id){
  const s=SCI[id];setCrumb([{t:'العلوم',a:'#/'},{t:s?.name||id}]);
  const rows=SER.filter(x=>x.science===id);
  app.innerHTML=`<div class="sec-title">${esc(s?.name||id)} <small>${rows.length} سلسلة</small></div>
  <div class="grid">${rows.map(r=>{
    const v0=VID[r.items[0]];const sh=v0?.speakers?.[0];const wk=r.kind==='sharh'?v0?.work:null;
    return `<div class="card" onclick="location.hash='#/series/${r.id}'">
      <h3>${esc(r.title)}</h3>
      <div class="meta"><span><span class="count">${r.items.length}</span> درساً</span>${sh?`<span>${esc(PER[sh]?.short||sh)}</span>`:''}</div>
      <div class="meta" style="margin-top:8px"><span class="badge kind">${esc(kindAr(r.kind))}</span>${wk?`<span class="badge sci">شرح: ${esc(WRK[wk]?.title||wk)}</span>`:''}${r.complete?'<span class="badge">مكتملة</span>':''}</div></div>`}).join('')}
  </div>`;
}
function kindAr(k){return {sharh:'شرح كتاب','5o6ab':'خطب',mo7adara:'محاضرات',bernamej:'برنامج'}[k]||k||'—'}
function viewSeries(id){
  const r=SER.find(x=>x.id===id);if(!r){app.innerHTML='<div class="err">سلسلة غير موجودة</div>';return}
  const sci=SCI[r.science];
  const v0=VID[r.items[0]];const sh=v0?.speakers?.[0];const wk=v0?.work;
  setCrumb([{t:'العلوم',a:'#/'},{t:sci?.name||r.science,a:'#/science/'+r.science},{t:r.title}]);
  const total=r.items.reduce((a,v)=>a+(VID[v]?.duration||0),0);
  app.innerHTML=`<div class="sec-title">${esc(r.title)} <small>${r.items.length} درساً · ${fmt(total)}</small></div>
  <div class="meta-card">
    <div class="person">${sh&&PER[sh]?.photo?`<img src="${BASE}/${PER[sh].photo}" onerror="this.remove()">`:''}<div><b>${esc(PER[sh]?.name||'—')}</b><br>${esc(sci?.name||'')} · ${esc(kindAr(r.kind))}${wk&&WRK[wk]?` · يشرح «${esc(WRK[wk].title)}»${WRK[wk].author&&PER[WRK[wk].author]?` لـ${esc(PER[WRK[wk].author].short||WRK[wk].author)}`:''}`:''}</div></div>
  </div>
  ${r.items.map((v,i)=>{const V=VID[v];return `<div class="lesson" onclick="location.hash='#/lesson/${v}'">
    <div class="num">${i+1}</div><div class="t">${esc(V?.title||v)}</div>
    <div class="d">${V?fmt(V.duration):''}${V&&!V.has?.includes('align')?' · بلا محاذاة':''}</div></div>`}).join('')}`;
}

/* ---- Lesson view with karaoke ---- */
let player=null,align=null,cur=-1,poller=null,autoscroll=true;
function viewLesson(id){
  const V=VID[id];
  if(!V){app.innerHTML='<div class="err">درس غير موجود</div>';return}
  const ser=SER.find(s=>s.items.includes(id));
  const sh=V.speakers?.[0];
  setCrumb([{t:'العلوم',a:'#/'},...(ser?[{t:SCI[ser.science]?.name,a:'#/science/'+ser.science},{t:ser.title,a:'#/series/'+ser.id}]:[]),{t:V.title}]);
  const idx=ser?ser.items.indexOf(id):-1;
  app.innerHTML=`
  <div class="lesson-wrap">
    <div>
      <div class="player"><div id="ytp"></div></div>
      <div class="prog"><i id="prog"></i></div>
      <div class="controls">
        <div class="ctrl on" id="cScroll" onclick="autoscroll=!autoscroll;this.classList.toggle('on')">تتبع تلقائي</div>
        <div class="ctrl" onclick="seek(-10)">‹ 10ث</div>
        <div class="ctrl" onclick="seek(10)">10ث ›</div>
        <div class="ctrl" id="ytlink">فتح في يوتيوب</div>
      </div>
      <div class="meta-card"><b>${esc(V.title)}</b><br>${esc(ser?.title||'')} · الدرس ${idx+1} · ${fmt(V.duration)} · ${esc(PER[sh]?.name||'')}${V.work&&WRK[V.work]?` · «${esc(WRK[V.work].title)}»`:''}</div>
      <div class="tabs">
        <div class="tab on" data-t="karaoke">كاريوكي</div>
        <div class="tab" data-t="text">التفريغ</div>
        <div class="tab" data-t="sum">الملخص</div>
      </div>
      <div class="pane on" id="p-karaoke"><div class="transcript" id="kara"><div class="loading">…</div></div></div>
      <div class="pane" id="p-text"><div class="transcript" id="txt"><div class="loading">…</div></div></div>
      <div class="pane" id="p-sum"><div class="sum"><div class="loading">…</div></div></div>
    </div>
    <div class="side-lessons">${ser?ser.items.map((v,i)=>`<div class="lesson${v===id?' cur':''}" onclick="location.hash='#/lesson/${v}'"><div class="num">${i+1}</div><div class="t">${esc(VID[v]?.title||v)}</div></div>`).join(''):''}</div>
  </div>`;
  document.getElementById('ytlink').onclick=()=>open(`https://youtu.be/${V.yt||V.id}`,'_blank');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+t.dataset.t));
  });
  // YouTube player
  const mount=()=>{player=new YT.Player('ytp',{videoId:V.yt||id,playerVars:{rel:0,modestbranding:1},events:{onStateChange:e=>{if(e.data===1)startPoll();}}})};
  if(window.YT&&YT.Player) mount();
  else{const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);const old=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{old&&old();mount()}}
  if(poller)clearInterval(poller);
  // content
  loadKaraoke(id); loadText(id); loadSum(id);
}
function seek(d){if(player&&player.getCurrentTime)player.seekTo(player.getCurrentTime()+d,true)}
function startPoll(){
  if(poller)clearInterval(poller);
  poller=setInterval(()=>{
    if(!player||!player.getCurrentTime)return;
    const t=player.getCurrentTime();
    const total=player.getDuration()||0;
    const bar=document.getElementById('prog');if(bar&&total)bar.style.width=(t/total*100)+'%';
    if(!align)return;
    const cs=Math.round(t*100);
    let i=align.start.findIndex((s,k)=>cs<s+(align.dur[k]||0));
    if(i<0)i=align.start.length-1;
    if(i!==cur){paint(i)}
  },150);
}
function paint(i){
  const ws=document.querySelectorAll('#kara .w');if(!ws.length)return;
  if(cur>=0&&ws[cur])ws[cur].classList.remove('on');
  ws.forEach((w,k)=>w.classList.toggle('passed',k<i));
  const w=ws[i];if(!w)return;
  w.classList.add('on');
  if(autoscroll)w.scrollIntoView({block:'center',behavior:'smooth'});
  cur=i;
}
async function loadKaraoke(id){
  const el=document.getElementById('kara');
  try{
    const a=await jget(`/content/tube/${id}/align.json`);
    align=a;
    el.innerHTML=a.words.split(' ').map((w,i)=>`<span class="w" data-i="${i}">${esc(w)}</span>`).join(' ')+
      `<div class="foot" style="margin-top:16px">تغطية التزامن: ${Math.round((a.cov||0)*100)}%</div>`;
    el.querySelectorAll('.w').forEach(w=>w.onclick=()=>{const i=+w.dataset.i;if(player&&align)player.seekTo(align.start[i]/100,true)});
  }catch(e){el.innerHTML='<div class="meta-card">لا محاذاة لهذا الدرس بعد</div>'}
}
async function loadText(id){
  const el=document.getElementById('txt');
  try{const t=await tget(`/content/tube/${id}/transcript.txt`);
    el.innerHTML=t.split(/\n+/).filter(x=>x.trim()).map(x=>`<p style="margin:0 0 12px">${esc(x)}</p>`).join('');
  }catch(e){el.innerHTML='<div class="meta-card">لا تفريغ</div>'}
}
async function loadSum(id){
  const el=document.querySelector('#p-sum .sum');
  try{const s=await jget(`/content/tube/${id}/summary.json`);
    el.innerHTML=`<p>${esc(s.summary)}</p><ul class="pts">${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  }catch(e){el.innerHTML='<div class="meta-card">لا ملخص</div>'}
}
boot();
</script>
</body>
</html>
