<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('irth.theme')||'night'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إرث — محاكاة التشغيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==== توكنات إرث الفعلية (src/theme/tokens.css) ==== */
:root{
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;
  --r-1:12px;--r-2:16px;--r-3:18px;--r-pill:999px;
  --font-display:'Amiri',serif;--font-body:'Noto Naskh Arabic',serif;
  --dur-1:150ms;--dur-2:300ms;--ease:cubic-bezier(0.22,0.61,0.36,1);
  --app-max:560px;--touch:44px;
}
:root,[data-theme='night']{
  --bg:#14110e;--card:#1c1814;--text:#efe6d6;--muted:#a39684;--line:#2f2923;
  --primary:#e3a598;--gold:#c9a35c;--soft:#2a241e;--press:#241f1a;
  --glass:rgba(20,17,14,.9);color-scheme:dark;
}
[data-theme='paper']{
  --bg:#f4eee2;--card:#fbf7ef;--text:#2a241d;--muted:#8a7e6e;--line:#e5dac6;
  --primary:#7b2d26;--gold:#ae8848;--soft:#eadfcb;--press:#f2eadb;
  --glass:rgba(244,238,226,.9);color-scheme:light;
}
[data-theme='white']{
  --bg:#ffffff;--card:#f0f2f5;--text:#050505;--muted:#65676b;--line:#ced0d4;
  --primary:#7b2d26;--gold:#ae8848;--soft:#e4e6eb;--press:#f0f2f5;
  --glass:rgba(255,255,255,.92);color-scheme:light;
}
[data-theme='dark']{
  --bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;
  --primary:#e3a598;--gold:#c9a35c;--soft:#3a3b3c;--press:#2d2e2f;
  --glass:rgba(24,25,26,.92);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px}
a{color:var(--primary)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.app{min-height:100dvh;max-width:var(--app-max);margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* الترويسة الزجاجية — ثابتة تنزلق بنمط فيسبوك */
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,var(--app-max));z-index:6;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .28s ease}
.top.hid{transform:translate(-50%,-52px)}
main{display:block;padding-top:calc(56px + env(safe-area-inset-top))}
body.les main{padding-top:calc(104px + env(safe-area-inset-top))}
.trow{display:flex;align-items:center}
.r1{justify-content:space-between;height:52px;padding:0 16px 0 6px;position:relative}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--app-max));z-index:8;display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav .tab{flex:1;display:grid;place-items:center;height:56px;color:var(--muted);border:0;border-top:3px solid transparent;
  background:none;padding:0;font:inherit;text-decoration:none;cursor:pointer}
.bnav .tab:focus-visible{outline:2px solid var(--primary);outline-offset:-6px}
.bnav .tab svg{width:25px;height:25px}
.tab{position:relative}
.bdg{position:absolute;top:6px;left:50%;transform:translateX(7px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold);color:var(--card);font:700 10px/16px var(--font-body);text-align:center;display:none;box-shadow:0 0 0 2px var(--card)}
.tab.hasf .bdg{display:block}
.bnav .tab.on{color:var(--primary);border-top-color:var(--primary)}
.bnav .tab:active{background:var(--soft)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:9px}
.brand b{font:700 25px/1 var(--font-display);color:var(--primary)}
.brand .sim{font:600 11px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.acts{display:flex}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
  color:var(--muted);border:0;background:none;font:inherit;cursor:pointer}
.ib:active{background:var(--press)}
.sbar{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));
  width:min(544px,calc(100% - 16px));height:44px;display:flex;align-items:center;gap:6px;
  padding:0 14px 0 2px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);animation:fade .18s ease-out}
.sbar[hidden]{display:none}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--text)}
.sbar input::placeholder{color:var(--muted)}
.themes{position:fixed;z-index:9;left:10px;top:calc(56px + env(safe-area-inset-top));min-width:170px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18);animation:fade .15s ease-out}
.themes button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;
  background:none;color:inherit;font:inherit;font-size:15px;text-align:right;cursor:pointer}
.themes button[aria-pressed='true']{background:var(--press);font-weight:600}
.themes i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(127,127,127,.35)}

/* قوائم الصفوف — أسلوب ورق */
.list{margin:20px 16px 8px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:78px;padding:12px 16px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;cursor:pointer;animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*28ms)}
.row:last-of-type{border-bottom:0}
.row:active{background:var(--soft)}
.ph{position:relative;flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:var(--soft);color:var(--primary);font:700 24px var(--font-display);
  box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--gold)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.tx{flex:1;min-width:0}
.nm{display:block;font:700 20px/1.4 var(--font-display)}
.mt{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:2px;color:var(--muted);font-size:12.5px}
.mi{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;width:20px;height:20px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.ctx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--muted);font-size:13px;padding-inline-start:10px}
.ctx a{color:var(--muted);text-decoration:none}
.ctx a:active{color:var(--primary)}
.ctx b{color:var(--text);font-weight:600}
.ctx .dim{opacity:.75;font-size:12px}
.newb{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* الشريط السفلي */
.nav{position:fixed;z-index:7;bottom:0;left:0;right:0;display:flex;max-width:var(--app-max);margin:0 auto;
  padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--muted);font-size:12px;text-decoration:none;cursor:pointer}
.nav a.on{color:var(--primary);font-weight:600}
.nav svg{width:24px;height:24px}

/* ==== صفحة الدرس ==== */
.player{position:relative;margin:8px 16px 0;border-radius:var(--r-2);overflow:hidden;background:#000;border:1px solid var(--line)}
.player:before{content:'';display:block;padding-top:56.25%}
.player iframe,.player #yfp{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage{position:relative;margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2);
  height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px;overflow:hidden}
.stage .ln{font-family:var(--font-display);font-size:clamp(1.2rem,5vw,1.7rem);line-height:2.1;text-align:center;max-width:640px;max-height:calc(clamp(1.2rem,5vw,1.7rem)*4.2);overflow:hidden}
.stage .w{cursor:pointer;color:var(--text);opacity:.62;transition:color .12s;border-radius:6px;padding:0 2px}
.stage .w.read{color:var(--text);opacity:1}
.stage .w.on{color:transparent}
.stage .wait{color:var(--muted);font-size:14px}
.stage .wait a{color:var(--primary)}

/* شريط الأوضاع داخل الترويسة — أيقونات صافية على كامل العرض */
.lmodes{display:none;height:48px;border-top:1px solid var(--line);align-items:stretch}
.lmodes:not(:empty){display:flex}
.mtab{flex:1;display:grid;place-items:center;color:var(--muted);border:0;border-bottom:3px solid transparent;
  background:none;padding:0;font:inherit;text-decoration:none;cursor:pointer}
.mtab svg{width:23px;height:23px}
.mtab.on{color:var(--primary);border-bottom-color:var(--primary)}
.mtab:active{background:var(--soft)}

.czone{margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2);padding:12px 14px;
  display:flex;flex-direction:column;gap:10px}
.crow{display:flex;justify-content:center;gap:10px}
.cbtn{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--soft);color:var(--text);cursor:pointer;font:inherit}
.cbtn svg{width:22px;height:22px}
.cbtn.main{width:56px;height:56px;background:var(--primary);color:var(--card);border-color:var(--primary)}
.cbtn.main svg{width:26px;height:26px}
.cbtn:active{background:var(--press)}
.csub{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.csub .ppos{margin-inline-start:10px}
.fvm{display:inline-block;width:12px;height:12px;color:var(--gold);vertical-align:-1px;margin-inline-start:6px}
.fvm svg{width:100%;height:100%;display:block;fill:currentColor;stroke:none}
.ufav{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--gold);cursor:pointer;display:grid;place-items:center}
.ufav svg{width:18px;height:18px;fill:currentColor;stroke:none}
.ufav:active{background:var(--press)}
.row{transition:opacity .18s ease,transform .18s ease;position:relative}
.rbar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--soft)}
.rbar i{display:block;height:100%;background:var(--gold)}
.sprog{display:flex;flex-direction:column;gap:6px;padding:10px 14px;margin-bottom:8px;color:var(--dim);font-size:13px}
.shr{flex:none;width:40px;height:40px;border:1px solid var(--soft);border-radius:12px;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center;margin-bottom:10px}
.shr svg{width:18px;height:18px}
.shr:active{background:var(--press)}
.list .cta+.shr{position:absolute;left:14px;top:14px}
.row.fin .nm{opacity:.55}
.row.fin .mt{opacity:.45}
.list{position:relative}
.sprog .sbar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.sprog .sbar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.hf a.row.fin{display:none}
.hfbtn{align-self:flex-start;background:none;border:1px solid var(--soft);color:var(--dim);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer}
.hfbtn.on{color:var(--gold);border-color:var(--gold)}
.hst{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 12px}
.hc{text-decoration:none;color:var(--fg);border:1px solid var(--soft);border-radius:14px;padding:8px;background:var(--card);min-width:0}
.hph{display:grid;place-items:center;height:56px;border-radius:10px;color:var(--gold);font-weight:700;font-size:22px;background:var(--soft)}
.ht{display:block;font-size:11.5px;line-height:1.4;margin-top:6px;height:32px;overflow:hidden;color:var(--dim)}
.hbar{display:block;height:3px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sdrop{position:absolute;top:100%;right:0;left:0;background:var(--card);border:1px solid var(--soft);border-top:0;border-radius:0 0 14px 14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;z-index:9}
.schip{border:1px solid var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);background:none;cursor:pointer;font-family:inherit}
.schip:active{background:var(--press);color:var(--fg)}
.hl{color:var(--gold);font-weight:700}
.done{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;color:var(--gold)}
.done svg{width:100%;height:100%}
a.row:active{transform:scale(.985)}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:14px;z-index:7;width:38px;height:38px;
  display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);cursor:pointer;
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;padding:0}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.fab svg{width:20px;height:20px}
.tost{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);
  z-index:20;background:var(--text);color:var(--card);padding:10px 18px;border-radius:12px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.tost.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin:12px 16px 4px;
  border-radius:var(--r-2);background:var(--primary);color:var(--card);font:inherit;font-size:15px;cursor:pointer;
  text-decoration:none}
.cta svg{width:20px;height:20px}
.gttl{margin:22px 16px 8px;color:var(--gold);font-size:13px;font-weight:700}
.pbar{height:3px;border-radius:999px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s linear}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  background:var(--card);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.icob{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);
  display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icob svg{width:16px;height:16px}
.icob.on{color:var(--gold);border-color:var(--gold)}
.icob:active{background:var(--press)}
.chip:active{background:var(--press)}
.chip.on{color:var(--gold);border-color:var(--gold)}
.pane{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2);padding:16px}
.txtp{font-family:var(--font-body);font-size:15.5px;line-height:2.1;white-space:pre-wrap;max-height:60vh;overflow:auto}
.sump{font-family:var(--font-body);font-size:15.5px;line-height:2}
.qq{background:var(--card);border:1px solid var(--line);border-radius:var(--r-1);margin:0 0 10px}
.qq summary{padding:12px 14px;font-family:var(--font-body);font-size:15px;line-height:1.9;cursor:pointer;list-style:none}
.qq summary::-webkit-details-marker{display:none}
.qq summary b{color:var(--gold);margin-inline-end:6px}
.qq[open] summary{border-bottom:1px solid var(--line)}
.qq .qa{padding:12px 14px;font-family:var(--font-body);font-size:14.5px;line-height:1.9;color:var(--muted)}
.qr{display:flex;align-items:center;gap:4px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.qrl{font-size:12px;color:var(--dim);margin-inline-end:6px}
.qrb{width:30px;height:30px;border:none;border-radius:8px;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center;padding:0}
.qrb svg{width:22px;height:22px}
.qrb:active{background:var(--press)}
.qrb.on{color:var(--gold)}
.qrb.on svg{fill:var(--gold)}
.pts{margin:10px 0 0;padding:0 18px 0 0;color:var(--muted);font-size:14px;line-height:2}
.navbt{display:flex;justify-content:space-between;gap:8px;margin:12px 16px 0}
.navbt .chip{max-width:48%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.skel{border-radius:var(--r-1);background:linear-gradient(90deg,var(--soft),var(--press),var(--soft));background-size:200% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-200% 0}}
.errbox{margin:40px 16px;padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-2)}
/* درج قائمة الدروس — يمين */
.drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer.open{opacity:1;pointer-events:auto}
.dbody{position:absolute;top:0;bottom:0;right:0;width:min(86vw,340px);background:var(--card);border-inline-start:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s var(--ease);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.drawer.open .dbody{transform:none}
.dhead{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:1}
.dhead b{font:700 16px var(--font-display);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.drow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.drow:active{background:var(--soft)}
.drow.cur{background:var(--soft)}
.dnum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary);font:700 13px var(--font-display);box-shadow:0 0 0 1.5px var(--gold)}
.drow.cur .dnum{background:var(--primary);color:var(--card)}
.dt{flex:1;min-width:0;font-size:14px;line-height:1.6}
.dd{flex:none;color:var(--muted);font-size:12px}
.drow .dok{color:var(--gold);width:15px;height:15px;display:block}
.drow .dok svg{width:100%;height:100%}
.drow.fin .dt{opacity:.55}
@media (min-width:700px){.list,.pane,.czone,.player,.stage{max-width:var(--app-max);margin-inline:auto}}
body.les,body.les *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="trow r1">
      <a class="brand" href="#/"><b>إرث</b></a>
      <div class="ctx" id="ctx"></div>
    </div>
    <nav class="lmodes" id="lmodes"></nav>
  </header>
  <div class="sbar" id="sbar" hidden><input type="search" id="sinput" placeholder="ابحث في الدروس والسلاسل…" autocomplete="off"><button class="ib" id="b-sx" aria-label="إغلاق" style="width:36px;height:36px;flex:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <nav class="bnav" id="tabs">

};
const I=k=>ICONS[k]||'';



const THEMESW=document.getElementById('themes');
const savedTheme=localStorage.getItem('irth.theme')||'night';
document.documentElement.dataset.theme=savedTheme;
document.querySelectorAll('#themes button').forEach(b=>{
  b.setAttribute('aria-pressed',b.dataset.t===savedTheme?'true':'false');
  b.onclick=e=>{e.stopPropagation();document.documentElement.dataset.theme=b.dataset.t;localStorage.setItem('irth.theme',b.dataset.t);
    document.querySelectorAll('#themes button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));THEMESW.hidden=true};
});
document.getElementById('b-theme').onclick=e=>{e.stopPropagation();THEMESW.hidden=!THEMESW.hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#themes,#b-theme'))THEMESW.hidden=true});
const sbar=document.getElementById('sbar'),sinput=document.getElementById('sinput');
const SRCHK='irth_srch';let SRCH=JSON.parse(localStorage.getItem(SRCHK)||'[]');
function srchSave(q){q=q.trim();if(q.length<2)return;SRCH=[q,...SRCH.filter(x=>x!==q)].slice(0,8);localStorage.setItem(SRCHK,JSON.stringify(SRCH))}
function srchDrop(){let d=document.getElementById('sdrop');
  if(sbar.hidden||sinput.value.trim()||!SRCH.length){if(d)d.remove();return}
  if(!d){d=document.createElement('div');d.id='sdrop';d.className='sdrop';sbar.appendChild(d)}
  d.innerHTML=SRCH.map(q=>`<button class="schip">${esc(q)}</button>`).join('');
  d.querySelectorAll('.schip').forEach(b=>b.onclick=()=>{sinput.value=b.textContent;srchDrop();viewSearch(b.textContent)})}
document.getElementById('b-search').onclick=()=>{sbar.hidden=!sbar.hidden;if(!sbar.hidden){scrollTo({top:0});sinput.focus();srchDrop()}};
document.getElementById('b-sx').onclick=()=>{const had=sinput.value.trim();sbar.hidden=true;sinput.value='';srchDrop();if(had)viewSearch('')};
sinput.oninput=()=>{const q=sinput.value.trim();srchDrop();if(location.hash.startsWith('#/lesson')||location.hash.startsWith('#/series'))return;viewSearch(q)};
sinput.onkeydown=e=>{if(e.key==='Enter')srchSave(sinput.value)};
app.addEventListener('click',e=>{if(e.target.closest('a.row')&&sinput.value.trim())srchSave(sinput.value)});
function setCrumb(parts,meta){ctx.innerHTML=parts.map((p,i)=>i<parts.length-1?`<a href="${p.a}">${esc(p.t)}</a>`:`<b>${esc(p.t)}</b>`).join(' <span style="opacity:.5">‹</span> ')+(meta?`<span class="dim"> · ${esc(meta)}</span>`:'')}

async function boot(){
  app.innerHTML='<div class="list"><div class="empty">يُحمّل…</div></div>';
  try{
    const [sc,sr,v,p,w]=await Promise.all([
      jget('/data/sciences.json'),jget('/data/tube/series.json'),jget('/data/tube/videos.json'),
      jget('/data/persons.json'),jget('/data/works.json')]);
    sc.rows.forEach(r=>SCI[r.id]=r);SER=sr.rows;
    v.rows.forEach(r=>VID[r.id]=r);p.rows.forEach(r=>PER[r.id]=r);w.rows.forEach(r=>WRK[r.id]=r);
  }catch(e){app.innerHTML='<div class="errbox">تعذر تحميل بيانات إرث — حدّث الصفحة</div>';return}
  addEventListener('hashchange',route);route();
}
function navOn(k){document.querySelectorAll('#tabs .tab').forEach(a=>a.classList.remove('on'));const n=document.getElementById('nv-'+k);if(n)n.classList.add('on')}
let _ly=0;addEventListener('scroll',()=>{const y=scrollY,t=document.getElementById('top'),f=document.getElementById('fab');
  if(f)f.classList.toggle('show',y>700);
  if(y<56)t.classList.remove('hid');else if(y>_ly+8)t.classList.add('hid');else if(y<_ly-8)t.classList.remove('hid');_ly=y},{passive:true});
function route(){
  const h=location.hash.slice(2)||'';
  try{YTP&&YTP.destroy&&YTP.destroy()}catch(_){}YTP=null;pendPlay=false;if(timer){clearInterval(timer);timer=null}
  const les=h.startsWith('lesson/');
  document.body.classList.toggle('les',les);
  if(!les)document.getElementById('lmodes').innerHTML='';
  const bs=document.getElementById('b-search');if(bs)bs.style.display=les?'none':'';
  document.getElementById('sbar').hidden=true;sinput.value='';
  if(h.startsWith('science/'))viewScience(h.slice(8));
  else if(h.startsWith('series/'))viewSeries(h.slice(7));
  else if(les)viewLesson(h.slice(7));
  else if(h==='fav')viewFav()
  else if(h==='stats'){navOn('stats');viewStats()}
  else viewHome();
}
const FAVK='irth_fav';let FAV=new Set(JSON.parse(localStorage.getItem(FAVK)||'[]'));
const QRK='irth_qrate';let QRATE={};try{QRATE=JSON.parse(localStorage.getItem(QRK)||'{}')}catch(e){QRATE={}}
function qrate(id,i,n,btn){QRATE[id+'#'+i]=n;try{localStorage.setItem(QRK,JSON.stringify(QRATE))}catch(e){}
  btn.closest('.qr').querySelectorAll('.qrb').forEach((b,j)=>b.classList.toggle('on',j<n))}
(function(){const f=document.createElement('button');f.id='fab';f.className='fab';f.setAttribute('aria-label','العودة لأعلى');
  f.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>';
  f.onclick=()=>scrollTo({top:0,behavior:document.body.classList.contains('les')?'auto':'smooth'});document.body.appendChild(f)})();
let _tt;function tost(msg){let t=document.getElementById('tost');if(!t){t=document.createElement('div');t.id='tost';t.className='tost';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),1600)}
function favSync(){const n=document.getElementById('nv-fav');if(!n)return;n.classList.toggle('hasf',FAV.size>0);const b=n.querySelector('.bdg');if(b)b.textContent=FAV.size>99?'99+':FAV.size}
function favToggle(id){const on=!FAV.has(id);on?FAV.add(id):FAV.delete(id);localStorage.setItem(FAVK,JSON.stringify([...FAV]));favSync();
  tost(on?'أُضيف إلى المفضلة':'أُزيل من المفضلة');const b=document.getElementById('favb');if(b)b.classList.toggle('on',on)}
favSync();
function unfav(e,id){e.preventDefault();e.stopPropagation();FAV.delete(id);localStorage.setItem(FAVK,JSON.stringify([...FAV]));favSync();tost('أُزيل من المفضلة');
  const r=e.target.closest('.row');if(r){r.style.opacity='0';r.style.transform='translateX(-18px)';setTimeout(()=>viewFav(),180)}}
function shareLes(){const u=location.href;
  if(navigator.share){navigator.share({title:document.title,url:u}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>{
    const p=document.getElementById('pos');if(p){const t=p.textContent;p.textContent='نُسخ الرابط';setTimeout(()=>p.textContent=t,1600)}}).catch(()=>{})}}
function viewFav(){navOn('fav');setCrumb([{t:'العلوم',a:'#/'},{t:'المفضلة'}]);document.title='المفضلة — إرث';
  const ids=[...FAV].filter(i=>VID[i]).reverse();
  app.innerHTML=ids.length?`<div class="list">${ids.map((v,i)=>{const V=VID[v];const s=SER.find(x=>x.items.includes(v));const pv=POS.get(v)||0;const pc=V.duration?Math.min(99,Math.round(pv/V.duration*100)):0;
    return `<a class="row" style="--i:${i}" href="#/lesson/${v}"><span class="ph">${firstLetter(V.title)}</span>
    <span class="tx"><span class="nm" style="font-size:16px">${esc(V.title)}</span>
    <span class="mt">${s?`<span class="mi">${esc(s.title)}</span>`:''}${V.duration?`<span class="mi">${fmtT(V.duration)}</span>`:''}</span></span><button class="ufav" onclick="unfav(event,'${v}')" aria-label="إزالة من المفضلة">${I('fav')}</button>${pc?`<span class="rbar"><i style="width:${pc}%"></i></span>`:''}</a>`}).join('')}</div>`
  :'<div class="empty" style="margin-top:60px">لا مفضلات بعد — اضغط ★ داخل أي درس ليظهر هنا</div>'}
function viewStats(){
  navOn('stats');setCrumb([{t:'إحصائي'}]);
  const vids=Object.keys(VID).length,ser=SER.length,sci=Object.keys(SCI).length;
  const mins=Object.values(VID).reduce((a,v)=>a+(v.duration||0),0);
  const perSh={},perSc={};
  SER.forEach(s=>{const sh=VID[s.items[0]]?.speakers?.[0]||'';
    const dur=s.items.reduce((a,v)=>a+(VID[v]?.duration||0),0);
    perSh[sh]=perSh[sh]||{n:0,t:0};perSh[sh].n+=s.items.length;perSh[sh].t+=dur;
    perSc[s.science]=perSc[s.science]||{n:0,t:0};perSc[s.science].n+=s.items.length;perSc[s.science].t+=dur});
  const grp=(t,rows)=>`<div class="gttl">${t}</div>${rows.map((r,i)=>r[3]
    ?`<a class="row" style="--i:${i}" href="#/science/${r[3]}"><span class="ph">${firstLetter(r[0])}</span><span class="tx"><span class="nm" style="font-size:16px">${r[0]}</span><span class="mt"><span class="mi">${pl3(r[1],'درس','درسان','دروس','درساً')}</span>${r[2]?`<span class="mi">${Math.round(r[2]/3600*10)/10} س</span>`:''}</span></span>${ICONS.chev}</a>`
    :`<div class="row" style="--i:${i};cursor:default"><span class="ph">${firstLetter(r[0])}</span><span class="tx"><span class="nm" style="font-size:16px">${r[0]}</span><span class="mt"><span class="mi">${pl3(r[1],'درس','درسان','دروس','درساً')}</span>${r[2]?`<span class="mi">${Math.round(r[2]/3600*10)/10} س</span>`:''}</span></span></div>`).join('')}`;
  const st=[...POS.entries()].filter(([,t])=>t>10);const fin=st.filter(([id,t])=>VID[id]?.duration&&t>=VID[id].duration*.95);
  const sec=st.reduce((a,[,t])=>a+t,0);
  app.innerHTML=`<div class="list">${[
    ['سلسلة',ser],['درساً',vids],['علماً',sci],['ساعة من العلم',Math.round(mins/3600)]].map((r,i)=>
    `<div class="row" style="--i:${i};cursor:default"><span class="ph">${r[1]}</span><span class="tx"><span class="nm" style="font-size:16px">${r[0]}</span></span></div>`).join('')}
    ${st.length?grp('استماعك',[
      [pl3(st.length,'درس','درسان','دروس','دروساً')+' بدأته','',0],
      [Math.floor(sec/3600)+' س '+Math.round(sec%3600/60)+' د استماعاً','',0],
      [pl3(fin.length,'درس','درسان','دروس','دروساً')+' أتممته','',0],
      [pl3(streak(),'يوم','يومان','أيام','أياماً')+' استماعاً متتالياً','',0]]):''}
    ${grp('لكل شيخ',Object.entries(perSh).sort((a,b)=>b[1].n-a[1].n).map(([sh,d])=>[PER[sh]?.short||PER[sh]?.name||sh||'غير معروف',d.n,d.t]))}
    ${grp('لكل علم',Object.entries(perSc).sort((a,b)=>b[1].n-a[1].n).map(([sc,d])=>[SCI[sc]?.name||sc,d.n,d.t,sc]))}</div>`;
}
function viewSearch(q){
  navOn('home');
  if(!q){route0();return}
  const sres=SER.filter(s=>s.title.includes(q)).slice(0,8);
  const res=Object.values(VID).filter(v=>v.title.includes(q)).slice(0,40);
  setCrumb([{t:'العلوم',a:'#/'},{t:'بحث: '+q}]);
  const hl=t=>q.length>=2?esc(t).split(esc(q)).join(`<span class="hl">${esc(q)}</span>`):esc(t);
  const srows=sres.map((s,i)=>`<a class="row" style="--i:${i}" href="#/series/${s.id}"><span class="ph">${firstLetter(s.title)}</span><span class="tx"><span class="nm" style="font-size:16px">${hl(s.title)}</span><span class="mt"><span class="mi">سلسلة</span><span class="mi">${pl3(s.items.length,'درس','درسان','دروس','درساً')}</span></span></span>${ICONS.chev}</a>`).join('');
  const vrows=res.map((v,i)=>{const s=SER.find(x=>x.items.includes(v.id));

  <div class="drawer" id="drawer" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="dbody">
      <div class="dhead"><b>${esc(ser?ser.title:'')}</b>${ser?`<span class="dim" style="font-size:12px;white-space:nowrap">${ser.items.indexOf(id)+1} / ${ser.items.length}</span>`:''}<button class="ib" onclick="document.getElementById('drawer').classList.remove('open')">${I('x')}</button></div>
      ${ser?ser.items.map((v,i)=>{const V2=VID[v]||{},pv2=POS.get(v)||0,fin2=V2.duration&&pv2>=V2.duration*.95;return `<a class="drow${v===id?' cur':''}${fin2?' fin':''}" href="#/lesson/${v}"><span class="dnum">${fin2?`<span class="dok">${ICONS.ok}</span>`:i+1}</span><span class="dt">${esc(V2.title||v)}</span><span class="dd">${V2.duration?fmtT(V2.duration):''}</span></a>`}).join(''):''}
    </div>
  </div>`;
  document.getElementById('p-txt').style.display='none';
  if(V.yt)mountPlayer(V.yt);
  loadStage(id);loadTxt(id);loadSum(id);loadQu(id);
}
document.addEventListener('click',e=>{
  const w=e.target.closest('.stage .w');
  if(w&&YTP&&YTP.seekTo){YTP.seekTo(parseFloat(w.dataset.s),true);YTP.playVideo&&YTP.playVideo()}
});
async function loadStage(id){
  try{const a=await jget(`/content/tube/${id}/align.json`);
    PH=buildPhrases(normAlign(a));
    const st=document.getElementById('stage');if(st)renderPhrase(0);
  }catch(e){const st=document.getElementById('stage');if(st)st.innerHTML='<span class="wait">لا محاذاة لهذا الدرس — جرّب «قراءة تفريغ»</span>'}
}
function openDrawer(){const d=document.getElementById('drawer');d.classList.add('open');
  const c=d.querySelector('.drow.cur');if(c)c.scrollIntoView({block:'center'})}
async function loadTxt(id){
  const el=document.getElementById('txt');if(!el)return;
  try{el.textContent=await tget(`/content/tube/${id}/transcript.txt`)}
  catch(e){el.innerHTML='<div class="empty">التفريغ غير متوفر بعد</div>'}
}
async function loadSum(id){
  const el=document.getElementById('sumw');if(!el)return;
  try{const s=await jget(`/content/tube/${id}/summary.json`);
    el.innerHTML=`<div class="sump">${esc(s.summary)}</div><ul class="pts">${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  }catch(e){el.innerHTML='<div class="empty">الملخص غير متوفر بعد</div>'}
}
async function loadQu(id){
  const el=document.getElementById('quw');if(!el)return;
  try{const q=await jget(`/content/tube/${id}/questions.json`);
    const qs=q.questions||[];
    el.innerHTML=qs.length?qs.map((x,i)=>{const k=id+'#'+i,r=QRATE[k]||0;
      return `<details class="qq"><summary><b>${i+1}.</b> ${esc(x.q)}</summary><div class="qa">${esc(x.a||'')}<div class="qr"><span class="qrl">قيّم إجابتك:</span>${[1,2,3,4,5].map(n=>`<button class="qrb${n<=r?' on':''}" onclick="qrate('${id}',${i},${n},this)" aria-label="تقييم ${n} من 5">${ICONS.fav}</button>`).join('')}</div></div></details>`}).join(''):'<div class="empty">لا أسئلة بعد</div>'}
  catch(e){el.innerHTML='<div class="empty">الأسئلة غير متوفرة بعد</div>'}
}
boot();
</script>
</body>
</html>
