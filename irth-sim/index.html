<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>irth · محاكاة المشاهدة</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="preload" href="../fonts/IBMPlexSansArabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../theme.css?v=11">
<link rel="stylesheet" href="../playlists/common.css?v=11">
<link rel="stylesheet" href="../playlists/ui.css?v=12">
<style>
main{max-width:960px;margin:0 auto;padding:var(--sp-3) var(--sp-3) var(--sp-6)}
/* browsing */
.grid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.crd{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:border-color var(--t-fast),transform var(--t-fast)}
.crd:hover{border-color:var(--acc);transform:translateY(-2px)}
.crd h3{font-size:1.05rem;margin-bottom:var(--sp-1);line-height:1.5}
.crd .mt{font-size:var(--fs-xs);color:var(--dim);display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.crd .mt b{color:var(--acc2)}
.knd{font-size:.68rem;color:var(--green);border:1px solid var(--green);border-radius:99px;padding:2px 9px;opacity:.9}
.knd.sc{color:var(--acc2);border-color:var(--gold-1)}
.ls{display:flex;gap:var(--sp-3);align-items:center;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2);cursor:pointer;transition:border-color var(--t-fast);min-height:52px}
.ls:hover{border-color:var(--acc)}
.ls .num{flex:none;min-width:34px;height:34px;border-radius:var(--r-sm);background:var(--bg-2);border:1px solid var(--border);display:grid;place-items:center;font-size:.8rem;color:var(--acc2);font-weight:700;font-variant-numeric:tabular-nums}
.ls .t{flex:1;min-width:0;font-size:.95rem;line-height:1.55}
.ls .d{flex:none;font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums}
.sech{font-size:1.25rem;font-weight:700;margin:var(--sp-4) 0 var(--sp-3);display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.sech small{color:var(--dim);font-weight:400;font-size:var(--fs-xs)}
.heroc{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);display:flex;gap:var(--sp-3);align-items:center}
.heroc img{width:48px;height:48px;border-radius:99px;object-fit:cover;border:2px solid var(--gold-1)}
.heroc .who{font-size:var(--fs-sm);color:var(--dim);line-height:1.8}
.heroc .who b{color:var(--txt);font-size:1.02rem}
/* lesson page — نفس بنية lesson.html */
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(var(--app-h,100dvh) * .36);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);margin-top:var(--sp-2);padding:var(--sp-4) var(--sp-4);overflow:hidden}
.stage.idle .ph{opacity:.75}
.stage .ph{font-family:var(--font-ar);font-size:clamp(1.15rem,4.5vw,1.6rem);line-height:2.1;text-align:center;color:var(--txt)}
.stage .ph .w{color:#9aa3b5;opacity:.55;border-radius:6px;padding:0 3px;transition:opacity .12s,color .12s;cursor:pointer}
.stage .ph .w.read{color:var(--acc);opacity:.75}
.stage .ph .w.on{opacity:1}
.stage .wait{color:var(--dim);font-size:.9rem}
.pos{color:var(--dim);font-size:.7rem;text-align:center;margin-top:4px}
.czone{display:flex;flex-direction:column;justify-content:center;gap:10px;margin-top:var(--sp-2);background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) clamp(8px,3vw,22px) var(--sp-2)}
.crow{direction:ltr;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.6vw,16px)}
.crow .btn{flex:none;width:clamp(44px,12.5vw,52px);height:clamp(44px,12.5vw,52px);padding:0;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.crow .btn:hover{border-color:var(--acc)}
.crow .btn .i{width:22px;height:22px}
.crow .btn.main .i{width:28px;height:28px}
.crow .btn.main{width:clamp(58px,17vw,66px);height:clamp(58px,17vw,66px);font-size:1.4rem;background:var(--acc);color:#0b0f1a;font-weight:700;border-color:var(--acc)}
.crow .btn.ld{position:relative;color:transparent}
.crow .btn.ld::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--acc);animation:ldsp .8s linear infinite}
@keyframes ldsp{to{transform:rotate(360deg)}}
.csub{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.csub .tm{color:var(--acc2);font-size:.8rem;font-variant-numeric:tabular-nums}
.csub .pos{flex:1;min-width:0;text-align:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:2px}
.pbar i{display:block;height:100%;background:linear-gradient(to left,var(--acc2),var(--acc));width:0}
/* tabs + side list */
.lwr{display:grid;grid-template-columns:1fr 300px;gap:var(--sp-3);align-items:start}
@media(max-width:820px){.lwr{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:var(--sp-3) 0;border-bottom:1px solid var(--border)}
.tab{padding:10px 18px;cursor:pointer;font-size:var(--fs-sm);color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px;display:flex;align-items:center}
.tab.on{color:var(--acc2);border-color:var(--acc);font-weight:700}
.pane{display:none}.pane.on{display:block}
.txtp{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);font-family:var(--font-ar);font-size:1.08rem;line-height:2.15;white-space:pre-wrap;max-height:480px;overflow-y:auto}
.sump{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);font-family:var(--font-ar);font-size:1.05rem;line-height:2.1;margin-bottom:var(--sp-3)}
.pts{list-style:none}
.pts li{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 40px 10px 14px;margin-bottom:var(--sp-2);line-height:1.8;font-size:.92rem;position:relative}
.pts li:before{content:"";position:absolute;right:16px;top:17px;width:7px;height:7px;border-radius:99px;background:var(--acc)}
.side{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-2);max-height:560px;overflow-y:auto}
.side .ls{padding:8px 10px;margin-bottom:4px;min-height:44px}
.side .ls .num{min-width:26px;height:26px;font-size:.7rem}
.side .ls .t{font-size:.82rem}
.side .ls.cur{border-color:var(--acc);background:var(--bg-2)}
.badge-dim{font-size:.65rem;color:var(--dim);border:1px dashed var(--border);border-radius:99px;padding:1px 8px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="#/" id="back" class="btn" aria-label="عودة" style="text-decoration:none"><svg class="i" style="width:1.15em;height:1.15em"><use href="../playlists/icons.svg#i-back"/></svg></a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">إرث <span style="font-size:.6em;opacity:.7">محاكاة</span></span>
  <span class="sub crumb" id="crumb" style="flex:1;min-width:0"></span>
</div></header>
<main id="app"><div class="skel" style="height:70px;margin-top:12px"></div><div class="skel" style="height:300px;margin-top:12px"></div></main>
<script>
const BASE='https://medmrf-10.github.io/irth';
const $=s=>document.querySelector(s);
const app=$('#app'),crumb=$('#crumb');
let SCI={},PER={},WRK={},SER=[],VID={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('click',e=>{
  const sp=e.target.closest('.stage .w');
  if(sp&&YTP){YTP.seekTo(parseFloat(sp.dataset.s),true);YTP.playVideo()}
});
const fmtT=s=>{s=Math.max(0,Math.floor(+s||0));const h=~~(s/3600),m=~~(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const I=i=>`<svg class="i"><use href="../playlists/icons.svg#${i}"/></svg>`;
async function jget(p){const r=await fetch(BASE+p);if(!r.ok)throw p;return r.json()}
async function tget(p){const r=await fetch(BASE+p);if(!r.ok)throw p;return r.text()}
const kindAr=k=>({sharh:'شرح كتاب','5o6ab':'خطب',mo7adara:'محاضرات',bernamej:'برنامج'}[k]||k||'—');

async function boot(){
  try{
    const [sc,pe,wk,se,vi]=await Promise.all([jget('/data/sciences.json'),jget('/data/persons.json'),jget('/data/works.json'),jget('/data/tube/series.json'),jget('/data/tube/videos.json')]);
    sc.rows.forEach(r=>SCI[r.id]=r);pe.rows.forEach(r=>PER[r.id]=r);wk.rows.forEach(r=>WRK[r.id]=r);
    SER=se.rows;vi.rows.forEach(r=>VID[r.id]=r);
    route();
  }catch(e){app.innerHTML=`<div class="errbox">تعذر جلب بيانات irth الحية (${esc(e)})</div>`}
}
addEventListener('hashchange',route);
const parts=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
function route(){
  const p=parts();
  if(p[0]==='lesson'&&p[1])return viewLesson(p[1]);
  if(p[0]==='series'&&p[1])return viewSeries(p[1]);
  if(p[0]==='science'&&p[1])return viewScience(p[1]);
  viewHome();
}
function setCrumb(items){
  crumb.innerHTML=items.map(i=>i.a?`<a href="${i.a}">${esc(i.t)}</a>`:`<bdi style="color:var(--txt)">${esc(i.t)}</bdi>`).join('<span style="opacity:.4"> › </span>');
  document.getElementById('back').href=items.length>1?items[items.length-2].a||'#/':'#/';
}

/* ---------- views ---------- */
function viewHome(){
  setCrumb([{t:'العلوم'}]);
  const bySci={};SER.forEach(s=>{(bySci[s.science]=bySci[s.science]||[]).push(s)});
  app.innerHTML=`<div class="sech cin">العلوم <small>${SER.length} سلسلة · ${Object.keys(VID).length} درساً حياً من irth</small></div>
  <div class="grid">${Object.keys(bySci).sort((a,b)=>(SCI[a]?.name||a).localeCompare(SCI[b]?.name||b,'ar')).map(id=>{
    const rows=bySci[id],n=rows.reduce((a,s)=>a+s.items.length,0);
    const sh=[...new Set(rows.flatMap(s=>s.items.map(v=>VID[v]?.speakers?.[0]).filter(Boolean)))];
    return `<div class="crd cin" onclick="location.hash='#/science/${id}'">
      <h3>${esc(SCI[id]?.name||id)}</h3>
      <div class="mt"><span><b>${rows.length}</b> سلسلة</span><span><b>${n}</b> درساً</span>${sh.map(x=>`<span>${esc(PER[x]?.short||x)}</span>`).join('')}</span></div></div>`}).join('')}
  </div>`;
}
function viewScience(id){
  setCrumb([{t:'العلوم',a:'#/'},{t:SCI[id]?.name||id}]);
  const rows=SER.filter(x=>x.science===id);
  app.innerHTML=`<div class="sech cin">${esc(SCI[id]?.name||id)} <small>${rows.length} سلسلة</small></div>
  <div class="grid">${rows.map(r=>{
    const sh=VID[r.items[0]]?.speakers?.[0];const wk=r.kind==='sharh'?VID[r.items[0]]?.work:null;
    return `<div class="crd cin" onclick="location.hash='#/series/${r.id}'">
      <h3>${esc(r.title)}</h3>
      <div class="mt"><span><b>${r.items.length}</b> درساً</span>${sh?`<span>${esc(PER[sh]?.short||sh)}</span>`:''}</div>
      <div class="mt" style="margin-top:8px"><span class="knd">${esc(kindAr(r.kind))}</span>${wk?`<span class="knd sc">شرح: ${esc(WRK[wk]?.title||wk)}</span>`:''}</div></div>`}).join('')}
  </div>`;
}
function viewSeries(id){
  const r=SER.find(x=>x.id===id);if(!r){app.innerHTML='<div class="errbox">سلسلة غير موجودة</div>';return}
  const sh=VID[r.items[0]]?.speakers?.[0];const wk=VID[r.items[0]]?.work;
  setCrumb([{t:'العلوم',a:'#/'},{t:SCI[r.science]?.name||r.science,a:'#/science/'+r.science},{t:r.title}]);
  const total=r.items.reduce((a,v)=>a+(VID[v]?.duration||0),0);
  app.innerHTML=`<div class="sech cin">${esc(r.title)} <small>${r.items.length} درساً · ${fmtT(total)}</small></div>
  <div class="heroc cin">
    ${sh&&PER[sh]?.photo?`<img src="${BASE}/${PER[sh].photo}" onerror="this.remove()">`:''}
    <div class="who"><b>${esc(PER[sh]?.name||'—')}</b><br>${esc(SCI[r.science]?.name||'')} · ${esc(kindAr(r.kind))}${wk&&WRK[wk]?` · يشرح «${esc(WRK[wk].title)}»${WRK[wk].author&&PER[WRK[wk].author]?` لـ${esc(PER[WRK[wk].author].short||WRK[wk].author)}`:''}`:''}</div>
  </div>
  ${r.items.map((v,i)=>{const V=VID[v];return `<div class="ls cin" onclick="location.hash='#/lesson/${v}'">
    <div class="num">${i+1}</div><div class="t">${esc(V?.title||v)}</div>
    <div class="d">${V?fmtT(V.duration):''}</div></div>`}).join('')}`;
}

/* ---------- lesson: stage karaoke (نفس محرك lesson.html) ---------- */
let YTP=null,PH=[],curPh=-1,curW=-1,timer=null,pendPlay=false,SPANS=[];
const PBRK=/[،؛.!؟:…—]$/;
function normAlign(a){ /* irth: {words,start[],dur[]} centiseconds */
  const ws=a.words.split(' ').filter(Boolean);
  return ws.map((w,i)=>[w,(a.start[i]||0)/100,((a.start[i]||0)+(a.dur[i]||0))/100,0]);
}
function buildPhrases(ws){ /* فواصل: ترقيم، سكوت >1.2ث، طول */
  const ph=[];let cur=[],prevE=-1;
  for(const w of ws){
    const gap=w[1]-prevE;
    if(cur.length&&(gap>1.2||cur.length>=12)){ph.push(cur);cur=[]}
    cur.push(w);prevE=w[2];
    if(PBRK.test(w[0])&&cur.length>=3){ph.push(cur);cur=[]}
  }
  if(cur.length)ph.push(cur);
  return ph;
}
function renderPhrase(i){
  const st=document.getElementById('stage');if(!st)return;
  const pos=document.getElementById('pos');
  if(i<0||i>=PH.length)return;
  curPh=i;curW=-1;
  st.innerHTML='<div class="ph">'+PH[i].map((w,k)=>`<span class="w" data-s="${w[1]}">${esc(w[0])}</span>`).join(' ')+'</div>';
  if(pos)pos.textContent=`جملة ${i+1} / ${PH.length}`;
  SPANS=st.querySelectorAll('.w');
}
function tick(){
  if(!YTP||!YTP.getCurrentTime||!PH.length)return;
  const tm=YTP.getCurrentTime();
  const bar=document.getElementById('tm');if(bar)bar.textContent=fmtT(tm)+' / '+fmtT(YTP.getDuration?YTP.getDuration():0);
  const pb=document.getElementById('pbar');if(pb){const d=YTP.getDuration()||1;pb.style.width=(tm/d*100)+'%'}
  let pi=curPh;
  if(pi<0||tm<PH[pi][0][1]-0.3||tm>PH[pi][PH[pi].length-1][2]+0.4){
    pi=-1;for(let i=0;i<PH.length;i++){if(tm<=PH[i][PH[i].length-1][2]+0.4){pi=i;break}}
    if(pi<0)pi=PH.length-1;
    renderPhrase(pi);
  }
  const ph=PH[pi];let wi=-1;
  for(let k=0;k<ph.length;k++){if(tm>=ph[k][1]&&tm<ph[k][2]+0.25){wi=k;break}}
  if(wi<0){for(let k=ph.length-1;k>=0;k--){if(ph[k][1]<=tm){wi=k;break}}}
  if(wi!==curW){
    for(let k=0;k<SPANS.length;k++){
      SPANS[k].classList.toggle('on',k===wi);
      SPANS[k].classList.toggle('read',wi>=0&&k<wi);
      if(k!==wi){SPANS[k].style.background='';SPANS[k].style.webkitBackgroundClip='';SPANS[k].style.backgroundClip='';SPANS[k].style.color=''}
    }
    curW=wi;
  }
  if(wi>=0&&SPANS[wi]){
    const w=ph[wi],f=Math.max(0,Math.min(1,(tm-w[1])/Math.max(.05,w[2]-w[1])));
    const p=Math.round(f*100),sp=SPANS[wi];
    sp.style.background=`linear-gradient(to left,var(--acc) ${p}%,#9aa3b5 ${p}%)`;
    sp.style.webkitBackgroundClip='text';sp.style.backgroundClip='text';sp.style.color='transparent';
  }
}
function seekPhrase(i){if(!YTP||i<0||i>=PH.length)return;YTP.seekTo(Math.max(0,PH[i][0][1]-0.1),true);renderPhrase(i)}
const SPEEDS=[1,1.25,1.5,2,0.75];let spdI=0;
function cycleSpeed(){
  spdI=(spdI+1)%SPEEDS.length;const v=SPEEDS[spdI];
  if(YTP&&YTP.setPlaybackRate)YTP.setPlaybackRate(v);
  const el=document.getElementById('spd');if(el)el.textContent='×'+v;
}
function playToggle(b){
  if(!YTP){pendPlay=true;if(b)b.classList.add('ld');return}
  const s=YTP.getPlayerState&&YTP.getPlayerState();
  (s===1||s===3)?YTP.pauseVideo():YTP.playVideo();
}
function mountPlayer(vid){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  let ready=false;
  setTimeout(()=>{if(!ready){const s=document.getElementById('stage');if(s)s.innerHTML='<span class="wait">المشغّل يتأخر — <a href="https://youtu.be/'+vid+'" target="_blank" rel="noopener" style="color:var(--acc2)">افتح الدرس على يوتيوب مباشرة</a></span>'}},9000);
  window.onYouTubeIframeAPIReady=()=>{
    YTP=new YT.Player('yfp',{events:{
      onReady:()=>{ready=true;const b=document.getElementById('playb');if(b){b.classList.remove('ld');b.innerHTML=I('i-play')}if(pendPlay){YTP.playVideo();pendPlay=false}},
      onStateChange:e=>{
        const b=document.getElementById('playb');const playing=(e.data===1||e.data===3);
        if(b){b.innerHTML=playing?I('i-pause'):I('i-play');b.setAttribute('aria-pressed',playing?'true':'false')}
        if(e.data===1){const st=document.getElementById('stage');if(st)st.classList.remove('idle');if(!timer)timer=setInterval(tick,150)}
        else if(e.data!==3&&timer){clearInterval(timer);timer=null}
      }}});
  };
}
function viewLesson(id){
  const V=VID[id];
  if(!V){app.innerHTML='<div class="errbox">درس غير موجود</div>';return}
  const ser=SER.find(s=>s.items.includes(id));
  const sh=V.speakers?.[0];
  setCrumb([{t:'العلوم',a:'#/'},...(ser?[{t:SCI[ser.science]?.name,a:'#/science/'+ser.science},{t:ser.title,a:'#/series/'+ser.id}]:[]),{t:V.title}]);
  document.getElementById('back').href=ser?'#/series/'+ser.id:'#/';
  document.title=V.title+' — '+(ser?ser.title:'irth');
  const idx=ser?ser.items.indexOf(id):-1;
  const nx=ser&&idx<ser.items.length-1?ser.items[idx+1]:null;
  const pv=ser&&idx>0?ser.items[idx-1]:null;
  app.innerHTML=`
  <div class="lwr">
    <div>
      ${V.yt?`<div class="player"><div id="yfp"></div></div>`:''}
      <div class="stage idle" id="stage"><span class="wait">يُحمّل…</span></div>
      <div class="czone">
        <div class="crow">
          <button class="btn" onclick="seekPhrase(curPh-1)" aria-label="الجملة السابقة">${I('i-prev')}</button>
          <button class="btn" onclick="YTP&&YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)" aria-label="رجوع 10 ثوانٍ">${I('i-rew10')}</button>
          <button class="btn main ld" id="playb" aria-pressed="false" onclick="playToggle(this)" aria-label="تشغيل/إيقاف"></button>
          <button class="btn" onclick="YTP&&YTP.seekTo(YTP.getCurrentTime()+10,true)" aria-label="تقدم 10 ثوانٍ">${I('i-fwd10')}</button>
          <button class="btn" onclick="seekPhrase(curPh+1)" aria-label="الجملة التالية">${I('i-next')}</button>
        </div>
        <div class="csub"><span class="tm" id="tm">0:00</span><span class="pos" id="pos"></span>
          <button class="chip" id="spd" onclick="cycleSpeed()">×1</button>
          ${V.yt?`<a class="chip" href="https://youtu.be/${V.yt}" target="_blank" rel="noopener" style="text-decoration:none">${I('i-yt')} يوتيوب</a>`:''}
        </div>
        <div class="pbar"><i id="pbar"></i></div>
      </div>
      <div class="tabs">
        <div class="tab on" data-t="txt">التفريغ</div>
        <div class="tab" data-t="sum">الملخص</div>
      </div>
      <div class="pane on" id="p-txt"><div class="txtp" id="txt"><div class="skel" style="height:120px"></div></div></div>
      <div class="pane" id="p-sum"><div id="sumw"><div class="skel" style="height:120px"></div></div></div>
      <div class="czone" style="flex-direction:row;justify-content:space-between;padding:8px 14px">
        ${pv?`<a class="chip" href="#/lesson/${pv}" style="text-decoration:none">→ ${esc((VID[pv]?.title||'').slice(0,28))}</a>`:'<span class="chip" style="opacity:.4">→ البداية</span>'}
        ${nx?`<a class="chip" href="#/lesson/${nx}" style="text-decoration:none">${esc((VID[nx]?.title||'').slice(0,28))} ←</a>`:'<span class="chip" style="opacity:.4">النهاية ←</span>'}
      </div>
    </div>
    <div class="side">${ser?ser.items.map((v,i)=>`<div class="ls${v===id?' cur':''}" onclick="location.hash='#/lesson/${v}'"><div class="num">${i+1}</div><div class="t">${esc(VID[v]?.title||v)}</div></div>`).join(''):''}</div>
  </div>`;
  const cur=document.querySelector('.side .ls.cur');if(cur)setTimeout(()=>cur.scrollIntoView({block:'center'}),60);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+t.dataset.t));
  });
  if(V.yt)mountPlayer(V.yt);
  if(timer){clearInterval(timer);timer=null}
  loadStage(id);loadTxt(id);loadSum(id);
}
async function loadStage(id){
  try{
    const a=await jget(`/content/tube/${id}/align.json`);
    PH=buildPhrases(normAlign(a));
    const st=document.getElementById('stage');
    if(st){renderPhrase(0);st.classList.add('idle')}
  }catch(e){const st=document.getElementById('stage');if(st)st.innerHTML='<span class="wait">لا محاذاة لهذا الدرس — تابع التفريغ من التبويب</span>'}
}
async function loadTxt(id){
  const el=document.getElementById('txt');if(!el)return;
  try{el.textContent=await tget(`/content/tube/${id}/transcript.txt`)}
  catch(e){el.innerHTML='<div style="text-align:center;color:var(--dim);padding:30px">التفريغ غير متوفر بعد</div>'}
}
async function loadSum(id){
  const el=document.getElementById('sumw');if(!el)return;
  try{const s=await jget(`/content/tube/${id}/summary.json`);
    el.innerHTML=`<div class="sump">${esc(s.summary)}</div><ul class="pts">${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  }catch(e){el.innerHTML='<div class="sump" style="text-align:center;color:var(--dim)">الملخص غير متوفر بعد</div>'}
}
boot();
</script>
</body>
</html>
