<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دون اتصال — hawshat</title>
<link rel="stylesheet" href="theme.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;padding:20px}
.off{max-width:340px}
.off .ic{width:64px;height:64px;margin:0 auto 16px;color:var(--acc2,#e0c98a)}
.off .ic svg{width:100%;height:100%}
.off h1{font-size:1.3rem;margin:0 0 8px}
.off p{color:var(--dim);font-size:.9rem;margin:0 0 20px}
.off .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.off a{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;background:var(--acc);color:var(--bg,#0b0f1a);font-weight:700;border-radius:12px;text-decoration:none}
.off a.alt{background:transparent;color:var(--acc2,#e0c98a);border:1px solid var(--acc,#c9a24b)}
</style>
</head>
<body>
<div class="off">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 4.5l15 15M9.5 6.8a8 8 0 0 1 8.4 5M6 8.2a8 8 0 0 0-3.4 3.7m3.4 2a3.5 3.5 0 0 1 4.8-1.3"/><circle cx="12" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg></div>
  <h1>لا يوجد اتصال</h1>
  <p>تعذّر الوصول إلى الشبكة. ما حفظته أو قرأته سابقاً لا يزال متاحاً من الذاكرة المحلية.</p>
  <div class="acts">
    <a href="playlists/">سلاسل المشايخ</a>
    <a class="alt" href="javascript:location.reload()">إعادة المحاولة</a>
  </div>
</div>
</body>
</html>
