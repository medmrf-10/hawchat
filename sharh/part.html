<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجزء — شروح الحديث</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>.empty{display:none}.src{font-size:14px;color:var(--soft);margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}</style>
</head>
<body>
<nav class="top"><div class="wrap"><a href="index.html">شروح الحديث</a><a id="crumb" href="#"></a><span id="pt"></span></div></nav>
<main class="wrap">
  <div class="pt-head"><div class="book" id="bmeta"></div><h1 id="ptitle"></h1></div>
  <div class="pt-nav"><a id="prev" href="#">→ الجزء السابق</a><a id="next" href="#">الجزء التالي ←</a></div>
  <div class="refs" id="refs"></div>
  <div class="card field isnad" id="f_isnad"><div class="lab">السند</div><div id="isnad"></div></div>
  <div class="card field matn" id="f_matn"><div class="lab">المتن</div><div id="matn"></div></div>
  <div class="card field" id="f_takhrij"><div class="lab">التخريج</div><div id="takhrij" class="takhrij"></div></div>
  <div class="card field sharh" id="f_sharh"><div class="lab">الشرح</div><div id="sharh"></div></div>
  <div class="card field notes" id="f_notes"><div class="lab">ملاحظات تحقيقية</div><div id="notes"></div></div>
</main>
<script>
const q=new URLSearchParams(location.search),b=q.get('b'),p=+q.get('p');
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
Promise.all([
  fetch(`data/${b}/book.json`).then(r=>r.json()),
  fetch(`data/${b}/p${(''+p).padStart(3,'0')}.json`).then(r=>r.json())
]).then(([B,d])=>{
  document.title=d.hadith_title+' — '+B.title;
  crumb.textContent=B.title; crumb.href=`book.html?b=${b}`;
  pt.textContent=' · الجزء '+p;
  bmeta.textContent=B.author;
  ptitle.textContent=d.hadith_title||d.title;
  if(p>0){prev.href=`part.html?b=${b}&p=${p-1}`}else{prev.style.visibility='hidden'}
  if(p<B.parts.length-1){next.href=`part.html?b=${b}&p=${p+1}`}else{next.style.visibility='hidden'}
  const show=(id,v)=>{if(!v||!v.trim()){document.getElementById(id).classList.add('empty');return false}return true};
  if(show('f_isnad',d.isnad))document.getElementById('isnad').innerHTML=esc(d.isnad);
  if(show('f_matn',d.matn))document.getElementById('matn').innerHTML=esc(d.matn);
  if(show('f_takhrij',d.takhrij))document.getElementById('takhrij').innerHTML=esc(d.takhrij);
  if(show('f_sharh',d.sharh))document.getElementById('sharh').innerHTML=esc(d.sharh)+(d.src?`<div class="src">${esc(d.src)}</div>`:'');
  if(show('f_notes',d.notes))document.getElementById('notes').innerHTML=esc(d.notes);
  const NAMES={bukhari:'صحيح البخاري',muslim:'صحيح مسلم',abudawud:'سنن أبي داود',tirmidhi:'سنن الترمذي',nasai:'سنن النسائي',ibnmajah:'سنن ابن ماجه',muwatta:'الموطأ',other:'مصدر آخر'};
  refs.innerHTML=(d.matn_refs||[]).map(r=>r.id?`<a class="ref-chip" href="hadith.html?book=${r.book}&id=${r.id}">${NAMES[r.book]||r.book} ${r.id}</a>`:`<span class="ref-chip">${NAMES[r.book]||r.book}</span>`).join('');
});
</script>
</body>
</html>
