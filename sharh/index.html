<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شروح الحديث — قاعدة السند والمتن والشرح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav class="top"><div class="wrap"><a href="../turath/">تراث</a><span>شروح الحديث</span></div></nav>
<header class="hero">
  <h1>شروح الحديث</h1>
  <div class="sub">لكل حديث: سندُه ومتنه وتخريجه وشرحُه — مفصولة بدقة يدوية</div>
  <div class="gold-rule"></div>
</header>
<main class="wrap">
  <section class="books" id="books"></section>
</main>
<script>
fetch('data/books.json').then(r=>r.json()).then(B=>{
  const el=document.getElementById('books');
  el.innerHTML=B.map(b=>`
    <a class="card book-card" href="book.html?b=${b.id}">
      <div class="sig">${b.sig||'﴾'}</div>
      <div>
        <h2>${b.title}</h2>
        <div class="meta">${b.author} — ${b.parts} جزءاً — ${b.hadiths} حديثاً</div>
      </div>
      <span class="go">تصفح ←</span>
    </a>`).join('');
});
</script>
</body>
</html>
