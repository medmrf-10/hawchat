<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحديث الأصل — شروح الحديث</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav class="top"><div class="wrap"><a href="index.html">شروح الحديث</a><span id="crumb">متن الحديث</span></div></nav>
<main class="wrap">
  <div class="pt-head"><div class="book" id="bmeta"></div><h1 id="htitle"></h1></div>
  <div class="pt-nav"><a id="prev" href="#">→ السابق</a><a id="next" href="#">التالي ←</a></div>
  <div class="card field matn"><div class="lab">النص (الإسناد والمتن كما في المصدر)</div><div id="txt"></div></div>
</main>
<script>
const q=new URLSearchParams(location.search),book=q.get('book'),id=+q.get('id');
const NAMES={bukhari:'صحيح البخاري',muslim:'صحيح مسلم',abudawud:'سنن أبي داود',tirmidhi:'سنن الترمذي',nasai:'سنن النسائي',ibnmajah:'سنن ابن ماجه',muwatta:'الموطأ'};
fetch(`data/matn/${book}.json`).then(r=>r.json()).then(H=>{
  const h=H[id];
  htitle.textContent=`${NAMES[book]||book} — حديث ${id}`;
  bmeta.textContent='فهرس المتون';
  txt.innerHTML=(h?h.text:'لم يُعثر على النص في هذه النسخة').replace(/\n/g,'<br>');
  const ids=Object.keys(H).map(Number).sort((x,y)=>x-y);const i=ids.indexOf(id);if(i>0)prev.href=`hadith.html?book=${book}prev.href=`hadith.html?book=${book}&id=${id-1}`; next.href=`hadith.html?book=${book}&id=${id+1}`;id=${ids[i-1]}`;else prev.style.visibility="hidden";if(i<ids.length-1)next.href=`hadith.html?book=${book}prev.href=`hadith.html?book=${book}&id=${id-1}`; next.href=`hadith.html?book=${book}&id=${id+1}`;id=${ids[i+1]}`;else next.style.visibility="hidden";
});
</script>
</body>
</html>
