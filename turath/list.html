<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قائمة — تراث</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
/* ── hero ── */
.ghead{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card2));padding:20px;margin-top:6px}
.ghead::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 85% -30%,rgba(201,162,75,.14),transparent 60%);pointer-events:none}
.ghead .row{display:flex;align-items:center;gap:16px;position:relative}
.ghead img{width:74px;height:74px;min-width:74px;border-radius:50%;object-fit:cover;border:2px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,.4)}
.ghead .ph{width:74px;height:74px;min-width:74px;border-radius:50%;border:2px solid var(--border);background:var(--skel);display:flex;align-items:center;justify-content:center;font-family:var(--font-ar);font-size:1.8rem;font-weight:700;color:var(--acc2)}
.ghead .nm{font-family:var(--font-ar);font-weight:700;font-size:1.4rem;line-height:1.4}
.ghead .cat{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:.78rem;font-weight:600;padding:4px 13px;border-radius:99px;border:1px solid var(--border)}
.ghead .cat i{width:8px;height:8px;border-radius:50%}
.ghead .cat.done{color:#7bd88f;border-color:rgba(123,216,143,.35)}.ghead .cat.done i{background:#7bd88f;box-shadow:0 0 8px rgba(123,216,143,.6)}
.ghead .cat.doing{color:#e8c96a;border-color:rgba(232,201,106,.35)}.ghead .cat.doing i{background:#e8c96a;box-shadow:0 0 8px rgba(232,201,106,.6)}
.ghead .cat.none{color:var(--dim)}.ghead .cat.none i{background:var(--dim)}
.ghead .cnt{font-family:var(--font-ar);font-weight:700;font-size:2rem;color:var(--acc2);margin-inline-start:auto;line-height:1}
.ghead .cnt small{display:block;font-family:var(--font-ui);font-weight:400;font-size:.62rem;color:var(--dim);text-align:center;margin-top:4px}
/* ── category switch ── */
.gnav{display:flex;gap:8px;margin:14px 0 4px}
.gnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);text-decoration:none;color:var(--dim);font-size:.72rem;font-weight:600;transition:.15s}
.gnav a b{font-family:var(--font-ar);font-size:1.05rem;font-weight:700}
.gnav a:hover{border-color:var(--acc)}
.gnav a.on{border-color:var(--acc);background:rgba(201,162,75,.08);color:var(--txt)}
.gnav a.on b{color:var(--acc2)}
/* ── toolbar ── */
.tbar{position:sticky;top:56px;z-index:30;display:flex;align-items:center;gap:10px;margin:14px 0 12px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bgt);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbar .hint{flex:1;min-width:0;font-size:.7rem;color:var(--dim);line-height:1.5}
.sbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:var(--r-md);border:1px solid var(--acc);background:linear-gradient(135deg,var(--acc),#a8823a);color:#0b0f1a;font-family:var(--font-ui);font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap;transition:filter .15s,transform .1s}
.sbtn:hover{filter:brightness(1.12)}.sbtn:active{transform:scale(.97)}
.sbtn:disabled{opacity:.55;cursor:default}
.sbtn svg{width:16px;height:16px}
/* ── rows ── */
#wrows{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card2));transition:border-color .15s}
.trow:hover{border-color:rgba(201,162,75,.4)}
.trow.dragging{opacity:.4;border-style:dashed}
.trow.no{border-style:dashed;opacity:.72}
.trow .idx{width:30px;height:30px;min-width:30px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.trow .main{flex:1;min-width:0}
.trow .t{font-family:var(--font-ar);font-weight:700;font-size:.94rem;line-height:1.5}
.trow .t a{color:inherit;text-decoration:none}
.trow .t a:hover{color:var(--acc2)}
.trow .meta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.trow .m{color:var(--dim);font-size:.66rem;white-space:nowrap}
.trow .m b{color:var(--txt);font-weight:600}
.tdots{display:flex;gap:3px;align-items:center}
.tdots i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--border)}
.tdots i.on{background:var(--acc);border-color:var(--acc)}
.tdots i.half{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.pbar{height:4px;border-radius:99px;background:var(--card2);border:1px solid var(--border);overflow:hidden;flex:0 0 64px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
/* controls */
.ctl{display:flex;flex-direction:column;gap:4px;min-width:34px}
.ctl button{width:34px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:.12s}
.ctl button:hover{border-color:var(--acc);color:var(--acc2)}
.ctl button:active{transform:scale(.94)}
.ctl svg{width:12px;height:12px}
.grip{color:var(--dim);cursor:grab;font-size:.9rem;letter-spacing:-3px;user-select:none;touch-action:none;padding:6px 0;line-height:1}
.ttag{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:600;padding:6px 12px;border-radius:99px;border:1.2px solid var(--border);color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;transition:.15s}
.ttag.want{color:#7bd88f;border-color:rgba(123,216,143,.55);background:rgba(123,216,143,.08)}
.ttag.strong{color:var(--acc);border-color:var(--acc);background:rgba(201,162,75,.14);font-weight:800}
.ttag.no{color:#e88f8f;border-color:rgba(232,143,143,.5);background:rgba(232,143,143,.07)}
.yl{display:inline-flex;color:#b05a5a;padding:4px}
.yl:hover{color:#d97a7a}
.yl svg{width:16px;height:16px;display:block}
/* footer save */
.fsave{position:fixed;bottom:0;right:0;left:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent);display:flex;justify-content:center;pointer-events:none;z-index:35}
.fsave .in{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:99px;border:1px solid var(--border);background:var(--bgt);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.fsave .st{font-size:.68rem;color:var(--dim);padding:0 10px}
.fsave .st b{color:var(--acc2)}
#wtoast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);color:var(--txt);padding:9px 20px;border-radius:99px;font-size:.76rem;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#wtoast.on{opacity:1}#wtoast.err{border-color:#e88f8f;color:#e88f8f}
.empty{color:var(--dim);padding:30px;text-align:center}
@media(max-width:520px){
  .trow{flex-wrap:wrap;gap:8px}
  .trow .main{flex:1 1 calc(100% - 130px)}
  .ctl{flex-direction:row}.ctl button{width:32px;height:30px}
  .grip{display:none}
  .tbar{top:52px}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="#" class="btn" aria-label="رجوع" style="text-decoration:none" id="bck">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem" id="hdr-sub">قائمة — تراث</span>
</div></header>
<main><div class="wrap" id="body"><div class="empty">جارٍ التحميل…</div></div></main>
<div id="wtoast"></div>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const WREPO={o:'medmrf-10',r:'hawchat',br:'main',path:'track/wants.json'};
const WLS='hw_track_wants_v1',WLT='hw_ghtok';
const WTOPIC='hawchat-wants-9f3kq7x';
let wants={version:1,updated_at:null,groups:{}},dirty=false;
function ridOf(t){return t.yt?t.yt.split('list=')[1]:'t:'+t.t}
function wgrp(sl){return wants.groups[sl]||(wants.groups[sl]={order:[],tags:{}})}
function wloadLS(){try{const s=JSON.parse(localStorage.getItem(WLS));if(s&&s.groups){wants=s;return true}}catch(e){}return false}
function wsaveLS(){wants.updated_at=new Date().toISOString();localStorage.setItem(WLS,JSON.stringify(wants));dirty=true;updSave()}
if(location.hash.startsWith('#t=')){try{localStorage.setItem(WLT,location.hash.slice(3));history.replaceState(null,'',location.pathname)}catch(e){}}
function wtoast(m,e){const t=document.getElementById('wtoast');t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400)}
async function wgh(m,u,body){const t=localStorage.getItem(WLT);if(!t)throw new Error('no-token');
  const r=await fetch('https://api.github.com'+u,{method:m,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):null});
  if(r.status===404)return null;if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,120))}return r.json()}
const GLBL={done:'تم تفريغه',doing:'يجري تفريغه',none:'لم يُفرَّغ'};
const GORD=['done','doing','none'];
function gf(t,g){return g==='done'?t.st==='complete':g==='doing'?t.st==='partial':(t.st!=='complete'&&t.st!=='partial')}
let _slug='',_g='done',_rows=[],_all=[],_wg=null,_meta={},_im=null;
function updSave(){const b=document.getElementById('wsav2');if(b){b.disabled=!dirty}}
async function saveAll(btn){
  wtoast('يحفظ…');wsaveLS();
  const t=localStorage.getItem(WLT);
  if(btn)btn.disabled=true;
  if(t){
    try{
      const cur=await wgh('GET','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path+'?ref='+WREPO.br);
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(wants,null,1))));
      const body={message:'track: حفظ ترتيب وتعليم السلاسل',content:b64,branch:WREPO.br};
      if(cur&&cur.sha)body.sha=cur.sha;
      await wgh('PUT','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path,body);
      dirty=false;updSave();wtoast('حُفظ في الموقع ✓');
      if(btn)btn.disabled=false;return;
    }catch(e){/* fall through to bridge */}
  }
  // no token / api failed → bridge: POST to the topic my box listens to
  try{
    const r=await fetch('https://ntfy.sh/'+WTOPIC,{method:'POST',body:JSON.stringify(wants)});
    if(!r.ok)throw new Error('bridge '+r.status);
    wtoast('أُرسل — يُحفظ في الموقع تلقائياً خلال لحظات…');
    const want=wants.updated_at;
    setTimeout(async()=>{
      for(let i=0;i<5;i++){
        const f=await j('../track/wants.json?_='+Date.now());
        if(f&&f.updated_at&&f.updated_at>=want){dirty=false;updSave();wtoast('حُفظ في الموقع ✓');if(btn)btn.disabled=false;return}
        await new Promise(z=>setTimeout(z,9000));
      }
      wtoast('وصل الطلب — سيُرفع للموقع عند أول فرصة');if(btn)btn.disabled=false;
    },9000);
  }catch(e){wtoast('تعذّر الإرسال: '+e.message,1);if(btn)btn.disabled=false}
}
function render(){
  const B=document.getElementById('body');
  const nm=_meta.name_display||_meta.name||_slug;
  let h='<div class="ghead cin"><div class="row">'
    +(_im?'<img src="'+esc(_im)+'" alt="">':'<div class="ph">'+esc((nm||'؟').replace(/^ال/,'').trim()[0]||'؟')+'</div>')
    +'<div><div class="nm">'+esc(nm)+'</div><span class="cat '+_g+'"><i></i>'+GLBL[_g]+'</span></div>'
    +'<div class="cnt">'+_rows.length+'<small>سلسلة</small></div></div></div>';
  h+='<div class="gnav cin">'+GORD.map(g=>{
      const c=_all.filter(t=>gf(t,g)).length;
      return '<a href="list.html?s='+encodeURIComponent(_slug)+'&g='+g+'" class="'+(g===_g?'on':'')+'"><b>'+c+'</b>'+GLBL[g]+'</a>'}).join('')+'</div>';
  h+='<div class="tbar cin"><span class="hint">اسحب البطاقة أو استعمل السهمين للترتيب · انقر العلامة لتعليمها (مرغوبة ← بشدة ← لا)</span>'
    +'<button class="sbtn" id="wsav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>حفظ</button></div>';
  if(!_rows.length){B.innerHTML=h+'<div class="empty">لا سلاسل في هذه الفئة.</div>';bindSave();return}
  h+='<div id="wrows">';
  _rows.forEach((t,i)=>{
    const r=ridOf(t),tg=(_wg.tags||{})[r]||'';
    const pub3=t.pub;
    const alP=t.al==='done',alH=!alP&&t.al&&/\//.test(t.al);
    const num=t.exp?('<b>'+t.n+'</b>/'+t.exp):'<b>'+t.n+'</b>';
    const hrs=t.hours!=null?' · '+t.hours+'س':'';
    const pct=t.exp?Math.min(100,Math.round(100*t.n/t.exp)):null;
    const tH=t.pslug?'<a href="series.html?s='+encodeURIComponent(t.pslug)+'">'+esc(t.t)+'</a>':esc(t.t);
    h+='<div class="trow cin'+(tg==='no'?' no':'')+'" draggable="true" data-r="'+esc(r)+'" style="animation-delay:'+Math.min(i,25)*28+'ms">'
      +'<span class="idx">'+(i+1)+'</span>'
      +'<span class="main"><span class="t">'+tH+'</span>'
      +'<span class="meta"><span class="m">'+num+' درس'+hrs+'</span>'
      +(pct!=null?'<span class="pbar"><i style="width:'+pct+'%"></i></span>':'')
      +'<span class="tdots"><i class="on"></i><i class="'+(t.st==='complete'?'on':t.st==='partial'?'half':'')+'"></i><i class="'+(alP?'on':alH?'half':'')+'"></i><i class="'+(pub3?'on':'')+'"></i></span>'
      +(t.yt?'<a class="yl" href="'+esc(t.yt)+'" target="_blank" rel="noopener" title="قائمة يوتيوب"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.85-.46-5.58a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.15 1 12 1 12s0 3.85.46 5.58a2.78 2.78 0 0 0 1.94 2c1.72.42 8.6.42 8.6.42s8.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.85 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5z"/></svg></a>':'')
      +'</span></span>'
      +'<span class="ttag'+(tg?' '+tg:'')+'" data-r="'+esc(r)+'">'+({want:'مرغوبة',strong:'بشدة',no:'غير مرغوبة'}[tg]||'تعليم')+'</span>'
      +'<span class="ctl"><button data-mv="-1" aria-label="أعلى"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button><button data-mv="1" aria-label="أسفل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button></span>'
      +'<span class="grip">⋮⋮⋮</span>'
      +'</div>'});
  h+='</div>';
  h+='<div class="fsave"><div class="in"><span class="st"><b>'+_rows.length+'</b> سلسلة — '+(dirty?'تغييرات غير محفوظة':'لا تغييرات')+'</span><button class="sbtn" id="wsav2" disabled>حفظ التغييرات</button></div></div>';
  B.innerHTML=h;
  bindAll();
}
function bindSave(){
  const sv=document.getElementById('wsav');if(sv)sv.onclick=e=>saveAll(e.target.closest('button'));
}
function bindAll(){
  bindSave();
  const box=document.getElementById('wrows');if(!box)return;
  const TAGS=['','want','strong','no'],TLBL={'':'تعليم',want:'مرغوبة',strong:'بشدة',no:'غير مرغوبة'};
  const s2=document.getElementById('wsav2');if(s2)s2.onclick=e=>saveAll(e.target.closest('button'));
  box.querySelectorAll('.ttag').forEach(t=>t.onclick=e=>{e.stopPropagation();
    const r=t.dataset.r,g=wgrp(_slug),cur=g.tags[r]||'',nx=TAGS[(TAGS.indexOf(cur)+1)%TAGS.length];
    if(nx)g.tags[r]=nx;else delete g.tags[r];
    t.className='ttag'+(nx?' '+nx:'');t.textContent=TLBL[nx];
    t.closest('.trow').classList.toggle('no',nx==='no');
    wsaveLS();});
  let dragEl=null;
  box.querySelectorAll('.trow').forEach(r=>{
    r.addEventListener('dragstart',()=>{dragEl=r;r.classList.add('dragging')});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');renum()});
    r.addEventListener('dragover',e=>{e.preventDefault();if(!dragEl||dragEl===r)return;
      const rc=r.getBoundingClientRect(),aft=(e.clientY-rc.top)>rc.height/2;
      box.insertBefore(dragEl,aft?r.nextSibling:r);});
  });
  function renum(){
    [...box.querySelectorAll('.trow')].forEach((x,i)=>x.querySelector('.idx').textContent=i+1);
    wgrp(_slug).order=[...box.querySelectorAll('.trow')].map(x=>x.dataset.r);wsaveLS();
  }
  box.querySelectorAll('.ctl button').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const r=b.closest('.trow'),sib=b.dataset.mv==='-1'?r.previousElementSibling:r.nextElementSibling;
    if(!sib||!sib.classList.contains('trow'))return;
    box.insertBefore(r,b.dataset.mv==='-1'?sib:sib.nextSibling);
    renum()});
}
(async()=>{
  const P=new URLSearchParams(location.search);
  _slug=P.get('s')||'';_g=GORD.includes(P.get('g'))?P.get('g'):'done';
  const [tr,meta,ph,sidx,wf]=await Promise.all([j('../track/data.json'),j('../playlists/data/sheikhs.json'),j('../playlists/photos.json'),j('../playlists/series/index.json'),j('../track/wants.json')]);
  if(!wloadLS()&&wf&&wf.groups)wants=wf;else if(wf&&wf.groups&&(!wants.updated_at||(wf.updated_at&&wf.updated_at>wants.updated_at)))wants=wf;
  _meta={};for(const x of (meta?meta.sheikhs:[]))if(x.slug===_slug){_meta=x;break}
  const nm=_meta.name_display||_meta.name||_slug;
  document.getElementById('bck').href='sheikh.html?s='+encodeURIComponent(_slug);
  document.getElementById('hdr-sub').textContent=GLBL[_g]+' — '+nm;
  document.title=GLBL[_g]+' — '+nm;
  _im=(ph&&(ph[nm]||ph[_meta.name]))||_meta.photo||null;
  if(_im&&_im[0]!=='h'&&_im[0]!=='.')_im='../playlists/'+_im.replace(/^playlists\//,'');
  _all=((tr&&tr.sheikhs&&tr.sheikhs[_slug])||[]);
  // attach published-series slug for linking
  if(sidx&&sidx.series)_all.forEach(t=>{const s=sidx.series.find(x=>x.sheikh_slug===_slug&&(t.pub&&t.t.includes(x.title.slice(0,12))));if(s)t.pslug=s.slug});
  _rows=_all.filter(t=>gf(t,_g));
  _wg=wgrp(_slug);
  const ord=_wg.order||[];
  _rows.sort((a,b)=>{const ia=ord.indexOf(ridOf(a)),ib=ord.indexOf(ridOf(b));return (ia<0?1e9:ia)-(ib<0?1e9:ib)});
  render();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
