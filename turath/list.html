<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قائمة — تراث</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:860px;margin:0 auto;padding:14px}
.wbar{display:flex;gap:7px;margin:8px 0 10px;align-items:center}
.wbar .n{flex:1;font-size:.68rem;color:var(--dim)}
.wbtn{font-size:.68rem;padding:5px 13px;border-radius:99px;border:1px solid var(--acc);background:rgba(201,162,75,.14);color:var(--acc2);cursor:pointer;font-family:inherit}
.wbtn.gh{border-color:var(--border);background:var(--card);color:var(--dim)}
.trow{display:flex;align-items:center;gap:7px;padding:7px 6px;border-bottom:1px solid rgba(201,162,75,.05);font-size:.83rem;border-radius:6px}
.trow:hover{background:rgba(201,162,75,.04)}
.trow.dragging{opacity:.35;background:rgba(201,162,75,.1)}
.trow .grip{color:var(--dim);cursor:grab;font-size:.82rem;letter-spacing:-2px;user-select:none;touch-action:none}
.tmv{display:flex;flex-direction:column}
.tmv b{font-size:.56rem;color:var(--dim);cursor:pointer;padding:0 3px;line-height:1.3;font-weight:400}
.tmv b:hover{color:var(--acc2)}
.trow .t{flex:1;min-width:0;line-height:1.45}
.trow .t a{color:inherit;text-decoration:none}
.trow .t a:hover{color:var(--acc2)}
.trow .m{color:var(--dim);font-size:.66rem;white-space:nowrap}
.tdots{display:flex;gap:3px}
.tdots i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--border)}
.tdots i.on{background:var(--acc);border-color:var(--acc)}
.tdots i.half{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.ttag{font-size:.6rem;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.ttag.want{color:#7bd88f;border-color:rgba(123,216,143,.5)}
.ttag.strong{color:var(--acc);border-color:var(--acc);background:rgba(201,162,75,.15);font-weight:700}
.ttag.no{color:#e88f8f;border-color:rgba(232,143,143,.4)}
.trow .yl{color:#b05a5a;display:inline-flex}
.trow .yl:hover{color:#d97a7a}
.ghead{display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 16px;margin-top:6px}
.ghead img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.ghead .nm{font-weight:700;font-size:1rem}
.ghead .gt{font-size:.7rem;color:var(--dim)}
.ghead .gt b{color:var(--acc2)}
#wtoast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:7px 16px;border-radius:99px;font-size:.74rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#wtoast.on{opacity:1}#wtoast.err{border-color:#e88f8f;color:#e88f8f}
.empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="#" class="btn" aria-label="رجوع" style="text-decoration:none" id="bck">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem" id="hdr-sub">قائمة — تراث</span>
</div></header>
<main><div class="wrap" id="body"><div class="empty">جارٍ التحميل…</div></div></main>
<div id="wtoast"></div>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const WREPO={o:'medmrf-10',r:'hawchat',br:'main',path:'track/wants.json'};
const WLS='hw_track_wants_v1',WLT='hw_ghtok';
let wants={version:1,updated_at:null,groups:{}};
function ridOf(t){return t.yt?t.yt.split('list=')[1]:'t:'+t.t}
function wgrp(sl){return wants.groups[sl]||(wants.groups[sl]={order:[],tags:{}})}
function wloadLS(){try{const s=JSON.parse(localStorage.getItem(WLS));if(s&&s.groups){wants=s;return true}}catch(e){}return false}
function wsaveLS(){wants.updated_at=new Date().toISOString();localStorage.setItem(WLS,JSON.stringify(wants))}
if(location.hash.startsWith('#t=')){try{localStorage.setItem(WLT,location.hash.slice(3));history.replaceState(null,'',location.pathname)}catch(e){}}
function wtoast(m,e){const t=document.getElementById('wtoast');t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400)}
async function wgh(m,u,body){const t=localStorage.getItem(WLT);if(!t)throw new Error('no-token');
  const r=await fetch('https://api.github.com'+u,{method:m,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):null});
  if(r.status===404)return null;if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,120))}return r.json()}
const GLBL={done:'تم تفريغه',doing:'يجري تفريغه',none:'لم يُفرَّغ'};
function gf(t,g){return g==='done'?t.st==='complete':g==='doing'?t.st==='partial':(t.st!=='complete'&&t.st!=='partial')}
(async()=>{
  const P=new URLSearchParams(location.search);
  const slug=P.get('s')||'',g=P.get('g')||'done';
  const [tr,meta,ph,sidx,wf]=await Promise.all([j('../track/data.json'),j('../playlists/data/sheikhs.json'),j('../playlists/photos.json'),j('../playlists/series/index.json'),j('../track/wants.json')]);
  if(!wloadLS()&&wf&&wf.groups)wants=wf;else if(wf&&wf.groups&&(!wants.updated_at||(wf.updated_at&&wf.updated_at>wants.updated_at)))wants=wf;
  const msl={};for(const x of (meta?meta.sheikhs:[]))msl[x.slug]=x;
  const m=msl[slug]||{},nm=m.name_display||m.name||slug;
  document.getElementById('bck').href='sheikh.html?s='+encodeURIComponent(slug);
  document.getElementById('hdr-sub').textContent=GLBL[g]+' — '+nm;
  document.title=GLBL[g]+' — '+nm;
  const B=document.getElementById('body');
  let im=(ph&&(ph[nm]||ph[m.name]))||m.photo||null;
  if(im&&im[0]!=='h'&&im[0]!=='.')im='../playlists/'+im.replace(/^playlists\//,'');
  const tlist=((tr&&tr.sheikhs&&tr.sheikhs[slug])||[]).filter(t=>gf(t,g));
  let h='<div class="ghead cin">'+(im?'<img src="'+esc(im)+'" alt="">':'')
    +'<div><div class="nm">'+esc(nm)+'</div><div class="gt"><b>'+GLBL[g]+'</b> — '+tlist.length+' سلسلة</div></div></div>';
  if(!tlist.length){B.innerHTML=h+'<div class="empty">لا سلاسل في هذه الفئة.</div>';return}
  h+='<div class="wbar cin"><span class="n">انقر العلامة للتعليم · اسحب أو استعمل الأسهم للترتيب · «حفظ» يرفع للمستودع</span>'
    +'<button class="wbtn gh" id="wdl">JSON ⤓</button><button class="wbtn" id="wsav">حفظ</button></div>';
  h+='<div id="wrows">';
  const wg=wgrp(slug),ord=wg.order||[];
  const idx=tlist.map((t,i)=>({t,i})).sort((a,b)=>{const ia=ord.indexOf(ridOf(a.t)),ib=ord.indexOf(ridOf(b.t));return (ia<0?9999:ia)-(ib<0?9999:ib)||a.i-b.i});
  for(const {t} of idx){
    const r=ridOf(t),tg=(wg.tags||{})[r]||'';
    const pub3=(sidx&&sidx.series.some(x=>x.sheikh_slug===slug&&t.t.includes(x.title.slice(0,12))))||t.pub;
    const alP=t.al==='done',alH=!alP&&t.al&&/\//.test(t.al);
    const num=t.exp?t.n+'/'+t.exp:t.n;
    const hrs=t.hours!=null?' · '+t.hours+'س':'';
    const pSlug=pub3&&sidx?(sidx.series.find(x=>x.sheikh_slug===slug&&t.t.includes(x.title.slice(0,12)))||{}).slug:null;
    const tH=pSlug?'<a href="series.html?s='+encodeURIComponent(pSlug)+'">'+esc(t.t)+'</a>':esc(t.t);
    h+='<div class="trow" draggable="true" data-r="'+esc(r)+'">'
      +'<span class="grip">⋮⋮</span><span class="tmv"><b data-mv="-1">▲</b><b data-mv="1">▼</b></span>'
      +'<span class="t">'+tH+'</span>'
      +'<span class="m">'+num+' درس'+hrs+'</span>'
      +'<span class="tdots"><i class="on"></i><i class="'+(t.st==='complete'?'on':t.st==='partial'?'half':'')+'"></i><i class="'+(alP?'on':alH?'half':'')+'"></i><i class="'+(pub3?'on':'')+'"></i></span>'
      +'<span class="ttag'+(tg?' '+tg:'')+'" data-r="'+esc(r)+'">'+({want:'مرغوبة',strong:'بشدة',no:'لا'}[tg]||'—')+'</span>'
      +(t.yt?'<a class="yl" href="'+esc(t.yt)+'" target="_blank" rel="noopener" title="قائمة يوتيوب"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.85-.46-5.58a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.15 1 12 1 12s0 3.85.46 5.58a2.78 2.78 0 0 0 1.94 2c1.72.42 8.6.42 8.6.42s8.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.85 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5z"/></svg></a>':'')
      +'</div>'}
  h+='</div>';
  B.innerHTML=h;
  bindWants(slug);
})();
function bindWants(slug){
  const box=document.getElementById('wrows');if(!box)return;
  const TAGS=['','want','strong','no'],TLBL={'':'—',want:'مرغوبة',strong:'بشدة',no:'لا'};
  box.querySelectorAll('.ttag').forEach(t=>t.onclick=e=>{e.stopPropagation();
    const r=t.dataset.r,g=wgrp(slug),cur=g.tags[r]||'',nx=TAGS[(TAGS.indexOf(cur)+1)%TAGS.length];
    if(nx)g.tags[r]=nx;else delete g.tags[r];
    t.className='ttag'+(nx?' '+nx:'');t.textContent=TLBL[nx];wsaveLS();wtoast('حُفظت محلياً — «حفظ» يرفعها');});
  let dragEl=null;
  box.querySelectorAll('.trow').forEach(r=>{
    r.addEventListener('dragstart',()=>{dragEl=r;r.classList.add('dragging')});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');wgrp(slug).order=[...box.querySelectorAll('.trow')].map(x=>x.dataset.r);wsaveLS()});
    r.addEventListener('dragover',e=>{e.preventDefault();if(!dragEl||dragEl===r)return;
      const rc=r.getBoundingClientRect(),aft=(e.clientY-rc.top)>rc.height/2;
      box.insertBefore(dragEl,aft?r.nextSibling:r);});
  });
  box.querySelectorAll('.tmv b').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const r=b.closest('.trow'),sib=b.dataset.mv==='-1'?r.previousElementSibling:r.nextElementSibling;
    if(!sib||!sib.classList.contains('trow'))return;
    box.insertBefore(r,b.dataset.mv==='-1'?sib:sib.nextSibling);
    wgrp(slug).order=[...box.querySelectorAll('.trow')].map(x=>x.dataset.r);wsaveLS();wtoast('حُفظ الترتيب محلياً');});
  document.getElementById('wdl').onclick=()=>{
    const b=new Blob([JSON.stringify(wants,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wants.json';a.click()};
  document.getElementById('wsav').onclick=async()=>{
    wtoast('يحفظ…');wsaveLS();
    const t=localStorage.getItem(WLT);
    if(!t){wtoast('لا رمز — «JSON ⤓» تنزّل نسخة، أو مرّر الرمز برابط #t=',1);return}
    try{
      const cur=await wgh('GET','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path+'?ref='+WREPO.br);
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(wants,null,1))));
      const body={message:'track: حفظ ترتيب وتعليم السلاسل',content:b64,branch:WREPO.br};
      if(cur&&cur.sha)body.sha=cur.sha;
      await wgh('PUT','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path,body);
      wtoast('حُفظ في track/wants.json ✓');
    }catch(e){wtoast('فشل: '+e.message,1)}};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
