<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-top:8px}
.hero .ph{width:96px;height:96px;min-width:96px;border-radius:50%;background:var(--skel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:var(--font-ar);font-size:2rem;font-weight:700;color:var(--acc2)}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{font-family:var(--font-ar);font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hero .als{color:var(--dim);font-size:.78rem;margin-top:5px}
.hero .grp{display:inline-block;margin-top:8px;font-size:.7rem;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:3px 12px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.sec h2{font-family:var(--font-ar);font-size:1.05rem;font-weight:700;color:var(--acc2);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--border)}
.lnk{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-md);text-decoration:none;color:var(--txt);margin-bottom:8px;transition:border-color .15s}
.lnk:hover{border-color:var(--acc)}
.lnk .ic{width:34px;height:34px;min-width:34px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--acc2);font-size:.95rem}
.lnk .av{width:56px;height:56px;min-width:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--skel)}
.lnk .vbadge{width:18px;height:18px;flex:none;color:var(--dim)}
.lnk .vbadge svg{width:100%;height:100%;display:block}
.lnk .yts{min-width:26px;display:flex;align-items:center;justify-content:center;color:var(--acc2)}
.lnk .yts svg{width:20px;height:20px;display:block}
.lnk .fmt{flex:none;font-size:.72rem;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--dim);background:var(--card2)}
.lnk .fmt[data-k="pdf"]{color:#e8a06a;border-color:rgba(232,160,106,.35)}
.lnk .fmt[data-k="epub"]{color:var(--acc3);border-color:rgba(139,124,246,.35)}
.lnk .fmt[data-k="docx"]{color:var(--acc2);border-color:rgba(201,162,75,.35)}
.lnk .fmt[data-k="نص"]{color:var(--ok);border-color:rgba(70,201,109,.35)}
.lnk .fmt[data-k="بحث"]{color:var(--dim);border-style:dashed}
.lnk .t{flex:1;font-size:.88rem}
.lnk .d{display:block;font-size:.68rem;color:var(--dim);margin-top:2px}
.lnk .arw{color:var(--dim);font-size:.8rem}
.tag{display:inline-block;font-size:.62rem;padding:2px 9px;border-radius:99px;background:rgba(70,201,109,.12);color:var(--ok);margin-right:6px}
.empty{color:var(--dim);font-size:.8rem;padding:8px 0}
.notes{color:var(--txt);font-size:.85rem;line-height:1.8}
.st{display:inline-block;font-size:.68rem;padding:3px 12px;border-radius:99px;border:1px solid var(--border);color:var(--dim)}
.st.pending{border-color:var(--acc);color:var(--acc2)}
.bdg{font-size:.66rem;padding:3px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
.bdg.ok{color:#7bd88f;border-color:rgba(123,216,143,.4);background:rgba(123,216,143,.08)}
.bdg.part{color:#e8c96a;border-color:rgba(232,201,106,.4);background:rgba(232,201,106,.08)}
.bdg.unk{color:var(--dim)}
.bdg.pub{color:var(--acc);border-color:var(--acc);background:rgba(201,162,75,.12)}
.bdg.aln{color:#8fb8ff;border-color:rgba(143,184,255,.4);background:rgba(143,184,255,.08)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px;font-size:.84rem}
.tr .tt{flex:1;min-width:0}
.tr .mm{color:var(--dim);font-size:.7rem;white-space:nowrap}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.scard{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;transition:border-color .15s}
.scard:hover{border-color:var(--acc)}
.scard .t{font-family:var(--font-ar);font-weight:700;font-size:.95rem;line-height:1.5}
.scard .ch{font-size:.68rem;color:var(--dim);margin-top:2px}
.scard .cstats{display:flex;gap:6px;margin:10px 0 9px}
.scard .stat{flex:1;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 4px}
.scard .stat .v{font-family:var(--font-ar);font-weight:700;font-size:1.02rem;color:var(--acc2)}
.scard .stat .l{font-size:.6rem;color:var(--dim);margin-top:1px}
.scard .beads{display:flex;align-items:center;gap:0;margin:9px 0}
.scard .bd{display:flex;align-items:center;gap:5px;flex:1}
.scard .bd::after{content:"";flex:1;height:1px;background:var(--border);margin:0 6px}
.scard .bd:last-child{flex:0}
.scard .bd:last-child::after{display:none}
.scard .dot{width:11px;height:11px;min-width:11px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:.2s}
.scard .bd .bl{font-size:.58rem;color:var(--dim);white-space:nowrap}
.scard .bd.on .dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px rgba(201,162,75,.45)}
.scard .bd.on .bl{color:var(--acc2)}
.scard .bd.half .dot{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.scard .bd.half .bl{color:#e8c96a}
.scard .foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.scard .ytl{display:inline-flex;align-items:center;gap:5px;font-size:.64rem;color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:99px;padding:3px 10px}
.scard .ytl:hover{color:var(--acc2);border-color:var(--acc)}
.scard .ytl svg{width:13px;height:13px}
.trow{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid rgba(201,162,75,.05);font-size:.8rem;border-radius:6px}
.trow:hover{background:rgba(201,162,75,.04)}
.trow.dragging{opacity:.35;background:rgba(201,162,75,.1)}
.trow .grip{color:var(--dim);cursor:grab;font-size:.8rem;letter-spacing:-2px;user-select:none;touch-action:none}
.tmv{display:flex;flex-direction:column}
.tmv b{font-size:.55rem;color:var(--dim);cursor:pointer;padding:0 3px;line-height:1.3;font-weight:400}
.tmv b:hover{color:var(--acc2)}
.trow .t{flex:1;min-width:0;line-height:1.4}
.trow .t a{color:inherit;text-decoration:none}
.trow .m{color:var(--dim);font-size:.64rem;white-space:nowrap}
.tdots{display:flex;gap:3px}
.tdots i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--border)}
.tdots i.on{background:var(--acc);border-color:var(--acc)}
.tdots i.half{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.ttag{font-size:.58rem;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.ttag.want{color:#7bd88f;border-color:rgba(123,216,143,.5)}
.ttag.strong{color:var(--acc);border-color:var(--acc);background:rgba(201,162,75,.15);font-weight:700}
.ttag.no{color:#e88f8f;border-color:rgba(232,143,143,.4)}
.wbar{display:flex;gap:7px;margin-bottom:8px;align-items:center}
.wbar .n{flex:1;font-size:.66rem;color:var(--dim)}
.wbtn{font-size:.66rem;padding:4px 11px;border-radius:99px;border:1px solid var(--acc);background:rgba(201,162,75,.14);color:var(--acc2);cursor:pointer;font-family:inherit}
.wbtn.gh{border-color:var(--border);background:var(--card2);color:var(--dim)}
#wtoast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:7px 16px;border-radius:99px;font-size:.74rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#wtoast.on{opacity:1}#wtoast.err{border-color:#e88f8f;color:#e88f8f}
.wgrp{margin-top:10px}
.wgrp .gh{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;padding:5px 8px;border-radius:7px;background:var(--card2);border-right:3px solid var(--border);margin-bottom:2px}
.wgrp .gh .c{font-weight:400;font-size:.62rem;color:var(--dim)}
.wgrp.done .gh{border-right-color:#7bd88f;color:#7bd88f}
.wgrp.doing .gh{border-right-color:#e8c96a;color:#e8c96a}
.wgrp.none .gh{border-right-color:var(--dim);color:var(--dim)}
.trow .yl{color:#b05a5a;display:inline-flex}
.trow .yl:hover{color:#d97a7a}
/* ── فئات التفريغ — ثلاث بلاطات ── */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat-t{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-md);background:linear-gradient(145deg,var(--card),var(--card2));padding:16px 14px;text-decoration:none;color:var(--txt);transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:6px;min-height:104px}
.cat-t:hover{transform:translateY(-2px)}
.cat-t::before{content:"";position:absolute;top:0;right:0;left:0;height:3px}
.cat-t.done::before{background:linear-gradient(90deg,transparent,#7bd88f)}.cat-t.done:hover{border-color:rgba(123,216,143,.5)}
.cat-t.doing::before{background:linear-gradient(90deg,transparent,#e8c96a)}.cat-t.doing:hover{border-color:rgba(232,201,106,.5)}
.cat-t.none::before{background:linear-gradient(90deg,transparent,var(--dim))}.cat-t.none:hover{border-color:var(--dim)}
.cat-t .cv{font-family:var(--font-ar);font-weight:700;font-size:1.8rem;line-height:1.1}
.cat-t.done .cv{color:#7bd88f}.cat-t.doing .cv{color:#e8c96a}.cat-t.none .cv{color:var(--txt)}
.cat-t .cl{font-size:.72rem;font-weight:600;color:var(--dim)}
.cat-t .cd{font-size:.6rem;color:var(--dim);opacity:.8}
.cat-t .go{position:absolute;top:14px;left:14px;color:var(--dim);font-size:.9rem;transition:.15s}
.cat-t:hover .go{color:var(--acc2);transform:translateX(-3px)}
@media(max-width:480px){.cats{grid-template-columns:1fr 1fr 1fr;gap:7px}.cat-t{padding:12px 10px;min-height:92px}.cat-t .cv{font-size:1.45rem}.cat-t .cl{font-size:.62rem}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="." class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">تراث</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem" id="hdr-sub">بطاقة الشيخ</span>
</div></header>
<main><div class="wrap">
  <div id="body"><div class="empty">جارٍ التحميل…</div></div>
</div></main>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function norm(s){return (s||'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
/* ── تعليم وترتيب السلاسل (مشترك مع track/wants.json) ── */
const WREPO={o:'medmrf-10',r:'hawchat',br:'main',path:'track/wants.json'};
const WLS='hw_track_wants_v1',WLT='hw_ghtok';
let wants={version:1,updated_at:null,groups:{}};
function ridOf(t){return t.yt?t.yt.split('list=')[1]:'t:'+t.t}
function wgrp(sl){return wants.groups[sl]||(wants.groups[sl]={order:[],tags:{}})}
function wloadLS(){try{const s=JSON.parse(localStorage.getItem(WLS));if(s&&s.groups){wants=s;return true}}catch(e){}return false}
function wsaveLS(){wants.updated_at=new Date().toISOString();localStorage.setItem(WLS,JSON.stringify(wants))}
if(location.hash.startsWith('#t=')){try{localStorage.setItem(WLT,location.hash.slice(3));history.replaceState(null,'',location.pathname)}catch(e){}}
function wtoast(m,e){const t=document.getElementById('wtoast');if(!t)return;t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400)}
async function wgh(m,u,body){const t=localStorage.getItem(WLT);if(!t)throw new Error('no-token');
  const r=await fetch('https://api.github.com'+u,{method:m,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):null});
  if(r.status===404)return null;if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,120))}return r.json()}
function bindWants(slug){
  const box=document.getElementById('wrows');if(!box)return;
  const TAGS=['','want','strong','no'],TLBL={'':'—',want:'مرغوبة',strong:'بشدة',no:'لا'};
  box.querySelectorAll('.ttag').forEach(t=>t.onclick=e=>{e.stopPropagation();
    const r=t.dataset.r,g=wgrp(slug),cur=g.tags[r]||'',nx=TAGS[(TAGS.indexOf(cur)+1)%TAGS.length];
    if(nx)g.tags[r]=nx;else delete g.tags[r];
    t.className='ttag'+(nx?' '+nx:'');t.textContent=TLBL[nx];wsaveLS();wtoast('حُفظت محلياً — «حفظ» يرفعها');});
  let dragEl=null;
  box.querySelectorAll('.trow').forEach(r=>{
    r.addEventListener('dragstart',()=>{dragEl=r;r.classList.add('dragging')});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');wgrp(slug).order=[...box.querySelectorAll('.trow')].map(x=>x.dataset.r);wsaveLS()});
    r.addEventListener('dragover',e=>{e.preventDefault();if(!dragEl||dragEl===r)return;
      if(dragEl.parentElement!==r.parentElement)return;
      const rc=r.getBoundingClientRect(),aft=(e.clientY-rc.top)>rc.height/2;
      r.parentElement.insertBefore(dragEl,aft?r.nextSibling:r);});
  });
  box.querySelectorAll('.tmv b').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const r=b.closest('.trow'),sib=b.dataset.mv==='-1'?r.previousElementSibling:r.nextElementSibling;
    if(!sib||!sib.classList.contains('trow'))return;
    box.insertBefore(r,b.dataset.mv==='-1'?sib:sib.nextSibling);
    wgrp(slug).order=[...box.querySelectorAll('.trow')].map(x=>x.dataset.r);wsaveLS();wtoast('حُفظ الترتيب محلياً');});
  const dl=document.getElementById('wdl');if(dl)dl.onclick=()=>{
    const b=new Blob([JSON.stringify(wants,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wants.json';a.click()};
  const sv=document.getElementById('wsav');if(sv)sv.onclick=async()=>{
    wtoast('يحفظ…');wsaveLS();
    const t=localStorage.getItem(WLT);
    if(!t){wtoast('لا رمز — «JSON ⤓» تنزّل نسخة، أو مرّر الرمز برابط #t=',1);return}
    try{
      const cur=await wgh('GET','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path+'?ref='+WREPO.br);
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(wants,null,1))));
      const body={message:'track: حفظ ترتيب وتعليم السلاسل',content:b64,branch:WREPO.br};
      if(cur&&cur.sha)body.sha=cur.sha;
      await wgh('PUT','/repos/'+WREPO.o+'/'+WREPO.r+'/contents/'+WREPO.path,body);
      wtoast('حُفظ في track/wants.json ✓');
    }catch(e){wtoast('فشل: '+e.message,1)}};
}
(async()=>{
  const slug=new URLSearchParams(location.search).get('s')||'';
  const [data,photos,chs,sidx,tr,wf]=await Promise.all([j('../playlists/data/sheikhs.json'),j('../playlists/photos.json'),j('../playlists/channels.json'),j('../playlists/series/index.json'),j('../track/data.json'),j('../track/wants.json')]);
  if(!wloadLS()&&wf&&wf.groups)wants=wf;else if(wf&&wf.groups&&(!wants.updated_at||(wf.updated_at&&wf.updated_at>wants.updated_at)))wants=wf;
  const sh=data&&data.sheikhs?data.sheikhs.find(x=>x.slug===slug):null;
  const B=document.getElementById('body');
  if(!sh){B.innerHTML='<div class="empty">لم يُعثر على الشيخ المطلوب. <a href="." style="color:var(--acc2)">عودة للقائمة</a></div>';return}
  document.title=sh.name_display+' — السلاسل المختارة';
  document.getElementById('hdr-sub').textContent='السلاسل المختارة — '+sh.name_display;
  // youtube channels from channels.json (flat across groups)
  const nset=new Set([sh.name_display,sh.name,...(sh.aliases||[])].flatMap(x=>[x,norm(x)]));
  const yts=[];if(chs&&chs.channels)for(const g of chs.channels)for(const c of (g.items||[]))if(nset.has(c.name)||nset.has(norm(c.name)))yts.push(c);
  let photo=(photos&&(photos[sh.name_display]||photos[sh.name]||photos[norm(sh.name_display)]))||sh.photo;if(photo&&photo[0]!=='h'&&photo[0]!=='.')photo='../playlists/'+photo;
  const init=(sh.name_display||sh.name).replace(/^ال/,'').trim()[0]||'؟';
  let h='<div class="hero cin"><div class="ph">'+(photo?'<img src="'+esc(photo)+'" alt="" onerror="this.remove()">':'')+'<span>'+esc(init)+'</span></div>'
    +'<div><h1>'+esc(sh.name_display)+'</h1>'
    +(sh.name!==sh.name_display?'<div class="als">'+esc(sh.name)+'</div>':'')
    +((sh.aliases&&sh.aliases.length)?'<div class="als">'+sh.aliases.map(esc).join('، ')+'</div>':'')
    +'<span class="grp">المجموعة '+sh.group+'</span> <span class="st pending">'+esc(sh.status||'')+'</span></div></div>';
  // contact — merged: official website + channels, YouTube-style rows
  const YT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.85-.46-5.58a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.15 1 12 1 12s0 3.85.46 5.58a2.78 2.78 0 0 0 1.94 2c1.72.42 8.6.42 8.6.42s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.85 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5z"/></svg>';
  const VCHK='<span class="vbadge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9.2 4.6l-4.1-.2-.2 4.1L2.4 11.3l2.5 2.8.2 4.1 4.1-.2L12 20.6l2.8-2.5 4.1.2.2-4.1 2.5-2.8-2.5-2.9-.2-4.1-4.1.2z"/><path d="M10.6 15.2 7.6 12.2l1.3-1.3 1.7 1.7 4.5-4.5 1.3 1.3z" fill="#0b0f1a"/></svg></span>';
  h+='<div class="sec cin"><h2>تواصل</h2>';
  let anyCh=false;
  if(sh.website){anyCh=true;
    h+='<a class="lnk" href="'+esc(sh.website)+'" target="_blank" rel="noopener"><span class="ic">🌐</span><span class="t">'+esc(domain(sh.website))+'</span></a>'}
  const rows=[];
  for(const c of yts){rows.push({u:c.url,t:c.yt_title||'القناة الرسمية',v:c.verified,a:c.avatar});
    for(const m of (c.more||[]))rows.push({u:m.url,t:m.yt_title||'قناة إضافية',v:false,a:m.avatar});}
  for(const r of rows){anyCh=true;
    const av=r.a?'<img class="av" src="'+esc(r.a[0]!=='h'&&r.a[0]!=='.'?'../playlists/'+r.a:r.a)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'<span class="yts">'+YT+'</span>';
    h+='<a class="lnk" href="'+esc(r.u)+'" target="_blank" rel="noopener">'+av+'<span class="t">'+esc(r.t)+'</span>'+(r.v?VCHK:'')+'<span class="yts">'+YT+'</span></a>'}
  for(const c of (sh.channels||[])){anyCh=true;
    h+='<a class="lnk" href="'+esc(c.url)+'" target="_blank" rel="noopener"><span class="yts">'+YT+'</span><span class="t">'+esc(c.label||domain(c.url))+'</span></a>'}
  if(!anyCh)h+='<div class="empty">يُضاف لاحقاً</div>';
  h+='</div>';
  // series — من سجل السلاسل + تعريفات sheikhs.json
  const sers=[...(sidx?sidx.series.filter(x=>x.sheikh_slug===sh.slug):[]),...(sh.series||[])];
  h+='<div class="sec cin"><h2>السلاسل المختارة</h2>';
  if(sers.length){for(const s of sers){
    const href=s.slug?'series.html?s='+encodeURIComponent(s.slug):(s.url||'#');
    h+='<a class="lnk" href="'+esc(href)+'" '+(s.url?'target="_blank" rel="noopener"':'')+'><span class="ic">≡</span><span class="t">'+esc(s.title)+'<span class="d">'+(s.count? s.count+' درساً':'')+(s.status?' — '+esc(s.status):'')+'</span></span><span class="arw">‹</span></a>'}}
  else h+='<div class="empty">تُنتقى وتُضاف لاحقاً</div>';
  h+='</div>';
  // حالة التفريغات — صفوف مدمجة: سحب للترتيب + تعليم + حفظ wants.json
  h+='<div class="sec cin"><h2>حالة التفريغات</h2>';
  const tlist=(tr&&tr.sheikhs&&tr.sheikhs[slug])||[];
  if(tlist.length){
    const GRP=[['done','تم تفريغه',x=>x.st==='complete'],['doing','يجري تفريغه',x=>x.st==='partial'],['none','لم يُفرَّغ',x=>x.st!=='complete'&&x.st!=='partial']];
    const dl=tlist.filter(x=>x.st==='complete').reduce((a,x)=>a+(x.n||0),0);
    const dt=tlist.reduce((a,x)=>a+(x.n||0),0);
    h+='<div class="cats">';
    for(const [gk,gl,gf] of GRP){
      const rows=tlist.filter(gf),cnt=rows.length;
      h+='<a class="cat-t '+gk+'" href="list.html?s='+encodeURIComponent(slug)+'&g='+gk+'">'
        +'<span class="go">‹</span><span class="cv">'+cnt+'</span><span class="cl">'+gl+'</span>'
        +'<span class="cd">'+rows.reduce((a,x)=>a+(x.n||0),0)+' درس</span></a>'}
    h+='</div><div class="wbar" style="margin-top:9px"><span class="n">'+tlist.length+' سلسلة · '+dt+' درس مفرّغ بالمجموع ('+dl+' من المكتملة)</span></div>';
    h+='<div id="wtoast"></div>'
  }else h+='<div class="empty">لا بيانات تفريغ لهذا الشيخ بعد</div>';
  h+='</div>';
  // books
  h+='<div class="sec cin"><h2>الكتب</h2>';
  if(sh.books&&sh.books.length){for(const b of sh.books){
    h+='<a class="lnk" href="'+esc(b.url||'#')+'" '+(b.url?'target="_blank" rel="noopener"':'')+'><span class="ic">✎</span><span class="t">'+esc(b.title)+'</span><span class="arw">↗</span></a>'}}
  else h+='<div class="empty">تُضاف لاحقاً</div>';
  h+='</div>';
  // notes
  h+='<div class="sec cin"><h2>ملاحظات</h2>'
    +(sh.notes?'<div class="notes">'+esc(sh.notes)+'</div>':'<div class="empty">—</div>')+'</div>';
  B.innerHTML=h;
  bindWants(slug);
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
