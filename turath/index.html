<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التراث — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hawchat">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:960px;margin:0 auto;padding:16px}
.h-title{font-family:var(--font-ar);font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0 4px}
.sub{color:var(--dim);font-size:.82rem;margin-bottom:18px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.door{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 14px;cursor:pointer;text-align:center;transition:.2s}
.door:hover{border-color:var(--acc);transform:translateY(-2px)}
.door b{font-family:var(--font-ar);font-size:1rem;display:block}
.door span{color:var(--dim);font-size:.68rem;display:block;margin-top:4px}
.srch{display:flex;gap:8px;margin:14px 0}
.srch input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);font-family:var(--font-ui);font-size:1rem;padding:12px 14px;outline:none}
.srch input:focus{border-color:var(--acc)}
.row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;align-items:baseline}
.row:hover{background:var(--card2)}
.row .no{color:var(--acc);font-weight:700;font-size:.8rem;min-width:44px}
.row .tx{flex:1;font-family:var(--font-ar);font-size:.95rem;color:var(--txt)}
.row .bb{color:var(--dim);font-size:.66rem;white-space:nowrap}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:99px;color:var(--acc2);font-size:.62rem;padding:2px 10px;margin-inline-start:6px}
.badge.m{color:var(--ok);border-color:var(--ok)}
.badge.a{color:#d19a66;border-color:#d19a66}
.badge.z{color:var(--dim)}
.hcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin:14px 0}
.parttext{font-family:var(--font-ar);font-size:1.15rem;line-height:2.4;white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin:14px 0}
.fn{background:var(--card2);border-radius:var(--r-sm);padding:10px 12px;font-size:.72rem;margin:6px 0;color:var(--dim);font-family:var(--font-ar)}
.fn b{color:var(--acc2)}
.pg{display:flex;gap:8px;justify-content:center;margin:16px 0}
.pg button{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:var(--r-sm);padding:8px 18px;cursor:pointer;font-family:var(--font-ui)}
.pg button:disabled{opacity:.4;cursor:default}
.pg span{align-self:center;color:var(--dim);font-size:.8rem}
.loading{color:var(--dim);text-align:center;padding:40px;font-size:.85rem}
.err{color:#e06c75;text-align:center;padding:30px;font-size:.85rem}
details{margin:8px 0}
details summary{cursor:pointer;color:var(--acc2);font-size:.78rem;padding:6px 0}
.secttl{font-family:var(--font-ar);font-size:1.05rem;color:var(--acc2);margin:18px 0 6px;border-bottom:1px solid var(--border);padding-bottom:6px}
.back{color:var(--dim);font-size:.78rem;cursor:pointer;display:inline-block;margin-bottom:8px}
.back:hover{color:var(--acc2)}
.pick{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.pick select{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--txt);font-family:var(--font-ui);padding:8px 12px;font-size:.9rem}
.ed{background:var(--card2);border-right:3px solid var(--acc);border-radius:var(--r-sm);padding:12px;margin:10px 0}
.ed .eh{color:var(--acc2);font-size:.8rem;font-weight:600}
.ed .et{font-family:var(--font-ar);font-size:1.02rem;line-height:2;margin-top:6px}
.ayahbox{font-family:var(--font-ar);font-size:1.5rem;line-height:2.4;text-align:center;color:var(--acc2);background:var(--card);border:1px solid var(--acc);border-radius:var(--r-lg);padding:18px 22px;margin:14px 0}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">التراث</span>
</div></header>
<main><div class="wrap" id="app"></div></main>
<script>
const BASE='https://medmrf-10.github.io/';
const SCI={
  sirah:['السيرة النبوية'],maliki:['الفقه المالكي'],tarajim:['التراجم والأنساب'],tari5:['التاريخ'],
  ossoul:['أصول الفقه'],'3olomQuran':['علوم القرآن'],'9awa3idFi9h':['القواعد الفقهية'],
  tazkiaV1:['التزكية والآداب'],akidaV1:['العقيدة'],tfsr:['التفسير']};
const SURAHS=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
const cache={};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function gz(u){
  if(cache[u])return cache[u];
  const r=await fetch(BASE+u);if(!r.ok)throw new Error(r.status);
  const buf=await r.arrayBuffer();
  const b=new Uint8Array(buf);
  let txt;
  if(b[0]===0x1f&&b[1]===0x8b){
    const stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    txt=await new Response(stream).text();
  }else txt=new TextDecoder().decode(buf);
  const j=JSON.parse(txt);
  cache[u]=j;return j;
}
function go(h){location.hash=h}
const BF={m:'علامة مصدرية',t:'مطابقة عنوان',a:'تقريبي',z:'عنوان ملتصق'};
const TSCI=Object.keys(SCI).filter(s=>s!=='tfsr');
function norm(w){
  return String(w).replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627')
    .replace(/\u0629/g,'\u0647').replace(/\u0649/g,'\u064A')
    .replace(/\u0626/g,'\u064A').replace(/\u0624/g,'\u0648');
}
function shard2(w){const n=norm(w);return /^[\u0621-\u064A]/.test(n)?n.slice(0,2):'_'}

/* ---------- home ---------- */
async function vHome(){
  app.innerHTML='<div class="loading">جارٍ تحميل فهارس العلوم…</div>';
  const out=[];
  for(const s of Object.keys(SCI)){
    try{
      const ix=await gz(`${s}/api/index.json`);
      const nb=ix.n_books||(ix.books?ix.books.length:0)||(ix.editions?ix.editions.length:0);
      const np=ix.books?ix.books.reduce((a,b)=>a+(b.nparts||0),0):(ix.total_ayahs||0);
      out.push(`<div class="door" onclick="go('#/${s==='tfsr'?'t':`c/${s}`}')"><b>${esc(SCI[s][0])}</b><span>${nb.toLocaleString('ar')} ${s==='tfsr'?'طبعة':'كتاباً'} · ${np.toLocaleString('ar')} ${s==='tfsr'?'آية':'جزءاً'}</span></div>`);
    }catch(e){out.push(`<div class="door"><b>${esc(SCI[s][0])}</b><span>تعذر التحميل</span></div>`)}
  }
  app.innerHTML=`
  <div class="h-title cin">مكتبة التراث</div>
  <div class="sub">${Object.keys(SCI).length} علوم — بيانات ذاتية الاستضافة، بلا مفاتيح</div>
  <div class="srch"><input id="q" placeholder="ابحث في الـ465 ألف جزء كلها (كلمات متعددة = تقاطع)…"><button onclick="go('#/q/'+encodeURIComponent($('#q').value))">بحث</button></div>
  <div class="doors">${out.join('')}</div>`;
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')go('#/q/'+encodeURIComponent($('#q').value))});
}

/* ---------- unified word search ---------- */
async function vSearch(q){
  const words=[...new Set(q.split(/\s+/).filter(Boolean))];
  if(!words.length)return vHome();
  app.innerHTML='<div class="loading">جارٍ البحث في العلوم العشرة…</div>';
  const sciRes={};let capped=0;
  await Promise.all(TSCI.map(async sci=>{
    try{
      const byKey={};
      for(const w of words){
        const sh=await gz(`${sci}/api/idx/${encodeURIComponent(shard2(w))}.json.gz`);
        const nw=norm(w);
        const posts={};
        for(const[word,v]of Object.entries(sh)){
          if(word===nw||word.includes(nw)){
            if(v&&v['~']!==undefined){capped++;continue}
            for(const[b,i]of v)(posts[b+':'+i]=posts[b+':'+i]||[b,i]);
          }
        }
        byKey[w]=Object.values(posts);
      }
      let hits=byKey[words[0]]||[];
      for(const w of words.slice(1)){
        const s2=new Set((byKey[w]||[]).map(x=>x[0]+':'+x[1]));
        hits=hits.filter(x=>s2.has(x[0]+':'+x[1]));
      }
      if(hits.length)sciRes[sci]=hits.slice(0,300);
    }catch(e){}
  }));
  // tfsr: quran word index — word->[[s,a]]
  try{
    const byKey={};
    for(const w of words){
      const sh=await gz(`tfsr/api/idx/${encodeURIComponent(shard2(w))}.json.gz`);
      const nw=norm(w);const posts={};
      for(const[word,v]of Object.entries(sh))if(word===nw||word.includes(nw))for(const[s,a]of v)posts[s+':'+a]=[s,a];
      byKey[w]=Object.values(posts);
    }
    let hits=byKey[words[0]]||[];
    for(const w of words.slice(1)){const s2=new Set((byKey[w]||[]).map(x=>x.join(':')));hits=hits.filter(x=>s2.has(x.join(':')))}
    if(hits.length)sciRes['tfsr']=hits.slice(0,300);
  }catch(e){}
  const total=Object.values(sciRes).reduce((a,x)=>a+x.length,0);
  // titles lookup lazily per displayed batch
  const ixCache={};
  async function bookTitle(sci,id){
    if(!ixCache[sci]){const ix=await gz(`${sci}/api/index.json`);ixCache[sci]={};(ix.books||[]).forEach(b=>ixCache[sci][b.id]=b.title)}
    return ixCache[sci][id]||('#'+id)
  }
  const flat=[];for(const sci of[...TSCI,'tfsr'])for(const h of(sciRes[sci]||[]))flat.push({sci,b:h[0],i:h[1]});
  app.innerHTML=`
  <span class="back" onclick="go('#/')">‹ الرئيسية</span>
  <div class="h-title cin">نتائج «${esc(q)}»</div>
  <div class="sub" id="rcount">${total.toLocaleString('ar')} موضعاً في ${Object.keys(sciRes).length} علوم${capped?' — بعض الكلمات الشائعة جداً قُصّت من الفهرس':''}</div>
  <div id="res"></div><div id="more"></div>`;
  let shown=0;
  window.moreRes=async()=>{
    const batch=flat.slice(shown,shown+30);shown+=batch.length;
    const rows=[];
    for(const r of batch){
      if(r.sci==='tfsr')rows.push(`<div class="row" onclick="go('#/t/${r.b}/${r.i}')"><span class="badge">التفسير</span><span class="tx">سورة ${esc(SURAHS[r.b-1])} : آية ${r.i}</span></div>`);
      else rows.push(`<div class="row" onclick="go('#/p/${r.sci}/${r.b}/${r.i}')"><span class="badge">${esc(SCI[r.sci][0])}</span><span class="tx">${esc(await bookTitle(r.sci,r.b))}</span><span class="bb">جزء ${r.i}</span></div>`);
    }
    $('#res').insertAdjacentHTML('beforeend',rows.join(''));
    $('#more').innerHTML=shown<flat.length?`<div class="pg"><button onclick="moreRes()">المزيد (${(flat.length-shown).toLocaleString('ar')})</button></div>`:'';
    $('#rcount').textContent=`${total.toLocaleString('ar')} موضعاً — معروض ${Math.min(shown,flat.length).toLocaleString('ar')}`;
  };
  moreRes();
}

/* ---------- science → books ---------- */
async function vSci(sci,page=1,q=''){
  const ix=await gz(`${sci}/api/index.json`);
  let books=ix.books;
  if(q){
    const n=s=>String(s).replace(/[ً-ٰٟ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
    const qq=n(q);
    books=books.filter(b=>n(b.title).includes(qq)||n(b.author).includes(qq));
  }
  const per=60,pages=Math.ceil(books.length/per)||1;
  page=Math.max(1,Math.min(page,pages));
  const slice=books.slice((page-1)*per,page*per);
  app.innerHTML=`
  <span class="back" onclick="go('#/')">‹ الرئيسية</span>
  <div class="h-title cin">${esc(SCI[sci][0])}</div>
  <div class="sub">${books.length.toLocaleString('ar')} كتاباً${q?` — تصفية: «${esc(q)}»`:''} — صفحة ${page}/${pages}</div>
  <div class="srch"><input id="bq" placeholder="صفِّ باسم الكتاب أو المؤلف…" value="${esc(q)}"><button onclick="go('#/c/${sci}/1/'+encodeURIComponent($('#bq').value))">تصفية</button></div>
  <div class="card">${slice.map(b=>`<div class="row" onclick="go('#/b/${sci}/${b.id}')"><span class="tx">${esc(b.title)}</span><span class="bb">${esc(b.author||'')} · ${b.nparts} جزء</span></div>`).join('')}</div>
  <div class="pg"><button ${page<=1?'disabled':''} onclick="go('#/c/${sci}/${page-1}/${q?encodeURIComponent(q):''}')">السابق</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="go('#/c/${sci}/${page+1}/${q?encodeURIComponent(q):''}')">التالي</button></div>`;
  $('#bq').addEventListener('keydown',e=>{if(e.key==='Enter')go(`#/c/${sci}/1/`+encodeURIComponent($('#bq').value))});
}

/* ---------- book → toc ---------- */
async function vBook(sci,id,page=1){
  app.innerHTML='<div class="loading">جارٍ تحميل فهرس الكتاب…</div>';
  const d=await gz(`${sci}/api/books/${id}/toc.json`);
  const toc=d.toc||d;
  const per=60,pages=Math.ceil(toc.length/per)||1;
  page=Math.max(1,Math.min(page,pages));
  const slice=toc.slice((page-1)*per,page*per);
  app.innerHTML=`
  <span class="back" onclick="go('#/c/${sci}')">‹ ${esc(SCI[sci][0])}</span>
  <div class="h-title cin">${esc(d.title||'')}</div>
  <div class="sub">${esc(d.author||'')}${d.death?' — ت '+esc(d.death):''} · ${toc.length.toLocaleString('ar')} عنواناً</div>
  ${d.betaka?`<details><summary>بطاقة الكتاب</summary><div class="fn">${esc(d.betaka)}</div></details>`:''}
  <div class="card">${slice.map(t=>`<div class="row" onclick="go('#/p/${sci}/${id}/${t.i}')" style="${t.d>0?`padding-inline-start:${12+t.d*16}px`:''}"><span class="no">${t.i}</span><span class="tx">${esc(t.t)}</span><span class="bb">${t.j?'ج'+t.j+' ':''}ص${t.pg||''}</span></div>`).join('')}</div>
  <div class="pg"><button ${page<=1?'disabled':''} onclick="go('#/b/${sci}/${id}/${page-1}')">السابق</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="go('#/b/${sci}/${id}/${page+1}')">التالي</button></div>`;
}

/* ---------- part reader ---------- */
async function vPart(sci,id,i){
  app.innerHTML='<div class="loading">جارٍ تحميل الجزء…</div>';
  let d;
  try{d=await gz(`${sci}/api/books/${id}/parts/${String(i).padStart(4,'0')}.json.gz`)}catch(e){
    app.innerHTML=`<span class="back" onclick="go('#/b/${sci}/${id}')">‹ الفهرس</span><div class="err">تعذر تحميل الجزء ${i}.</div>`;return}
  const fns=Object.entries(d.fn||{});
  app.innerHTML=`
  <span class="back" onclick="go('#/b/${sci}/${id}')">‹ الفهرس</span>
  <div class="sub">${esc(d.t||'')} — ${d.j?'جزء '+d.j+' · ':''}ص ${d.pg||'؟'} <span class="badge ${d.b}">${esc(BF[d.b]||d.b||'')}</span></div>
  <div class="parttext cin">${esc(d.text)}</div>
  ${fns.length?`<details><summary>الحواشي (${fns.length})</summary>${fns.map(([p,t])=>`<div class="fn"><b>ص${p}:</b> ${esc(t)}</div>`).join('')}</details>`:''}
  <div class="pg"><button ${d.i<=0?'disabled':''} onclick="go('#/p/${sci}/${id}/${d.i-1}')">‹ السابق</button><button onclick="go('#/p/${sci}/${id}/${d.i+1}')">التالي ›</button></div>`;
}

/* ---------- tafsir ---------- */
async function vTafsir(s,a){
  app.innerHTML='<div class="loading">جارٍ تحميل التفسير…</div>';
  const[ix,q]=await Promise.all([gz('tfsr/api/index.json'),gz(`tfsr/api/quran/${String(s).padStart(3,'0')}.json.gz`)]);
  const d=await gz(`tfsr/api/ayah/${s}/${a}.json.gz`);
  const eds=ix.editions;
  const names={};eds.forEach(e=>names[e.slug]=e.name);
  const ay=q.ayahs&&q.ayahs[a]?q.ayahs[a].t:'';
  const nAya=Object.keys(q.ayahs||{}).length;
  const ents=Object.entries(d.tafsir||{});
  app.innerHTML=`
  <span class="back" onclick="go('#/t')">‹ التفسير</span>
  <div class="sub">سورة ${esc(SURAHS[s-1])} · آية ${a} · ${ents.length} طبعة</div>
  <div class="ayahbox cin">${esc(ay)} ﴿${a}﴾</div>
  <div class="pick"><select onchange="go('#/t/'+this.value+'/${a}')">${SURAHS.map((n,i)=>`<option value="${i+1}" ${i+1===+s?'selected':''}>${n}</option>`).join('')}</select>
  <select onchange="go('#/t/${s}/'+this.value)">${Array.from({length:nAya},(_,i)=>`<option ${i+1===+a?'selected':''}>${i+1}</option>`).join('')}</select></div>
  ${ents.map(([sl,v])=>`<div class="ed"><div class="eh">${esc(names[sl]||sl)}${v.g!==v.f||v.f!==`${s}:${a}`?` <span class="bb">${esc(v.f)}–${esc(v.t)}</span>`:''}</div><div class="et">${esc(v.p)}</div></div>`).join('')}
  <div class="pg"><button ${a<=1?'disabled':''} onclick="go('#/t/${s}/${+a-1}')">‹ السابقة</button><button ${a>=nAya?'disabled':''} onclick="go('#/t/${s}/${+a+1}')">التالية ›</button></div>`;
}
async function vTafsirPick(){
  const q=await gz('tfsr/api/quran/001.json.gz');
  app.innerHTML=`
  <span class="back" onclick="go('#/')">‹ الرئيسية</span>
  <div class="h-title cin">التفسير</div>
  <div class="sub">41 طبعة عربية دفعةً واحدة لكل آية</div>
  <div class="pick">
    <select id="ss">${SURAHS.map((n,i)=>`<option value="${i+1}">${i+1}. ${n}</option>`).join('')}</select>
    <select id="aa">${Array.from({length:Object.keys(q.ayahs).length},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
    <button class="btn" onclick="go('#/t/'+$('#ss').value+'/'+$('#aa').value)">اعرض</button>
  </div>
  <div class="sub">أو اكتب الآية مباشرة: #/t/سورة/آية</div>`;
  $('#ss').addEventListener('change',async()=>{const qq=await gz(`tfsr/api/quran/${String($('#ss').value).padStart(3,'0')}.json.gz`);$('#aa').innerHTML=Array.from({length:Object.keys(qq.ayahs).length},(_,i)=>`<option>${i+1}</option>`).join('')});
}

/* ---------- router ---------- */
async function route(){
  const h=location.hash.slice(1)||'/';
  const p=h.split('/').filter(Boolean);
  try{
    if(p[0]==='c'&&p[1])return vSci(p[1],+p[2]||1,p[3]?decodeURIComponent(p[3]):'');
    if(p[0]==='b')return vBook(p[1],p[2],+p[3]||1);
    if(p[0]==='p')return vPart(p[1],p[2],+p[3]);
    if(p[0]==='t'&&p[1])return vTafsir(+p[1],+p[2]||1);
    if(p[0]==='t')return vTafsirPick();
    if(p[0]==='q'&&p[1])return vSearch(decodeURIComponent(p[1]));
    return vHome();
  }catch(e){console.error(e);app.innerHTML='<div class="err">خطأ في التحميل — '+esc(e.message)+'</div>'}
}
addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
