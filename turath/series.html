<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السلسلة — تراث</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تراث">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);padding:26px 22px;margin-top:8px}
.hero::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.hero .kick{font-size:.68rem;color:var(--acc2);font-weight:600;letter-spacing:.4px;margin-bottom:8px}
.hero h1{font-family:var(--font-ar);font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0;line-height:1.55}
.hero .sh{margin-top:10px}
.hero .sh a{display:inline-flex;align-items:center;gap:8px;color:var(--txt);text-decoration:none;font-size:.88rem;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.02);transition:border-color .15s}
.hero .sh a:hover{border-color:var(--acc);color:var(--acc2)}
.hero .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.hero .st{display:flex;flex-direction:column;gap:2px}
.hero .st b{font-size:1.05rem;color:var(--acc2);font-weight:700}
.hero .st span{font-size:.64rem;color:var(--dim)}
.hero .yt{margin-top:16px}
.ytpill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:99px;border:1px solid rgba(176,90,90,.5);background:rgba(176,90,90,.08);color:#d97a7a;font-size:.76rem;font-weight:600;text-decoration:none;transition:.15s}
.ytpill:hover{background:rgba(176,90,90,.16)}
.ytpill svg{width:15px;height:15px}
/* toolbar */
.tbar{position:sticky;top:52px;z-index:30;display:flex;gap:10px;align-items:center;margin:14px 0 12px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bgt);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbar .q{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.tbar .q svg{width:15px;height:15px;color:var(--dim);flex:none}
.tbar input{flex:1;min-width:0;height:40px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--txt);padding:0 13px;font-family:var(--font-ui);font-size:.83rem}
.tbar input:focus{outline:none;border-color:var(--acc)}
.tbar .cnt{font-size:.68rem;color:var(--dim);white-space:nowrap}
.tbar .cnt b{color:var(--acc2)}
/* lesson rows */
#rows{display:flex;flex-direction:column;gap:8px}
.ls{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card2));text-decoration:none;color:var(--txt);transition:border-color .15s,transform .12s}
.ls:hover{border-color:rgba(201,162,75,.45);transform:translateY(-1px)}
.ls .th{position:relative;width:74px;height:44px;min-width:74px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.ls .th img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.ls .th .pn{position:absolute;bottom:2px;left:4px;font-size:.58rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);background:rgba(0,0,0,.45);padding:1px 6px;border-radius:4px;direction:ltr}
.ls .num{width:30px;height:30px;min-width:30px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.ls .main{flex:1;min-width:0}
.ls .t{font-family:var(--font-ar);font-weight:700;font-size:.96rem;line-height:1.55}
.ls .meta{display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap}
.ls .m{color:var(--dim);font-size:.66rem;white-space:nowrap}
.ls .alg{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;color:#7bd88f;border:1px solid rgba(123,216,143,.4);border-radius:99px;padding:2px 8px}
.ls .alg i{width:5px;height:5px;border-radius:50%;background:#7bd88f}
.ls .go{color:var(--dim);display:flex;align-items:center}
.ls .go svg{width:16px;height:16px}
.empty{color:var(--dim);padding:34px;text-align:center;font-size:.85rem}
@media(max-width:520px){
  .hero{padding:20px 16px}
  .hero h1{font-size:1.35rem}
  .ls .th{width:60px;height:36px;min-width:60px}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="./" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">تراث</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">سلسلة</span>
</div></header>
<main><div class="wrap" id="app"><p class="empty">يحمّل…</p></div></main>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function secs(d){if(!d)return 0;const p=d.split(':').map(Number);return p.reduce((a,b)=>a*60+b,0)}
let _d=null,_slug='';
function row(l){
  const th=l.video?'<span class="th"><img loading="lazy" src="https://i.ytimg.com/vi/'+l.video+'/mqdefault.jpg" alt="" onerror="this.parentNode.style.display=\'none\'"><span class="pn">'+l.n+'</span></span>':'<span class="num">'+l.n+'</span>';
  return '<a class="ls" href="lesson.html?s='+encodeURIComponent(_slug)+'&l='+l.n+'">'+th
    +'<span class="main"><span class="t">'+esc(l.title)+'</span>'
    +'<span class="meta">'
    +(l.dur?'<span class="m">⏱ '+esc(l.dur)+'</span>':'')
    +(l.chars?'<span class="m">'+Math.round(l.chars/1000)+' ألف حرف</span>':'')
    +(l.align?'<span class="alg"><i></i>محاذاة</span>':'')
    +'</span></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span></a>';
}
function draw(q){
  const rows=_d.lessons.filter(l=>!q||l.title.includes(q)||String(l.n)===q.trim());
  document.getElementById('rows').innerHTML=rows.map(row).join('')||'<p class="empty">لا نتائج لـ«'+esc(q)+'»</p>';
  document.getElementById('qc').innerHTML='<b>'+rows.length+'</b> / '+_d.lessons.length;
}
(async()=>{
  _slug=new URLSearchParams(location.search).get('s');
  const app=document.getElementById('app');
  _d=await j('../playlists/series/'+encodeURIComponent(_slug)+'.json');
  if(!_d){app.innerHTML='<p class="empty">السلسلة غير موجودة. <a href="./" style="color:var(--acc2)">عودة</a></p>';return}
  document.title=_d.title+' — تراث';
  const tot=_d.lessons.reduce((a,l)=>a+secs(l.dur),0);
  const hrs=tot?Math.floor(tot/3600)+' سا '+Math.round(tot%3600/60)+' د':null;
  const nal=_d.lessons.filter(l=>l.align).length;
  let h='<div class="hero cin"><div class="kick">سلسلة صوتية مفرّغة</div><h1>'+esc(_d.title)+'</h1>'
    +'<div class="sh"><a href="sheikh.html?s='+encodeURIComponent(_d.sheikh_slug)+'">'+esc(_d.sheikh)+' ←</a></div>'
    +'<div class="stats"><div class="st"><b>'+_d.count+'</b><span>درساً</span></div>'
    +(hrs?'<div class="st"><b>'+hrs+'</b><span>المدة الكلية</span></div>':'')
    +(nal?'<div class="st"><b>'+nal+'</b><span>محاذاة كاراوكي</span></div>':'')
    +'</div>'
    +(_d.playlist?'<div class="yt"><a class="ytpill" href="'+esc(_d.playlist)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12z"/></svg>قائمة يوتيوب الأصلية</a></div>':'')
    +'</div>';
  h+='<div class="tbar cin"><span class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="qin" placeholder="ابحث في الدروس…"></span><span class="cnt" id="qc"></span></div>';
  h+='<div id="rows"></div>';
  app.innerHTML=h;
  draw('');
  document.getElementById('qin').addEventListener('input',e=>draw(e.target.value));
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
