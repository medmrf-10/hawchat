<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>shorts — مقاطع قصيرة</title>
<link rel="icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#000}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100dvh;scroll-snap-align:start;position:relative;background:#000}
.card video{width:100%;height:100%;object-fit:cover;display:block}
.meta{position:absolute;bottom:0;right:0;left:0;padding:16px 16px 22px;background:linear-gradient(transparent,rgba(0,0,0,.88));color:#fff;pointer-events:none}
.meta h2{font-family:var(--font-ui);font-size:1rem;font-weight:600;margin:0 0 4px;line-height:1.5}
.meta .sh{font-size:.75rem;color:#cfcfcf}
.meta .txt{font-family:var(--font-ar);font-size:1rem;line-height:2;margin-top:8px;color:#eee;max-height:6em;overflow:hidden}
.badge{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:5px 12px;border-radius:20px;font-family:var(--font-ui)}
.back{position:fixed;top:14px;left:14px;z-index:50;background:rgba(0,0,0,.55);color:#fff;text-decoration:none;font-size:.8rem;padding:7px 14px;border-radius:20px;font-family:var(--font-ui)}
.logo{position:fixed;top:16px;right:50%;transform:translateX(50%);z-index:50;color:#fff;font-family:var(--font-ui);font-weight:700;font-size:.95rem;opacity:.85}
.mute{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:.75rem;padding:5px 12px;border-radius:20px;font-family:var(--font-ui);cursor:pointer;z-index:5}
.prog{position:absolute;bottom:0;right:0;left:0;height:3px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;width:0;background:var(--acc,#7aa2ff)}
</style></head><body>
<a class="back" href="../">→ البوابة</a><div class="logo">shorts</div>
<div class="feed" id="feed"></div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const F=document.getElementById('feed');let CL=[],snd=false;
fetch('clips.json?v='+Date.now()).then(r=>r.json()).then(cs=>{CL=cs;build()});
function build(){
 CL.forEach((c,i)=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<video src="clips/c${i}.mp4" loop muted playsinline preload="${i<2?'auto':'none'}"></video>
   <span class="badge">${esc(c.sh||'')}</span>
   <button class="mute">🔇 تفعيل الصوت</button>
   <div class="meta"><h2>${esc(c.t)}</h2><div class="sh">الدرس ${c.n} · ${esc(c.s)}</div>
   <div class="txt">${esc(c.x)}</div></div><div class="prog"><i></i></div>`;
  F.appendChild(card);
 });
 const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
   const v=e.target.querySelector('video');
   if(e.isIntersecting){v.muted=!snd;v.play().catch(()=>{})}else{v.pause()}
  });
 },{threshold:.55});
 [...F.children].forEach(c=>io.observe(c));
 document.querySelectorAll('.mute').forEach(b=>b.onclick=ev=>{ev.stopPropagation();
  snd=true;document.querySelectorAll('video').forEach(v=>v.muted=false);
  document.querySelectorAll('.mute').forEach(x=>x.textContent='🔊 الصوت يعمل')});
 // progress bar
 setInterval(()=>{document.querySelectorAll('.card').forEach(c=>{
  const v=c.querySelector('video'),p=c.querySelector('.prog i');
  if(v.duration)p.style.width=(v.currentTime/v.duration*100)+'%'})},400);
 // single tap toggles play
 document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  const v=c.querySelector('video');v.paused?v.play():v.pause()}));
}
</script></body></html>
