<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة التفريغات — hawchat</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/favicon-180.png">
<link rel="stylesheet" href="../theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.wrap{max-width:960px;margin:0 auto;padding:16px}
.intro{color:var(--dim);font-size:.82rem;margin:10px 0 4px}
.sh{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--r-lg);margin-top:14px;overflow:hidden}
.sh>.hd2{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.sh>.hd2 .nm{font-weight:700;font-size:1rem;flex:1}
.sh>.hd2 img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.sh>.hd2 .cnt{color:var(--dim);font-size:.75rem}
.sh .body{display:none;border-top:1px solid var(--border)}
.sh.open .body{display:block}
.sr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid rgba(201,162,75,.06);font-size:.85rem}
.sr:first-child{border-top:0}
.sr .t{flex:1;line-height:1.5}
.sr .m{color:var(--dim);font-size:.72rem;white-space:nowrap}
.badge{font-size:.68rem;padding:3px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
.badge.ok{color:#7bd88f;border-color:rgba(123,216,143,.4);background:rgba(123,216,143,.08)}
.badge.part{color:#e8c96a;border-color:rgba(232,201,106,.4);background:rgba(232,201,106,.08)}
.badge.unk{color:var(--dim)}
.badge.pub{color:var(--acc);border-color:var(--acc);background:rgba(201,162,75,.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--dim);margin-top:10px}
.empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a href="../" class="btn" aria-label="رجوع" style="text-decoration:none">→</a>
  <img src="../icons/icon-192.png" alt="" width="30" height="30" style="border-radius:8px">
  <span class="brand">hawchat</span>
  <span class="sub" style="color:var(--dim);font-size:.8rem">متابعة التفريغات</span>
</div></header>
<main><div class="wrap">
<p class="intro cin">حالة تفريغ سلاسل المشايخ: مفرغة بالكامل، جزئياً، أو منشورة على الموقع — تُحدَّث مع كل دفعة.</p>
<div class="legend cin">
  <span><span class="badge ok">مفرغة بالكامل</span></span>
  <span><span class="badge part">مفرغة جزئياً</span></span>
  <span><span class="badge pub">منشورة</span></span>
</div>
<div id="app"></div>
</div></main>
<script>
async function j(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{
  const [tr,meta,ph,sidx]=await Promise.all([j('data.json'),j('../playlists/data/sheikhs.json'),j('../playlists/photos.json'),j('../playlists/series/index.json')]);
  const app=document.getElementById('app');
  if(!tr){app.innerHTML='<p class="empty">لا بيانات.</p>';return}
  const pub={};for(const s of (sidx?sidx.series:[]))pub[s.sheikh_slug]=(pub[s.sheikh_slug]||0)+1;
  const msl={};for(const x of (meta?meta.sheikhs:[]))msl[x.slug]=x;
  let h='';
  const slugs=Object.keys(tr.sheikhs).sort((a,b)=>(tr.sheikhs[b].length)-(tr.sheikhs[a].length));
  for(const sl of slugs){
    const list=tr.sheikhs[sl];
    const m=msl[sl]||{};
    const name=m.name_display||m.name||(sl==='غير-مصنف'?'غير مصنفة':sl);
    const img=(ph&&(ph[name]||ph[m.name]))||m.photo;
    const comp=list.filter(x=>x.st==='complete').length;
    h+='<div class="sh cin"><div class="hd2" onclick="this.parentElement.classList.toggle(\'open\')">'
      +(img?'<img src="../playlists/'+esc(img.replace(/^playlists\//,''))+'" alt="">':'')
      +'<span class="nm">'+esc(name)+'</span>'
      +'<span class="cnt">'+list.length+' سلسلة · '+comp+' مكتملة'+(pub[sl]?' · '+pub[sl]+' منشورة':'')+'</span></div>';
    h+='<div class="body">';
    for(const s of list){
      const pub2=sidx&&sidx.series.some(x=>x.sheikh_slug===sl&&s.t.includes(x.title.slice(0,12)));
      const badge=s.st==='complete'?'<span class="badge ok">مفرغة بالكامل</span>':s.st==='partial'?'<span class="badge part">جزئية</span>':'<span class="badge unk">غير محدد</span>';
      h+='<div class="sr"><span class="t">'+esc(s.t)+'</span><span class="m">'+(s.exp?s.n+'/'+s.exp:s.n+' درس')+'</span>'+(pub2?'<span class="badge pub">منشورة</span>':badge)+'</div>';
    }
    h+='</div></div>';
  }
  app.innerHTML=h;
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
